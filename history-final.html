<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#19131c">
<title>한국사 2 · 기말고사 훈련기</title>
<style>
:root{color-scheme:dark;--bg:#111017;--panel:#201c25;--border:#403640;--text:#f7f1ec;--muted:#b5aab3;--accent:#f1bf82;--green:#87d7ad;--red:#ff9e9e}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 90% 0,#382631,transparent 35%),var(--bg);color:var(--text);font:15px/1.65 system-ui,"Noto Sans KR","Malgun Gothic",sans-serif}button,select,input{font:inherit}button{cursor:pointer}a{color:#ffdc9a}button:focus-visible,a:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}.wrap{max-width:1100px;margin:auto;padding:0 15px}
header{position:sticky;top:0;z-index:10;background:#151219f2;backdrop-filter:blur(12px);border-bottom:1px solid var(--border)}.bar{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:12px 0}.brand{font-size:17px;font-weight:900;letter-spacing:-.035em}.barLinks{display:flex;gap:6px}.barLinks a{font-size:12px;text-decoration:none;color:#f0d6b9;padding:7px 10px;border:1px solid #70525c;border-radius:8px}.tabs{display:flex;gap:5px;overflow:auto;scrollbar-width:none;padding-bottom:9px}.tabs::-webkit-scrollbar{display:none}.tab{background:transparent;color:#d1c1cb;border:1px solid transparent;border-radius:11px;padding:8px 12px;white-space:nowrap;font-weight:750;font-size:13px}.tab.active{background:#52343f;border-color:#926178;color:#ffddad}
main{padding-top:23px;padding-bottom:70px}h1{font-size:clamp(26px,4vw,43px);line-height:1.25;letter-spacing:-.05em;margin:9px 0 13px}h2{font-size:22px;letter-spacing:-.035em;margin:0 0 8px}h3{font-size:18px;margin:5px 0 8px}p{margin:7px 0 12px}.muted,.small{color:var(--muted)}.small{font-size:12px}.hero{border:1px solid #895969;background:linear-gradient(135deg,#3c2735,#211d2a 75%);border-radius:22px;padding:30px}.eyebrow{font-size:12px;letter-spacing:.13em;color:var(--accent);font-weight:850}.stats{display:flex;flex-wrap:wrap;gap:9px;margin:22px 0}.stat{background:#17121ab0;border:1px solid #765365;padding:11px 17px;border-radius:12px}.stat b{display:block;font-size:21px;color:var(--accent)}.stat span{font-size:12px;color:#d9c5ca}
.btn{border:1px solid #6b5666;background:#312b38;color:var(--text);padding:10px 15px;border-radius:11px;font-weight:800}.btn:hover{background:#453848}.btn.main{background:linear-gradient(110deg,#f2c081,#c36b70);border-color:#f5c58d;color:#24161b}.btn:disabled{opacity:.4;cursor:not-allowed}.actions{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:12px}.card{border:1px solid var(--border);background:var(--panel);border-radius:17px;padding:18px}.unit{width:100%;text-align:left;color:var(--text)}.unit:hover{border-color:#deae7a}.panel{margin-top:20px}.chip{display:inline-block;background:#3b2c35;color:#ffdaa2;border:1px solid #614753;padding:4px 10px;border-radius:99px;font-size:12px}.date{font-weight:900;color:var(--accent);font-variant-numeric:tabular-nums}.controls{display:flex;flex-wrap:wrap;gap:9px;align-items:end;margin:18px 0}.field{display:flex;flex-direction:column;gap:5px;font-size:12px;color:var(--muted);font-weight:800}.field select,.field input{background:#27212b;border:1px solid #64525e;color:var(--text);border-radius:10px;padding:10px;min-width:170px;height:43px}.field input{min-width:250px}.line{border-left:2px solid #9f6c69;padding:0 0 17px 22px;position:relative;margin-left:8px}.line:before{content:"";width:12px;height:12px;position:absolute;top:5px;left:-8px;border-radius:50%;background:#f7c38e;border:2px solid #2c1e27}
.quiz{max-width:820px;margin:auto}.progress{height:8px;border-radius:20px;background:#413740;overflow:hidden;margin:16px 0}.progress div{height:100%;background:#e5ad70}.question{font-size:clamp(17px,2.4vw,21px);font-weight:750;line-height:1.8;white-space:pre-wrap;margin:18px 0}.choices{display:grid;gap:9px}.choice{text-align:left;display:flex;gap:10px;align-items:flex-start;color:var(--text);background:#2b2530;border:1px solid #5c4b58;border-radius:12px;padding:13px}.choice:hover:not(:disabled){border-color:#e6b27b}.choice b{display:grid;place-items:center;background:#54404e;border-radius:8px;min-width:27px;height:27px}.choice.correct{border-color:var(--green);background:#224032}.choice.wrong{border-color:var(--red);background:#512b33}.choice:disabled{cursor:default}.feedback{border:1px solid #926e6b;border-radius:12px;background:#302932;padding:15px;margin-top:17px}.feedback.good{border-color:var(--green)}.feedback p{white-space:pre-wrap}.feedback details{margin-top:10px}.feedback details p{padding:7px 0;border-top:1px solid #554751;font-size:13px}
details{background:#2b2530;border:1px solid #63525c;border-radius:12px;padding:11px 14px}summary{cursor:pointer;font-weight:800;color:#ffddb0}.timeline p{color:#e2d5db}.result{font-size:58px;color:var(--accent);font-weight:900}.empty{border:1px dashed #685361;border-radius:14px;padding:26px;text-align:center;color:var(--muted)}.source{border-left:3px solid #d7a16d}.source h3{color:#f4ce98}.flow{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:10px 0}.node{border:1px solid #947064;background:#3b2c3a;border-radius:9px;padding:8px 10px;font-weight:800}.arrow{color:var(--accent)}#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#4e3b48;border:1px solid #ac8a83;border-radius:12px;padding:10px 17px;display:none;z-index:20}
@media(max-width:690px){.barLinks{flex-wrap:wrap;justify-content:flex-end}.bar{min-height:65px}.brand{font-size:14px}.barLinks a{font-size:11px;padding:5px}.hero{padding:20px}.grid{grid-template-columns:1fr}.field,.field input,.field select{width:100%}.controls .btn{width:100%}.tab{font-size:12px;padding:8px 10px}.card{padding:15px}}
</style></head>
