쌍가야금\n금선이 타는 비파, 종지가 타는 해금, 설원이 치는 장구\n아야, 밤을 새워 연주하는 정경, 그것이 어떠합니까?\n일지홍이 비껴 부는 피리 소리, 일지홍이 비껴 부는 피리 소리\n아야, 듣고야 잠들고 싶습니다.\n\n<제7장>\n신선들이 산다는 봉래산, 방장산, 영주산들은 삼신산이오.\n이 삼신산 가운데 있는 홍루각 속에는 몸이 가냘픈 맵씨도 아리따운 가인이\n윤이 흐르는 검은 머릿결을 가체수식한 가인이 금수휘장 속에서 구슬발을 반쯤 걷고는\n아야, 높은 대를 올라 멀리 오호를 바라보는 광경, 그것이 어떠합니까?\n푸른 버드나무와 푸른 대나무가 심어진 정자 둔덕에서, 푸른 버드나무와 푸른 대나무가 심어진 정자 둔덕에서\n아야, 노랑 꾀꼬리 반갑기도 하구려.\n\n<제8장>\n당당당 당추자(호두나무), 쥐엄나무에\n붉은 실로 붉은 그네를 맵니다.\n당기시라 미시라 정소년이여\n아야, 내 가는 곳에 남이 갈까 두렵구나.\n옥같이 예쁘고 가냘픈 두 손길에, 옥같이 예쁘고 가냘픈 두 손길에\n아야, 손을 마주 잡고 노는 정경, 그것이 어떠합니까?","sourceContext":"현재 화면의 한림별곡 본문은 사용자가 직접 제공한 네 장의 이미지 자료를 기준으로 구성했습니다.","isExcerpt":false},{"group":"외부 지문","title":"찬송","author":"한용운","genre":"현대 서정시","theme":"님을 향한 절대적 사랑과 찬미","summary":"화자가 님을 높이고 그 존재가 지닌 가치를 찬미하며 사랑의 의미를 확장한다.","structure":"님의 가치 인식 → 찬미의 확대 → 사랑의 확언","grammar":"경어법·호명·상징적 언어.","emotion":"경외·사랑·확신","devices":"찬미 어조·상징","compare":"「님의 침묵」의 부재하는 님과 비교","note":"","intro":"한용운의 「찬송」은 임을 소중하고 의로운 존재로 높여 부르며 사랑을 찬양한다.","units":[{"label":"첫 연: 단련한 금","meaning":"임을 여러 차례 단련된 금처럼 순수하고 가치 있는 존재로 찬양한다.","analysis":"불순물이 제거된 금의 이미지는 정신적 순수성과 견고함을 상징한다.","original":"님이어 당신은 百番이나 鍜鍊한 金결임니다\nᄲᅩᆼ나무ᄲᅮ리가 珊瑚가 되도록 天國의 사랑을 바듭소서\n님이어 사랑이어 아츰볏의 첫거름이어"},{"label":"둘째 연: 의와 재물","meaning":"임이 금전적 이익보다 옳은 일을 중시한다고 말한다.","analysis":"물질적 가치와 도덕적 가치를 대조한다.","original":"님이어 당신은 義가 무거읍고 黃金이 가벼은 것을 잘 아심니다\n거지의 거친 밧헤 福의 씨를 ᄲᅮ리옵소서\n님이어 사랑이어 옛 梧桐의 숨은 소리여"},{"label":"셋째 연: 평화와 자비","meaning":"임에게 약자를 돕고 세상을 밝히는 평화의 존재가 되어 달라고 청한다.","analysis":"개인적 사랑을 윤리적·사회적 사랑으로 확장하는 결말이다.","original":"님이어 당신은 봄과 光明과 平和를 조아하심니다\n弱者의 가슴에 눈물을 ᄲᅮ리는 慈悲의 菩薩이 되옵소서\n님이어 사랑이어 어름 바다에 봄바람이어"}],"vocab":"찬송: 대상을 높이 기리고 노래함 / 금: 단련된 순수성 / 의: 도덕적 가치 / 봄·광명·평화: 생명과 희망","point":"「님의 침묵」이 부재의 역설을 중심으로 한다면 「찬송」은 임의 실질적·윤리적 가치를 찬양.","pitfalls":"임을 오직 연애 대상으로만 해석하지 말고 종교·민족·절대적 이상 등 상징의 다의성을 열어 둘 것.","original":"님이어 당신은 百番이나 鍜鍊한 金결임니다\nᄲᅩᆼ나무ᄲᅮ리가 珊瑚가 되도록 天國의 사랑을 바듭소서\n님이어 사랑이어 아츰볏의 첫거름이어\n\n님이어 당신은 義가 무거읍고 黃金이 가벼은 것을 잘 아심니다\n거지의 거친 밧헤 福의 씨를 ᄲᅮ리옵소서\n님이어 사랑이어 옛 梧桐의 숨은 소리여\n\n님이어 당신은 봄과 光明과 平和를 조아하심니다\n弱者의 가슴에 눈물을 ᄲᅮ리는 慈悲의 菩薩이 되옵소서\n님이어 사랑이어 어름 바다에 봄바람이어","source":"https://gongu.copyright.or.kr/gongu/wrt/wrt/view.do?menuNo=200019&wrtSn=9001776","originalNote":"원시 표기 전문(띄어쓰기는 편의상 조정). 작가 사후 70년 경과 작품.","lineGuides":[{"label":"01행","meaning":"이 구절의 한자는 아래 독음으로 읽고, 이어지는 표현 분석과 문맥 뜻풀이를 확인하세요.","analysis":"금속을 단련한 귀금속의 비유는 임의 순수하고 단단한 가치를 칭송한다.","reference":"님이어 당신은 百番이나 鍜鍊한 金결임니다"},{"label":"02행","meaning":"이 구절의 한자는 아래 독음으로 읽고, 이어지는 표현 분석과 문맥 뜻풀이를 확인하세요.","analysis":"뽕나무 뿌리가 산호가 되는 비현실적 변화는 임의 아름다움·사랑을 기원하는 과장된 상상이다.","reference":"ᄲᅩᆼ나무ᄲᅮ리가 珊瑚가 되도록 天國의 사랑을 바듭소서"},{"label":"03행","meaning":"님이어 사랑이어 아츰볏의 첫거름이어","analysis":"첫걸음처럼 빛나는 임을 부르며 찬송의 어조를 반복한다.","reference":"님이어 사랑이어 아츰볏의 첫거름이어"},{"label":"04행","meaning":"이 구절의 한자는 아래 독음으로 읽고, 이어지는 표현 분석과 문맥 뜻풀이를 확인하세요.","analysis":"정의는 중요하고 금전적 이익은 가벼운 것이라는 가치관을 임의 덕성으로 제시한다.","reference":"님이어 당신은 義가 무거읍고 黃金이 가벼은 것을 잘 아심니다"},{"label":"05행","meaning":"이 구절의 한자는 아래 독음으로 읽고, 이어지는 표현 분석과 문맥 뜻풀이를 확인하세요.","analysis":"가난한 이의 밭에 복을 뿌리는 이미지는 임이 사회적 약자를 돕는 윤리적 존재임을 기원한다.","reference":"거지의 거친 밧헤 福의 씨를 ᄲᅮ리옵소서"},{"label":"06행","meaning":"이 구절의 한자는 아래 독음으로 읽고, 이어지는 표현 분석과 문맥 뜻풀이를 확인하세요.","analysis":"옛 오동의 숨은 소리는 차분하지만 깊게 울리는 사랑과 도덕적 가치를 상징한다.","reference":"님이어 사랑이어 옛 梧桐의 숨은 소리여"},{"label":"07행","meaning":"이 구절의 한자는 아래 독음으로 읽고, 이어지는 표현 분석과 문맥 뜻풀이를 확인하세요.","analysis":"봄·빛·평화의 열거는 임이 세상에 가져올 긍정적 생명력에 대한 찬양이다.","reference":"님이어 당신은 봄과 光明과 平和를 조아하심니다"},{"label":"08행","meaning":"이 구절의 한자는 아래 독음으로 읽고, 이어지는 표현 분석과 문맥 뜻풀이를 확인하세요.","analysis":"자비의 보살이 되어 약자를 돕기를 빈다. 사랑이 개인 감정에서 타인을 위한 실천으로 확대된다.","reference":"弱者의 가슴에 눈물을 ᄲᅮ리는 慈悲의 菩薩이 되옵소서"},{"label":"09행","meaning":"님이어 사랑이어 어름 바다에 봄바람이어","analysis":"얼음 바다에 불어오는 봄바람은 고통스럽고 차가운 현실을 바꾸는 임의 따뜻한 힘을 상징한다.","reference":"님이어 사랑이어 어름 바다에 봄바람이어"}],"detailNotice":"원문의 9행을 기준으로 구성·시어·정서를 모두 나누어 풀이했습니다.","hanjaWords":[{"hanja":"百番","reading":"백번","meaning":"백 번"},{"hanja":"鍜鍊","reading":"단련","meaning":"쇠 따위를 두드려 단단히 함"},{"hanja":"珊瑚","reading":"산호","meaning":"산호"},{"hanja":"天國","reading":"천국","meaning":"하늘나라"},{"hanja":"黃金","reading":"황금","meaning":"금"},{"hanja":"梧桐","reading":"오동","meaning":"오동나무"},{"hanja":"光明","reading":"광명","meaning":"빛과 희망"},{"hanja":"平和","reading":"평화","meaning":"평온함"},{"hanja":"弱者","reading":"약자","meaning":"힘이 약한 사람"},{"hanja":"慈悲","reading":"자비","meaning":"자애"},{"hanja":"菩薩","reading":"보살","meaning":"불교적 구제자"}],"id":"w24","poem":true,"textStatus":"학습용 본문 · 표기 비교 권장"},{"group":"외부 지문","title":"상저가","author":"작자 미상","genre":"고려 가요·노동요","theme":"부모에 대한 효성과 소박한 삶","summary":"방아를 찧는 노동의 장면을 노래하며 부모를 봉양하려는 마음을 표현한다.","structure":"방아 노동 → 부모 봉양의 마음","grammar":"의성어·후렴·반복, 중세 국어 어휘.","emotion":"성실·효심","devices":"노동의 리듬·반복","compare":"「한림별곡」의 향락적 정서와 비교","note":"","intro":"방아를 찧고 거친 밥을 지어 부모께 드리겠다는 효심을 노래한 짧은 고려 가요.","units":[{"label":"첫 부분: 노동","meaning":"방아를 찧는 소리가 들리며 화자의 일상적 노동이 제시된다.","analysis":"노동의 반복이 노랫말의 리듬과 연결된다.","original":"듥긔동 방해나 디히 히얘"},{"label":"가운데: 밥 짓기","meaning":"거친 밥이라도 지어 부모께 드리겠다고 한다.","analysis":"물질적 풍요보다 부모를 먼저 생각하는 마음이 강조된다.","original":"게우즌 바비나 지ᅀᅥ 히얘\n아버님 어머님ᄭᅴ 받ᄌᆞᆸ고 히야해"},{"label":"끝: 효심","meaning":"부모께 먼저 올린 뒤 남으면 자신이 먹겠다고 한다.","analysis":"행동의 순서를 통해 효의 가치가 명확하게 표현된다.","original":"남거시든 내 머고리 히야해"}],"vocab":"듥긔동: 의성·의태성 여음으로 보는 설명이 있음 / 방해: 방아 / 게우즌 바비: 거친 밥 / 받ᄌᆞᆸ고: 바치고 / 히야해: 후렴","point":"후렴구와 일상 노동을 통해 리듬감을 만들어 낸다. 효라는 가치를 교훈의 나열이 아닌 행동으로 표현.","pitfalls":"분석 대상은 짧은 노동요의 전문이며 본문에 없는 어려운 고사나 상징을 함부로 추가하지 말 것.","original":"듥긔동 방해나 디히 히얘\n게우즌 바비나 지ᅀᅥ 히얘\n아버님 어머님ᄭᅴ 받ᄌᆞᆸ고 히야해\n남거시든 내 머고리 히야해","source":"https://ko.wikisource.org/wiki/상저가","originalNote":"고전 가사 전문. 원문의 여음 표기는 판본에 따라 차이가 있을 수 있다.","lineGuides":[{"label":"01행","meaning":"듥긔동 방해나 디히 히얘","analysis":"방아 찧는 일상적 노동을 먼저 드러낸다. 후렴의 소리가 노동요적 리듬과 생동감을 만든다.","reference":"듥긔동 방해나 디히 히얘"},{"label":"02행","meaning":"게우즌 바비나 지ᅀᅥ 히얘","analysis":"여유롭지 못한 형편에서 마련하는 거친 밥은 소박한 민중의 삶과 노동을 암시한다.","reference":"게우즌 바비나 지ᅀᅥ 히얘"},{"label":"03행","meaning":"아버님 어머님ᄭᅴ 받ᄌᆞᆸ고 히야해","analysis":"부모님께 먼저 드리려는 행동이 작품의 효 사상을 분명하게 드러낸다.","reference":"아버님 어머님ᄭᅴ 받ᄌᆞᆸ고 히야해"},{"label":"04행","meaning":"남거시든 내 머고리 히야해","analysis":"부모가 드시고 남은 것만 먹겠다는 말로 화자의 희생과 공경이 완성된다.","reference":"남거시든 내 머고리 히야해"}],"detailNotice":"원문의 4행을 기준으로 구성·시어·정서를 모두 나누어 풀이했습니다.","hanjaWords":[],"id":"w25","poem":true,"textStatus":"학습용 본문 · 표기 비교 권장"},{"group":"외부 지문","title":"가시리","author":"작자 미상","genre":"고려 가요","theme":"떠나는 임에 대한 원망과 재회를 바라는 마음","summary":"임을 붙잡고 싶지만 그로 인해 돌아오지 않을까 두려워 떠나보낸다.","structure":"이별의 상황 → 원망과 붙잡고 싶은 마음 → 재회 기원","grammar":"‘가시리’의 반복과 후렴이 음악성을 형성한다.","emotion":"슬픔·원망·희망","devices":"반복·후렴·역설적 태도","compare":"「송인」「진달래꽃」과 이별의 태도 비교","note":"","intro":"고려 가요의 대표적인 이별 노래. 이별을 붙잡을지 놓아줄지 갈등하는 마음이 네 연을 따라 변한다.","units":[{"label":"1연","meaning":"가시겠느냐고 되묻고, 자신을 버리고 떠나는 상황을 믿기 어려워한다.","analysis":"‘가시리’ 반복은 떠남에 대한 충격과 원망의 정서를 심화한다.","original":"가시리 가시리잇고 나ᄂᆞᆫ\nᄇᆞ리고 가시리잇고 나ᄂᆞᆫ\n위 증즐가 大平盛代"},{"label":"2연","meaning":"자신은 어떻게 살아가라는 것인지 임에게 호소한다.","analysis":"화자에게 이별은 삶을 흔드는 사건이며 물음은 설의적 호소의 기능을 한다.","original":"날러는 엇디 살라 ᄒᆞ고\nᄇᆞ리고 가시리잇고 나ᄂᆞᆫ\n위 증즐가 大平盛代"},{"label":"3연","meaning":"붙잡아 두고 싶지만 임이 서운해하여 영영 돌아오지 않을까 걱정한다.","analysis":"붙잡기와 보내기 사이의 심리적 갈등이 가장 직접적으로 드러나는 부분이다.","original":"잡ᄉᆞ와 두어리마 나ᄂᆞᆫ\n선ᄒᆞ면 아니 올셰라\n위 증즐가 大平盛代"},{"label":"4연","meaning":"슬픔을 참고 임을 보내면서 가자마자 곧 돌아오기를 빈다.","analysis":"끝은 단순한 체념이 아니라 재회에 대한 희망으로 마무리된다.","original":"셜온 님 보내ᄋᆞᆸ노니 나ᄂᆞᆫ\n가시ᄂᆞᆫ ᄃᆞᆺ 도셔 오셔셔 나ᄂᆞᆫ\n위 증즐가 大平盛代"}],"vocab":"가시리잇고: 가시겠습니까 / 날러는: 나더러는 / 잡ᄉᆞ와: 잡아서 / 선ᄒᆞ면: 서운해하면 등 논란 / 도셔: 돌아서, 곧","point":"반복구·여음과 4연의 정서 변화를 함께 암기. ‘위 증즐가 대평성대’의 음악적 기능에 주목.","pitfalls":"후렴이 밝다고 화자의 감정도 즐겁다고 볼 수 없다.","original":"가시리 가시리잇고 나ᄂᆞᆫ\nᄇᆞ리고 가시리잇고 나ᄂᆞᆫ\n위 증즐가 大平盛代\n\n날러는 엇디 살라 ᄒᆞ고\nᄇᆞ리고 가시리잇고 나ᄂᆞᆫ\n위 증즐가 大平盛代\n\n잡ᄉᆞ와 두어리마 나ᄂᆞᆫ\n선ᄒᆞ면 아니 올셰라\n위 증즐가 大平盛代\n\n셜온 님 보내ᄋᆞᆸ노니 나ᄂᆞᆫ\n가시ᄂᆞᆫ ᄃᆞᆺ 도셔 오셔셔 나ᄂᆞᆫ\n위 증즐가 大平盛代","source":"https://ko.wikisource.org/wiki/가시리","originalNote":"고어 전문. 일부 음절과 띄어쓰기는 판본에 따라 다르다.","lineGuides":[{"label":"01행","meaning":"가시리 가시리잇고 나ᄂᆞᆫ","analysis":"“가시리”의 반복은 임의 이별을 믿기 어려워하는 화자의 질문이자 탄식이다.","reference":"가시리 가시리잇고 나ᄂᆞᆫ"},{"label":"02행","meaning":"ᄇᆞ리고 가시리잇고 나ᄂᆞᆫ","analysis":"자신을 버리고 떠나는 것인가 묻는다. 체념과 원망이 함께 깔려 있다.","reference":"ᄇᆞ리고 가시리잇고 나ᄂᆞᆫ"},{"label":"03행","meaning":"이 구절의 한자는 아래 독음으로 읽고, 이어지는 표현 분석과 문맥 뜻풀이를 확인하세요.","analysis":"정해진 후렴은 음악적 리듬을 만들지만 시적 상황과 직접 일대일 대응시킬 필요는 없다.","reference":"위 증즐가 大平盛代"},{"label":"04행","meaning":"날러는 엇디 살라 ᄒᆞ고","analysis":"임이 떠난 뒤 화자가 어떻게 살아갈지 묻는다. 삶을 버틸 수 없다는 정서가 드러난다.","reference":"날러는 엇디 살라 ᄒᆞ고"},{"label":"05행","meaning":"ᄇᆞ리고 가시리잇고 나ᄂᆞᆫ","analysis":"떠나지 말라는 요청을 거듭하지만 이별은 여전히 예정되어 있다.","reference":"ᄇᆞ리고 가시리잇고 나ᄂᆞᆫ"},{"label":"06행","meaning":"이 구절의 한자는 아래 독음으로 읽고, 이어지는 표현 분석과 문맥 뜻풀이를 확인하세요.","analysis":"반복되는 후렴이 한 연의 노래를 끝맺는다.","reference":"위 증즐가 大平盛代"},{"label":"07행","meaning":"잡ᄉᆞ와 두어리마 나ᄂᆞᆫ","analysis":"붙잡고 싶은 마음이 강하지만 억지로 막을 것인지 고민한다.","reference":"잡ᄉᆞ와 두어리마 나ᄂᆞᆫ"},{"label":"08행","meaning":"선ᄒᆞ면 아니 올셰라","analysis":"붙잡으면 임이 불쾌해해 영영 돌아오지 않을까 걱정한다. 이별을 받아들이는 이유가 설명된다.","reference":"선ᄒᆞ면 아니 올셰라"},{"label":"09행","meaning":"이 구절의 한자는 아래 독음으로 읽고, 이어지는 표현 분석과 문맥 뜻풀이를 확인하세요.","analysis":"후렴이 한 연의 절제된 슬픔을 음악적 형식으로 마감한다.","reference":"위 증즐가 大平盛代"},{"label":"10행","meaning":"셜온 님 보내ᄋᆞᆸ노니 나ᄂᆞᆫ","analysis":"슬프지만 떠나는 임을 보내겠다는 선택이다. 양가적 태도와 희생이 나타난다.","reference":"셜온 님 보내ᄋᆞᆸ노니 나ᄂᆞᆫ"},{"label":"11행","meaning":"가시ᄂᆞᆫ ᄃᆞᆺ 도셔 오셔셔 나ᄂᆞᆫ","analysis":"떠나자마자 돌아오라는 역설적인 바람으로 재회에 대한 희망을 끝까지 남긴다.","reference":"가시ᄂᆞᆫ ᄃᆞᆺ 도셔 오셔셔 나ᄂᆞᆫ"},{"label":"12행","meaning":"이 구절의 한자는 아래 독음으로 읽고, 이어지는 표현 분석과 문맥 뜻풀이를 확인하세요.","analysis":"후렴을 통해 노래 전체의 형식적 통일성을 형성한다.","reference":"위 증즐가 大平盛代"}],"detailNotice":"원문의 12행을 기준으로 구성·시어·정서를 모두 나누어 풀이했습니다.","hanjaWords":[{"hanja":"大平盛代","reading":"태평성대","meaning":"평화롭고 살기 좋은 시대"}],"id":"w26","poem":true,"textStatus":"학습용 본문 · 표기 비교 권장"},{"group":"외부 지문","title":"강이 풀리면","author":"김동환","genre":"현대시","theme":"봄의 도래와 만남에 대한 기대","summary":"얼었던 강이 풀리는 계절 변화에 기대어 기다림과 희망을 노래한다.","structure":"겨울의 정지 → 강의 해빙 → 미래의 기대","grammar":"‘-면’ 조건 구성에 담긴 시간적 기대, 자연 이미지.","emotion":"기대·희망·그리움","devices":"자연의 변화와 심리 연결","compare":"「봄비」의 봄 이미지와 비교","note":"","intro":"김동환의 「강이 풀리면」은 얼어 있던 강이 풀리는 계절 변화로 인해 화자의 소망과 그리움을 환기한다.","units":[{"label":"겨울의 풍경","meaning":"추위로 얼어붙은 강은 정지된 상황을 연상시킨다.","analysis":"자연의 상태가 화자 심리의 배경이 된다."},{"label":"해빙의 순간","meaning":"강이 풀리면 새로운 움직임과 변화가 가능해진다.","analysis":"조건절은 미래의 기대를 미루어 두는 문장 구조다."},{"label":"그리움과 기대","meaning":"자연의 변화를 통해 기다리는 대상과의 만남을 소망한다.","analysis":"계절 순환과 심리적 희망이 연결된다."}],"vocab":"‘-면’: 조건을 뜻하는 연결 어미 / 강: 변화 가능성을 드러내는 자연 소재 / 겨울과 봄의 대비","point":"자연 묘사만 하는 시가 아니라 대상의 부재와 화자의 기대를 연결.","pitfalls":"지문 전문을 모르는 상태에서 특정 행의 표현법·화자를 단정할 수 없음.","original":"","source":"https://www.donga.com/news/Opinion/article/all/20200118/99276067/1","originalNote":"저작권 보호 작품이라 전문을 이 프로그램에 재수록하지 않습니다. 아래 URL에서 원문·출처 자료를 확인하세요.","externalLabel":"동아일보 작품 감상·해설","copyrighted":true,"lineGuides":[{"label":"결빙된 강","meaning":"강이 얼어 있어 이동과 만남이 이루어지지 않는 현재.","analysis":"얼음은 단절의 장애물이면서도 봄이 오면 녹을 수 있다는 점에서 희망의 출발점이다."},{"label":"배가 오기를 기다림","meaning":"강물이 풀리면 배가 다시 오리라는 기대를 품는다.","analysis":"조건과 결과를 잇는 말투가 희망의 단계를 만든다."},{"label":"임 또는 소식에 대한 기대","meaning":"배에 임이 있거나 적어도 소식이 실려 오기를 바란다.","analysis":"기대가 현실적으로 조금씩 낮아지면서도 기다림의 마음은 변하지 않는다."},{"label":"매일 강가에서 돌아옴","meaning":"오늘도 기다렸지만 원하는 만남 없이 돌아서는 처지다.","analysis":"반복적 상황에서 끈질긴 기다림과 미완의 사랑을 읽는다."},{"label":"마음의 응어리와 계절","meaning":"언 강이 풀리듯 그리움과 설움도 풀리기를 빈다.","analysis":"외부 자연의 해빙을 내면의 화해·만남에 대응시킨다. 이 작품에는 이문 또는 가곡 개작판이 있어 판본 확인이 필요하다."}],"detailNotice":"보호 작품은 원문 문장을 복제하지 않고 흐름에 맞춰 해설합니다. 원문은 위의 외부 읽기 링크를 열어 대조하세요.","hanjaWords":[],"id":"w27","poem":true,"textStatus":"저작권 보호 · 원문 URL 제공","originalModern":"","readableOriginal":"","alignedLines":null},{"group":"외부 지문","title":"님의 침묵","author":"한용운","genre":"현대 서정시","theme":"님의 부재를 넘어서는 사랑과 재회의 확신","summary":"님은 떠났지만 화자는 그 떠남을 영원한 단절로 받아들이지 않는다. 침묵 가운데 사랑의 지속을 확언한다.","structure":"이별 인식 → 상실의 아픔 → 사랑의 지속과 역설적 희망","grammar":"시적 진술 속 부정과 역설, 님의 다의성.","emotion":"슬픔·극복·확신","devices":"역설·상징·대조","compare":"「찬송」「속미인곡」과 비교","note":"","intro":"한용운의 「님의 침묵」은 떠난 임을 인정하면서도 진실한 사랑은 끝나지 않는다고 주장하는 역설의 시.","units":[{"label":"1부분: 이별 선언","meaning":"임이 떠났다는 현실을 직시하고 크게 슬퍼한다.","analysis":"임의 부재를 직시하기 때문에 뒤의 희망이 더 강한 역설로 작동한다.","original":"님은갓슴니다 아아 사랑하는나의님은 갓슴니다"},{"label":"2부분: 자연의 위안이 사라짐","meaning":"임이 없어진 뒤 과거에 아름다웠던 세계의 빛과 소리도 변한다.","analysis":"외부 세계가 변한 것이 아니라 화자의 인식이 부재 때문에 변한 측면이 크다.","original":"푸른산빗을ᄭᅢ치고 단풍나무숩을향하야난 적은길을 거러서 참어ᄯᅥᆯ치고 갓슴니다\n黃金의ᄭᅩᆺ가티 굿고빗나든 옛盟誓는 차듸찬ᄯᅴᄭᅳᆯ이되야서 한숨의微風에 나러갓슴니다\n날카로은 첫｢키쓰｣의追憶은 나의運命의指針을 돌너노코 뒤ㅅ거름처서 사러젓슴니다\n나는 향긔로은 님의말소리에 귀먹고 ᄭᅩᆺ다은 님의얼골에 눈머럿슴니다"},{"label":"3부분: 이별을 통한 사랑","meaning":"헤어짐은 사랑의 끝이 아니라 새로운 만남과 사랑을 생각하게 만든다.","analysis":"상반되는 진술을 하나로 묶는 역설적 논리다.","original":"사랑도 사람의일이라 맛날ᄯᅢ에 미리 ᄯᅥ날 것을 염녀하고경계하지 아니한것은아니지만 리별은 ᄯᅳᆺ밧긔일이되고 놀난가슴은 새로은슯음에 터짐니다\n그러나 리별을 쓸데업는 눈물의源泉을만들고 마는것은 스스로 사랑을ᄭᅢ치는것인줄 아는ᄭᅡ닭에 것잡을수업는 슯음의힘을 옴겨서 새希望의 정수박이에 드러부엇슴니다"},{"label":"끝: 침묵의 노래","meaning":"임은 말이 없지만 화자는 침묵 속에서 사랑을 이어 간다.","analysis":"침묵은 단절이면서 사랑의 지속을 증명하는 역설적 공간이 된다.","original":"우리는 맛날ᄯᅢ에 ᄯᅥ날것을염녀하는것과가티 ᄯᅥ날ᄯᅢ에 다시맛날것을 밋슴니다 아아 님은갓지마는 나는 님을보내지 아니하얏슴니다\n제곡조를못이기는 사랑의노래는 님의沈默을 휩싸고돔니다"}],"vocab":"님: 연인·조국·절대자 등 복합적 해석 가능 / 역설: 겉으로 모순처럼 보이지만 의미상 진실 / 침묵: 부재·저항·기다림","point":"이별 인식 → 상실의 심화 → 사랑의 지속에 대한 확신이라는 논리적 변화를 기억.","pitfalls":"님을 오로지 ‘조국’ 또는 오로지 ‘연인’으로 고정하면 시의 다의성을 놓침.","original":"님은갓슴니다 아아 사랑하는나의님은 갓슴니다\n푸른산빗을ᄭᅢ치고 단풍나무숩을향하야난 적은길을 거러서 참어ᄯᅥᆯ치고 갓슴니다\n黃金의ᄭᅩᆺ가티 굿고빗나든 옛盟誓는 차듸찬ᄯᅴᄭᅳᆯ이되야서 한숨의微風에 나러갓슴니다\n날카로은 첫｢키쓰｣의追憶은 나의運命의指針을 돌너노코 뒤ㅅ거름처서 사러젓슴니다\n나는 향긔로은 님의말소리에 귀먹고 ᄭᅩᆺ다은 님의얼골에 눈머럿슴니다\n사랑도 사람의일이라 맛날ᄯᅢ에 미리 ᄯᅥ날 것을 염녀하고경계하지 아니한것은아니지만 리별은 ᄯᅳᆺ밧긔일이되고 놀난가슴은 새로은슯음에 터짐니다\n그러나 리별을 쓸데업는 눈물의源泉을만들고 마는것은 스스로 사랑을ᄭᅢ치는것인줄 아는ᄭᅡ닭에 것잡을수업는 슯음의힘을 옴겨서 새希望의 정수박이에 드러부엇슴니다\n우리는 맛날ᄯᅢ에 ᄯᅥ날것을염녀하는것과가티 ᄯᅥ날ᄯᅢ에 다시맛날것을 밋슴니다 아아 님은갓지마는 나는 님을보내지 아니하얏슴니다\n제곡조를못이기는 사랑의노래는 님의沈默을 휩싸고돔니다","source":"https://ko.wikisource.org/wiki/님의_침묵/님의_침묵","originalNote":"한용운 「님의 침묵」 시 전문(초판 맞춤법을 일부 보존). 현대어 풀이는 직접 쓴 뜻풀이.","lineGuides":[{"label":"01행","meaning":"님은갓슴니다 아아 사랑하는나의님은 갓슴니다","analysis":"임의 떠남을 선언하는 반복·영탄이다. 현실의 상실이 작품의 출발점이다.","reference":"님은갓슴니다 아아 사랑하는나의님은 갓슴니다"},{"label":"02행","meaning":"푸른산빗을ᄭᅢ치고 단풍나무숩을향하야난 적은길을 거러서 참어ᄯᅥᆯ치고 갓슴니다","analysis":"작은 길과 산빛 등 풍경을 통해 임이 떠난 상황을 구체적으로 제시한다.","reference":"푸른산빗을ᄭᅢ치고 단풍나무숩을향하야난 적은길을 거러서 참어ᄯᅥᆯ치고 갓슴니다"},{"label":"03행","meaning":"이 구절의 한자는 아래 독음으로 읽고, 이어지는 표현 분석과 문맥 뜻풀이를 확인하세요.","analysis":"찬란했던 약속이 사라졌다는 대조. 굳고 빛나던 과거의 확신이 산산이 흩어진 심리를 드러낸다.","reference":"黃金의ᄭᅩᆺ가티 굿고빗나든 옛盟誓는 차듸찬ᄯᅴᄭᅳᆯ이되야서 한숨의微風에 나러갓슴니다"},{"label":"04행","meaning":"이 구절의 한자는 아래 독음으로 읽고, 이어지는 표현 분석과 문맥 뜻풀이를 확인하세요.","analysis":"소중한 첫 만남의 기억이 운명의 방향마저 흔들고 사라진 충격을 표현한다.","reference":"날카로은 첫｢키쓰｣의追憶은 나의運命의指針을 돌너노코 뒤ㅅ거름처서 사러젓슴니다"},{"label":"05행","meaning":"나는 향긔로은 님의말소리에 귀먹고 ᄭᅩᆺ다은 님의얼골에 눈머럿슴니다","analysis":"임의 음성·얼굴에 몰두했던 사랑의 강도를 과장적으로 말한다.","reference":"나는 향긔로은 님의말소리에 귀먹고 ᄭᅩᆺ다은 님의얼골에 눈머럿슴니다"},{"label":"06행","meaning":"사랑도 사람의일이라 맛날ᄯᅢ에 미리 ᄯᅥ날 것을 염녀하고경계하지 아니한것은아니지만 리별은 ᄯᅳᆺ밧긔일이되고 놀난가슴은 새로은슯음에 터짐니다","analysis":"이별 가능성을 알고도 실제 헤어짐은 예상하지 못했음을 고백한다. 지적 판단과 현실 경험의 차이다.","reference":"사랑도 사람의일이라 맛날ᄯᅢ에 미리 ᄯᅥ날 것을 염녀하고경계하지 아니한것은아니지만 리별은 ᄯᅳᆺ밧긔일이되고 놀난가슴은 새로은슯음에 터짐니다"},{"label":"07행","meaning":"이 구절의 한자는 아래 독음으로 읽고, 이어지는 표현 분석과 문맥 뜻풀이를 확인하세요.","analysis":"그러나를 기준으로 시상이 전환된다. 이별의 슬픔을 새로운 희망으로 바꾸려는 자발적 의지다.","reference":"그러나 리별을 쓸데업는 눈물의源泉을만들고 마는것은 스스로 사랑을ᄭᅢ치는것인줄 아는ᄭᅡ닭에 것잡을수업는 슯음의힘을 옴겨서 새希望의 정수박이에 드러부엇슴니다"},{"label":"08행","meaning":"우리는 맛날ᄯᅢ에 ᄯᅥ날것을염녀하는것과가티 ᄯᅥ날ᄯᅢ에 다시맛날것을 밋슴니다 아아 님은갓지마는 나는 님을보내지 아니하얏슴니다","analysis":"떠남에도 불구하고 내면에서는 떠나보내지 않았다는 역설. 사랑의 지속과 재회 신념이다.","reference":"우리는 맛날ᄯᅢ에 ᄯᅥ날것을염녀하는것과가티 ᄯᅥ날ᄯᅢ에 다시맛날것을 밋슴니다 아아 님은갓지마는 나는 님을보내지 아니하얏슴니다"},{"label":"09행","meaning":"이 구절의 한자는 아래 독음으로 읽고, 이어지는 표현 분석과 문맥 뜻풀이를 확인하세요.","analysis":"임이 침묵해도 사랑의 노래가 그 침묵을 감싸며 계속된다. 침묵과 노래의 대립이 정서적 결말을 만든다.","reference":"제곡조를못이기는 사랑의노래는 님의沈默을 휩싸고돔니다"}],"detailNotice":"원문의 9행을 기준으로 구성·시어·정서를 모두 나누어 풀이했습니다.","hanjaWords":[{"hanja":"黃金","reading":"황금","meaning":"금"},{"hanja":"盟誓","reading":"맹세","meaning":"약속"},{"hanja":"微風","reading":"미풍","meaning":"산들바람"},{"hanja":"追憶","reading":"추억","meaning":"지난 일을 떠올림"},{"hanja":"運命","reading":"운명","meaning":"정해진 삶의 흐름"},{"hanja":"指針","reading":"지침","meaning":"방향을 잡는 기준"},{"hanja":"源泉","reading":"원천","meaning":"근원"},{"hanja":"希望","reading":"희망","meaning":"바람"},{"hanja":"沈默","reading":"침묵","meaning":"말하지 않음"}],"id":"w28","poem":true,"textStatus":"학습용 본문 · 표기 비교 권장"},{"group":"외부 지문","title":"봄비","author":"이수복","genre":"현대 서정시","theme":"봄비 뒤 되살아나는 자연의 생명력과 그 속에 스며든 서러운 정서","summary":"비가 그친 뒤 강가의 풀빛, 보리밭, 종달새, 꽃밭, 젊은이들, 아지랑이가 차례로 살아나는 모습을 그린다. 생명력 넘치는 봄 풍경 속에서도 화자의 마음에는 서러움이 남아 있으며, 마지막의 아지랑이는 임 앞에 피어오르는 향연에 비유된다.","structure":"비가 그친 뒤의 풀빛 → 보리밭과 종달새 → 꽃밭과 짝지은 젊은이들 → 향연 같은 아지랑이의 상승","grammar":"반복되는 계절 이미지와 서정적 시어.","emotion":"서러움과 쓸쓸함 → 봄의 생동감 → 그리움과 소망","devices":"‘이 비 그치면’의 반복, 풀빛·보리밭·꽃밭의 시각적 심상, 종달새의 청각적 심상, 아지랑이를 향연에 빗댄 직유","compare":"「강이 풀리면」의 봄 정서와 비교","note":"","intro":"이수복의 「봄비」는 봄의 생명력이 상실한 이를 떠올리게 하며 애도의 정서를 심화하는 작품.","units":[{"label":"봄비가 내리는 배경","meaning":"비 내리는 봄날의 감각적 풍경이 펼쳐진다.","analysis":"보통 희망을 상징하는 봄이 여기서는 기억과 슬픔을 깨운다."},{"label":"상실과 기억","meaning":"화자는 떠난 이와 관련한 생각을 떠올린다.","analysis":"자연 이미지와 개인적 비극을 겹쳐 보여 준다."},{"label":"애도의 심화","meaning":"새 생명과 부재한 존재의 대비 속에서 그리움이 깊어진다.","analysis":"봄의 밝음이 역설적으로 슬픔을 강화한다."}],"vocab":"봄비: 새 생명의 매개인 동시에 추모의 계기 / 밝음과 슬픔의 대비 / 감각적 이미지","point":"‘봄=무조건 밝음’으로만 읽지 말고, 되살아나는 자연과 화자 내면의 서러움이 함께 존재하는 대비를 볼 것.","pitfalls":"제공된 본문만으로 특정 인물의 죽음을 전제하면 안 된다. 작품은 봄의 생명력과 서러운 내면을 함께 보여 준다.","original":"","source":"https://ko.wikisource.org/wiki/%EB%B4%84%EB%B9%84_%28%EC%9D%B4%EC%88%98%EB%B3%B5%29","originalNote":"저작권 보호 작품이라 전문을 이 프로그램에 재수록하지 않습니다. 아래 URL에서 원문·출처 자료를 확인하세요.","externalLabel":"작품 열람","copyrighted":true,"lineGuides":[{"label":"첫 가정 · 비가 그친 뒤","meaning":"봄비가 멎은 뒤 새 생명이 자랄 풍경을 기대한다.","analysis":"계절의 생동이 화자의 감정까지 밝게 만드는 것은 아니다."},{"label":"강가의 초록","meaning":"초록이 짙어지는 경관 속에 쓸쓸함을 느낀다.","analysis":"생기 있는 풀빛과 내면의 서러움 사이의 정서적 대비를 확인한다."},{"label":"보리밭과 하늘의 소리","meaning":"생기로운 봄 풍경과 새소리가 들린다.","analysis":"시각·청각적 심상이 모여 따뜻한 분위기를 형성하지만 화자의 그리움은 여전하다."},{"label":"짝을 이룬 청춘","meaning":"꽃이 피고 젊은 사람들이 짝지어 서는 풍경을 묘사한다.","analysis":"남들은 짝을 이루지만 화자는 임과 떨어져 있다는 대조가 더 선명해진다."},{"label":"아지랑이의 상승","meaning":"땅에서 봄 아지랑이가 피어오르는 장면을 종교적 향내에 비유한다.","analysis":"신성하고 아름다운 생명력이 화자의 기다림과 애틋한 소망을 간접적으로 드러낸다."}],"detailNotice":"보호 작품은 원문 문장을 복제하지 않고 흐름에 맞춰 해설합니다. 원문은 위의 외부 읽기 링크를 열어 대조하세요.","hanjaWords":[],"id":"w29","poem":true,"textStatus":"저작권 보호 · 원문 URL 제공","originalModern":"","readableOriginal":"","alignedLines":null},{"group":"외부 지문","title":"송파에서의 시를","author":"정약용","genre":"조선 후기 한시 · 주체적 시론","theme":"형식의 구속을 넘어 자신의 삶과 감흥을 담는 주체적 시 창작","summary":"시 창작의 자유를 즐김 → 압운과 퇴고의 구속을 거부함 → 감흥을 직접 표현함 → 조선의 삶과 정서에 맞는 시를 지향함.","structure":"시를 쓰는 즐거움 → 형식적 제약 비판 → 조선시의 주체성 강조","grammar":"현대어 풀이의 “-라”, “-으랴”는 단언과 설의에 가까운 종결. 원문의 압운·대구·평측 등 형식적 요소는 한문 원전이 제시되지 않았으므로 이 번역문만으로 확정하지 않는다.","emotion":"통쾌함·자부심·자유로움","devices":"설의적 의문, 대조(고정된 법칙과 자유로운 창작), 직접적인 선언, 어조의 변화","compare":"","note":"제목이 불완전할 가능성: 허위 해설을 생성하지 않음.","intro":"격률에 얽매여 시를 쓰기보다 자신이 느낀 감흥과 조선의 고유한 경험을 시로 표현하려는 화자의 생각이 나타난다.","units":[{"label":"시를 자유롭게 쓰는 즐거움","original":"늙은이의 한 가지 통쾌한 일은 붓 가는 대로 시를 마구 쓰는 것","meaning":"나이가 든 화자의 큰 즐거움은 생각나는 대로 시를 자유롭게 쓰는 일이다.","analysis":"시 창작을 속박에서 벗어난 자기표현의 행위로 바라본다."},{"label":"압운과 퇴고의 구속에서 벗어남","original":"압운에 꼭 매일 것 없고 퇴고를 꼭 오래 할 것도 없다네.","meaning":"반드시 같은 운을 맞추거나 오랫동안 고쳐 쓸 필요는 없다.","analysis":"중국 한시의 형식적 격률을 절대화하지 않는 태도다. 압운과 퇴고를 무가치하다고 단정하는 것이 아니라 획일적인 구속을 비판한다."},{"label":"흥과 뜻의 자연스러운 표현","original":"흥이 나면 곧바로 뜻을 실어 내고 뜻이 이르면 곧바로 쓰면 그뿐.","meaning":"감흥이 생기는 대로 생각을 시로 옮기면 된다는 뜻이다.","analysis":"시인의 자발적인 감흥과 진솔한 내용을 형식보다 앞세운다."},{"label":"조선 사람이라는 자각","original":"나는 바로 조선 사람인지라 즐겨 조선의 시를 짓노라.","meaning":"자신은 조선인이므로 조선의 삶과 정서에 맞는 시를 쓰고 싶다는 말이다.","analysis":"주체적인 문학관과 자기 문화에 대한 자부심이 직접 드러난다."},{"label":"각자의 법을 존중함","original":"당신은 당신의 법을 따르라 시원찮다 따질 자 누구이겠나?","meaning":"다른 사람은 자신의 규칙을 따라도 좋으나 내 시가 그 기준에 못 미친다고 탓하지 말라는 말이다.","analysis":"명령형과 설의적 물음으로 시 창작의 독자성과 자율성을 주장한다."},{"label":"멀리 있는 사람의 기준에 대한 비판","original":"구구한 격이니 법이니 하는 것을 먼 데 사람이 어찌 알 수 있으랴?","meaning":"먼 곳의 사람들이 조선의 구체적인 사정과 표현의 가치를 어떻게 다 알 수 있겠느냐는 뜻이다.","analysis":"격식의 보편적 적용을 의심하며 조선의 현실과 감정을 반영하는 자주적 시론을 강조한다."}],"vocab":"압운(押韻): 구의 끝 운자를 맞춤 / 퇴고(推敲): 글을 여러 번 고쳐 다듬음 / 격률(格律): 운율·형식의 규칙 / 구구한: 자질구레하고 번거로운","point":"자주적 시론, 압운·퇴고에 대한 유연한 태도, 주체적 조선 문학 인식, 설의적 표현.","pitfalls":"시인이 한시를 무조건 부정했다고 해석하면 안 된다. 중국 시의 격률에 획일적으로 매이지 말자는 취지이다.","original":"늙은이의 한 가지 통쾌한 일은 붓 가는 대로 시를 마구 쓰는 것 압운에 꼭 매일 것 없고 퇴고를 꼭 오래 할 것도 없다네.\n흥이 나면 곧바로 뜻을 실어 내고 뜻이 이르면 곧바로 쓰면 그뿐. 나는 바로 조선 사람인지라 즐겨 조선의 시를 짓노라.\n당신은 당신의 법을 따르라 시원찮다 따질 자 누구이겠나? 구구한 격이니 법이니 하는 것을 먼 데 사람이 어찌 알 수 있으랴?","source":"","originalNote":"이 본문은 한문 원시가 아니라 사용자가 보내 준 현대 한국어 풀이입니다. 시의 제목·판본이 특정되면 한문 원전과 대조할 수 있습니다.","lineGuides":[{"label":"시를 자유롭게 쓰는 즐거움","reference":"늙은이의 한 가지 통쾌한 일은 붓 가는 대로 시를 마구 쓰는 것","meaning":"나이가 든 화자의 큰 즐거움은 생각나는 대로 시를 자유롭게 쓰는 일이다.","analysis":"시 창작을 속박에서 벗어난 자기표현의 행위로 바라본다."},{"label":"압운과 퇴고의 구속에서 벗어남","reference":"압운에 꼭 매일 것 없고 퇴고를 꼭 오래 할 것도 없다네.","meaning":"반드시 같은 운을 맞추거나 오랫동안 고쳐 쓸 필요는 없다.","analysis":"중국 한시의 형식적 격률을 절대화하지 않는 태도다. 압운과 퇴고를 무가치하다고 단정하는 것이 아니라 획일적인 구속을 비판한다."},{"label":"흥과 뜻의 자연스러운 표현","reference":"흥이 나면 곧바로 뜻을 실어 내고 뜻이 이르면 곧바로 쓰면 그뿐.","meaning":"감흥이 생기는 대로 생각을 시로 옮기면 된다는 뜻이다.","analysis":"시인의 자발적인 감흥과 진솔한 내용을 형식보다 앞세운다."},{"label":"조선 사람이라는 자각","reference":"나는 바로 조선 사람인지라 즐겨 조선의 시를 짓노라.","meaning":"자신은 조선인이므로 조선의 삶과 정서에 맞는 시를 쓰고 싶다는 말이다.","analysis":"주체적인 문학관과 자기 문화에 대한 자부심이 직접 드러난다."},{"label":"각자의 법을 존중함","reference":"당신은 당신의 법을 따르라 시원찮다 따질 자 누구이겠나?","meaning":"다른 사람은 자신의 규칙을 따라도 좋으나 내 시가 그 기준에 못 미친다고 탓하지 말라는 말이다.","analysis":"명령형과 설의적 물음으로 시 창작의 독자성과 자율성을 주장한다."},{"label":"멀리 있는 사람의 기준에 대한 비판","reference":"구구한 격이니 법이니 하는 것을 먼 데 사람이 어찌 알 수 있으랴?","meaning":"먼 곳의 사람들이 조선의 구체적인 사정과 표현의 가치를 어떻게 다 알 수 있겠느냐는 뜻이다.","analysis":"격식의 보편적 적용을 의심하며 조선의 현실과 감정을 반영하는 자주적 시론을 강조한다."}],"detailNotice":"사용자가 제공한 번역문을 여섯 의미 단위로 나누어 문장별 풀이와 문학사적 의미를 붙였습니다.","originalModern":"","isExcerpt":false,"sourceContext":"사용자가 채팅에서 직접 제공한 「송파에서의 시를」 현대어 본문을 그대로 수록했습니다. 한문 원문은 제공되지 않아 임의로 복원하지 않았습니다.","hanjaWords":[{"hanja":"押韻","reading":"압운","meaning":"시의 운을 맞춤"},{"hanja":"推敲","reading":"퇴고","meaning":"글을 다듬음"},{"hanja":"格律","reading":"격률","meaning":"시 형식의 규칙"}],"id":"w30","poem":true,"textStatus":"사용자 제공/대조 본문 · 판본 확인 권장"},{"group":"외부 지문","title":"공무도하가","author":"백수광부의 아내(전승)","genre":"고대 가요·4언 4구 한역시","theme":"사랑하는 이의 죽음을 애도하는 비극적 정서","summary":"물을 건너지 말라고 만류했지만 임은 결국 건너다 돌아오지 못한다. 남은 이가 그를 애도한다.","structure":"만류 → 건넘 → 죽음 → 슬픔","grammar":"한역 4언 4구 형태, 반복·금지 표현과 비극적 사건의 압축.","emotion":"절망·애도","devices":"물=생사의 경계로 해석 가능, 반복","compare":"「황조가」「제망매가」의 상실과 비교","note":"","intro":"물 건너는 임을 만류하지만 결국 돌아오지 못해 비통해하는 고대 가요.","units":[{"label":"1구 · 만류","original":"임이여, 강을 건너지 마오.","meaning":"상대방에게 위험한 강을 건너지 말라고 간절히 만류한다.","analysis":"명령·금지 표현으로 애절한 호소가 드러난다."},{"label":"2구 · 만류의 좌절","original":"임은 끝내 강을 건너셨네.","meaning":"화자의 바람과 달리 상대방이 결국 강을 건넌다.","analysis":"금지와 실제 행동의 대비가 비극성을 높인다."},{"label":"3구 · 이별의 확정","original":"물에 빠져 세상을 떠나셨으니,","meaning":"상대와 더는 만날 수 없는 상태에 놓인다.","analysis":"돌이킬 수 없는 사건이 화자의 충격을 심화한다."},{"label":"4구 · 탄식","original":"이제 임을 어찌해야 하나.","meaning":"임을 잃은 슬픔과 무력감을 토로한다.","analysis":"설의적 표현으로 절망이 강조된다."}],"vocab":"강=건넘과 단절을 나타내는 공간 / 건너지 마오=금지의 호소 / 끝내=간절한 만류에도 이루어진 행동 / 어찌해야 하나=설의적 탄식.","point":"4언 4구라는 형식과 금지→행동→죽음→탄식의 단계별 구조가 짧게 응축된다.","pitfalls":"노래의 전승 설화와 실제 고대 가요의 텍스트를 구분할 것.","original":"公無渡河\n公竟渡河\n墮河而死\n當奈公何","source":"https://ko.wikisource.org/wiki/공무도하가","originalNote":"전승 한역 4구 한자 원문입니다. 원형의 정확한 언어와 전승 방식은 구별하여 학습해야 합니다.","lineGuides":[{"label":"01행","meaning":"임이여, 강을 건너지 마오.","analysis":"상대에게 강을 건너지 말라고 만류한다. 이때 강은 위험한 현실적 장소이자 돌이킬 수 없는 경계가 된다.","reference":"公無渡河"},{"label":"02행","meaning":"임은 끝내 강을 건너셨네.","analysis":"만류에도 강을 건너는 인물이 등장해 비극적 긴장이 커진다.","reference":"公竟渡河"},{"label":"03행","meaning":"물에 빠져 세상을 떠나셨으니,","analysis":"사랑하는 이의 죽음으로 이별이 확정되고 화자의 슬픔이 터져 나온다.","reference":"墮河而死"},{"label":"04행","meaning":"이제 임을 어찌해야 하나.","analysis":"이제 어떻게 해야 하느냐는 탄식·설의가 슬픔과 무력감을 강조한다.","reference":"當奈公何"}],"detailNotice":"수록한 현대어 본문 4행을 각각 풀어 설명했습니다.","originalModern":"그대여, 물을 건너지 마오.\n그대는 끝내 물을 건너셨네.\n물에 빠져 돌아가셨으니,\n그대를 어찌해야 할까.","hanjaPronunciations":[{"hanja":"公無渡河","reading":"공무도하","meaning":"임이여, 강을 건너지 마오"},{"hanja":"公竟渡河","reading":"공경도하","meaning":"임은 끝내 강을 건넜네"},{"hanja":"墮河而死","reading":"타하이사","meaning":"물에 빠져 세상을 떠났으니"},{"hanja":"當奈公何","reading":"당내공하","meaning":"이제 임을 어찌하리오"}],"hanjaWords":[],"id":"w31","poem":true,"textStatus":"한문 원전 · 독음 지원"},{"group":"외부 지문","title":"황조가","author":"유리왕","genre":"고대 가요·4언 4구 한시","theme":"짝을 잃은 외로움","summary":"서로 다정한 꾀꼬리 한 쌍과 홀로 있는 자신의 처지를 비교하며 외로움을 노래한다.","structure":"꾀꼬리 한 쌍 묘사 → 화자 자신과 대비 → 쓸쓸함","grammar":"한문으로 전해진 4구의 고대 서정 가요. 앞 2구 자연 상황을 제시한 뒤 뒤 2구에서 자신의 고독을 밝힌다.","emotion":"외로움·고독","devices":"꾀꼬리 한 쌍(서로 의지함)과 화자(혼자임)의 대조. 자연물을 통해 인간의 외로움과 상실을 비추는 방식.","compare":"「공무도하가」와 고대 가요의 개인 감정 비교","note":"","intro":"유리왕이 한 쌍의 꾀꼬리를 보면서 자신의 외로운 처지를 대비한 고대 서정가요.","units":[{"label":"1구 · 새의 모습","original":"펄펄 날아다니는 꾀꼬리는","meaning":"어우러져 나는 꾀꼬리를 바라본다.","analysis":"외부 자연물로 화자의 정서를 끌어낼 준비를 한다."},{"label":"2구 · 짝의 대비","original":"암수가 서로 의지해 노는데,","meaning":"꾀꼬리들은 함께 지내며 정겨운 모습이다.","analysis":"서로 의지하는 한 쌍의 모습을 제시한다."},{"label":"3구 · 화자의 고독","original":"나의 외로운 처지를 생각하니","meaning":"홀로 남은 자기 처지를 떠올린다.","analysis":"자연의 어울림과 인간의 외로움이 대조된다."},{"label":"4구 · 동반자에 대한 탄식","original":"누구와 함께 돌아갈 것인가.","meaning":"함께할 사람이 없는 외로움과 그리움을 드러낸다.","analysis":"설의로 고독의 정서를 강화한다."}],"vocab":"翩翩: 펄펄 나는 모양 / 黃鳥: 꾀꼬리 / 雌雄: 암수 / 相依: 서로 의지함 / 獨: 홀로 / 誰: 누구","point":"자연의 짝 ↔ 화자의 독신이라는 대조는 간단하지만 핵심적인 표현 구조.","pitfalls":"단순한 자연 예찬시가 아니라 외로움의 서정시.","original":"翩翩黃鳥\n雌雄相依\n念我之獨\n誰其與歸","source":"https://ko.wikisource.org/wiki/황조가","originalNote":"전해지는 4구 한자 원문입니다. 짝을 이룬 꾀꼬리와 홀로 있는 화자의 처지를 대조합니다.","lineGuides":[{"label":"01행","meaning":"펄펄 날아다니는 꾀꼬리는","analysis":"꾀꼬리가 함께 오가는 모습을 목격한다. 자연물의 정다운 모습을 먼저 제시하는 장면이다.","reference":"翩翩黃鳥"},{"label":"02행","meaning":"암수가 서로 의지해 노는데,","analysis":"한 쌍의 새가 다정히 지내는 모습은 홀로 있는 화자와 뚜렷하게 대비된다.","reference":"雌雄相依"},{"label":"03행","meaning":"나의 외로운 처지를 생각하니","analysis":"자신의 외로운 상태를 드러내며 정서의 핵심을 밝힌다.","reference":"念我之獨"},{"label":"04행","meaning":"누구와 함께 돌아갈 것인가.","analysis":"함께 돌아갈 사람이 누가 있겠느냐는 설의. 외로움을 질문 형식으로 강조한다.","reference":"誰其與歸"}],"detailNotice":"수록한 현대어 본문 4행을 각각 풀어 설명했습니다.","originalModern":"펄펄 나는 꾀꼬리들은\n암수가 다정히 어울리는데\n외로운 내 모습을 생각하니\n누구와 함께 돌아갈까.","hanjaPronunciations":[{"hanja":"翩翩黃鳥","reading":"편편황조","meaning":"펄펄 날아다니는 꾀꼬리는"},{"hanja":"雌雄相依","reading":"자웅상의","meaning":"암수 서로 의지하고"},{"hanja":"念我之獨","reading":"염아지독","meaning":"홀로인 나를 생각하니"},{"hanja":"誰其與歸","reading":"수기여귀","meaning":"누구와 함께 돌아가리오"}],"hanjaWords":[],"id":"w32","poem":true,"textStatus":"한문 원전 · 독음 지원"},{"group":"외부 지문","title":"초토의 시 8 - 적군 묘지 앞에서","author":"구상","genre":"현대시·연작시 일부","theme":"전쟁의 은원과 적대를 넘어 죽은 인간을 연민하고 화해를 모색함","summary":"화자는 자신이 방아쇠를 당기던 적군의 시신을 거두어 묻은 뒤 그 무덤 앞에 선다. 살아 있을 때는 미움으로 맺혔지만 죽음 앞에서는 원한까지 자신의 마음에 스며든다고 느낀다. 가까운 고향을 두고도 돌아갈 수 없는 분단의 현실과 멀리 들려오는 포성 속에서 결국 통곡한다.","structure":"적군 무덤과 매장 회상 → 죽음의 너그러움 인식 → 살아 있을 때의 미움과 죽은 뒤의 연민 → 분단된 고향과 원한의 성찰 → 포성 속 통곡","grammar":"호명과 직접적인 진술, 윤리적 성찰을 유도하는 문장.","emotion":"엄숙함 → 연민 → 죄책감·공감 → 비통함","devices":"적/나의 대립과 죽음 앞의 화해, ‘은원’의 역설적 결합, 가까운 거리와 갈 수 없음의 대비, 북쪽으로 흐르는 구름의 상징, 포성과 통곡의 청각적 이미지","compare":"「제망매가」의 죽음에 대한 인식과 비교","note":"","intro":"구상의 연작시 「초토의 시」 제8편은 전쟁 중 죽은 적군의 무덤을 바라보며 적대의 논리를 넘어 인간애를 드러낸다.","units":[{"label":"상황","meaning":"적군의 묘지 앞에 선 화자가 죽음을 바라본다.","analysis":"일반적으로 미워할 대상의 무덤 앞이라는 설정이 이미 가치관의 전환을 준비한다."},{"label":"전환","meaning":"적군이라도 죽은 이는 한 인간이라는 사실을 인식한다.","analysis":"국가·이념의 구분과 인간의 생명이라는 보편적 가치가 대조된다."},{"label":"결말","meaning":"고통받은 모든 존재에 대한 연민과 평화를 생각한다.","analysis":"적대의 해소와 인간 존엄의 회복이라는 윤리적 결론이다."}],"vocab":"초토: 불타 황폐해진 땅 / 적군 묘지: 적과 인간을 함께 인식하는 공간 / 인도주의·화해","point":"전쟁의 적과 인간으로서의 상대를 분리하여 읽는 것이 핵심.","pitfalls":"‘적을 무조건 옹호’한다는 뜻이 아니라 죽음 앞의 인간 존엄을 성찰하는 시다.","original":"","source":"https://the-n.co.kr/%EA%B5%AC%EC%83%81%EC%9D%98-%EC%B4%88%ED%86%A0%EC%9D%98-%EC%8B%9C8-%EB%B6%84%EC%84%9D-%ED%95%B4%EC%84%A4-%EC%A0%95%EB%A6%AC-%EB%B0%8F-%EA%B4%80%EB%A0%A8-%EA%B8%B0%EC%B6%9C%EB%AC%B8%EC%A0%9C/","originalNote":"저작권 보호 작품이라 전문을 이 프로그램에 재수록하지 않습니다. 아래 URL에서 원문·출처 자료를 확인하세요.","externalLabel":"작품 해설·읽기","copyrighted":true,"lineGuides":[{"label":"묘지 앞의 부름","meaning":"화자가 전쟁 중 죽은 상대편 군인의 묘지 앞에서 그들의 넋을 부른다.","analysis":"적을 단순히 증오의 대상으로 보지 않고 말을 건네는 청자로 삼는 것부터 시상의 전환이 시작된다."},{"label":"서로 겨누던 과거","meaning":"화자와 묻힌 이들이 살아서는 전쟁의 적대 관계였음을 돌아본다.","analysis":"개인의 감정이 전쟁의 현실과 부딪힌다. 죽음이 정치적 구분을 넘어서는 계기다."},{"label":"시신을 정성껏 묻음","meaning":"상대의 시신을 거두어 매장한 경험을 떠올린다.","analysis":"원수였던 사람에게도 애도와 존중을 실천하는 인도주의적 태도가 드러난다."},{"label":"죽음에 대한 성찰","meaning":"죽음은 미움의 분열을 넘어서는 보편적 인간의 현실로 제시된다.","analysis":"전쟁의 비극 속에서 생명 자체의 소중함과 관용의 가능성이 강조된다."},{"label":"가까우나 갈 수 없는 고향","meaning":"고향이 멀지 않아도 경계 때문에 돌아갈 수 없는 상황을 인식한다.","analysis":"물리적 거리가 짧고 정치적 거리가 멀다는 대비가 분단의 비극을 구체화한다."},{"label":"돌아갈 수 없는 넋","meaning":"이승에서 대립했던 상대가 죽어 같은 비애 속에 놓였음을 인정한다.","analysis":"미움에서 연민으로 화자의 시선이 이동한다."},{"label":"마지막의 절규","meaning":"분단과 전쟁의 현실 앞에서 울음을 터뜨린다.","analysis":"전쟁을 미화하는 결말이 아니라 죽음의 슬픔을 넘어 화해·평화에 대한 간절한 소망을 드러낸다."}],"detailNotice":"보호 작품은 원문 문장을 복제하지 않고 흐름에 맞춰 해설합니다. 원문은 위의 외부 읽기 링크를 열어 대조하세요.","sourceContext":"사용자가 보낸 교재·필기 이미지를 참고해 단위별 의미·상징·구성 분석을 보강했습니다. 이미지의 원문 전문을 복제하지 않으며, 판본에 따른 행 순서는 외부 원문과 대조하세요.","hanjaWords":[],"id":"w33","poem":true,"textStatus":"저작권 보호 · 원문 URL 제공","originalModern":"","readableOriginal":"","alignedLines":null},{"group":"외부 지문","title":"진달래꽃","author":"김소월","genre":"현대 서정시·민요조","theme":"떠나는 임에 대한 사랑과 이별의 슬픔","summary":"임이 떠나면 꽃을 뿌려 보내겠다고 말하지만 눈물조차 보이지 않겠다는 말에는 깊은 슬픔이 감춰져 있다.","structure":"이별 가정 → 꽃길 마련 → 감정 억제의 다짐","grammar":"반복되는 가정·미래 표현과 민요적 율격.","emotion":"체념처럼 보이는 슬픔·사랑·원망","devices":"반어·반복·민요조","compare":"「가시리」「송인」과 이별 대응 비교","note":"","intro":"김소월의 대표작. 임을 보내겠다는 말과 사실은 깊은 이별의 아픔을 가진 내면이 서로 어긋나는 반어적 표현이 핵심.","units":[{"label":"1연: 보내겠다는 다짐","meaning":"임이 자신을 싫어해 떠나면 아무 말 없이 곱게 보내 주겠다고 한다.","analysis":"표면상 체념·수용의 언어이지만 이별에 대한 슬픔이 숨어 있다.","original":"나 보기가 역겨워\n가실 때에는\n말없이 고이 보내드리오리다."},{"label":"2연: 꽃길","meaning":"영변 약산의 진달래꽃을 꺾어 임의 가는 길에 뿌리겠다고 한다.","analysis":"꽃은 사랑과 애도의 복합적 상징이다. 떠나는 임을 축복하는 모습이 사랑의 깊이를 드러낸다.","original":"영변에 약산\n진달래꽃\n아름따다 가실 길에 뿌리오리다."},{"label":"3연: 꽃을 밟으라는 청","meaning":"임에게 꽃길을 사뿐히 밟고 가라고 한다.","analysis":"꽃을 밟는 임의 발걸음과 화자의 고통이 겹쳐 읽힌다.","original":"가시는 걸음걸음\n놓인 그 꽃을\n사뿐히 즈려밟고 가시옵소서."},{"label":"4연: 눈물 부정","meaning":"죽어도 눈물을 흘리지 않겠다고 말한다.","analysis":"실제로 슬프지 않다는 뜻이 아니라 깊은 슬픔을 억제한 반어적 표현이다. 1연과 수미상관을 이룬다.","original":"나 보기가 역겨워\n가실 때에는\n죽어도 아니 눈물 흘리오리다."}],"vocab":"역겨워: 보기 싫어 / 아름: 두 팔로 안을 만큼 / 즈려밟다: 지르밟다·꾹 눌러 밟다 / 수미상관: 첫 연과 끝 연이 유사","point":"표면적 정서 ‘보냄·절제’와 내면적 정서 ‘이별의 아픔’ 구분. 민요조의 음수율·반복을 체크.","pitfalls":"눈물을 안 흘린다고 전혀 슬프지 않다고 판단하지 말 것.","original":"나 보기가 역겨워\n가실 때에는\n말없이 고이 보내드리오리다.\n\n영변에 약산\n진달래꽃\n아름따다 가실 길에 뿌리오리다.\n\n가시는 걸음걸음\n놓인 그 꽃을\n사뿐히 즈려밟고 가시옵소서.\n\n나 보기가 역겨워\n가실 때에는\n죽어도 아니 눈물 흘리오리다.","source":"https://gongu.copyright.or.kr/gongu/wrt/wrt/view.do?menuNo=200019&wrtSn=9000320","originalNote":"김소월 사후 70년 경과한 공개 작품의 현대 표기 원문.","lineGuides":[{"label":"01행","meaning":"나 보기가 역겨워","analysis":"임이 나를 싫어한다는 가정은 버림의 위기를 먼저 제시한다. 실제 이별이 일어났다고 확정할 수는 없다.","reference":"나 보기가 역겨워"},{"label":"02행","meaning":"가실 때에는","analysis":"조건절이 이어져 가정한 이별 상황의 범위를 구체화한다.","reference":"가실 때에는"},{"label":"03행","meaning":"말없이 고이 보내드리오리다.","analysis":"떠나는 이를 조용히 보내겠다는 태도는 이별을 받아들이는 듯하지만 속마음까지 완전히 무심한 것은 아니다.","reference":"말없이 고이 보내드리오리다."},{"label":"04행","meaning":"영변에 약산","analysis":"영변 약산이라는 구체적인 지명으로 전통적 향토성과 민요적 분위기를 살린다.","reference":"영변에 약산"},{"label":"05행","meaning":"진달래꽃","analysis":"진달래꽃은 화자의 정성이며 사랑을 전하는 상징적 매개다.","reference":"진달래꽃"},{"label":"06행","meaning":"아름따다 가실 길에 뿌리오리다.","analysis":"자신의 슬픔보다 떠나는 임의 길을 배려하는 헌신적 행동으로 그려진다.","reference":"아름따다 가실 길에 뿌리오리다."},{"label":"07행","meaning":"가시는 걸음걸음","analysis":"걸음마다 반복되는 리듬은 이별의 순간이 길게 지속되는 듯한 효과를 준다.","reference":"가시는 걸음걸음"},{"label":"08행","meaning":"놓인 그 꽃을","analysis":"꽃은 이미 떠나는 길에 놓인 상태이며 임의 이동과 화자의 정성을 연결한다.","reference":"놓인 그 꽃을"},{"label":"09행","meaning":"사뿐히 즈려밟고 가시옵소서.","analysis":"꽃을 밟으라는 역설적인 부탁은 헌신과 이별의 고통이 겹치는 장면이다.","reference":"사뿐히 즈려밟고 가시옵소서."},{"label":"10행","meaning":"나 보기가 역겨워","analysis":"처음의 가정이 다시 반복되어 시가 수미상관 형태로 묶인다.","reference":"나 보기가 역겨워"},{"label":"11행","meaning":"가실 때에는","analysis":"반복되는 시간 조건이 슬픔을 다시 환기한다.","reference":"가실 때에는"},{"label":"12행","meaning":"죽어도 아니 눈물 흘리오리다.","analysis":"눈물 흘리지 않겠다는 부정은 강인한 결의로도 읽히지만, 역으로 큰 슬픔을 감추는 반어적 표현으로 해석되기도 한다.","reference":"죽어도 아니 눈물 흘리오리다."}],"detailNotice":"원문의 12행을 기준으로 구성·시어·정서를 모두 나누어 풀이했습니다.","hanjaWords":[{"hanja":"杜鵑花","reading":"두견화","meaning":"진달래의 한자 이름"}],"id":"w34","poem":true,"textStatus":"학습용 본문 · 표기 비교 권장"},{"group":"외부 지문","title":"청산리 벽계수야","author":"황진이","genre":"평시조 · 기녀 시조","theme":"흐르는 세월과 인연을 붙잡으려는 마음","summary":"흐르는 세월과 인연을 붙잡으려는 마음","structure":"초장: 상황/이미지 → 중장: 감정의 심화 → 종장: 변화된 인식·바람","grammar":"종장 첫 음보 3음절 안팎, 둘째 음보 비교적 길게 전개하는 경향. 작품 판본에 따라 표기 다름.","emotion":"여유로운 만류·기지","devices":"자연물의 상징·의인화·대조·영탄(작품별)","compare":"황진이 「동짓달 기나긴 밤을」과 기다림·시간·이별을 비교","note":"고전 원전의 표기에는 이본이 있어 현대 표기로 읽기 쉽게 정리함.","original":"청산리 벽계수야 수이 감을 자랑마라\n일도창해하면 다시 오기 어려워라\n명월이 만공산하니 쉬어 간들 어떠리","originalNote":"고전 시조의 현대 표기 정리. 가집의 이본에 따라 조사·어미가 달라질 수 있음.","intro":"기녀 시조의 담백한 언어와 세련된 이미지가 사랑과 시간의 경험을 드러낸다.","units":[{"label":"초장 · 벽계수에게","meaning":"푸른 시냇물아, 빨리 흘러간다고 뽐내지 마라.","analysis":"시냇물은 빠르게 떠나는 대상이며, ‘벽계수’는 인물 이름을 떠올리게 하는 중의적 표현도 가능하다."},{"label":"중장 · 돌아올 수 없음","meaning":"한번 넓은 바다에 이르면 되돌아오기 어렵다.","analysis":"흐르는 물=되돌릴 수 없는 시간/만남. 단순한 풍경이 아닌 시간·이별의 비유다."},{"label":"종장 · 달빛 아래 머무름","meaning":"달이 산에 가득하니 잠시 쉬었다 가면 어떻겠느냐.","analysis":"명월은 화자의 기명으로도 읽히는 중의적 시어. 직접적 명령 대신 여유 있게 만류한다."}],"source":"https://encykorea.aks.ac.kr/Article/E0065346","lineGuides":[{"label":"초장 · 벽계수에게","meaning":"푸른 시냇물아, 빨리 흘러간다고 뽐내지 마라.","analysis":"시냇물은 빠르게 떠나는 대상이며, ‘벽계수’는 인물 이름을 떠올리게 하는 중의적 표현도 가능하다.","reference":"청산리 벽계수야 수이 감을 자랑마라"},{"label":"중장 · 돌아올 수 없음","meaning":"한번 넓은 바다에 이르면 되돌아오기 어렵다.","analysis":"흐르는 물=되돌릴 수 없는 시간/만남. 단순한 풍경이 아닌 시간·이별의 비유다.","reference":"일도창해하면 다시 오기 어려워라"},{"label":"종장 · 달빛 아래 머무름","meaning":"달이 산에 가득하니 잠시 쉬었다 가면 어떻겠느냐.","analysis":"명월은 화자의 기명으로도 읽히는 중의적 시어. 직접적 명령 대신 여유 있게 만류한다.","reference":"명월이 만공산하니 쉬어 간들 어떠리"}],"detailNotice":"초장·중장·종장으로 나누어 현대어·시어·표현법을 분석함.","sourceContext":"사용자 수업 범위와 고전 시조 전승본을 대조한 텍스트 해설입니다.","hanjaWords":[],"id":"w35","poem":true,"textStatus":"학습용 본문 · 표기 비교 권장" analysis":"시각적인 생장 이미지를 사용해 떨어져 있는 관계를 지속한다."},{"label":"종장 · 새싹과 나","meaning":"비를 맞고 새잎이 나면 자신인 듯 생각해 달라는 소망이다.","analysis":"새싹=사랑의 지속/새로운 소식. 자연물과 자신을 겹쳐 나타낸다."}],"source":"https://encykorea.aks.ac.kr/Article/E0064041","lineGuides":[{"label":"초장 · 묏버들","meaning":"잘 골라 꺾은 버들가지를 임에게 보낸다.","analysis":"버들가지가 화자를 대신하는 선물/사랑의 매개체가 된다.","reference":"묏버들 가려 꺾어 보내노라 님의 손에"},{"label":"중장 · 심어 둘 것","meaning":"창가에 심어 자라나는 모습을 보아 달라고 부탁한다.","analysis":"시각적인 생장 이미지를 사용해 떨어져 있는 관계를 지속한다.","reference":"자시는 창밖에 심어 두고 보소서"},{"label":"종장 · 새싹과 나","meaning":"비를 맞고 새잎이 나면 자신인 듯 생각해 달라는 소망이다.","analysis":"새싹=사랑의 지속/새로운 소식. 자연물과 자신을 겹쳐 나타낸다.","reference":"밤비에 새 잎 곧 나거든 날인가도 여기소서"}],"detailNotice":"초장·중장·종장으로 나누어 현대어·시어·표현법을 분석함.","sourceContext":"사용자 수업 범위와 고전 시조 전승본을 대조한 텍스트 해설입니다.","hanjaWords":[],"id":"w38","poem":true,"textStatus":"학습용 본문 · 표기 비교 권장"},{"group":"외부 지문","title":"이화우 흩뿌릴 제","author":"계랑(매창)","genre":"평시조 · 기녀 시조","theme":"이별한 임에 대한 그리움과 기다림","summary":"이별한 임에 대한 그리움과 기다림","structure":"초장: 상황/이미지 → 중장: 감정의 심화 → 종장: 변화된 인식·바람","grammar":"종장 첫 음보 3음절 안팎, 둘째 음보 비교적 길게 전개하는 경향. 작품 판본에 따라 표기 다름.","emotion":"애상·고독","devices":"자연물의 상징·의인화·대조·영탄(작품별)","compare":"황진이 「동짓달 기나긴 밤을」과 기다림·시간·이별을 비교","note":"고전 원전의 표기에는 이본이 있어 현대 표기로 읽기 쉽게 정리함.","original":"이화우 흩뿌릴 제 울며 잡고 이별한 임\n추풍낙엽에 저도 날 생각는가\n천 리에 외로운 꿈만 오락가락 하노매","originalNote":"고전 시조의 현대 표기 정리. 가집의 이본에 따라 조사·어미가 달라질 수 있음.","intro":"기녀 시조의 담백한 언어와 세련된 이미지가 사랑과 시간의 경험을 드러낸다.","units":[{"label":"초장 · 봄날 이별","meaning":"배꽃이 흩날리는 봄날 임과 슬프게 헤어졌다.","analysis":"‘이화우’라는 봄 이미지가 이별의 상황을 감각적으로 형상화한다."},{"label":"중장 · 가을 낙엽","meaning":"가을이 되자 임도 나를 그리워할지 묻는다.","analysis":"봄→가을의 시간 경과. 추풍낙엽은 화자의 허전함과 기다림을 드러낸다."},{"label":"종장 · 멀어진 거리","meaning":"천 리 떨어진 곳을 오가는 것은 외로운 꿈뿐이다.","analysis":"공간적으로 떨어진 현실과 꿈속 재회 소망이 대비된다."}],"source":"https://encykorea.aks.ac.kr/Article/E0017994","lineGuides":[{"label":"초장 · 봄날 이별","meaning":"배꽃이 흩날리는 봄날 임과 슬프게 헤어졌다.","analysis":"‘이화우’라는 봄 이미지가 이별의 상황을 감각적으로 형상화한다.","reference":"이화우 흩뿌릴 제 울며 잡고 이별한 임"},{"label":"중장 · 가을 낙엽","meaning":"가을이 되자 임도 나를 그리워할지 묻는다.","analysis":"봄→가을의 시간 경과. 추풍낙엽은 화자의 허전함과 기다림을 드러낸다.","reference":"추풍낙엽에 저도 날 생각는가"},{"label":"종장 · 멀어진 거리","meaning":"천 리 떨어진 곳을 오가는 것은 외로운 꿈뿐이다.","analysis":"공간적으로 떨어진 현실과 꿈속 재회 소망이 대비된다.","reference":"천 리에 외로운 꿈만 오락가락 하노매"}],"detailNotice":"초장·중장·종장으로 나누어 현대어·시어·표현법을 분석함.","sourceContext":"사용자 수업 범위와 고전 시조 전승본을 대조한 텍스트 해설입니다.","hanjaWords":[],"id":"w39","poem":true,"textStatus":"학습용 본문 · 표기 비교 권장"},{"group":"외부 지문","title":"원왕생가","author":"광덕","genre":"10구체 향가","theme":"아미타불의 극락정토에 왕생하기를 기원함","summary":"달을 매개로 서방 정토의 아미타불에게 왕생의 소원을 전해 달라고 빈다.","structure":"1~4구: 달에 부탁함 → 5~8구: 합장·왕생 기원 → 9~10구: 영탄과 구원의 소망","grammar":"향찰로 기록된 10구체 향가. 향찰 문자와 현대어 풀이를 구분하며, 해독의 차이를 인정한다.","emotion":"종교적 염원·간절함","devices":"달의 의인화·반복·영탄","compare":"월명사 「제망매가」와 불교적 사상·극락왕생에 대한 염원이 공통되지만 개인적 죽음의 추모와 직접적 왕생 기원이 구별됨.","note":"","intro":"달에게 서방 정토까지 가서 부처에게 소원을 전해 달라는 기도로 시작한다. 반복되는 기원은 신앙의 진정성을 강조한다.","original":"달이여, 저 서방까지 가서\n무량수불 계신 곳에 이르러\n내 간절한 소원을 고해 주십시오.\n정성으로 두 손 모아 부처를 우러르며\n극락왕생, 극락왕생을 빌겠습니다.\n부처의 큰 서원이 이루어지기를 바라니,\n이 몸은 그 약속 안에서 안식을 찾고자 합니다.","originalNote":"위 본문은 향찰 전문을 직역한 것이 아닌 의미 단위별 자체 현대어 풀이입니다. 사용자가 제공한 사진의 향찰 본문 및 구분을 우선 대조하세요.","lineGuides":[{"label":"01행","reference":"달이여, 저 서방까지 가서","meaning":"달에게 서쪽으로 가 달라고 청한다.","analysis":"달을 말을 알아듣는 전달자로 대하는 의인화다."},{"label":"02행","reference":"무량수불 계신 곳에 이르러","meaning":"아미타불이 계신 곳에 이르기를 바란다.","analysis":"서방정토를 목적지로 하는 불교적 공간 의식이 나타난다."},{"label":"03행","reference":"내 간절한 소원을 고해 주십시오.","meaning":"소원을 대신 전해 달라고 빈다.","analysis":"간청의 높임 표현이 신앙심을 드러낸다."},{"label":"04행","reference":"정성으로 두 손 모아 부처를 우러르며","meaning":"합장하며 부처에게 기도한다.","analysis":"실제 동작을 통해 발원의 진정성을 시각화한다."},{"label":"05행","reference":"극락왕생, 극락왕생을 빌겠습니다.","meaning":"극락에 태어나기를 간절히 빈다.","analysis":"반복이 소원의 간절함을 강화한다."},{"label":"06행","reference":"부처의 큰 서원이 이루어지기를 바라니,","meaning":"부처의 원력이 실현되기를 기대한다.","analysis":"개인의 구원과 불교 신앙이 연결된다."},{"label":"07행","reference":"이 몸은 그 약속 안에서 안식을 찾고자 합니다.","meaning":"불교적 구원 속에서 안식을 얻고자 한다.","analysis":"희망적 발원으로 마무리한다."}],"units":[{"label":"달의 전달자 역할","meaning":"달은 소원을 대신 전하는 존재다.","analysis":"인간이 갈 수 없는 정토로 기도를 전하는 매개체."},{"label":"왕생의 희망","meaning":"서방 정토에 태어나길 바란다.","analysis":"죽음에 대한 불교적 이해와 소원의 반복으로 간절함 강조."}],"sourceContext":"사용자 수업 범위와 고전 시조 전승본을 대조한 텍스트 해설입니다.","hanjaWords":[],"id":"w40","poem":true,"textStatus":"학습용 본문 · 표기 비교 권장"}],"concepts":[["시가 문학의 역사","고대 가요 → 향가 → 고려 속요·경기체가·한시 → 조선 시조·가사·악장 → 조선 후기 사설시조·잡가 → 개화기 창가·신체시 → 현대 자유시. 갈래는 공존하고 시대 구분은 대체가 아니다.","공무도하가 → 제망매가 → 동동 → 오백 년 도읍지를 → 속미인곡 → 소춘향가 → 진달래꽃"],["고대 가요","고대 국가의 노래로 구전되다가 후대 한문 문헌에 기록된 예가 많다. ‘한문으로 전한다’는 사실만으로 한시라고 분류하지 않는다.","공무도하가·황조가·구지가"],["향가","향찰로 기록된 고유 시가. 4구체·8구체·10구체가 있고, 10구체는 흔히 4·4·2구 구성과 마지막 낙구의 감탄사가 특징이다.","제망매가(10구체)·모죽지랑가(8구체)·헌화가(4구체)"],["고려 가요(속요)","주로 고려 시대 민간에서 불린 노래. 후렴·분연체·반복·직설적인 정서가 흔하나 모두 동일 구조는 아니다.","동동(월령체)·가시리(이별)·청산별곡(현실의 고뇌)·정석가"],["경기체가","고려 후기부터 조선 초기까지 문인층 중심의 노래. 사물·학문·풍류를 나열하며 감탄하는 구성이 특징이다.","한림별곡"],["한시의 형식","한자로 지은 시. 한 구의 글자 수(오언/칠언), 구 수(절구/율시), 압운·대구 등을 구분한다. 기승전결은 절구의 일반적인 해석 틀이지 절대 법칙은 아니다.","송인(칠언절구)·소악부 제6장(칠언절구)"],["시조 총론","3장(초장·중장·종장)과 각 장의 의미 전개가 핵심. 평시조·엇시조·사설시조는 형식, 연시조는 여러 수를 잇는 구성 방식으로 구별한다.","황진이 동짓달 기나긴 밤을 · 길재 오백 년 도읍지를 · 님이 오마 하거늘"],["평시조","기본적인 3장 6구 12음보, 4음보 중심 정형시. 종장 첫 음보의 3음절 관습을 중요하게 다룬다. 3·4조, 4·4조의 대략적 음수율은 엄격한 기계적 고정이 아니다.","동짓달 기나긴 밤을(애정)·오백 년 도읍지를(역사 회고)"],["엇시조","평시조와 사설시조의 중간 형태. 평시조의 특정 장/구가 길어지지만 사설시조만큼 장황하게 확장하지 않는 유형.","형태 판별은 작품의 실제 초·중·종장 음보와 사설 길이를 대조해야 한다."],["사설시조","초·중·종장 3장 체제를 바탕으로 특히 중장이 장형화하는 사례가 많다. 구어체·나열·우스꽝스러운 상황·풍자·해학과 관련이 깊다.","님이 오마 하거늘·두터비 파리를 물고·창 내고자 창을 내고자"],["연시조","한 수가 아니라 여러 수의 시조가 한 주제 또는 배열 원리 아래 이어지는 구성. 평·엇·사설과 다른 기준으로 구별한다.","윤선도 오우가(6수)·이황 도산십이곡(12수)·정철 훈민가(연작)"],["가사","대체로 4음보의 율격이 길게 이어지는 장편 운문. 서사·본사·결사의 흐름이나 대화체 구성 등 다양한 서술 방식을 보인다.","속미인곡(연군·대화체)·사미인곡(연군·독백)·관동별곡(기행)"],["잡가","주로 조선 후기에 전문 소리꾼이 부른 비교적 긴 노래. 판소리·가사·민요의 영향을 받고 가창·반복과 장형 사설이 특징이다.","소춘향가(경기 12잡가 계열)"],["악장","조선 초기 왕조·건국·국가의 위업을 노래하고 의례에 쓰이던 송축적 노래.","용비어천가·월인천강지곡(분류 논의와 수록 맥락 주의)"],["소악부","민간 노래의 정서와 소재를 한시 형식으로 옮겨 적은 작품군. 제목에 ‘악부’가 붙어도 현대의 악보·악장과 같지 않다.","민사평 소악부 제6장: 거미·나비·꽃의 우의"],["개화기 시가와 신체시","전통적 가창 형식에서 새로운 사회 의식과 근대적 표현으로 이행하는 과정. 창가·신체시·신시·자유시의 개념을 구별한다.","창가: 독립신문 관련 계몽 가요 등 / 신체시: 최남선 해에게서 소년에게"],["현대시와 자유시","근현대 시에서는 고정 음수보다 행·연, 이미지, 화자, 반어, 상징, 반복, 발화 상황이 중요하다. 자유시도 반복과 음성 상징으로 리듬을 만든다.","진달래꽃·유리창·님의 침묵·하관"],["소설 문학의 흐름","설화와 전기적 서사 → 한문 소설·국문 고전 소설 → 판소리계 소설 등 → 개화기 신소설 → 근현대 소설. 단순히 고전은 행복한 결말, 현대는 불행한 결말이라고 외우지 않는다.","사씨남정기·춘향전·봄봄"],["고전 소설의 갈래","영웅·가정·애정·풍자·판소리계 등 소재·전승 방식에 따라 나눌 수 있다. 전지적 서술·우연적 사건·권선징악은 흔한 경향이지 필수 조건이 아니다.","춘향전(판소리계·애정)·사씨남정기(가정)"],["현대 소설의 갈래","단편/중편/장편, 사실주의·풍자·농촌 소설 등 여러 기준으로 나뉜다. 구체적 시간·공간과 개인 심리, 사회 갈등을 읽는다.","봄봄(현대 단편·농촌·해학)"],["소설의 시점과 서술","1인칭 주인공/관찰자, 3인칭 관찰자/전지적을 구별한다. 작가·서술자·인물은 같지 않으며, 서술자의 이해 수준이 독자의 이해와 다를 수 있다.","봄봄: 1인칭 주인공(서술의 제한성) / 춘향전: 전지적 서술과 판소리 구연 전통"],["시의 표현법·정서·문장","직유·은유·상징·의인·대조·역설·반어·설의·영탄·반복·점층을 시어/문맥의 근거로 구별한다. 정서와 태도를 혼동하지 않는다.","제망매가(비유)·동짓달 기나긴 밤을(시간의 공간화)·송인(설의·과장)"]],"details":{"시가 문학의 역사":{"intro":"수업 필기의 문학사 변화: 고대 가요 → 향가 → 고려 가요·한시 → 조선 시조·가사 → 사설시조·잡가 → 근대 시가 → 현대시. 갈래가 등장한 시기와 그 갈래가 사라지는 시기를 혼동하지 않는다.","sections":[{"heading":"① 신라 · 향가","body":"향찰을 이용해 우리말을 기록. 4·8·10구체가 있고, 향가 10구체는 흔히 4+4+2구와 낙구의 감탄사로 마무리한다."},{"heading":"② 고려 · 속요/경기체가","body":"고려 속요는 민요적 성격을 지닌 노래가 궁중 연향에 유입되기도 하며, 한글 창제 뒤에 기록된 작품이 많다. 경기체가는 귀족·문인층의 풍류와 찬탄을 나타낸다."},{"heading":"③ 고려~조선 · 한시","body":"한문과 한시 형식은 지식인층에서 오랫동안 사용됐다. 조선 이후에도 소멸하지 않았으므로 서술 시대와 형식을 구분해야 한다."},{"heading":"④ 조선 · 시조/가사","body":"3장 6구의 평시조, 긴 사설을 수용하는 가사. 시조는 후기에 사설시조 등으로 변화하고 기녀·서민층으로 창작자가 확대된다."},{"heading":"⑤ 조선 후기 · 사설시조/잡가","body":"일상적 소재·희화화·사회 비판이 확대된다. 잡가는 민요나 사설시조와 구별되는 긴 대중적 성악 갈래로, 잡가라는 이름이 잡다한 시라는 뜻은 아니다."},{"heading":"⑥ 개화기·현대시","body":"창가·신체시의 정형 탈피를 거쳐 다양한 자유시와 실험적 작품으로 전개된다. 시대 구분은 절대적 칸막이가 아니다."}],"examples":"공무도하가(고대) / 제망매가(향가) / 동동(고려 속요) / 오백 년 도읍지를(시조) / 속미인곡(가사) / 진달래꽃(현대시)","matrix":[],"exam":["「제망매가」가 향찰로 쓰였다고 한문으로 지은 한시인가? → 아니다. 한자를 빌려 우리말을 적은 향가다.","고려 속요가 조선 시대에 한글로 기록될 수 있는 이유는? → 가창과 전승 시기와 문자 기록 시기가 다르기 때문이다."]},"고대 가요":{"intro":"고대 가요는 구전성과 개인·집단 노래의 흔적을 지닌다. 전승 문헌은 한문이어도 갈래 판단은 원래 노래의 성격을 고려한다.","sections":[{"heading":"「공무도하가」","body":"만류 → 강 건넘 → 이별의 확정 → 탄식. 간결한 네 구의 전개에 사랑하는 이를 잃은 비극적 정서가 집중된다. 강을 경계·단절의 공간으로 읽을 수 있다."},{"heading":"「황조가」","body":"암수 꾀꼬리가 서로 의지하는 모습 ↔ 홀로 남은 화자. 자연물과 화자의 처지를 대비하고 마지막 의문으로 외로움을 강조한다."},{"heading":"구비 전승과 기록","body":"후대 문헌에 한문으로 쓰인 형태가 남아 있더라도 당시 우리말 가창의 존재를 추정한다. 한시와 다른 문학사적 맥락이다."}],"examples":"공무도하가(임을 잃은 슬픔), 황조가(짝 없는 고독), 구지가(집단적 의례의 노래)","matrix":[],"exam":["「황조가」의 꾀꼬리는 화자와 동일한 처지인가? → 아니다. 서로 의지하는 한 쌍으로 화자와 대비된다."]},"향가":{"intro":"사진 반영: 신라 때 향찰로 기록한 노래. 『삼국유사』에 14수, 『균여전』에 11수가 전한다. 작품별 갈래·시상을 구체적으로 구별한다.","sections":[{"heading":"4구체 · 「헌화가」","body":"간결한 4구 형식이며 민요적 성격과 소박한 표현이 나타나는 작품이 있다."},{"heading":"8구체 · 「모죽지랑가」","body":"8개의 구. 죽지랑을 그리워하며 시간의 흐름과 재회의 소망을 표현한다."},{"heading":"10구체 · 「제망매가」","body":"4구+4구+2구로 구분하기도 하는 3단 형태. 9구 첫머리의 낙구 감탄사는 시상 전환과 영탄을 나타낸다."},{"heading":"표기 · 향찰","body":"한자 음과 뜻을 빌려 한국어 어순·문법을 적었다. 겉모습이 한자로 보인다는 이유로 중국 한시로 분류하면 안 된다."},{"heading":"사상과 정서","body":"불교적 내용이 많지만 세속적 정서와 추모·찬양·다짐도 나타난다. ‘모든 향가는 불교 시’라고 단정하지 않는다."}],"examples":"헌화가(4) · 모죽지랑가(8) · 제망매가(10) · 찬기파랑가(10)","matrix":[["4구체","4구","짧고 소박한 노래","헌화가"],["8구체","8구","인물 찬양·그리움","모죽지랑가"],["10구체","10구, 대체로 4+4+2","낙구의 영탄·전환","제망매가"]],"exam":["8구체 작품에 10구체만의 낙구 배치를 적용하지 않는다.","낙구의 감탄사가 항상 감정 전환을 의미하는 것은 아니므로 문맥도 확인한다."]},"고려 가요(속요)":{"intro":"사진 속 고려 가요 필기 반영: 민간 노래에서 기원한 전승 작품들이 고려 궁중에서도 불렸고, 후대 한글 문헌으로 기록된 경우가 많다. 경기체가를 구별한다.","sections":[{"heading":"발생과 전승","body":"많은 작품이 민간의 노래를 바탕으로 전승되었고 궁중 연악으로 편입되기도 했다. 조선 시대 문헌인 『악장가사』·『악학궤범』 등에 전하는 경우가 있다."},{"heading":"형식상의 공통 경향","body":"3음보 율격의 경향, 여러 연으로 나뉘는 분연체, 감탄·악기 소리로 이루어진 후렴구가 두드러진다. 전 작품에 기계적으로 적용하면 오답이다."},{"heading":"대표 작품과 내용","body":"「동동」은 12달 세시/그리움(월령체), 「가시리」는 이별의 슬픔/재회 기원, 「상저가」는 부모 공경과 노동의 일상을 나타낸다."},{"heading":"시험에 나오는 구분","body":"후렴은 음악적 운율·연 구분을 돕고, 분연체는 연속된 여러 연으로 구성된 형태다. 경기체가 「한림별곡」은 문인층의 지식과 호사를 과시한다."}],"examples":"동동(월령체·연정), 가시리(이별·그리움), 청산별곡(현실의 고뇌), 정과정(정서의 충절; 향가계의 흔적)","matrix":[["고려 속요","민간 가창과 후렴·반복","동동·가시리"],["경기체가","문인층의 자긍심·열거","한림별곡"],["향가계 고려가요","향가 계통 형식의 지속","정과정"]],"exam":["‘후렴구가 있다’만으로 고려 가요 전체를 분연체로 단정하지 않는다.","「동동」의 월령체는 12달의 흐름에 따라 시상이 펼쳐지는 구조다."]},"경기체가":{"intro":"고려 후기 문인층의 취향과 지적 자긍심을 드러내며, 후렴과 열거를 통해 화려한 율조를 만든다.","sections":[{"heading":"대표 형식","body":"작품별로 차이는 있지만 문물·학문·경치를 풍성하게 늘어놓고 감탄하는 구성이 두드러진다."},{"heading":"「한림별곡」","body":"신진 사대부의 문학적 역량·사교·풍류를 자랑한다. 현실로부터 도피하기만 하는 노래로 읽지 않는다."},{"heading":"속요와 비교","body":"고려 속요는 민간적 정서 표현이 중심인 사례가 많고 경기체가는 문인의 향락·자랑이 부각된다. 그러나 둘 다 가창·후렴이 나타날 수 있다."}],"examples":"한림별곡","matrix":[],"exam":["여러 사물과 사람의 이름을 열거하는 이유? → 지식과 풍류에 대한 자부심을 강조하기 위해서."]},"한시의 형식":{"intro":"사용자 필기 반영: 한문으로 지어진 시. 5글자=오언, 7글자=칠언; 4행=절구, 8행=율시. 예: 「송인」(칠언절구).","sections":[{"heading":"한시와 향가 구별","body":"한시는 한문 문장과 한시의 규칙을 따르지만 향가는 한자를 빌린 한국어 표기인 향찰을 사용한다."},{"heading":"오언 절구 · 오언 율시","body":"한 행마다 한자 5자, 각각 4행(절구)·8행(율시)으로 구성된다."},{"heading":"칠언 절구 · 칠언 율시","body":"한 행마다 한자 7자. 「송인」은 칠언절구로 이별의 슬픔을 생기 있는 봄 풍경과 대비한다."},{"heading":"운율·압운","body":"특정 행 끝에 운자가 같은 한자를 배치하는 압운, 근체시에서의 평측·대구를 학습한다. 한시마다 전부 동일한 규칙을 적용하는 것은 아니다."},{"heading":"한시 전개","body":"절구의 기·승·전·결은 이해를 돕는 구성 방식으로 사용될 수 있다. 율시의 수련·함련·경련·미련과 구별한다."}],"examples":"송인(정지상, 칠언절구), 소악부 제6장(민사평, 칠언절구)","matrix":[["오언절구","5자","4구","20자"],["칠언절구","7자","4구","28자"],["오언율시","5자","8구","40자"],["칠언율시","7자","8구","56자"]],"exam":["칠언절구의 전체 글자 수: 7자×4행=28자(제목 제외).","한시가 고려·조선의 작품이라면 모두 우리말로 쓰인 향가인가? → 아니다."]},"시조 총론":{"intro":"필기 반영: 시조는 3장 6구, 대체로 45자 내외, 4음보를 기본형으로 한다. 종장 첫 음보는 약 3음절, 둘째 음보는 비교적 긴 5음절 이상이 되는 경향.","sections":[{"heading":"3장 6구","body":"초장·중장·종장으로 구성되고 각 장이 2개의 구로 나뉘는 일반적 형태."},{"heading":"4음보","body":"한 장을 보통 4개의 리듬 단위로 읽는다. 고정 음절 수와 동일하지 않다."},{"heading":"종장의 특성","body":"대체로 첫 음보 3음절, 둘째 음보 5음절 이상. 종장에서 시상이 뒤집히거나 정리되기도 한다."},{"heading":"내용과 향유층","body":"조선 전기에는 사대부의 유교적 이념/자연친화, 후기에는 기녀의 사랑·서민의 풍자·일상 등 주제가 확장된다."},{"heading":"평시조와 사설시조","body":"평시조는 간결한 기본형. 사설시조는 특히 중장 등의 사설이 길어지고 사건·대사·해학이 발달한다."},{"heading":"엇시조와 연시조","body":"엇시조는 일부 구가 길어지는 변형, 연시조는 2수 이상의 시조를 묶은 연작. 서로 다른 분류 기준이다."}],"examples":"평시조: 동짓달 기나긴 밤을·오백 년 도읍지를 / 사설시조: 님이 오마 하거늘 / 연시조: 오우가·도산십이곡","matrix":[["평시조","기본 3장 6구 12음보","절제된 정형","동짓달 기나긴 밤을"],["엇시조","일부 음보·구가 다소 확장","평시조와 사설시조의 사이","교재별 해당 작품 확인"],["사설시조","대체로 중장 대폭 확장","일상어·해학·나열","님이 오마 하거늘"],["연시조","여러 수의 시조를 연속 구성","주제의 연작·변주","오우가"]],"exam":["시조의 3장은 서·본·결사와 정확히 같은 이름이 아니다.","연시조는 평시조/사설시조와 분류 기준이 달라 평시조 여러 수로도 구성될 수 있다."]},"평시조":{"intro":"시조의 표준 정형을 따르는 유형. 세 장의 의미 전환 및 종장의 마무리가 특히 중요하다.","sections":[{"heading":"3장 6구 12음보","body":"초장(4음보)·중장(4음보)·종장(4음보). 시조의 기본 리듬을 말할 때 사용한다."},{"heading":"음수율","body":"흔히 3·4조/4·4조라 하지만 모든 음보가 정확히 같은 음절 수인 것은 아니다. 종장 첫 음보의 3음절 관습을 구별."},{"heading":"「동짓달 기나긴 밤을」","body":"초장: 긴 시간을 베어냄 → 중장: 접어 보관함 → 종장: 임이 온 밤에 펼침. 연정·시간의 공간화."},{"heading":"「오백 년 도읍지를」","body":"초장: 옛 고려 도읍 방문 → 중장: 산천의 불변과 인걸의 부재 → 종장: 왕조의 무상함과 탄식."},{"heading":"주제의 다양성","body":"같은 평시조 형식이어도 애정·자연·충절·회고 등 내용은 달라진다."}],"examples":"황진이 「동짓달 기나긴 밤을」, 길재 「오백 년 도읍지를」, 황진이 「청산리 벽계수야」","matrix":[],"exam":["평시조의 「초장·중장·종장」은 각각 시에서 어떤 역할을 하는가? → 제시, 전개, 전환·마무리가 흔하지만 실제 시상 전개를 확인한다."]},"엇시조":{"intro":"평시조의 정형 일부가 늘어나는 변형. 사설시조로 착각하기 쉬우나 장형 사설의 정도를 구분한다.","sections":[{"heading":"형식 기준","body":"3장 체제를 유지하면서 특정 장의 일부 음보 또는 구가 평시조의 일반적 길이보다 길어진다."},{"heading":"사설시조와 구별","body":"사설시조는 특히 중장이 크게 장형화하는 경우가 많으며 말의 나열과 서사가 상대적으로 풍부하다."},{"heading":"주제와 예시","body":"엇시조라는 명칭만으로 주제가 애정·풍자 중 하나로 고정되지는 않는다. 현재 제공된 작품 목록에서 확실히 해당하는 작품을 특정하지 않고 판본별 형태 비교 문제로 학습한다."}],"examples":"형식 비교: 평시조 「오백 년 도읍지를」 ↔ 사설시조 「님이 오마 하거늘」 사이의 확장 단계","matrix":[],"exam":["엇시조를 사설시조와 구분할 때 가장 먼저 볼 것? → 각 장이 얼마나 길어졌는지, 특히 사설의 확장 정도."]},"사설시조":{"intro":"장형화된 서술과 구어체로 조선 후기의 생활 현실, 연정, 풍자·해학을 활발히 담는다.","sections":[{"heading":"장형화","body":"3장 형식의 흔적을 지니면서 중장이 장황하게 늘어나는 사례가 많다. 반드시 모든 작품의 중장만 늘어나는 절대 법칙은 아니다."},{"heading":"구어·나열·반복","body":"말을 늘어놓고 일상 속 몸짓을 빠르게 나열하여 실제 장면을 보는 듯한 현장감을 만든다."},{"heading":"「님이 오마 하거늘」","body":"임이 온다는 소식 → 밖에서 조급하게 기다림 → 다른 대상을 임으로 오인 → 우스꽝스러운 깨달음. 기대와 결과의 반전이 해학을 형성한다."},{"heading":"「두터비 파리를 물고」","body":"약자를 괴롭히면서 강자 앞에서는 비굴해지는 세태를 동물의 행동에 빗대어 풍자한다."},{"heading":"주제의 폭","body":"사랑과 기다림, 일상생활, 허세 비판, 신분 질서의 풍자, 개인의 욕망. 사설시조=무조건 풍자라는 단정은 오답."}],"examples":"님이 오마 하거늘(연정·해학), 두터비 파리를 물고(사회 풍자), 창 내고자 창을 내고자(답답함의 과장)","matrix":[],"exam":["임을 착각하고 뛰쳐나가는 장면은 왜 해학적인가? → 과장된 행동과 기대의 실패가 웃음을 만든다."]},"연시조":{"intro":"여러 수를 모아 하나의 주제 아래 배열한 시조 작품. ‘한 수의 길이’와 별개의 구분이다.","sections":[{"heading":"구성","body":"여러 편의 평시조가 연달아 놓일 수 있다. 전체 흐름과 각 수의 대응 관계를 확인한다."},{"heading":"「오우가」","body":"윤선도가 물·돌·소나무·대나무·달을 벗으로 삼아 자연물의 덕성을 찬양하는 연작."},{"heading":"「도산십이곡」","body":"이황이 지은 12수의 연작. 자연과 학문, 수양의 뜻을 담는다."},{"heading":"「훈민가」","body":"정철이 유교 윤리와 일상 규범을 민중에게 알리는 목적으로 지은 연작."}],"examples":"윤선도 오우가(6수) / 이황 도산십이곡(12수) / 정철 훈민가(16수)","matrix":[],"exam":["연시조와 사설시조는 양자택일 관계인가? → 아니다. 연작 여부와 길이 확장이라는 서로 다른 분류다."]},"가사":{"intro":"필기 반영: 조선의 대표적 장형 시가. 시조와 달리 행 수에 제한이 적고 4음보를 기본으로 서술의 길이가 길다.","sections":[{"heading":"운율과 길이","body":"보통 4음보의 반복, 3·4조/4·4조 등의 음수율 경향. 조선 후기에는 변격 가사가 다양하게 발달한다."},{"heading":"발달 · 향유층","body":"조선 전기에는 사대부 중심의 강호·충절 표현이 두드러지며, 후기에는 평민·여성 등 향유층이 확대되고 생활과 경험의 서술이 증가한다."},{"heading":"강호 가사","body":"자연에서의 삶과 유교적 수양을 함께 노래하는 경우가 있다."},{"heading":"기행 가사","body":"여행지의 풍경·경험·감상을 길게 기록한다. 「관동별곡」을 연관해 읽는다."},{"heading":"유배 가사","body":"유배지의 억울함과 임금에 대한 연군지정을 노래한다."},{"heading":"내방 가사","body":"여성의 삶·감정을 담는 가사 계열. 후기에 확산되었다."},{"heading":"전쟁 가사","body":"전쟁의 체험과 비판·애도를 작품으로 옮긴다."},{"heading":"「속미인곡」의 특성","body":"갑녀와 을녀의 문답 구조, 여성 화자를 통한 연군지정, 산·강·꿈·낙월·궂은비의 시상 전개."}],"examples":"속미인곡/사미인곡(연군), 관동별곡(기행), 누항사(가난 속 안빈낙도의 태도)","matrix":[["속미인곡","갑녀·을녀 대화","임과의 단절·연군"],["사미인곡","여성 화자 독백","사계절의 그리움"],["관동별곡","유람 경로와 경관 묘사","산수미·연군·선정"]],"exam":["가사는 기본적으로 4음보라는 점에서 시조와 공유하지만 장형이라는 차이가 있다.","정격/변격을 작품 길이만으로 기계적으로 판단하지 않는다."]},"잡가":{"intro":"조선 후기에 전문 음악인들이 부른 노래. 가사의 길이가 길고 대중적 가창 문화에 뿌리를 두며 다양한 곡조·구성이 있다.","sections":[{"heading":"12잡가","body":"경기 지역의 전문 소리꾼이 부르던 긴 노래들로, 「소춘향가」가 그 예에 속한다."},{"heading":"「소춘향가」","body":"춘향이 임을 향해 기울이는 몸짓과 기다리는 모습을 세세히 그려 정경과 연정을 연결한다. 소설 「춘향전」과 소재가 겹쳐도 갈래는 잡가다."},{"heading":"표현 특징","body":"신체 행동의 나열, 대화·감탄·반복, 길게 이어지는 사설이 가창의 흥과 현장감을 만든다."},{"heading":"가사와 구별","body":"가사와 잡가는 모두 길지만 역사적 향유층·가창 전통·작품 구조에서 차이가 있다."}],"examples":"소춘향가·제비가·유산가 등 경기 12잡가","matrix":[],"exam":["「소춘향가」가 춘향 이야기라고 해서 소설인가? → 아니다. 잡가라는 노래 갈래다."]},"악장":{"intro":"조선 초기 건국과 왕조의 정통성, 공덕을 기리는 궁중 행사 및 국가 의례의 노래.","sections":[{"heading":"기능","body":"왕조를 송축하고 통치 이념을 선전하는 목적이 강하다."},{"heading":"특징","body":"일부 작품은 한문·국문 혼용, 다양한 형식·길이를 가진다. 작품별로 독립된 갈래적 맥락을 확인한다."},{"heading":"비교","body":"개인의 애정이나 이별을 노래하는 고려 속요·시조와 달리 국가적 주제가 두드러진다."}],"examples":"용비어천가(조선 왕조의 정당성과 업적 찬양)","matrix":[],"exam":["악장의 대표적 창작·향유 목적? → 왕조의 공덕 찬미·의례."]},"소악부":{"intro":"민간의 사랑·이별과 같은 정서를 한문 절구에 담아낸 창작·번안 형식.","sections":[{"heading":"형식","body":"서민의 노래 소재를 한시의 4구 형식으로 옮겨 적는다. 해당 작품은 칠언절구로 학습한다."},{"heading":"「소악부 제6장」","body":"화자가 거미에게 나비가 날아갈 길에 줄을 치라고 청하고, 나비가 새 꽃을 찾으려다 잘못을 깨닫기를 바란다."},{"heading":"시어 해석","body":"거미=부탁을 받는 대상, 거미줄=변심을 깨닫게 할 수단, 나비=떠난 임, 꽃=새로운 대상."},{"heading":"주의","body":"거미줄을 임과 화자를 이어주는 로맨틱한 연결로 단순 해석하면 구절의 ‘응징·자각’ 의미를 놓친다."}],"examples":"민사평 소악부 제6장","matrix":[],"exam":["나비의 잘못을 인식하게 하려는 장치는 무엇인가? → 거미줄."]},"개화기 시가와 신체시":{"intro":"근대 전환기에는 전통적 가창의 흔적과 서구적 형식 실험이 함께 나타난다.","sections":[{"heading":"창가","body":"서양식 악곡과 결합해 계몽·교육·애국을 표방하기도 한 노래. 반드시 모두 7·5조로만 쓰이지는 않는다."},{"heading":"신체시","body":"전통 시가의 구속에서 벗어나 새로운 율격·표현을 시도하지만 현대 자유시처럼 완전히 자유로운 것은 아니다."},{"heading":"자유시로의 전개","body":"1920년대 전후 본격적 현대 시 형식이 형성되며 음수율보다 심상·상징·개인적 목소리가 확대된다."}],"examples":"신체시: 최남선 해에게서 소년에게 / 현대시: 김소월 진달래꽃","matrix":[],"exam":["신체시와 현대 자유시는 완전히 같은가? → 아니다. 형식적 과도기의 차이를 알아야 한다."]},"현대시와 자유시":{"intro":"자유시는 고정된 음절 수에서 벗어나되 운율이 없는 시가 아니다. 의미의 반복·배열·이미지로 리듬을 만든다.","sections":[{"heading":"자유시의 형식","body":"행과 연의 수가 고정되지 않는다. 반복·돈호·의성·문장 길이로 내재율을 만든다."},{"heading":"서정적 화자","body":"시 속의 ‘나’와 실제 시인은 구별한다. 시간·공간·청자·시적 상황에 따라 화자의 태도를 읽는다."},{"heading":"이미지","body":"시각·청각·촉각·후각·미각의 심상과 공감각적 심상을 가려낸다."},{"heading":"의미의 모순","body":"반어는 표현과 의도가 어긋나고, 역설은 겉보기 모순에서 참된 뜻이 드러난다."},{"heading":"문학사적 주제","body":"이별(진달래꽃), 상실(유리창·하관), 저항·역사 의식, 신앙·성찰 등 다양하다."}],"examples":"김소월 진달래꽃 / 정지용 유리창 / 한용운 님의 침묵 / 박목월 하관","matrix":[],"exam":["자유시에 운율이 없다는 설명은 옳은가? → 아니다. 내재율과 반복이 가능하다."]},"소설 문학의 흐름":{"intro":"필기 반영: 설화·한문 전기소설→한글 소설의 확산→판소리계/영웅/가정 소설→개화기 신소설→현대 소설의 실험적 서술.","sections":[{"heading":"설화의 전승","body":"신화·전설·민담 등의 서사적 요소가 고전 소설의 소재·구성에 영향을 주었다."},{"heading":"한문 소설","body":"조선 전기 전기적 한문 소설이 등장했다. 『금오신화』는 대표적인 작품이다."},{"heading":"국문·판소리계 소설","body":"한글 대중화와 독자층 확대 속에 「춘향전」 등 판소리계 소설도 중요한 위치를 차지한다."},{"heading":"신소설·현대 소설","body":"계몽적 신소설을 거쳐 개인의 심리·현실 갈등과 다양한 시점·구성을 가진 현대 소설로 발전한다."}],"examples":"고전: 춘향전·사씨남정기 / 근대: 이인직 혈의 누 / 현대: 김유정 봄봄","matrix":[],"exam":["서술의 변화에는 문체뿐 아니라 독자층과 매체 변화가 관계한다."]},"고전 소설의 갈래":{"intro":"수업 사진 반영: 조선 전기와 후기의 소설은 창작·유통 배경 및 내용에서 차이가 있으며, 초현실성과 권선징악이 자주 나타난다.","sections":[{"heading":"초기 · 전기적 한문 소설","body":"『금오신화』 같은 초기 작품은 비현실적인 사건과 한문 문체를 활용하며 현실과 환상의 경계를 넘나드는 전기적 서사가 나타난다."},{"heading":"조선 후기 · 국문 소설","body":"한글 보급과 독자층 확대로 국문 소설이 발달한다. 영웅·가정·애정·풍자 등 다양한 유형이 확산된다."},{"heading":"판소리계 소설 · 「춘향전」","body":"구어·열거·의성어·해학·독자/청중과의 친밀감을 활용하며 신분의 모순과 인간적 가치를 드러낸다."},{"heading":"가정 소설 · 「사씨남정기」","body":"가족의 갈등을 통해 윤리적 인물의 시련·회복·권선징악을 보여 준다. 사진 속 꿈과 약수의 기적은 전기적 요소의 예다."},{"heading":"고전소설의 오답 주의","body":"“모든 고전 소설은 전지적 작가 시점만 사용한다”, “모든 사건은 필연이다”처럼 지나친 일반화는 옳지 않다."}],"examples":"춘향전(판소리계·애정), 사씨남정기(가정), 홍길동전(영웅)","matrix":[],"exam":["사씨남정기의 신기한 약수 장면은 현실성만을 추구하는 서술이 아니다.","고전 소설은 조선 말 개화 전후까지 경계가 분명하지 않으므로 ‘1894년 이전’이라는 기준도 절대적이지 않다."]},"현대 소설의 갈래":{"intro":"길이(단편·중편·장편)와 소재·경향(농촌·역사·풍자·심리 등)은 서로 다른 분류 기준이다.","sections":[{"heading":"단편 소설","body":"주로 제한된 인물·시간·갈등에 집중하지만 예외도 있다. 「봄·봄」은 사건의 한 갈등을 중심으로 전개한다."},{"heading":"농촌 소설","body":"농촌의 노동, 생활, 인간관계와 경제적 불합리를 구체적으로 드러낸다."},{"heading":"해학과 풍자","body":"해학은 인물의 결점에서 웃음을 낳되 인간적 애정이 깔리고, 풍자는 사회나 권력의 모순을 비판하며 웃게 한다."},{"heading":"「봄·봄」의 인물 구조","body":"‘나’는 장인에게 노동력을 제공하지만 혼인은 미뤄지고, 점순은 둘 사이 갈등을 부추긴다. 서술자는 인물들의 속뜻을 다 이해하지 못한다."}],"examples":"김유정 봄봄: 현대 단편·농촌·해학","matrix":[],"exam":["서술자인 ‘나’가 이해하지 못하는 장인의 행동을 독자가 알아차린다면? → 서술자의 제한된 인식과 독자의 이해 사이의 간극."]},"소설의 시점과 서술":{"intro":"시점 문제는 ‘누가 말하는가’, ‘누구의 생각을 아는가’, ‘어떤 정보를 독자에게 제공하는가’를 순서대로 살펴보면 쉽게 풀린다.","sections":[{"heading":"1인칭 주인공","body":"사건 당사자인 ‘나’가 자신의 경험을 전한다. 자신의 판단이 불완전하거나 편향될 수 있다. 「봄·봄」."},{"heading":"1인칭 관찰자","body":"‘나’가 다른 인물의 이야기를 관찰·전달한다. 주인공의 내면은 말·행동·추측으로 알게 된다."},{"heading":"3인칭 관찰자","body":"이야기 밖 서술자가 관찰 가능한 말과 행동을 중심으로 드러내며 인물의 내면 정보를 제한한다."},{"heading":"3인칭 전지적","body":"이야기 밖 서술자가 여러 인물의 내면·과거·미래·사건 의미를 폭넓게 알 수 있다."},{"heading":"작가 ≠ 서술자 ≠ 인물","body":"글을 쓴 실존 작가와 작품 속 말하는 목소리, 등장인물을 구별해야 반어·아이러니를 이해할 수 있다."}],"examples":"봄봄(1인칭 주인공) / 춘향전(전지적 서술과 판소리의 구연적 개입)","matrix":[["1인칭 주인공","작중 ‘나’","주인공 자기 경험"],["1인칭 관찰자","작중 ‘나’","다른 사람 관찰"],["3인칭 관찰자","작품 밖 서술자","인물의 외면 중심"],["3인칭 전지적","작품 밖 서술자","여러 인물 내면까지 앎"]],"exam":["「봄·봄」의 ‘나’가 상황을 오해할 수 있는 이유? → 1인칭 주인공 시점의 제한적 인식."]},"시의 표현법·정서·문장":{"intro":"시험에서는 ‘무슨 수법인가’보다 ‘그 수법으로 어떤 의미·정서를 강화하는가’를 근거까지 연결해야 한다.","sections":[{"heading":"직유와 은유","body":"직유: 같이·처럼 등의 비교 표지. 은유: A를 B로 직접 제시. 「제망매가」는 떨어지는 잎과 남매의 이별을 유사 관계로 제시한다."},{"heading":"대조와 대비","body":"서로 다른 대상·정서를 병치해 의미를 선명하게 한다. 「황조가」의 한 쌍 꾀꼬리 vs 홀로인 화자."},{"heading":"설의와 영탄","body":"설의: 답을 알고 묻는 형식으로 의미 강조. 영탄: 감탄사·감탄형으로 정서 표출. 「송인」의 강물은 언제 마르겠는가, 「제망매가」의 아아."},{"heading":"반어와 역설","body":"반어는 겉말과 속뜻이 어긋나고, 역설은 모순되어 보이는 진술이 깊은 의미를 낳는다. 작품의 문맥으로 확인."},{"heading":"상징과 의인","body":"나비=변심한 임처럼 사물이 추상적·인물적 의미를 띠면 상징/우의, 사물에 사람의 역할을 주면 의인."},{"heading":"시의 태도","body":"화자가 처지를 받아들이는지·극복하는지·저항하는지·체념하는지에 따라 정서의 방향이 달라진다."}],"examples":"제망매가(낙엽·영탄), 송인(설의·과장), 속미인곡(대화·상징), 님이 오마 하거늘(해학)","matrix":[["설의","의문형으로 이미 전제된 답 강조","송인"],["영탄","감정 직접 분출","제망매가"],["반어","말과 의도 불일치","진달래꽃(해석상 논의 주의)"],["우의","한 사물로 다른 인물·상황 비유","소악부 제6장"]],"exam":["「송인」의 “언제 마를까?”에 실제로 강물이 마르는 날짜를 찾으면? → 잘못. 설의와 과장이다."]}},"lexicon":{"生死":"생사","彌陀刹":"미타찰","道":"도","天上":"천상","白玉京":"백옥경","離別":"이별","春寒":"춘한","苦熱":"고열","秋日":"추일","冬天":"동천","日月":"일월","咫尺":"지척","千里":"천리","力盡":"역진","落月":"낙월","青燈":"청등","鷄聲":"계성","虛事":"허사","精誠":"정성","茅簷":"모첨","半壁":"반벽","消息":"소식","殘月曉星":"잔월효성","千萬":"천만","山":"산","過":"과","小樂府":"소악부","七言絶句":"칠언절구","蝶":"접","冬至":"동지","春風":"춘풍","雨歇長堤草色多":"우헐장제초색다","送君南浦動悲歌":"송군남포동비가","大同江水何時盡":"대동강수하시진","別淚年年添綠波":"별루년년첨록파","日光":"일광","竹林":"죽림","亭子":"정자","動動":"동동","德":"덕","福":"복","正月":"정월","二月":"이월","三月":"삼월","四月":"사월","五月":"오월","五日":"오일","六月":"유월","七月":"칠월","八月":"팔월","九月":"구월","九日":"구일","十月":"시월","十一月":"십일월","十二月":"십이월","萬人":"만인","滿春":"만춘","長存":"장존","百種":"백종","嘉俳":"가배","黃花":"황화","汗杉":"한삼","開":"개","藥":"약","顧":"고","情":"정","以手":"이수","加額":"가액","金樽美酒":"금준미주","千人血":"천인혈","玉盤佳肴":"옥반가효","萬姓膏":"만성고","燭淚落時":"촉루낙시","民淚落":"민루낙","歌聲高處":"가성고처","怨聲高":"원성고","封庫罷職":"봉고파직","天門":"천문","九重":"구중","紫微宮":"자미궁","關東":"관동","江湖":"강호","聖恩":"성은","百番":"백번","鍜鍊":"단련","珊瑚":"산호","天國":"천국","黃金":"황금","梧桐":"오동","光明":"광명","平和":"평화","弱者":"약자","慈悲":"자비","菩薩":"보살","大平盛代":"태평성대","盟誓":"맹세","微風":"미풍","追憶":"추억","運命":"운명","指針":"지침","源泉":"원천","希望":"희망","沈默":"침묵","押韻":"압운","推敲":"퇴고","格律":"격률","公無渡河":"공무도하","公竟渡河":"공경도하","墮河而死":"타하이사","當奈公何":"당내공하","翩翩黃鳥":"편편황조","雌雄相依":"자웅상의","念我之獨":"염아지독","誰其與歸":"수기여귀","杜鵑花":"두견화","金":"금","大同江":"대동강","行":"행","阿彌陀佛":"아미타불","靑燈":"청등","漢詩":"한시","眞":"진"},"hanjaChars":{"生":"생","死":"사","彌":"미","陀":"타","刹":"찰","道":"도","天":"천","上":"상","白":"백","玉":"옥","京":"경","離":"이","別":"별","春":"춘","寒":"한","苦":"고","熱":"열","秋":"추","日":"일","冬":"동","粥":"죽","早":"조","飯":"반","朝":"조","夕":"석","消":"소","息":"식","山":"산","川":"천","月":"월","咫":"지","尺":"척","千":"천","里":"이","江":"강","茅":"모","簷":"첨","半":"반","壁":"벽","靑":"청","燈":"등","力":"역","盡":"진","精":"정","誠":"성","情":"정","鷄":"계","聲":"성","虛":"허","事":"사","窓":"창","落":"낙","殘":"잔","曉":"효","星":"성","過":"과","萬":"만","至":"지","風":"풍","雨":"우","歇":"헐","長":"장","堤":"제","草":"초","色":"색","多":"다","送":"송","君":"군","南":"남","浦":"포","動":"동","悲":"비","歌":"가","大":"대","同":"동","水":"수","何":"하","時":"시","淚":"누","年":"연","添":"첨","綠":"녹","波":"파","德":"덕","福":"복","正":"정","二":"이","人":"인","三":"삼","開":"개","滿":"만","四":"사","錄":"녹","五":"오","藥":"약","存":"존","六":"육","七":"칠","百":"백","種":"종","排":"배","顧":"고","八":"팔","嘉":"가","俳":"배","九":"구","黃":"황","花":"화","十":"십","後":"후","一":"일","汗":"한","杉":"삼","盤":"반","番":"번","鍜":"하","鍊":"연","金":"김","珊":"산","瑚":"호","國":"국","義":"의","梧":"오","桐":"동","光":"광","明":"명","平":"평","和":"화","弱":"약","者":"자","慈":"자","菩":"보","薩":"살","盛":"성","代":"대","盟":"맹","誓":"서","微":"미","追":"추","憶":"억","運":"운","命":"명","指":"지","針":"침","源":"원","泉":"천","希":"희","望":"망","沈":"침","默":"묵","公":"공","無":"무","渡":"도","河":"하","竟":"경","墮":"타","而":"이","當":"당","奈":"내","翩":"편","鳥":"조","雌":"자","雄":"웅","相":"상","依":"의","念":"염","我":"아","之":"지","獨":"독","誰":"수","其":"기","與":"여","歸":"귀"}}</script><script>
(()=>{'use strict';
const D=JSON.parse(document.getElementById('lit-data').textContent),works=D.works,concepts=D.concepts,details=D.details,H=D.hanjaChars,L=D.lexicon;
const state={kind:'home',idx:0,tab:'read',query:'',scale:1};
const E=(s)=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=(s)=>E(s).replace(/\n/g,'<br>');
const isHan=c=>Object.prototype.hasOwnProperty.call(H,c);
function reading(s){let out='',i=0;while(i<s.length){let best='';for(const w of Object.keys(L))if(s.startsWith(w,i)&&w.length>best.length)best=w;if(best){out+=L[best];i+=best.length;}else{out+=H[s[i]]||s[i];i++;}}return out;}
function rubric(s){let out='',buf='';function push(){if(!buf)return;out+=`<ruby>${E(buf)}<rt>${E(reading(buf))}</rt></ruby>`;buf='';}for(const c of String(s||'')){if(isHan(c))buf+=c;else{push();out+=E(c)}}push();return out;}
function snip(s){return String(s||'').slice(0,240)}
function showSide(show){document.getElementById('sidebar').classList.toggle('open',show);document.getElementById('shade').classList.toggle('show',show)}
function navList(){let frag='',parts=['교과 작품','소설','외부 지문'];let q=state.query.trim().toLowerCase();for(const group of parts){const list=works.map((w,i)=>({w,i})).filter(o=>o.w.group===group&&(!q||(`${o.w.title} ${o.w.author} ${o.w.genre}`).toLowerCase().includes(q)));if(!list.length)continue;frag+=`<div class="category">${E(group)} <small>${list.length}</small></div>`;for(const {w,i} of list)frag+=`<button class="nav-item ${state.kind==='work'&&state.idx===i?'active':''}" data-route="w${i}">${E(w.title)}<small>${E(w.author||'')}</small></button>`;}
const cx=concepts.map((c,i)=>({c,i})).filter(o=>!q||o.c[0].toLowerCase().includes(q));if(cx.length){frag+=`<div class="category">문학 개념 <small>${cx.length}</small></div>`;for(const {c,i}of cx)frag+=`<button class="nav-item ${state.kind==='concept'&&state.idx===i?'active':''}" data-route="c${i}">${E(c[0])}</button>`;}
document.getElementById('navigation').innerHTML=frag||'<p class="small" style="padding:15px">검색 결과가 없어요.</p>';}
function baseHero(w){return `<section class="hero"><div class="eyebrow">文學 NOTE · 작품 분석</div><h1>${E(w.title)}</h1><p class="lead">${E(w.intro||w.summary||'작품의 갈래와 흐름을 읽어 봅시다.')}</p><div class="chips"><span class="chip">${E(w.author||'작자 미상')}</span><span class="chip">${E(w.genre||'문학 작품')}</span><span class="chip">${E(w.textStatus||'학습용 본문')}</span></div></section>`;}
function textInfo(w){const ok=w.source&&/^https?:\/\//.test(w.source);const visible=w.copyrighted&&ok?`<div class="source-url">${E(w.source)}</div>`:'';return `<p class="source-note">${E(w.sourceContext||w.originalNote||'판본과 해독이 다를 수 있으므로 수업 자료를 함께 확인하세요.')}</p>${visible}${ok?`<a class="readlink" href="${E(w.source)}" target="_blank" rel="noopener noreferrer">${w.copyrighted?'원문 URL 열기':'원문·출처 자료 열기'} ↗</a>`:''}`;}
function poemGuides(w){if(w.title==='속미인곡'&&w.alignedLines?.length)return w.alignedLines.map((r,i)=>({label:`${i+1}행 · ${r.speaker}`,reference:r.original,meaning:r.modern,analysis:r.analysis,speaker:r.speaker}));return w.lineGuides||[];}
function hanjaLookup(w){const items=[],seen=new Set();for(const term of w.hanjaWords||[]){if(!seen.has(term.hanja)){items.push(term);seen.add(term.hanja)}}for(const row of w.hanjaPronunciations||[]){if(!seen.has(row.hanja)){items.push({hanja:row.hanja,reading:row.reading,meaning:row.meaning});seen.add(row.hanja)}}return items;}
function renderVocabulary(w){const words=hanjaLookup(w);let vocab='';if(words.length)vocab+=`<div class="vocab-grid">${words.map(p=>`<div class="word"><span>${E(p.hanja)}</span><strong>${E(p.reading)}</strong><small>${E(p.meaning)}</small></div>`).join('')}</div>`;if(w.vocab)vocab+=`<p class="small" style="margin-top:14px">${E(w.vocab)}</p>`;return vocab||'<p class="small">작품의 핵심 어휘는 구절별 풀이에서 확인해 주세요.</p>';}
function originalReader(w){if(w.copyrighted)return `<div class="copyright-box"><strong>저작권 보호 작품</strong><p>시 전문은 이 프로그램에 재수록하지 않습니다. 아래에 표시되는 원문 URL을 열어 작품을 읽고, 이 화면에서는 구간별 해설·표현법·시험 포인트를 확인하세요.</p></div>`;if(w.chapterPairs?.length)return `<p class="small">사용자가 제공한 이미지의 장별 원문과 현대어 풀이를 나란히 대조합니다.</p>${w.chapterPairs.map((a,i)=>`<article class="paired"><div class="left"><div class="tagline">${E(a.label)} · 원문</div><div class="verse">${rubric(a.original)}</div></div><div class="right"><div class="tagline">현대어 풀이</div><div class="interpret">${E(a.modern)}</div><div class="note-panel">${E(a.analysis)}</div></div></article>`).join('')}`;if(!w.original)return `<div class="empty">현재 신뢰할 수 있는 본문이 확보되지 않아 전문을 임의로 생성하지 않았습니다. 대신 의미 단위 해석을 제공합니다.</div>`;
 if(w.title==='속미인곡')return `<p class="small">원문과 사용자가 제공한 현대어 풀이를 문답별로 나란히 배치했습니다. 한자 위에 한글 독음도 함께 표시됩니다.</p>${w.alignedLines.map((a,i)=>`<article class="paired"><div class="left"><div class="tagline">${String(i+1).padStart(2,'0')} · 원문</div><span class="speaker ${a.speaker==='을녀'?'b':''}">${E(a.speaker)}</span><div class="verse">${rubric(a.original)}</div></div><div class="right"><div class="tagline">현대어 풀이</div><div class="interpret">${E(a.modern)}</div><div class="note-panel">${E(a.analysis)}</div></div></article>`).join('')}`;
 if(!w.poem)return `<div class="text-body">${E(w.original)}</div>`;
 const lines=w.original.split('\n').filter(a=>a.trim());const guides=poemGuides(w);
 if(w.hanjaPronunciations?.length===lines.length)return lines.map((line,i)=>{const g=w.hanjaPronunciations[i];return `<article class="paired"><div class="left"><div class="tagline">${String(i+1).padStart(2,'0')} · 한문 원전</div><div class="verse pure-hanja">${rubric(line)}</div><div class="reading">독음 · ${E(g.reading)}</div></div><div class="right"><div class="tagline">현대어 풀이</div><div class="interpret">${E(g.meaning)}</div><div class="note-panel">${E((guides[i]||{}).analysis||'원문의 뜻과 작품 정서를 연결해 보세요.')}</div></div></article>`}).join('');
 const match=lines.length===guides.length&&lines.length<80;
 if(match)return lines.map((line,i)=>{const g=guides[i],old=String(g.meaning||'').trim()===line.trim();const phrase=old?null:g.meaning;return `<article class="paired"><div class="left"><div class="tagline">${String(i+1).padStart(2,'0')} · 본문</div><div class="verse">${rubric(line)}</div></div><div class="right"><div class="tagline">${phrase?'현대어 풀이·내용':'의미·해석'}</div>${phrase?`<div class="interpret">${E(phrase)}</div>`:''}<div class="note-panel">${E(g.analysis||'작품의 맥락에 따라 표현을 살펴보세요.')}</div></div></article>`}).join('');
 return `<pre class="text-body">${rubric(w.readableOriginal||w.original)}</pre>${w.readableOriginal?`<details class="quiz-details"><summary>옛 표기 원문 확인</summary><p>${rubric(w.original)}</p></details>`:''}<p class="small">이 작품은 행별 자료가 확보되지 않은 일부 구간이 있어 아래 ‘구절별 해석’에서 확인 가능한 의미 단위 중심으로 풀이했습니다.</p>`;
}
function readTab(w){return `<section class="section"><div class="toolbar"><h2>01 · ${w.copyrighted?'원문 URL · 작품 읽기':w.poem?'시 전문 · 현대어 대조':'소설 본문'}</h2><div class="buttonrow"><button class="font-btn" data-action="down" aria-label="글자 작게">가−</button><button class="font-btn" data-action="up" aria-label="글자 크게">가＋</button></div></div>${originalReader(w)}${textInfo(w)}</section>`}
function guideCards(w){const gs=poemGuides(w);if(!gs.length)return '<div class="empty">원문이 확보되지 않은 일부 작품은 아래 시상 전개 분석을 참고하세요.</div>';
 return `<div class="analysis-list">${gs.map((g,i)=>`<article class="analysis-card"><h3>${E(g.label||`${i+1}구절`)}</h3>${g.reference?`<div class="quote">${rubric(g.reference)}</div>`:''}<div class="badge-label">뜻풀이 · 내용</div><p>${E(g.meaning||'해당 부분의 의미를 주변 시상과 연결해 이해합니다.')}</p><div class="badge-label">표현법 · 정서 · 효과</div><p>${E(g.analysis||'화자의 처지와 정서에 맞춰 해석해 보세요.')}</p></article>`).join('')}</div>`;}
function unitCards(w){return w.units?.length?`<hr class="muted-divider"><h2>전체 흐름 · ${w.units.length}단계</h2><div class="analysis-list">${w.units.map((u,i)=>`<article class="analysis-card"><h3>${E(u.label||`제${i+1}부분`)}</h3>${u.original?`<div class="quote">${rubric(u.original)}</div>`:''}<div class="badge-label">핵심 내용</div><p>${E(u.meaning)}</p><div class="badge-label">상세 분석</div><p>${E(u.analysis)}</p></article>`).join('')}</div>`:'';}
function analysisTab(w){return `<section class="section"><h2>02 · ${w.poem?'구절·문장별 해석':'문장·장면별 해설'}</h2><p class="small" style="margin-bottom:13px">${E(w.detailNotice||'원문 근거, 뜻풀이, 표현 효과를 구별해서 읽어 주세요.')}</p>${guideCards(w)}${unitCards(w)}</section>`;}
function knowledgeTab(w){const info=[['갈래 · 형식',w.genre],['주제',w.theme],['시상·사건 전개',w.structure],['화자의 정서·태도',w.emotion],['문법·문장 구조',w.grammar],['표현법·상징',w.devices],['함께 비교',w.compare],['핵심 어휘',w.vocab]];return `<section class="section"><h2>03 · 갈래 · 문법 · 정서 · 표현법</h2><div class="info-grid">${info.filter(x=>x[1]).map(([a,b])=>`<div class="infobox"><div class="infokey">${E(a)}</div><p>${E(b)}</p></div>`).join('')}</div></section><section class="section"><h2>한자·옛말 독음 사전</h2><p class="small" style="margin-bottom:14px">원문에서는 한자 위에 한글 독음을 표시합니다. 여기의 독음은 현대 한국 한자음이며, 당시 실제 발음·중세 음운과 일치한다고 단정하지 않습니다.</p>${renderVocabulary(w)}</section>`}
function pointTab(w){return `<section class="section"><h2>04 · 시험 핵심과 오답 점검</h2><div class="concept-box"><h3>기억할 핵심</h3><p>${E(w.point||w.summary||'작품의 문맥을 확인하세요.')}</p></div><div class="concept-box"><h3>틀리기 쉬운 해석</h3><p>${E(w.pitfalls||'화자와 실제 작가를 구별하고 의미를 문맥 속에서 판단하세요.')}</p></div><details class="quiz-details"><summary>자가 점검 · 왜 이런 정서와 표현이 나타나는지 답하기</summary><p>${E(w.point||'핵심 시상과 장치를 원문에서 찾아보세요.')}</p></details>${w.source&&/^https?:\/\//.test(w.source)?`<p class="small" style="margin-top:14px">본문 출처 확인: <a href="${E(w.source)}" target="_blank" rel="noopener noreferrer">자료 열기 ↗</a></p>`:''}</section>`;}
function workPage(w){const names=['본문·현대어','구절별 분석','문법·정서','시험 대비'];return `${baseHero(w)}<nav class="tabbar" aria-label="학습 내용 탭">${names.map((n,i)=>`<button class="tab ${state.tab===['read','analysis','knowledge','exam'][i]?'active':''}" data-tab="${['read','analysis','knowledge','exam'][i]}">${n}</button>`).join('')}</nav><div id="tab-content">${workTabHtml(w)}</div>`;}
function workTabHtml(w){return ({read:()=>readTab(w),analysis:()=>analysisTab(w),knowledge:()=>knowledgeTab(w),exam:()=>pointTab(w)})[state.tab]();}
function conceptPage(idx){const c=concepts[idx],d=details[c[0]]||{};return `<section class="hero"><div class="eyebrow">文學 NOTE · 문학 개념</div><h1>${E(c[0])}</h1><p class="lead">${E(d.intro||c[1])}</p></section><section class="section" style="margin-top:18px"><h2>핵심 정의와 대표 작품</h2><div class="info-grid"><div class="infobox"><div class="infokey">정의 · 형식</div><p>${E(c[1])}</p></div><div class="infobox"><div class="infokey">작품 · 대표 주제</div><p>${E(c[2])}</p></div></div></section><section class="section"><h2>개념 상세 정리</h2>${(d.sections||[]).map((s,i)=>`<article class="concept-box"><h3><span class="indexnum">${String(i+1).padStart(2,'0')}</span> ${E(s.heading)}</h3><p>${E(s.body)}</p></article>`).join('')}${d.matrix?.length?`<div class="tablewrap"><table><tbody>${d.matrix.map(row=>`<tr>${row.map(cell=>`<td>${E(cell)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`:''}</section><section class="section"><h2>오답 주의</h2>${(d.exam||[]).map((q,i)=>`<article class="concept-box"><p>${E(q)}</p></article>`).join('')}</section>`;}
function home(){return `<section class="hero"><div class="eyebrow">文學 NOTE · 대한민국 국어 문학 학습</div><h1>시 한 행부터,<br>문학사 전체까지.</h1><p class="lead">기존에 보내 준 교과서 본문과 고전시가를 한글 독음·현대어·표현법과 함께 공부합니다. 한자 위 독음을 바로 읽고, 작품마다 본문/정밀 해석/문법/시험 대비를 구분해 볼 수 있어요.</p><div class="chips"><span class="chip">작품 ${works.length}개</span><span class="chip">개념 ${concepts.length}단원</span><span class="chip">고전 한자 독음</span><span class="chip">오프라인 HTML</span></div></section><div class="concept-grid">${[...concepts.slice(0,7)].map(c=>{let i=concepts.findIndex(x=>x[0]===c[0]);return `<button class="conceptnav" data-route="c${i}"><h3>${E(c[0])}</h3><p>${E(snip(c[1]))}</p></button>`;}).join('')}</div><p class="footer">원문이 확보되지 않은 저작권 보호 작품이나 긴 고전 작품은 전문을 임의로 만들어 넣지 않습니다. 확인 가능한 본문과 의미 단위 해설을 구별합니다.</p>`;}
function render(){const view=document.getElementById('view');view.innerHTML=state.kind==='home'?home():state.kind==='work'?workPage(works[state.idx]):conceptPage(state.idx);navList();document.title=(state.kind==='home'?'국어 문학 노트':state.kind==='work'?works[state.idx].title:concepts[state.idx][0])+' | 문학 노트 v14';document.documentElement.style.setProperty('--fontscale',String(state.scale));}
function navigate(k){if(k==='home'){state.kind='home';state.idx=0;}else if(/^w\d+$/.test(k)&&+k.slice(1)<works.length){state.kind='work';state.idx=+k.slice(1);state.tab='read';}else if(/^c\d+$/.test(k)&&+k.slice(1)<concepts.length){state.kind='concept';state.idx=+k.slice(1);}else return;showSide(false);render();window.scrollTo({top:0,behavior:'auto'});if(location.hash!=='#'+k)history.replaceState(null,'','#'+k);}
function onClick(e){const route=e.target.closest('[data-route]');if(route){navigate(route.dataset.route);return}const t=e.target.closest('[data-tab]');if(t&&state.kind==='work'){state.tab=t.dataset.tab;render();return}const a=e.target.closest('[data-action]');if(a){state.scale=Math.min(1.45,Math.max(.85,Math.round((state.scale+(a.dataset.action==='up'?.1:-.1))*100)/100));document.documentElement.style.setProperty('--fontscale',String(state.scale));}}
document.addEventListener('click',onClick);document.getElementById('menu').addEventListener('click',()=>showSide(true));document.getElementById('shade').addEventListener('click',()=>showSide(false));document.getElementById('brand').addEventListener('click',e=>{e.preventDefault();navigate('home')});document.getElementById('search').addEventListener('input',e=>{state.query=e.target.value;navList()});document.addEventListener('keydown',e=>{if(e.key==='Escape')showSide(false);if(e.key==='/'&&!['INPUT','TEXTAREA'].includes(document.activeElement.tagName)){e.preventDefault();document.getElementById('search').focus();showSide(true)}});window.addEventListener('hashchange',()=>navigate(location.hash.slice(1)));
window.__studyTest={getState:()=>({...state}),goto:navigate,items:works.map(w=>({title:w.title,poem:w.poem,orig:w.original.length,guide:(w.lineGuides||[]).length,aligned:(w.alignedLines||[]).length}))};
navigate(location.hash.slice(1)||'home');
})();
</script></body></html>
