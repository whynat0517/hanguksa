</style><meta name="korean-build" content="v14-integrated-20261010"></head><body class="portal-korean" data-app-subject="korean"><div id="globalSubjectBarWrap"><nav id="globalSubjectBar" aria-label="과목 전환"><a class="history" href="/" target="_self"><span class="subjectEmoji">📜</span><span>한국사</span></a><a class="social" href="/social/" target="_self"><span class="subjectEmoji">🌐</span><span>통합사회</span></a><a class="english" href="/english/" target="_self"><span class="subjectEmoji">🔤</span><span>공통영어</span></a><a class="korean active" href="/korean/" target="_self" aria-current="page"><span class="subjectEmoji">📖</span><span>국어</span></a></nav></div><div class="mobile-shade" id="shade"></div><div class="mobile-bar"><strong style="color:#913729;font-family:Batang,serif">文 국어 문학 노트</strong><button id="menu" class="open-menu" aria-label="작품 목록 열기">☰ 목록</button></div><div class="app"><aside class="sidebar" id="sidebar"><a href="#home" id="brand" class="brand"><span class="seal">文</span>국어 문학 노트</a><p class="sidehint">고전시가 · 현대시 · 소설 · 문학사</p><input class="search" id="search" type="search" placeholder="작품명·작가·갈래 검색" aria-label="작품과 개념 검색"><div id="navigation"></div></aside><main class="content" id="view" tabindex="-1"></main></div><script id="lit-data" type="application/json">{"works":[{"group":"교과 작품","title":"제망매가","author":"월명사","genre":"10구체 향가","theme":"누이의 죽음을 애도하며 불교적 재회를 기원함","summary":"생사의 갈림길에서 누이와 갑자기 헤어졌음을 탄식한다. 같은 가지에서 자란 잎이 바람에 흩어지듯 혈육도 죽음 앞에 갈라진다. 극락에서 다시 만날 것을 믿으며 수행을 다짐한다.","structure":"1~4구 이별의 상황과 충격 → 5~8구 가을바람·잎의 비유로 이별의 보편성 인식 → 9~10구 종교적 재회와 수행의 다짐.","grammar":"10구체 향가의 3단 구성(4구+4구+2구). 향찰은 한자 음과 뜻을 빌려 우리말을 표기한 방식이지 한시가 아니다. 9구의 감탄사가 시상을 전환하고 마지막 서술은 다짐의 기능을 갖는다.","emotion":"두려움·슬픔 → 무상감 → 종교적 극복 의지","devices":"직유·상징: 같은 가지에서 떨어진 잎으로 혈육의 이별을 형상화한다. 「아아」로 애도에서 종교적 극복 의지로 전환. 이승과 미타찰을 대비하는 공간 구성.","compare":"「모죽지랑가」와 죽은 사람을 기억하는 방식을 비교","note":"","intro":"생사의 갈림길에서 누이의 갑작스러운 죽음을 애도하고, 가을바람과 떨어지는 잎을 통해 혈육의 이별을 비유한 뒤, 미타찰에서 재회하겠다는 불교적 수행 의지로 시상을 전환한다.","units":[{"label":"1~4구 · 죽음 앞의 당혹과 애도","meaning":"누이는 제대로 작별 인사도 하지 못하고 갑작스럽게 죽었다. 화자는 이별의 순간을 받아들이기 어렵다.","analysis":"삶과 죽음의 경계에 대한 두려움, 설의적 탄식, 급작스러운 이별이 나타난다.","original":"생사(生死) 길은\n예 있으매 머뭇거리고,\n나는 간다는 말도\n못다 이르고 어찌 갑니까."},{"label":"5~8구 · 떨어지는 잎의 비유","meaning":"같은 부모에게서 태어난 남매도 떨어져 흩어지는 잎과 같이 헤어질 수밖에 없다.","analysis":"가지와 잎의 비유는 가족 관계와 생명의 유한성을 구체적으로 보여 준다. 이른 가을바람은 때 이른 죽음을 환기한다.","original":"어느 가을 이른 바람에\n이에 저에 떨어질 잎처럼,\n한 가지에 나고\n가는 곳 모르온저."},{"label":"9~10구 · 재회의 희망과 발원","meaning":"아미타불의 극락정토에서 누이를 다시 만나도록 불도를 닦으며 기다리겠다.","analysis":"‘아아’로 시작하는 낙구에서 비탄이 종교적 극복 의지로 전환된다. 10구체 향가 4·4·2구 구성을 확인할 수 있다.","original":"아아, 미타찰(彌陀刹)에서 만날 나\n도(道) 닦아 기다리겠노라."}],"vocab":"생사(生死): 삶과 죽음 / 예: 여기 / 못다 이르고: 말을 다 마치지 못하고 / 이른 바람: 때 이르게 불어온 바람, 갑작스러운 죽음의 이미지 / 모르온저: 알 수 없구나 / 미타찰(彌陀刹): 아미타불의 극락정토 / 도(道) 닦아: 불교 수행을 하여","point":"10구체 향가의 4·4·2구 구성, 9구의 감탄사, 자연물의 비유, 슬픔에서 극복 의지로 이어지는 시상 변화를 본문에서 확인할 것.","pitfalls":"제공된 문장은 향찰 원문이 아니라 현대어 해독문이다. ‘아아’ 뒤의 재회 소망을 이미 실제로 재회했다는 내용으로 읽지 말 것.","original":"생사(生死) 길은\n예 있으매 머뭇거리고,\n나는 간다는 말도\n못다 이르고 어찌 갑니까.\n어느 가을 이른 바람에\n이에 저에 떨어질 잎처럼,\n한 가지에 나고\n가는 곳 모르온저.\n아아, 미타찰(彌陀刹)에서 만날 나\n도(道) 닦아 기다리겠노라.","source":"https://ko.wikisource.org/wiki/제망매가","originalNote":"사용자가 제공한 교과서용 현대어 해독 본문 10행을 그대로 수록했습니다. 향찰 원문이 아니라 현대어 표기이므로 판본과 해독에 따라 차이가 있을 수 있습니다.","lineGuides":[{"label":"01행 · 생사(生死) 길은","reference":"생사(生死) 길은","meaning":"삶과 죽음이 갈라지는 길이라는 의미다.","analysis":"죽음을 추상적 상태가 아니라 길로 공간화한다. 시작부터 생과 사의 경계를 제시한다."},{"label":"02행 · 예 있으매 머뭇거리고,","reference":"예 있으매 머뭇거리고,","meaning":"여기에 있기에 선뜻 나서지 못하고 망설인다는 뜻이다.","analysis":"‘머뭇거리고’에서 갑작스러운 죽음을 마주한 당혹과 두려움이 드러난다."},{"label":"03행 · 나는 간다는 말도","reference":"나는 간다는 말도","meaning":"떠나는 사람이 “나는 간다”는 말조차 하지 못했다는 상황이다.","analysis":"죽은 누이가 작별 인사를 미처 전하지 못할 만큼 갑작스레 떠났다는 사실을 강조한다."},{"label":"04행 · 못다 이르고 어찌 갑니까.","reference":"못다 이르고 어찌 갑니까.","meaning":"말을 마치지도 못하고 어떻게 떠날 수 있느냐는 탄식이다.","analysis":"의문문이지만 답을 요구하기보다 애통함을 강조하는 설의적 호소로 볼 수 있다."},{"label":"05행 · 어느 가을 이른 바람에","reference":"어느 가을 이른 바람에","meaning":"때 이른 가을바람이 불어오듯 죽음이 갑작스레 찾아왔다.","analysis":"계절 이미지와 이른 바람은 예기치 않은 이별을 떠올리게 한다."},{"label":"06행 · 이에 저에 떨어질 잎처럼,","reference":"이에 저에 떨어질 잎처럼,","meaning":"여기저기 흩날리며 떨어지는 나뭇잎처럼 서로 헤어졌다.","analysis":"나뭇잎에 사람의 운명을 빗댄 직유 표현. 존재의 무상함이 구체적 장면으로 드러난다."},{"label":"07행 · 한 가지에 나고","reference":"한 가지에 나고","meaning":"남매가 한 부모에게서 태어났다는 의미다.","analysis":"한 가지가 혈육의 공통 기원을 나타내고 잎은 같은 가지에서 난 생명들을 가리킨다."},{"label":"08행 · 가는 곳 모르온저.","reference":"가는 곳 모르온저.","meaning":"떠난 누이가 어디로 갔는지 알 수 없다.","analysis":"죽음 뒤 세계를 알 수 없다는 막막함과 이별의 슬픔이 응축되어 있다."},{"label":"09행 · 아아, 미타찰(彌陀刹)에서 만날","reference":"아아, 미타찰(彌陀刹)에서 만날 나","meaning":"아, 아미타불의 극락정토에서 다시 만나겠다는 소망이다.","analysis":"9구의 감탄사 ‘아아’는 10구체 향가 낙구의 특징으로, 애도의 정서를 종교적 소망으로 전환한다."},{"label":"10행 · 도(道) 닦아 기다리겠노라.","reference":"도(道) 닦아 기다리겠노라.","meaning":"불교의 가르침을 따라 수행하며 재회를 기다리겠다는 다짐이다.","analysis":"소극적 체념이 아니라 수행 의지를 통해 죽음의 슬픔을 극복하려는 태도다."}],"detailNotice":"사용자가 제공한 10행을 빠짐없이 나누어 행별 뜻·표현·시상 전개를 설명했습니다.","sourceContext":"사용자가 채팅으로 직접 보낸 「제망매가」 10행을 기본 본문으로 적용. 이전 향찰 한자 원문은 기본 화면에서 제외.","originalModern":"","alignedLines":null,"isExcerpt":false,"hanjaWords":[{"hanja":"生死","reading":"생사","meaning":"삶과 죽음"},{"hanja":"彌陀刹","reading":"미타찰","meaning":"아미타불의 정토"},{"hanja":"道","reading":"도","meaning":"수행의 길"}],"id":"w0","poem":true,"textStatus":"학습용 본문 · 표기 비교 권장"},{"group":"교과 작품","title":"속미인곡","author":"정철","genre":"조선 가사·양반 가사","theme":"임을 향한 변함없는 사랑과 그리움(충신연주지사)","summary":"두 여인의 문답을 통해 임과 이별한 여인의 그리움, 자책, 임의 안부 염려, 소식 탐문, 꿈속 만남과 좌절, 그리고 끝내 임 곁에 가고자 하는 소망을 드러낸 장편 가사이다.","structure":"서사: 갑녀의 물음→을녀의 지난날 회상과 자책 / 본사: 임의 안위 걱정→산과 강에서 소식 탐색→빈 배로 좌절→차가운 집과 꿈에서의 만남 / 결사: 꿈이 깨자 고독 심화→낙월의 소극적 지향→갑녀가 궂은비의 능동적 지향 권유.","grammar":"조선 가사. 4음보를 기반으로 이어지는 연속체 형식. 갑녀는 질문과 조언, 을녀는 사연과 그리움을 말한다. “~는고/~고” 등의 물음 표현과 설의적 의문, “하랴” 등의 반문을 문맥에 따라 해석한다. 현대 표기 전사본이므로 원전의 문자 자형 연구에는 원본 판본을 이용해야 한다.","emotion":"갑녀의 호기심·위로 ↔ 을녀의 자책·슬픔 → 임에 대한 염려·그리움 → 답답함·좌절 → 꿈속 기쁨과 상실 → 간절한 사랑과 적극적 접근의 요청.","devices":"두 여인의 대화체: 감정을 객관화하고 극적으로 구성. 백옥경/초가집, 옛날/지금 대비. 구름·안개·풍랑=방해물, 빈 배=무력한 고립, 꿈=일시적 만남, 닭 울음=재회 좌절, 낙월/궂은비=서로 다른 사랑의 방식. 여성 화자로 작가 정철의 연군지정을 우회적으로 형상화.","compare":"「사미인곡」: 독백체·사계절 중심 / 「속미인곡」: 대화체·공간 이동 중심. 공통으로 임금에 대한 충성과 이별의 정서를 여성 화자에 의탁.","note":"","intro":"이 버전은 속미인곡의 핵심인 대화체 구조가 한눈에 보이도록 원문과 현대어를 한 행씩 대조하도록 다시 구성했다. 갑녀의 질문, 을녀의 자책과 연군, 탐문과 꿈, 마지막 변신 소망까지 흐름이 끊기지 않게 읽을 수 있다.","units":[{"label":"도입 · 만남과 질문","original":"뎌 가는 뎌 각시 본듯도 하뎌이고\n텬상(天上) 백옥경(白玉京)을 엇디하야 니별(離別)하고\n해 다 져믄 날의 뉘를 보라 가시난고\n어와 네여이고 이내 사설 드러 보오","meaning":"저기 가는 저 각시 (어디서) 본 듯도 하구나.\n천상 백옥경을 어찌하여 이별하고\n해 다 져 저문 날에 누구를 보러 가시는가.\n어와 너로구나. 이내 사설 들어 보오.","analysis":"길 가는 여인을 우연히 만난 갑녀가 말을 건네면서 작품이 시작된다. 상대의 외형을 보고 사연을 추측하는 방식이 극적 장면을 만들고, 문답체 가사라는 작품의 성격을 분명히 드러낸다."},{"label":"자책과 원망 없는 슬픔","original":"내 얼굴 이 거동이 님 괴얌 직ᄒᆞᆫ가마ᄂᆞᆫ\n엇던디 날 보시고 네로다 녀기실새\n나도 님을 미더 군뜻디 전혀 업서\n이리야 교태야 어즈러이 흐뭇던디\n반기시는 낯비치 예와 엇디 다르신고\n누어 생각ᄒᆞ고 니러 안자 혜여ᄒᆞ니\n내 몸의 지은 죄ㅣ 산가티 ᄡᆞ혀시니\n하ᄂᆞᆯ히라 원망ᄒᆞ며 사ᄅᆞᆷ이라 허믈하랴\n셜워 플텨 혜니 조믈주의 탓이로다","meaning":"내 모습 이 거동이 임이 사랑함 직한가마는\n어쩐지 나를 보시고 너로구나 여기시기에\n나도 임을 믿어 딴 생각이 전혀 없어\n아양이며 교태며 어지럽게 하였던지\n반기시는 낯빛이 예와 어찌 다르신가.\n누워 생각하고 일어나 앉아 헤아리니\n내 몸의 지은 죄 산같이 쌓였으니\n하늘을 원망하며 사람을 탓하겠는가.\n서러워 생각하니 조물주의 탓이로다.","analysis":"을녀는 자신이 지나치게 교태를 부린 탓은 아닌지 돌아보며, 결국 모든 일을 자기 죄와 조물주의 탓으로 돌린다. 임을 원망하기보다 스스로를 책망하는 태도가 특징이다."},{"label":"임의 안부를 염려함","original":"글란 생각 마오\nᄆᆡ친 일이 이셔이다\n님을 모셔 이셔 님의 일을 내 알거니\n물 그튼 얼굴이 편ᄒᆞ실 적 몇 날일고\n춘한(春寒) 고열(苦熱)은 엇디하야 디내시며\n츄일(秋日) 동천(冬天)은 뉘라셔 뫼셨는고\n죽조반(粥早飯) 죠석(朝夕) 믜와 갓치 셰시는가\n기나긴 밤의 쟘은 엇디 자시ᄂᆞᆫ고","meaning":"그것일랑 생각 마오.\n(마음속에) 맺힌 일이 있습니다.\n임을 모셔 봐서 임의 일을 내 알거니\n물같이 연약한 몸이 편하실 때 몇 날일까.\n봄 추위 여름 더위 어떻게 지내시며\n가을철 겨울철은 누가 모셨는가.\n죽조반 조석 진지 옛날과 같이 잡수시는가.\n기나긴 밤에 잠은 어찌 주무시나.","analysis":"갑녀의 위로 뒤에 을녀는 자신의 괴로움보다 임의 건강과 식사, 잠자리를 더 걱정한다. 연모의 정이 연군의 형식으로 전환되는 핵심 대목이다."},{"label":"소식 탐문과 산·물가 장면","original":"님 다히 소식(消息)을 아므려나 아쟈 ᄒᆞ니\n오ᄂᆞᆯ도 거의로다 니일이나 사ᄅᆞᆷ 올가\n내 ᄆᆞ음 둘 덴 업다 어드러로 가쟛 말고\n잡거니 밀거니 놉픈 뫼헤 올라가니\n구롬은커니와 안개는 므스 일고\n산천(山川)이 어둡거니 일월(日月)을 엇디 보며\n지척(咫尺)을 모로거든 천 리(千里)를 ᄇᆞ라보랴\n차라리 믈가에 가 뱃길히나 보랴 ᄒᆞ니\n바람이야 믈결이야 어즈러이 된더이고\n샤공은 어디 가고 빈 배만 매여 잇고\n강천(江天)의 혼자 서서 디는 해를 구버보니\n님 다히 소식(消息)이 더욱 아득ᄒᆞ더이고","meaning":"임 계신 곳 소식을 어떻게든 알자 하니\n오늘도 저물었네. 내일이나 사람이 올까.\n내 마음 둘 데 없다 어디로 가자는 말인가.\n잡거니 밀거니 높은 산에 올라가니\n구름은 물론이고 안개는 무슨 일인가.\n산천이 어두운데 해와 달을 어찌 보며\n지척을 모르는데 천 리를 바라볼까.\n차라리 물가에 가 뱃길이나 보려 하니\n바람이야 물결이야 어수선히 되었구나.\n사공은 어디 가고 빈 배만 매여 있는가.\n강가에 혼자 서서 지는 해를 굽어보니\n임 계신 곳 소식이 더욱 아득하구나","analysis":"사람이 오기만을 기다리다 못해 산에도 오르고 물가에도 가지만, 구름과 안개와 빈 배만 보게 된다. 공간 이동이 많아지지만 임의 소식은 끝내 닿지 않아 오히려 거리감이 커진다."},{"label":"밤의 고독과 꿈속 상봉","original":"모첨(茅簷) 찬 자리의 밤중만 노라오니\n반벽(半壁) 청등(靑燈)은 뉘를 위ᄒᆞ야 불갓는고\n오르며 내리며 헤뜨며 바자니니\n져근덧 녁진(力盡)하여 풋쟘을 잠간 드니\n정성(精誠)이 지극하여 꿈의 님을 보니\n옥(玉) 그튼 얼굴이 반(半)이나마 늘거셰라\nᄆᆞ음의 머근 말을 실컷 사뢰려니\n눈물이 바라 나니 말솜인들 어이 ᄒᆞ며\n정(情)을 못다 ᄒᆞ여 목이조차 메여ᄒᆞ니\n오면됴 계성(鷄聲)의 쟘은 엇디 씨돗던고","meaning":"초가집 찬 자리에 밤 깊어 돌아오니\n벽 가운데 청등은 누구를 위해 밝았는가.\n오르며 내리며 헤매며 서성대니\n잠깐 동안 힘이 다해 풋잠을 잠깐 드니\n정성이 지극하여 꿈에 임을 보니\n옥 같은 얼굴이 반 넘어 늙었구나.\n마음에 먹은 말을 실컷 사뢰려니\n눈물이 연달아 나니 말인들 어찌하며\n정회를 못다 풀어 목조차 메어 오니\n방정맞은 닭 울음소리에 잠은 어찌 깨었던가.","analysis":"차가운 방에서 밤을 견디다가 겨우 잠든 뒤 꿈속에서 임을 만난다. 그러나 늙은 임의 모습에 눈물이 앞서 말도 다 하지 못하고, 닭 울음으로 꿈마저 깨진다."},{"label":"결말 · 달과 비의 상상","original":"어와 허사(虛事)로다 이 님이 어데 간고\n결의 니러 안자 창(窓)을 열고 ᄇᆞ라보니\n어엿븐 그림재 날 조차 뿐이로다\n차라리 셔여디여 낙월(落月)이나 되야이셔\n님 계신 창(窓) 안ᄒᆡ 번드시 비최리라","meaning":"어와, 허사로다. 이 임이 어디 갔나.\n잠결에 일어나 앉아 창을 열고 바라보니\n가엾은 그림자가 나를 좇을 뿐이로다.\n차라리 죽어서 지는 달이나 되어서\n임 계신 창 안에 환하게 비추리라.","analysis":"현실에서 만날 수 없기에 을녀는 죽어서라도 달이 되어 임의 창을 비추고 싶다고 한다. 갑녀는 달보다 구궂은 비가 되어 가까이 내리라고 제안하며 작품을 마무리한다."}],"vocab":"백옥경: 하늘의 궁전 / 괴얌 직하다: 사랑할 만하다 / 매친 일: 맺힌 일 / 죽조반: 아침밥 / 지척: 매우 가까운 거리 / 낙월: 지는 달 / 구즌 비: 궂은비","point":"① 두 화자(갑녀·을녀)의 발화 구분 ② 자책과 연군의 결합 ③ 임의 안부를 먼저 걱정하는 태도 ④ 산·물가·밤·꿈으로 이어지는 공간 이동 ⑤ 달·비로의 변신 소망","pitfalls":"모든 발화를 한 사람의 독백으로 읽으면 안 된다. 마지막의 “각시님…”은 갑녀의 응답으로 보는 것이 일반적이다. 또한 작품의 ‘임’을 단순 연애 대상만이 아니라 연군의 대상으로도 읽을 수 있다.","original":"뎌 가는 뎌 각시 본듯도 하뎌이고\n텬상(天上) 백옥경(白玉京)을 엇디하야 니별(離別)하고\n해 다 져믄 날의 뉘를 보라 가시난고\n어와 네여이고 이내 사설 드러 보오\n내 얼굴 이 거동이 님 괴얌 직ᄒᆞᆫ가마ᄂᆞᆫ\n엇던디 날 보시고 네로다 녀기실새\n나도 님을 미더 군뜻디 전혀 업서\n이리야 교태야 어즈러이 흐뭇던디\n반기시는 낯비치 예와 엇디 다르신고\n누어 생각ᄒᆞ고 니러 안자 혜여ᄒᆞ니\n내 몸의 지은 죄ㅣ 산가티 ᄡᆞ혀시니\n하ᄂᆞᆯ히라 원망ᄒᆞ며 사ᄅᆞᆷ이라 허믈하랴\n셜워 플텨 혜니 조믈주의 탓이로다\n글란 생각 마오\nᄆᆡ친 일이 이셔이다\n님을 모셔 이셔 님의 일을 내 알거니\n물 그튼 얼굴이 편ᄒᆞ실 적 몇 날일고\n춘한(春寒) 고열(苦熱)은 엇디하야 디내시며\n츄일(秋日) 동천(冬天)은 뉘라셔 뫼셨는고\n죽조반(粥早飯) 죠석(朝夕) 믜와 갓치 셰시는가\n기나긴 밤의 쟘은 엇디 자시ᄂᆞᆫ고\n님 다히 소식(消息)을 아므려나 아쟈 ᄒᆞ니\n오ᄂᆞᆯ도 거의로다 니일이나 사ᄅᆞᆷ 올가\n내 ᄆᆞ음 둘 덴 업다 어드러로 가쟛 말고\n잡거니 밀거니 놉픈 뫼헤 올라가니\n구롬은커니와 안개는 므스 일고\n산천(山川)이 어둡거니 일월(日月)을 엇디 보며\n지척(咫尺)을 모로거든 천 리(千里)를 ᄇᆞ라보랴\n차라리 믈가에 가 뱃길히나 보랴 ᄒᆞ니\n바람이야 믈결이야 어즈러이 된더이고\n샤공은 어디 가고 빈 배만 매여 잇고\n강천(江天)의 혼자 서서 디는 해를 구버보니\n님 다히 소식(消息)이 더욱 아득ᄒᆞ더이고\n모첨(茅簷) 찬 자리의 밤중만 노라오니\n반벽(半壁) 청등(靑燈)은 뉘를 위ᄒᆞ야 불갓는고\n오르며 내리며 헤뜨며 바자니니\n져근덧 녁진(力盡)하여 풋쟘을 잠간 드니\n정성(精誠)이 지극하여 꿈의 님을 보니\n옥(玉) 그튼 얼굴이 반(半)이나마 늘거셰라\nᄆᆞ음의 머근 말을 실컷 사뢰려니\n눈물이 바라 나니 말솜인들 어이 ᄒᆞ며\n정(情)을 못다 ᄒᆞ여 목이조차 메여ᄒᆞ니\n오면됴 계성(鷄聲)의 쟘은 엇디 씨돗던고\n어와 허사(虛事)로다 이 님이 어데 간고\n결의 니러 안자 창(窓)을 열고 ᄇᆞ라보니\n어엿븐 그림재 날 조차 뿐이로다\n차라리 셔여디여 낙월(落月)이나 되야이셔\n님 계신 창(窓) 안ᄒᆡ 번드시 비최리라\n각시님 달이야커니와 구즌 비나 되쇼셔","source":"https://encykorea.aks.ac.kr/Article/E0030414","originalNote":"제공된 원문 이미지에서 전사한 학습용 표기본입니다. 중세국어 자형과 분철·띄어쓰기는 교과서 판본과 대조하세요. 현대어 풀이는 사용자가 직접 제공한 내용으로 교체했습니다.","alignedLines":[{"speaker":"갑녀","original":"뎌 가는 뎌 각시 본듯도 하뎌이고","modern":"저기 가는 저 각시 (어디서) 본 듯도 하구나.","analysis":"길 위의 인물에게 말을 거는 도입이다. 외로운 여인의 모습을 먼저 포착해 문답의 상황을 설정한다.","label":"01행 · 저기 가는 저 각시 (어디서) 본"},{"speaker":"갑녀","original":"텬상(天上) 백옥경(白玉京)을 엇디하야 니별(離別)하고","modern":"천상 백옥경을 어찌하여 이별하고","analysis":"백옥경은 임이 있는 천상의 공간이면서 연군의 정치적 상징이다. 그곳과의 이별은 사랑과 신하의 소외를 겹친다.","label":"02행 · 천상 백옥경을 어찌하여 이별하고"},{"speaker":"갑녀","original":"해 다 져믄 날의 뉘를 보라 가시난고","modern":"해 다 져 저문 날에 누구를 보러 가시는가.","analysis":"해가 저무는 시간의 설정은 처지의 막막함을 강화한다. 설의적 질문은 상대의 사연을 끌어낸다.","label":"03행 · 해 다 져 저문 날에 누구를 보러"},{"speaker":"을녀","original":"어와 네여이고 이내 사설 드러 보오","modern":"어와 너로구나. 이내 사설 들어 보오.","analysis":"을녀가 자신을 알아보는 상대에게 사연을 털어놓는 진술이다. 청자 설정이 독백보다 생동감을 준다.","label":"04행 · 어와 너로구나. 이내 사설 들어 "},{"speaker":"을녀","original":"내 얼굴 이 거동이 님 괴얌 직ᄒᆞᆫ가마ᄂᆞᆫ","modern":"내 모습 이 거동이 임이 사랑함 직한가마는","analysis":"자신이 임의 사랑을 받을 만한 인물인지 되묻는다. 겸손과 자책을 통해 임 중심의 태도를 드러낸다.","label":"05행 · 내 모습 이 거동이 임이 사랑함 "},{"speaker":"을녀","original":"엇던디 날 보시고 네로다 녀기실새","modern":"어쩐지 나를 보시고 너로구나 여기시기에","analysis":"한때 임이 자신을 소중하게 여겼던 상황을 회상한다. 과거의 총애가 뒤의 소외와 대비된다.","label":"06행 · 어쩐지 나를 보시고 너로구나 여기"},{"speaker":"을녀","original":"나도 님을 미더 군뜻디 전혀 업서","modern":"나도 임을 믿어 딴 생각이 전혀 없어","analysis":"임을 전적으로 믿었다고 말해 변함없는 충정과 신뢰를 강조한다.","label":"07행 · 나도 임을 믿어 딴 생각이 전혀 "},{"speaker":"을녀","original":"이리야 교태야 어즈러이 흐뭇던디","modern":"아양이며 교태며 어지럽게 하였던지","analysis":"임에게 지나치게 사랑스러운 태도를 보인 것이 오히려 문제였는지 자책한다. 원망이 자기 성찰로 옮겨 간다.","label":"08행 · 아양이며 교태며 어지럽게 하였던지"},{"speaker":"을녀","original":"반기시는 낯비치 예와 엇디 다르신고","modern":"반기시는 낯빛이 예와 어찌 다르신가.","analysis":"예전과 다른 임의 낯빛을 묻는 설의적 표현이다. 변화의 이유를 알지 못하는 슬픔이 담긴다.","label":"09행 · 반기시는 낯빛이 예와 어찌 다르신"},{"speaker":"을녀","original":"누어 생각ᄒᆞ고 니러 안자 혜여ᄒᆞ니","modern":"누워 생각하고 일어나 앉아 헤아리니","analysis":"누웠다 일어나는 행동의 나열은 잠시도 근심을 떨치지 못하는 마음을 행동으로 보여 준다.","label":"10행 · 누워 생각하고 일어나 앉아 헤아리"},{"speaker":"을녀","original":"내 몸의 지은 죄ㅣ 산가티 ᄡᆞ혀시니","modern":"내 몸의 지은 죄 산같이 쌓였으니","analysis":"자신의 잘못을 산처럼 쌓였다고 과장하여 죄책감을 강조한다. 객관적 죄의 확정은 아니다.","label":"11행 · 내 몸의 지은 죄 산같이 쌓였으니"},{"speaker":"을녀","original":"하ᄂᆞᆯ히라 원망ᄒᆞ며 사ᄅᆞᆷ이라 허믈하랴","modern":"하늘을 원망하며 사람을 탓하겠는가.","analysis":"하늘과 사람을 탓할 수 없다는 설의적 물음이다. 그리움과 함께 충절을 지키려는 태도가 드러난다.","label":"12행 · 하늘을 원망하며 사람을 탓하겠는가"},{"speaker":"을녀","original":"셜워 플텨 혜니 조믈주의 탓이로다","modern":"서러워 생각하니 조물주의 탓이로다.","analysis":"마침내 조물주의 탓이라 돌리며 개인의 힘으로 해결할 수 없다는 운명적 체념을 드러낸다.","label":"13행 · 서러워 생각하니 조물주의 탓이로다"},{"speaker":"갑녀","original":"글란 생각 마오","modern":"그것일랑 생각 마오.","analysis":"갑녀가 자책을 그만두라고 위로한다. 두 화자의 문답 구조가 다시 확인된다.","label":"14행 · 그것일랑 생각 마오"},{"speaker":"을녀","original":"ᄆᆡ친 일이 이셔이다","modern":"(마음속에) 맺힌 일이 있습니다.","analysis":"을녀가 아직 털어놓지 못한 속마음을 밝힌다. 이후 임의 안부 염려로 화제가 옮겨 간다.","label":"15행 · (마음속에) 맺힌 일이 있습니다"},{"speaker":"을녀","original":"님을 모셔 이셔 님의 일을 내 알거니","modern":"임을 모셔 봐서 임의 일을 내 알거니","analysis":"임을 곁에서 모셨기에 그의 생활을 잘 안다는 말이다. 이어지는 구체적 걱정의 근거가 된다.","label":"16행 · 임을 모셔 봐서 임의 일을 내 알"},{"speaker":"을녀","original":"물 그튼 얼굴이 편ᄒᆞ실 적 몇 날일고","modern":"물같이 연약한 몸이 편하실 때 몇 날일까.","analysis":"물처럼 연약한 몸이라는 비유로 임의 건강을 염려한다. 사랑의 대상에 대한 헌신이 나타난다.","label":"17행 · 물같이 연약한 몸이 편하실 때 몇"},{"speaker":"을녀","original":"춘한(春寒) 고열(苦熱)은 엇디하야 디내시며","modern":"봄 추위 여름 더위 어떻게 지내시며","analysis":"봄추위와 여름더위를 나란히 놓아 계절을 두루 걱정한다. 시간의 흐름이 그리움의 지속을 만든다.","label":"18행 · 봄 추위 여름 더위 어떻게 지내시"},{"speaker":"을녀","original":"츄일(秋日) 동천(冬天)은 뉘라셔 뫼셨는고","modern":"가을철 겨울철은 누가 모셨는가.","analysis":"가을과 겨울까지 이어 묻는 열거다. 자신 대신 임을 모시는 사람이 있는지 걱정한다.","label":"19행 · 가을철 겨울철은 누가 모셨는가"},{"speaker":"을녀","original":"죽조반(粥早飯) 죠석(朝夕) 믜와 갓치 셰시는가","modern":"죽조반 조석 진지 옛날과 같이 잡수시는가.","analysis":"아침저녁 식사를 세세히 묻는다. 큰 정치적 추상보다 일상의 안위가 연군의 진정성을 드러낸다.","label":"20행 · 죽조반 조석 진지 옛날과 같이 잡"},{"speaker":"을녀","original":"기나긴 밤의 쟘은 엇디 자시ᄂᆞᆫ고","modern":"기나긴 밤에 잠은 어찌 주무시나.","analysis":"잠자리를 염려하는 물음으로 보살피고 싶은 마음을 강조한다. 잇단 질문이 절박한 어조를 만든다.","label":"21행 · 기나긴 밤에 잠은 어찌 주무시나"},{"speaker":"을녀","original":"님 다히 소식(消息)을 아므려나 아쟈 ᄒᆞ니","modern":"임 계신 곳 소식을 어떻게든 알자 하니","analysis":"소식을 얻으려 하는 의지가 드러난다. 이후 공간 이동이 시작되는 연결 대목이다.","label":"22행 · 임 계신 곳 소식을 어떻게든 알자"},{"speaker":"을녀","original":"오ᄂᆞᆯ도 거의로다 니일이나 사ᄅᆞᆷ 올가","modern":"오늘도 저물었네. 내일이나 사람이 올까.","analysis":"오늘도 기다림이 허사가 되어 내일로 기대를 미룬다. 기다림의 반복과 불확실성이 나타난다.","label":"23행 · 오늘도 저물었네. 내일이나 사람이"},{"speaker":"을녀","original":"내 ᄆᆞ음 둘 덴 업다 어드러로 가쟛 말고","modern":"내 마음 둘 데 없다 어디로 가자는 말인가.","analysis":"안정을 잃고 어느 곳으로도 향할 수 없는 심리다. 동작으로 이어지는 방황의 원인이다.","label":"24행 · 내 마음 둘 데 없다 어디로 가자"},{"speaker":"을녀","original":"잡거니 밀거니 놉픈 뫼헤 올라가니","modern":"잡거니 밀거니 높은 산에 올라가니","analysis":"산에 오르는 동작을 연달아 나열한다. 임의 소식을 직접 확인하려는 적극성을 드러낸다.","label":"25행 · 잡거니 밀거니 높은 산에 올라가니"},{"speaker":"을녀","original":"구롬은커니와 안개는 므스 일고","modern":"구름은 물론이고 안개는 무슨 일인가.","analysis":"구름과 안개는 시야를 막는 장애물이다. 임을 보지 못하는 답답함을 자연에 투사한다.","label":"26행 · 구름은 물론이고 안개는 무슨 일인"},{"speaker":"을녀","original":"산천(山川)이 어둡거니 일월(日月)을 엇디 보며","modern":"산천이 어두운데 해와 달을 어찌 보며","analysis":"산천이 어두우므로 해와 달도 보이지 않는다. 인식 불가능의 상황을 공간적으로 확대한다.","label":"27행 · 산천이 어두운데 해와 달을 어찌 "},{"speaker":"을녀","original":"지척(咫尺)을 모로거든 천 리(千里)를 ᄇᆞ라보랴","modern":"지척을 모르는데 천 리를 바라볼까.","analysis":"눈앞도 볼 수 없는데 먼 곳을 어찌 보겠느냐는 설의다. 임과의 거리와 소식의 단절을 강조한다.","label":"28행 · 지척을 모르는데 천 리를 바라볼까"},{"speaker":"을녀","original":"차라리 믈가에 가 뱃길히나 보랴 ᄒᆞ니","modern":"차라리 물가에 가 뱃길이나 보려 하니","analysis":"높은 산에서 강가로 장소를 옮긴다. 시도와 실패가 반복되며 안타까움이 커진다.","label":"29행 · 차라리 물가에 가 뱃길이나 보려 "},{"speaker":"을녀","original":"바람이야 믈결이야 어즈러이 된더이고","modern":"바람이야 물결이야 어수선히 되었구나.","analysis":"바람과 물결이 어지러운 상태로 나타난다. 외부 환경이 화자의 불안과 맞물린다.","label":"30행 · 바람이야 물결이야 어수선히 되었구"},{"speaker":"을녀","original":"샤공은 어디 가고 빈 배만 매여 잇고","modern":"사공은 어디 가고 빈 배만 매여 있는가.","analysis":"사공은 없고 빈 배만 있어 만남을 도울 수단마저 사라진다. 부재 이미지가 강조된다.","label":"31행 · 사공은 어디 가고 빈 배만 매여 "},{"speaker":"을녀","original":"강천(江天)의 혼자 서서 디는 해를 구버보니","modern":"강가에 혼자 서서 지는 해를 굽어보니","analysis":"강가에서 저무는 해를 바라보며 기다림의 하루가 끝나 간다. 공간과 시간이 함께 정서를 심화한다.","label":"32행 · 강가에 혼자 서서 지는 해를 굽어"},{"speaker":"을녀","original":"님 다히 소식(消息)이 더욱 아득ᄒᆞ더이고","modern":"임 계신 곳 소식이 더욱 아득하구나","analysis":"소식을 찾으려 했지만 오히려 더 멀어진 느낌이다. 반복된 탐색의 실패를 정리한다.","label":"33행 · 임 계신 곳 소식이 더욱 아득하구"},{"speaker":"을녀","original":"모첨(茅簷) 찬 자리의 밤중만 노라오니","modern":"초가집 찬 자리에 밤 깊어 돌아오니","analysis":"차가운 초가로 되돌아온다. 밖에서의 실패가 고독한 실내 장면으로 이어진다.","label":"34행 · 초가집 찬 자리에 밤 깊어 돌아오"},{"speaker":"을녀","original":"반벽(半壁) 청등(靑燈)은 뉘를 위ᄒᆞ야 불갓는고","modern":"벽 가운데 청등은 누구를 위해 밝았는가.","analysis":"어둠 속 홀로 켜진 등불을 묻는다. 외로운 실내 사물이 화자의 처지를 대변한다.","label":"35행 · 벽 가운데 청등은 누구를 위해 밝"},{"speaker":"을녀","original":"오르며 내리며 헤뜨며 바자니니","modern":"오르며 내리며 헤매며 서성대니","analysis":"서성임을 연속 동사로 묘사해 마음의 불안을 눈에 보이는 행동으로 드러낸다.","label":"36행 · 오르며 내리며 헤매며 서성대니"},{"speaker":"을녀","original":"져근덧 녁진(力盡)하여 풋쟘을 잠간 드니","modern":"잠깐 동안 힘이 다해 풋잠을 잠깐 드니","analysis":"지친 끝에 잠깐 잠든다. 현실의 끝에서 꿈이라는 대체적 만남의 세계가 열린다.","label":"37행 · 잠깐 동안 힘이 다해 풋잠을 잠깐"},{"speaker":"을녀","original":"정성(精誠)이 지극하여 꿈의 님을 보니","modern":"정성이 지극하여 꿈에 임을 보니","analysis":"정성이 꿈의 상봉을 불러온다고 한다. 현실에서 불가능했던 만남이 환상 공간에서 시도된다.","label":"38행 · 정성이 지극하여 꿈에 임을 보니"},{"speaker":"을녀","original":"옥(玉) 그튼 얼굴이 반(半)이나마 늘거셰라","modern":"옥 같은 얼굴이 반 넘어 늙었구나.","analysis":"옥같던 임의 얼굴이 늙었다는 묘사는 임의 안위를 걱정하는 마음을 더 크게 만든다.","label":"39행 · 옥 같은 얼굴이 반 넘어 늙었구나"},{"speaker":"을녀","original":"ᄆᆞ음의 머근 말을 실컷 사뢰려니","modern":"마음에 먹은 말을 실컷 사뢰려니","analysis":"그동안 하지 못한 말을 쏟아내려 한다. 오랜 억눌림과 정서의 절박함이 드러난다.","label":"40행 · 마음에 먹은 말을 실컷 사뢰려니"},{"speaker":"을녀","original":"눈물이 바라 나니 말솜인들 어이 ᄒᆞ며","modern":"눈물이 연달아 나니 말인들 어찌하며","analysis":"눈물 때문에 말을 할 수 없다는 탄식이다. 감정이 언어를 압도하는 순간이다.","label":"41행 · 눈물이 연달아 나니 말인들 어찌하"},{"speaker":"을녀","original":"정(情)을 못다 ᄒᆞ여 목이조차 메여ᄒᆞ니","modern":"정회를 못다 풀어 목조차 메어 오니","analysis":"마음속 응어리를 다 풀지 못한다. 목이 메는 몸의 반응으로 슬픔을 구체화한다.","label":"42행 · 정회를 못다 풀어 목조차 메어 오"},{"speaker":"을녀","original":"오면됴 계성(鷄聲)의 쟘은 엇디 씨돗던고","modern":"방정맞은 닭 울음소리에 잠은 어찌 깨었던가.","analysis":"닭 울음이 꿈을 중단시키는 외부 자극이다. 짧은 재회마저 끊기는 좌절을 강조한다.","label":"43행 · 방정맞은 닭 울음소리에 잠은 어찌"},{"speaker":"을녀","original":"어와 허사(虛事)로다 이 님이 어데 간고","modern":"어와, 허사로다. 이 임이 어디 갔나.","analysis":"꿈이 허사가 되었음을 깨닫고 탄식한다. 꿈과 현실의 단절이 한층 뚜렷해진다.","label":"44행 · 어와, 허사로다. 이 임이 어디 "},{"speaker":"을녀","original":"결의 니러 안자 창(窓)을 열고 ᄇᆞ라보니","modern":"잠결에 일어나 앉아 창을 열고 바라보니","analysis":"창을 열어 임을 찾지만 꿈에서만 가능했던 만남은 사라졌다. 희망이 다시 부재로 바뀐다.","label":"45행 · 잠결에 일어나 앉아 창을 열고 바"},{"speaker":"을녀","original":"어엿븐 그림재 날 조차 뿐이로다","modern":"가엾은 그림자가 나를 좇을 뿐이로다.","analysis":"자신의 그림자만 곁에 남았다는 말은 고독을 시각화한다. 그림자는 동반자가 아닌 부재의 증거다.","label":"46행 · 가엾은 그림자가 나를 좇을 뿐이로"},{"speaker":"을녀","original":"차라리 셔여디여 낙월(落月)이나 되야이셔","modern":"차라리 죽어서 지는 달이나 되어서","analysis":"지는 달이 되어서라도 임 곁에 가고 싶다는 소망이다. 변신의 상상으로 거리의 제약을 넘으려 한다.","label":"47행 · 차라리 죽어서 지는 달이나 되어서"},{"speaker":"을녀","original":"님 계신 창(窓) 안ᄒᆡ 번드시 비최리라","modern":"임 계신 창 안에 환하게 비추리라.","analysis":"달빛으로 임이 있는 창을 밝히려 한다. 거리를 두고 임을 비추는 헌신적 태도가 나타난다.","label":"48행 · 임 계신 창 안에 환하게 비추리라"},{"speaker":"갑녀","original":"각시님 달이야커니와 구즌 비나 되쇼셔","modern":"각시님 달도 좋지만 궂은비나 되소서.","analysis":"갑녀가 달보다 궂은비를 권한다. 닿지 못하는 빛보다 직접 임에게 내리는 비가 더 가까운 사랑·연군의 방법이라는 해석이 가능하다.","label":"49행 · 각시님 달도 좋지만 궂은비나 되소"}],"lineGuides":[{"label":"01행 · 저기 가는 저 각시 (어디서) 본","reference":"뎌 가는 뎌 각시 본듯도 하뎌이고","meaning":"저기 가는 저 각시 (어디서) 본 듯도 하구나.","analysis":"길 위의 인물에게 말을 거는 도입이다. 외로운 여인의 모습을 먼저 포착해 문답의 상황을 설정한다."},{"label":"02행 · 천상 백옥경을 어찌하여 이별하고","reference":"텬상(天上) 백옥경(白玉京)을 엇디하야 니별(離別)하고","meaning":"천상 백옥경을 어찌하여 이별하고","analysis":"백옥경은 임이 있는 천상의 공간이면서 연군의 정치적 상징이다. 그곳과의 이별은 사랑과 신하의 소외를 겹친다."},{"label":"03행 · 해 다 져 저문 날에 누구를 보러","reference":"해 다 져믄 날의 뉘를 보라 가시난고","meaning":"해 다 져 저문 날에 누구를 보러 가시는가.","analysis":"해가 저무는 시간의 설정은 처지의 막막함을 강화한다. 설의적 질문은 상대의 사연을 끌어낸다."},{"label":"04행 · 어와 너로구나. 이내 사설 들어 ","reference":"어와 네여이고 이내 사설 드러 보오","meaning":"어와 너로구나. 이내 사설 들어 보오.","analysis":"을녀가 자신을 알아보는 상대에게 사연을 털어놓는 진술이다. 청자 설정이 독백보다 생동감을 준다."},{"label":"05행 · 내 모습 이 거동이 임이 사랑함 ","reference":"내 얼굴 이 거동이 님 괴얌 직ᄒᆞᆫ가마ᄂᆞᆫ","meaning":"내 모습 이 거동이 임이 사랑함 직한가마는","analysis":"자신이 임의 사랑을 받을 만한 인물인지 되묻는다. 겸손과 자책을 통해 임 중심의 태도를 드러낸다."},{"label":"06행 · 어쩐지 나를 보시고 너로구나 여기","reference":"엇던디 날 보시고 네로다 녀기실새","meaning":"어쩐지 나를 보시고 너로구나 여기시기에","analysis":"한때 임이 자신을 소중하게 여겼던 상황을 회상한다. 과거의 총애가 뒤의 소외와 대비된다."},{"label":"07행 · 나도 임을 믿어 딴 생각이 전혀 ","reference":"나도 님을 미더 군뜻디 전혀 업서","meaning":"나도 임을 믿어 딴 생각이 전혀 없어","analysis":"임을 전적으로 믿었다고 말해 변함없는 충정과 신뢰를 강조한다."},{"label":"08행 · 아양이며 교태며 어지럽게 하였던지","reference":"이리야 교태야 어즈러이 흐뭇던디","meaning":"아양이며 교태며 어지럽게 하였던지","analysis":"임에게 지나치게 사랑스러운 태도를 보인 것이 오히려 문제였는지 자책한다. 원망이 자기 성찰로 옮겨 간다."},{"label":"09행 · 반기시는 낯빛이 예와 어찌 다르신","reference":"반기시는 낯비치 예와 엇디 다르신고","meaning":"반기시는 낯빛이 예와 어찌 다르신가.","analysis":"예전과 다른 임의 낯빛을 묻는 설의적 표현이다. 변화의 이유를 알지 못하는 슬픔이 담긴다."},{"label":"10행 · 누워 생각하고 일어나 앉아 헤아리","reference":"누어 생각ᄒᆞ고 니러 안자 혜여ᄒᆞ니","meaning":"누워 생각하고 일어나 앉아 헤아리니","analysis":"누웠다 일어나는 행동의 나열은 잠시도 근심을 떨치지 못하는 마음을 행동으로 보여 준다."},{"label":"11행 · 내 몸의 지은 죄 산같이 쌓였으니","reference":"내 몸의 지은 죄ㅣ 산가티 ᄡᆞ혀시니","meaning":"내 몸의 지은 죄 산같이 쌓였으니","analysis":"자신의 잘못을 산처럼 쌓였다고 과장하여 죄책감을 강조한다. 객관적 죄의 확정은 아니다."},{"label":"12행 · 하늘을 원망하며 사람을 탓하겠는가","reference":"하ᄂᆞᆯ히라 원망ᄒᆞ며 사ᄅᆞᆷ이라 허믈하랴","meaning":"하늘을 원망하며 사람을 탓하겠는가.","analysis":"하늘과 사람을 탓할 수 없다는 설의적 물음이다. 그리움과 함께 충절을 지키려는 태도가 드러난다."},{"label":"13행 · 서러워 생각하니 조물주의 탓이로다","reference":"셜워 플텨 혜니 조믈주의 탓이로다","meaning":"서러워 생각하니 조물주의 탓이로다.","analysis":"마침내 조물주의 탓이라 돌리며 개인의 힘으로 해결할 수 없다는 운명적 체념을 드러낸다."},{"label":"14행 · 그것일랑 생각 마오","reference":"글란 생각 마오","meaning":"그것일랑 생각 마오.","analysis":"갑녀가 자책을 그만두라고 위로한다. 두 화자의 문답 구조가 다시 확인된다."},{"label":"15행 · (마음속에) 맺힌 일이 있습니다","reference":"ᄆᆡ친 일이 이셔이다","meaning":"(마음속에) 맺힌 일이 있습니다.","analysis":"을녀가 아직 털어놓지 못한 속마음을 밝힌다. 이후 임의 안부 염려로 화제가 옮겨 간다."},{"label":"16행 · 임을 모셔 봐서 임의 일을 내 알","reference":"님을 모셔 이셔 님의 일을 내 알거니","meaning":"임을 모셔 봐서 임의 일을 내 알거니","analysis":"임을 곁에서 모셨기에 그의 생활을 잘 안다는 말이다. 이어지는 구체적 걱정의 근거가 된다."},{"label":"17행 · 물같이 연약한 몸이 편하실 때 몇","reference":"물 그튼 얼굴이 편ᄒᆞ실 적 몇 날일고","meaning":"물같이 연약한 몸이 편하실 때 몇 날일까.","analysis":"물처럼 연약한 몸이라는 비유로 임의 건강을 염려한다. 사랑의 대상에 대한 헌신이 나타난다."},{"label":"18행 · 봄 추위 여름 더위 어떻게 지내시","reference":"춘한(春寒) 고열(苦熱)은 엇디하야 디내시며","meaning":"봄 추위 여름 더위 어떻게 지내시며","analysis":"봄추위와 여름더위를 나란히 놓아 계절을 두루 걱정한다. 시간의 흐름이 그리움의 지속을 만든다."},{"label":"19행 · 가을철 겨울철은 누가 모셨는가","reference":"츄일(秋日) 동천(冬天)은 뉘라셔 뫼셨는고","meaning":"가을철 겨울철은 누가 모셨는가.","analysis":"가을과 겨울까지 이어 묻는 열거다. 자신 대신 임을 모시는 사람이 있는지 걱정한다."},{"label":"20행 · 죽조반 조석 진지 옛날과 같이 잡","reference":"죽조반(粥早飯) 죠석(朝夕) 믜와 갓치 셰시는가","meaning":"죽조반 조석 진지 옛날과 같이 잡수시는가.","analysis":"아침저녁 식사를 세세히 묻는다. 큰 정치적 추상보다 일상의 안위가 연군의 진정성을 드러낸다."},{"label":"21행 · 기나긴 밤에 잠은 어찌 주무시나","reference":"기나긴 밤의 쟘은 엇디 자시ᄂᆞᆫ고","meaning":"기나긴 밤에 잠은 어찌 주무시나.","analysis":"잠자리를 염려하는 물음으로 보살피고 싶은 마음을 강조한다. 잇단 질문이 절박한 어조를 만든다."},{"label":"22행 · 임 계신 곳 소식을 어떻게든 알자","reference":"님 다히 소식(消息)을 아므려나 아쟈 ᄒᆞ니","meaning":"임 계신 곳 소식을 어떻게든 알자 하니","analysis":"소식을 얻으려 하는 의지가 드러난다. 이후 공간 이동이 시작되는 연결 대목이다."},{"label":"23행 · 오늘도 저물었네. 내일이나 사람이","reference":"오ᄂᆞᆯ도 거의로다 니일이나 사ᄅᆞᆷ 올가","meaning":"오늘도 저물었네. 내일이나 사람이 올까.","analysis":"오늘도 기다림이 허사가 되어 내일로 기대를 미룬다. 기다림의 반복과 불확실성이 나타난다."},{"label":"24행 · 내 마음 둘 데 없다 어디로 가자","reference":"내 ᄆᆞ음 둘 덴 업다 어드러로 가쟛 말고","meaning":"내 마음 둘 데 없다 어디로 가자는 말인가.","analysis":"안정을 잃고 어느 곳으로도 향할 수 없는 심리다. 동작으로 이어지는 방황의 원인이다."},{"label":"25행 · 잡거니 밀거니 높은 산에 올라가니","reference":"잡거니 밀거니 놉픈 뫼헤 올라가니","meaning":"잡거니 밀거니 높은 산에 올라가니","analysis":"산에 오르는 동작을 연달아 나열한다. 임의 소식을 직접 확인하려는 적극성을 드러낸다."},{"label":"26행 · 구름은 물론이고 안개는 무슨 일인","reference":"구롬은커니와 안개는 므스 일고","meaning":"구름은 물론이고 안개는 무슨 일인가.","analysis":"구름과 안개는 시야를 막는 장애물이다. 임을 보지 못하는 답답함을 자연에 투사한다."},{"label":"27행 · 산천이 어두운데 해와 달을 어찌 ","reference":"산천(山川)이 어둡거니 일월(日月)을 엇디 보며","meaning":"산천이 어두운데 해와 달을 어찌 보며","analysis":"산천이 어두우므로 해와 달도 보이지 않는다. 인식 불가능의 상황을 공간적으로 확대한다."},{"label":"28행 · 지척을 모르는데 천 리를 바라볼까","reference":"지척(咫尺)을 모로거든 천 리(千里)를 ᄇᆞ라보랴","meaning":"지척을 모르는데 천 리를 바라볼까.","analysis":"눈앞도 볼 수 없는데 먼 곳을 어찌 보겠느냐는 설의다. 임과의 거리와 소식의 단절을 강조한다."},{"label":"29행 · 차라리 물가에 가 뱃길이나 보려 ","reference":"차라리 믈가에 가 뱃길히나 보랴 ᄒᆞ니","meaning":"차라리 물가에 가 뱃길이나 보려 하니","analysis":"높은 산에서 강가로 장소를 옮긴다. 시도와 실패가 반복되며 안타까움이 커진다."},{"label":"30행 · 바람이야 물결이야 어수선히 되었구","reference":"바람이야 믈결이야 어즈러이 된더이고","meaning":"바람이야 물결이야 어수선히 되었구나.","analysis":"바람과 물결이 어지러운 상태로 나타난다. 외부 환경이 화자의 불안과 맞물린다."},{"label":"31행 · 사공은 어디 가고 빈 배만 매여 ","reference":"샤공은 어디 가고 빈 배만 매여 잇고","meaning":"사공은 어디 가고 빈 배만 매여 있는가.","analysis":"사공은 없고 빈 배만 있어 만남을 도울 수단마저 사라진다. 부재 이미지가 강조된다."},{"label":"32행 · 강가에 혼자 서서 지는 해를 굽어","reference":"강천(江天)의 혼자 서서 디는 해를 구버보니","meaning":"강가에 혼자 서서 지는 해를 굽어보니","analysis":"강가에서 저무는 해를 바라보며 기다림의 하루가 끝나 간다. 공간과 시간이 함께 정서를 심화한다."},{"label":"33행 · 임 계신 곳 소식이 더욱 아득하구","reference":"님 다히 소식(消息)이 더욱 아득ᄒᆞ더이고","meaning":"임 계신 곳 소식이 더욱 아득하구나","analysis":"소식을 찾으려 했지만 오히려 더 멀어진 느낌이다. 반복된 탐색의 실패를 정리한다."},{"label":"34행 · 초가집 찬 자리에 밤 깊어 돌아오","reference":"모첨(茅簷) 찬 자리의 밤중만 노라오니","meaning":"초가집 찬 자리에 밤 깊어 돌아오니","analysis":"차가운 초가로 되돌아온다. 밖에서의 실패가 고독한 실내 장면으로 이어진다."},{"label":"35행 · 벽 가운데 청등은 누구를 위해 밝","reference":"반벽(半壁) 청등(靑燈)은 뉘를 위ᄒᆞ야 불갓는고","meaning":"벽 가운데 청등은 누구를 위해 밝았는가.","analysis":"어둠 속 홀로 켜진 등불을 묻는다. 외로운 실내 사물이 화자의 처지를 대변한다."},{"label":"36행 · 오르며 내리며 헤매며 서성대니","reference":"오르며 내리며 헤뜨며 바자니니","meaning":"오르며 내리며 헤매며 서성대니","analysis":"서성임을 연속 동사로 묘사해 마음의 불안을 눈에 보이는 행동으로 드러낸다."},{"label":"37행 · 잠깐 동안 힘이 다해 풋잠을 잠깐","reference":"져근덧 녁진(力盡)하여 풋쟘을 잠간 드니","meaning":"잠깐 동안 힘이 다해 풋잠을 잠깐 드니","analysis":"지친 끝에 잠깐 잠든다. 현실의 끝에서 꿈이라는 대체적 만남의 세계가 열린다."},{"label":"38행 · 정성이 지극하여 꿈에 임을 보니","reference":"정성(精誠)이 지극하여 꿈의 님을 보니","meaning":"정성이 지극하여 꿈에 임을 보니","analysis":"정성이 꿈의 상봉을 불러온다고 한다. 현실에서 불가능했던 만남이 환상 공간에서 시도된다."},{"label":"39행 · 옥 같은 얼굴이 반 넘어 늙었구나","reference":"옥(玉) 그튼 얼굴이 반(半)이나마 늘거셰라","meaning":"옥 같은 얼굴이 반 넘어 늙었구나.","analysis":"옥같던 임의 얼굴이 늙었다는 묘사는 임의 안위를 걱정하는 마음을 더 크게 만든다."},{"label":"40행 · 마음에 먹은 말을 실컷 사뢰려니","reference":"ᄆᆞ음의 머근 말을 실컷 사뢰려니","meaning":"마음에 먹은 말을 실컷 사뢰려니","analysis":"그동안 하지 못한 말을 쏟아내려 한다. 오랜 억눌림과 정서의 절박함이 드러난다."},{"label":"41행 · 눈물이 연달아 나니 말인들 어찌하","reference":"눈물이 바라 나니 말솜인들 어이 ᄒᆞ며","meaning":"눈물이 연달아 나니 말인들 어찌하며","analysis":"눈물 때문에 말을 할 수 없다는 탄식이다. 감정이 언어를 압도하는 순간이다."},{"label":"42행 · 정회를 못다 풀어 목조차 메어 오","reference":"정(情)을 못다 ᄒᆞ여 목이조차 메여ᄒᆞ니","meaning":"정회를 못다 풀어 목조차 메어 오니","analysis":"마음속 응어리를 다 풀지 못한다. 목이 메는 몸의 반응으로 슬픔을 구체화한다."},{"label":"43행 · 방정맞은 닭 울음소리에 잠은 어찌","reference":"오면됴 계성(鷄聲)의 쟘은 엇디 씨돗던고","meaning":"방정맞은 닭 울음소리에 잠은 어찌 깨었던가.","analysis":"닭 울음이 꿈을 중단시키는 외부 자극이다. 짧은 재회마저 끊기는 좌절을 강조한다."},{"label":"44행 · 어와, 허사로다. 이 임이 어디 ","reference":"어와 허사(虛事)로다 이 님이 어데 간고","meaning":"어와, 허사로다. 이 임이 어디 갔나.","analysis":"꿈이 허사가 되었음을 깨닫고 탄식한다. 꿈과 현실의 단절이 한층 뚜렷해진다."},{"label":"45행 · 잠결에 일어나 앉아 창을 열고 바","reference":"결의 니러 안자 창(窓)을 열고 ᄇᆞ라보니","meaning":"잠결에 일어나 앉아 창을 열고 바라보니","analysis":"창을 열어 임을 찾지만 꿈에서만 가능했던 만남은 사라졌다. 희망이 다시 부재로 바뀐다."},{"label":"46행 · 가엾은 그림자가 나를 좇을 뿐이로","reference":"어엿븐 그림재 날 조차 뿐이로다","meaning":"가엾은 그림자가 나를 좇을 뿐이로다.","analysis":"자신의 그림자만 곁에 남았다는 말은 고독을 시각화한다. 그림자는 동반자가 아닌 부재의 증거다."},{"label":"47행 · 차라리 죽어서 지는 달이나 되어서","reference":"차라리 셔여디여 낙월(落月)이나 되야이셔","meaning":"차라리 죽어서 지는 달이나 되어서","analysis":"지는 달이 되어서라도 임 곁에 가고 싶다는 소망이다. 변신의 상상으로 거리의 제약을 넘으려 한다."},{"label":"48행 · 임 계신 창 안에 환하게 비추리라","reference":"님 계신 창(窓) 안ᄒᆡ 번드시 비최리라","meaning":"임 계신 창 안에 환하게 비추리라.","analysis":"달빛으로 임이 있는 창을 밝히려 한다. 거리를 두고 임을 비추는 헌신적 태도가 나타난다."},{"label":"49행 · 각시님 달도 좋지만 궂은비나 되소","reference":"각시님 달이야커니와 구즌 비나 되쇼셔","meaning":"각시님 달도 좋지만 궂은비나 되소서.","analysis":"갑녀가 달보다 궂은비를 권한다. 닿지 못하는 빛보다 직접 임에게 내리는 비가 더 가까운 사랑·연군의 방법이라는 해석이 가능하다."}],"detailNotice":"원문과 제공된 현대어를 49행으로 대조합니다. 해독본과 판본에 따라 세부 표기는 다를 수 있습니다.","sourceContext":"사용자가 보낸 세 장의 원문 이미지와 직접 입력한 현대어 풀이를 대조하여 재구성한 학습용 본문입니다. 웹의 불완전한 블로그 캡처 대신 이 자료를 기준으로 원문/현대어를 나란히 정리했습니다.","originalModern":"저기 가는 저 각시 (어디서) 본 듯도 하구나.\n천상 백옥경을 어찌하여 이별하고\n해 다 져 저문 날에 누구를 보러 가시는가.\n어와 너로구나. 이내 사설 들어 보오.\n내 모습 이 거동이 임이 사랑함 직한가마는\n어쩐지 나를 보시고 너로구나 여기시기에\n나도 임을 믿어 딴 생각이 전혀 없어\n아양이며 교태며 어지럽게 하였던지\n반기시는 낯빛이 예와 어찌 다르신가.\n누워 생각하고 일어나 앉아 헤아리니\n내 몸의 지은 죄 산같이 쌓였으니\n하늘을 원망하며 사람을 탓하겠는가.\n서러워 생각하니 조물주의 탓이로다.\n그것일랑 생각 마오.\n(마음속에) 맺힌 일이 있습니다.\n임을 모셔 봐서 임의 일을 내 알거니\n물같이 연약한 몸이 편하실 때 몇 날일까.\n봄 추위 여름 더위 어떻게 지내시며\n가을철 겨울철은 누가 모셨는가.\n죽조반 조석 진지 옛날과 같이 잡수시는가.\n기나긴 밤에 잠은 어찌 주무시나.\n임 계신 곳 소식을 어떻게든 알자 하니\n오늘도 저물었네. 내일이나 사람이 올까.\n내 마음 둘 데 없다 어디로 가자는 말인가.\n잡거니 밀거니 높은 산에 올라가니\n구름은 물론이고 안개는 무슨 일인가.\n산천이 어두운데 해와 달을 어찌 보며\n지척을 모르는데 천 리를 바라볼까.\n차라리 물가에 가 뱃길이나 보려 하니\n바람이야 물결이야 어수선히 되었구나.\n사공은 어디 가고 빈 배만 매여 있는가.\n강가에 혼자 서서 지는 해를 굽어보니\n임 계신 곳 소식이 더욱 아득하구나\n초가집 찬 자리에 밤 깊어 돌아오니\n벽 가운데 청등은 누구를 위해 밝았는가.\n오르며 내리며 헤매며 서성대니\n잠깐 동안 힘이 다해 풋잠을 잠깐 드니\n정성이 지극하여 꿈에 임을 보니\n옥 같은 얼굴이 반 넘어 늙었구나.\n마음에 먹은 말을 실컷 사뢰려니\n눈물이 연달아 나니 말인들 어찌하며\n정회를 못다 풀어 목조차 메어 오니\n방정맞은 닭 울음소리에 잠은 어찌 깨었던가.\n어와, 허사로다. 이 임이 어디 갔나.\n잠결에 일어나 앉아 창을 열고 바라보니\n가엾은 그림자가 나를 좇을 뿐이로다.\n차라리 죽어서 지는 달이나 되어서\n임 계신 창 안에 환하게 비추리라.\n각시님 달도 좋지만 궂은비나 되소서.","isExcerpt":false,"copyrighted":false,"hanjaWords":[{"hanja":"天上","reading":"천상","meaning":"하늘 세계"},{"hanja":"白玉京","reading":"백옥경","meaning":"옥으로 된 천상의 궁궐"},{"hanja":"離別","reading":"이별","meaning":"헤어짐"},{"hanja":"春寒","reading":"춘한","meaning":"봄추위"},{"hanja":"苦熱","reading":"고열","meaning":"더위"},{"hanja":"秋日","reading":"추일","meaning":"가을날"},{"hanja":"冬天","reading":"동천","meaning":"겨울철"},{"hanja":"日月","reading":"일월","meaning":"해와 달"},{"hanja":"咫尺","reading":"지척","meaning":"아주 가까움"},{"hanja":"千里","reading":"천리","meaning":"매우 먼 거리"},{"hanja":"力盡","reading":"역진","meaning":"기운이 다함"},{"hanja":"落月","reading":"낙월","meaning":"지는 달"},{"hanja":"青燈","reading":"청등","meaning":"푸른빛 등불"},{"hanja":"鷄聲","reading":"계성","meaning":"닭 울음"},{"hanja":"虛事","reading":"허사","meaning":"헛된 일"},{"hanja":"精誠","reading":"정성","meaning":"정성스러운 마음"},{"hanja":"茅簷","reading":"모첨","meaning":"초가의 처마"},{"hanja":"半壁","reading":"반벽","meaning":"벽 한편"},{"hanja":"消息","reading":"소식","meaning":"소식"}],"id":"w1","poem":true,"textStatus":"사용자 제공/대조 본문 · 판본 확인 권장"},{"group":"교과 작품","title":"정과정곡","author":"정서","genre":"고려 가요·향가계 10구체 전통","theme":"유배된 신하가 자신의 결백과 임금에 대한 충절을 호소함","summary":"나를 모함하는 말은 사실이 아니며 나는 임을 배반한 적이 없다고 하소연한다. 돌아갈 수 없는 처지를 탄식하면서도 임이 알아주기를 간절하게 바란다.","structure":"원망과 외로움 → 결백의 호소 → 임에게 신뢰와 귀환을 청함","grammar":"중세 국어의 호격·탄식·강조 표현과 반복되는 간절한 종결을 주목한다. 정확한 형태소 분석은 교과서 표기와 대조한다.","emotion":"억울함·그리움·원망·충절","devices":"직접 호소, 반복, 영탄, 충신연주","compare":"「속미인곡」과 임의 이중적 의미 비교","note":"","intro":"유배당한 정서가 임금에 대한 충성·결백을 호소하는 고려 가요다. 「정과정」과 동일 작품.","units":[{"label":"첫 부분: 그리움과 울음","meaning":"임을 그리워하며 눈물을 흘린다. 산의 접동새와 같은 자신의 처지를 호소한다.","analysis":"접동새는 슬픈 울음의 상징. 화자의 처지를 자연물과 견주며 애상적 분위기를 조성한다.","original":"내 님믈 그리ᅀᆞ와 우니다니\n山 졉동새 난 이슷ᄒᆞ요이다"},{"label":"중간: 결백의 근거","meaning":"자신에게 씌워진 죄는 사실이 아니며 하늘의 달과 새벽별이 그 결백을 알고 있을 것이라고 주장한다.","analysis":"잔월효성은 화자의 결백을 증언해 줄 대상으로 제시된다. 하늘의 자연물은 객관적 증인의 상징으로 기능한다.","original":"아니시며 거츠르신 ᄃᆞᆯ 아으\n殘月曉星이 아ᄅᆞ시리이다"},{"label":"후반: 모함을 원망","meaning":"자기에게 잘못이 없는데 누군가 헐뜯는 말로 임과의 관계가 끊어졌음을 호소한다.","analysis":"남의 말을 원망하는 부분과 임금에 대한 태도를 구별해야 한다. 결백을 밝힌다는 뜻이 임에 대한 충성을 버렸다는 뜻은 아니다.","original":"넉시라도 님은 ᄒᆞᆫᄃᆡ 녀져라 아으\n벼기더시니 뉘러시니잇가\n過도 허믈도 千萬 업소이다\nᄆᆞᆯ힛마리신뎌\nᄉᆞᆯ읏븐뎌 아으"},{"label":"결말: 돌아봐 주기를","meaning":"임이 자신의 말을 들어 다시 사랑해 주기를 청한다.","analysis":"명령처럼 보이는 끝맺음은 임에 대한 절절한 청원이다. 개인적 서러움과 정치적 충절이 동시에 드러난다.","original":"니미 나ᄅᆞᆯ 하마 니ᄌᆞ시니잇가\n아소 님하 도람 드르샤 괴오쇼셔"}],"vocab":"님: 고려 왕 / 접동새: 슬픈 화자의 분신 / 殘月曉星: 지는 달과 새벽별 / 넉시라도: 넋이라도 / 하마: 이미·벌써 / 아소: 감탄·환기의 표현","point":"고려가요이면서 향가 10구체 전통과 연결되는 사례. 반복된 ‘아으’ 등 여음도 주목.","pitfalls":"‘말힛마리’ 등은 학자별 해석 차이가 있음. 단어 하나의 뜻을 유일한 정답처럼 강요하지 말 것.","original":"내 님믈 그리ᅀᆞ와 우니다니\n山 졉동새 난 이슷ᄒᆞ요이다\n아니시며 거츠르신 ᄃᆞᆯ 아으\n殘月曉星이 아ᄅᆞ시리이다\n넉시라도 님은 ᄒᆞᆫᄃᆡ 녀져라 아으\n벼기더시니 뉘러시니잇가\n過도 허믈도 千萬 업소이다\nᄆᆞᆯ힛마리신뎌\nᄉᆞᆯ읏븐뎌 아으\n니미 나ᄅᆞᆯ 하마 니ᄌᆞ시니잇가\n아소 님하 도람 드르샤 괴오쇼셔","source":"https://ko.wikisource.org/wiki/정과정","originalNote":"분장 표시는 생략하고 노랫말 순서만 정리한 고어 표기 전문. 전승 판본·해독 차이가 있다.","lineGuides":[{"label":"01행","meaning":"내 님믈 그리ᅀᆞ와 우니다니","analysis":"임금에 대한 그리움으로 운다는 고백이며, 충신연주지사의 핵심 상황을 이룬다.","reference":"내 님믈 그리ᅀᆞ와 우니다니"},{"label":"02행","meaning":"이 구절의 한자는 아래 독음으로 읽고, 이어지는 표현 분석과 문맥 뜻풀이를 확인하세요.","analysis":"접동새 울음에 슬픈 마음을 투영한다. 자연물과 자기 처지를 비슷하게 묶는 감정이입이다.","reference":"山 졉동새 난 이슷ᄒᆞ요이다"},{"label":"03행","meaning":"아니시며 거츠르신 ᄃᆞᆯ 아으","analysis":"자신을 비난한 말이 사실이 아니라는 결백의 호소이며, 탄식 표현이 정서적 긴장을 높인다.","reference":"아니시며 거츠르신 ᄃᆞᆯ 아으"},{"label":"04행","meaning":"이 구절의 한자는 아래 독음으로 읽고, 이어지는 표현 분석과 문맥 뜻풀이를 확인하세요.","analysis":"잔월과 새벽별이 자신의 진실을 안다고 주장한다. 자연물을 도덕적 증인의 자리에 세운다.","reference":"殘月曉星이 아ᄅᆞ시리이다"},{"label":"05행","meaning":"넉시라도 님은 ᄒᆞᆫᄃᆡ 녀져라 아으","analysis":"죽어서 영혼이 되더라도 임과 함께 가기를 빈다. 충성과 그리움의 강도를 보인다.","reference":"넉시라도 님은 ᄒᆞᆫᄃᆡ 녀져라 아으"},{"label":"06행","meaning":"벼기더시니 뉘러시니잇가","analysis":"임이 편들고 사랑하던 지난날이 누구 탓에 바뀌었냐는 질문으로 모함한 사람들을 원망한다.","reference":"벼기더시니 뉘러시니잇가"},{"label":"07행","meaning":"이 구절의 한자는 아래 독음으로 읽고, 이어지는 표현 분석과 문맥 뜻풀이를 확인하세요.","analysis":"과실도 허물도 전혀 없다는 부정·강조를 통해 억울함을 적극 주장한다.","reference":"過도 허믈도 千萬 업소이다"},{"label":"08행","meaning":"ᄆᆞᆯ힛마리신뎌","analysis":"모함한 말이 문제라는 폭로다. 말의 신뢰성과 소문에 의한 소외를 드러낸다.","reference":"ᄆᆞᆯ힛마리신뎌"},{"label":"09행","meaning":"ᄉᆞᆯ읏븐뎌 아으","analysis":"서러움을 감탄조로 표현하여 감정의 절정에 이른다.","reference":"ᄉᆞᆯ읏븐뎌 아으"},{"label":"10행","meaning":"니미 나ᄅᆞᆯ 하마 니ᄌᆞ시니잇가","analysis":"임이 자신을 벌써 잊었는지 묻는다. 버려졌다는 두려움이 설의형으로 나타난다.","reference":"니미 나ᄅᆞᆯ 하마 니ᄌᆞ시니잇가"},{"label":"11행","meaning":"아소 님하 도람 드르샤 괴오쇼셔","analysis":"임이 다시 자신을 돌아보고 사랑해 달라는 직접적인 청. 원망보다 충절이 끝내 우세한 결말이다.","reference":"아소 님하 도람 드르샤 괴오쇼셔"}],"detailNotice":"수록한 현대어 본문 11행을 각각 풀어 설명했습니다.","hanjaWords":[{"hanja":"殘月曉星","reading":"잔월효성","meaning":"지는 달과 새벽별"},{"hanja":"千萬","reading":"천만","meaning":"매우 많은 수"},{"hanja":"山","reading":"산","meaning":"산"},{"hanja":"過","reading":"과","meaning":"허물·잘못"}],"id":"w2","poem":true,"textStatus":"학습용 본문 · 표기 비교 권장"},{"group":"교과 작품","title":"소악부 제6장","author":"민사평","genre":"칠언절구 한시·소악부","theme":"떠나간 임이 잘못을 깨닫기를 바라는 원망","summary":"화자는 거미에게 떠나는 나비의 앞길에 거미줄을 쳐 달라고 부탁한다. 꽃에 날아가는 나비가 제 허물을 깨닫기를 바란다는 뜻이다.","structure":"거미에게 부탁 → 나비의 행태 지적 → 뉘우침을 바라며 요청","grammar":"한시 원문은 칠언절구 형식이다. 번역문에서는 거미를 부르는 호격과 청유·명령의 부탁 방식이 두드러진다.","emotion":"배신감·원망·미련","devices":"거미=도움 줄 대상, 거미줄=응징, 나비=떠난 임, 꽃=다른 연인; 우의·의인·반복","compare":"「정과정곡」의 임에 대한 태도와 비교","note":"","intro":"떠나는 임을 ‘나비’, 다른 사랑을 ‘꽃’, 응징을 돕는 대상을 ‘거미’로 빗댄 우의적 한시다.","units":[{"label":"1구 · 거미에게 부탁","original":"거미여, 간절히 부탁하니","meaning":"화자가 거미를 부르며 도와달라고 청한다.","analysis":"인간 아닌 거미를 청자로 삼는 의인법, 반복적 간청으로 간절함을 드러낸다."},{"label":"2구 · 거미줄 설치","original":"그 사람이 지나갈 길에 거미줄을 쳐 두었다가,","meaning":"떠난 임의 길목에 덫을 놓으라고 부탁한다.","analysis":"거미줄은 단순한 구원의 매개가 아니라 배신한 임을 곤경에 빠뜨려 잘못을 깨닫게 할 도구다."},{"label":"3구 · 꽃과 나비","original":"나를 등지고 다른 꽃을 찾아 날아가는 나비가","meaning":"나비는 화자를 떠나 다른 이에게 마음을 옮긴 임을 빗댄다.","analysis":"나비=변심한 임, 꽃=그가 새로 찾아간 사랑의 대상이라는 우의적 표현."},{"label":"4구 · 허물의 자각","original":"줄에 걸려 자기 잘못을 깨닫게 해 다오.","meaning":"변심한 임이 자신의 행동을 뉘우치기를 바란다.","analysis":"단순히 돌아오라는 소망에 그치지 않고 원망·응징의 마음이 드러난다."}],"vocab":"거미=화자가 자신의 부탁을 전하는 대상 / 거미줄=나비를 붙잡아 잘못을 깨닫게 하는 수단 / 나비=변심한 임 / 꽃=임이 새로 찾아간 대상 / 소악부=민간 노래의 내용을 한시로 옮긴 작품.","point":"상징 관계(거미·거미줄·나비·꽃)를 구분하고, 떠난 임에 대한 원망과 잘못을 뉘우치게 하려는 태도를 설명.","pitfalls":"거미줄을 ‘임과 화자를 이어 주는 사랑의 매개’라고 단정하지 말 것. 원문은 한시지만 여기에는 현대어 의미만 수록.","original":"거미여, 간절히 부탁하니\n그 사람이 지나갈 길에 거미줄을 쳐 두었다가,\n나를 등지고 다른 꽃을 찾아 날아가는 나비가\n줄에 걸려 자기 잘못을 깨닫게 해 다오.","source":"https://eduking1978.tistory.com/445","originalNote":"민사평 「소악부」 제6장의 내용을 바탕으로 재구성한 현대어 뜻풀이. 한문 원전 직역문이나 교과서의 번역문을 복제한 것이 아님.","lineGuides":[{"label":"01행","meaning":"거미여, 간절히 부탁하니","analysis":"화자는 거미를 부르며 자신의 문제에 개입해 달라고 청한다. 소악부는 한시 형식에 민간적 정서를 실은 갈래다.","reference":"거미여, 간절히 부탁하니"},{"label":"02행","meaning":"그 사람이 지나갈 길에 거미줄을 쳐 두었다가,","analysis":"거미줄은 임을 기다리는 화자에게 도움이 되는 함정·제지 장치다. 단순한 사랑의 연결이 아니다.","reference":"그 사람이 지나갈 길에 거미줄을 쳐 두었다가,"},{"label":"03행","meaning":"나를 등지고 다른 꽃을 찾아 날아가는 나비가","analysis":"나비는 다른 꽃으로 날아가는 변심한 임, 꽃은 임이 향하는 새로운 사랑의 대상에 대응한다.","reference":"나를 등지고 다른 꽃을 찾아 날아가는 나비가"},{"label":"04행","meaning":"줄에 걸려 자기 잘못을 깨닫게 해 다오.","analysis":"다른 꽃을 찾아가는 일을 잘못이라고 여기며 뉘우치게 하려는 바람을 표현한다. 원망과 미련이 겹친다.","reference":"줄에 걸려 자기 잘못을 깨닫게 해 다오."}],"detailNotice":"수록한 현대어 본문 4행을 각각 풀어 설명했습니다.","hanjaWords":[{"hanja":"小樂府","reading":"소악부","meaning":"민가의 정서를 한시로 표현한 작품군"},{"hanja":"七言絶句","reading":"칠언절구","meaning":"7자씩 4구"},{"hanja":"蝶","reading":"접","meaning":"나비"}],"id":"w3","poem":true,"textStatus":"학습용 본문 · 표기 비교 권장"},{"group":"교과 작품","title":"동짓달 기나긴 밤을","author":"황진이","genre":"평시조·기생 시조","theme":"임과 함께하는 시간을 길게 간직하려는 소망","summary":"긴 겨울밤의 한허리를 베어 이불 아래에 간직했다가 임이 오는 밤에 펼쳐 시간을 늘리고 싶다는 상상이다.","structure":"초장: 긴 밤을 잘라 둠 → 중장: 보관 → 종장: 임이 오는 밤에 펼침","grammar":"‘동짓달’, ‘춘풍 이불’의 계절 대비; ‘서리서리’와 ‘굽이굽이’의 반복·음성 상징성. 시조 종장 첫 음보의 전환 기능.","emotion":"애틋한 그리움·기대","devices":"추상적 시간의 구체화·공간화, 과장, 역설적 발상","compare":"「님이 오마 하거늘」의 임을 기다리는 태도와 비교","note":"","intro":"기다리는 시간을 길게 느끼는 심리를 기발한 물질적 조작으로 나타낸 평시조.","units":[{"label":"초장: 밤을 베어 냄","meaning":"겨울밤의 가운데를 베어 낸다.","analysis":"밤이라는 시간을 천처럼 잘라 낼 수 있는 물체로 취급한다. 이것이 시간의 공간화·구체화다.","original":"冬至ㅅᄃᆞᆯ 기나긴 밤을 ᄒᆞᆫ 허리를 버혀 내여"},{"label":"중장: 서리서리 보관","meaning":"따뜻한 이불 속에 밤을 돌돌 말아 보관한다.","analysis":"‘춘풍’은 따뜻함과 임과의 만남을 연상한다. ‘서리서리’는 둘둘 감아 넣는 동작의 감각적 표현이다.","original":"春風 니불 아래 서리서리 너헛다가"},{"label":"종장: 굽이굽이 폄","meaning":"임이 오는 날 밤에 저장한 시간을 펼쳐 함께 있는 밤을 늘리고 싶다.","analysis":"아직 만나지 못했기 때문에 소망·가정의 미래 시간이다. ‘굽이굽이’는 펴는 동작과 정서의 여운을 강조한다.","original":"어론 님 오신 날 밤이여든 구뷔구뷔 펴리라"}],"vocab":"버혀: 베어 / 너헛다가: 넣었다가 / 어론 님: 정을 나눈 임 / 밤이여든: 밤이거든 / 펴리라: 펴겠다(의지·소망)","point":"초·중·종장 모두 추상적인 시간의 물질화를 연결한다. ‘서리서리=넣는 행위’, ‘굽이굽이=펼치는 행위’ 구분.","pitfalls":"‘동짓달 밤이 길다’는 사실과 ‘임과 함께할 밤을 길게 만들고 싶다’는 화자의 소망은 다르다.","original":"冬至ㅅᄃᆞᆯ 기나긴 밤을 ᄒᆞᆫ 허리를 버혀 내여\n春風 니불 아래 서리서리 너헛다가\n어론 님 오신 날 밤이여든 구뷔구뷔 펴리라","source":"https://ko.wikisource.org/wiki/청구영언","originalNote":"고어 표기 복원·수록 판본에 따라 자구가 다를 수 있다.","lineGuides":[{"label":"01행","meaning":"이 구절의 한자는 아래 독음으로 읽고, 이어지는 표현 분석과 문맥 뜻풀이를 확인하세요.","analysis":"가장 긴 겨울밤을 베어 둔다는 불가능한 발상으로 시간의 공간화가 시작된다.","reference":"冬至ㅅᄃᆞᆯ 기나긴 밤을 ᄒᆞᆫ 허리를 버혀 내여"},{"label":"02행","meaning":"이 구절의 한자는 아래 독음으로 읽고, 이어지는 표현 분석과 문맥 뜻풀이를 확인하세요.","analysis":"밤을 보관하는 행위는 이별의 시간을 덜어내고 싶은 마음과 임과의 만남을 대비한다.","reference":"春風 니불 아래 서리서리 너헛다가"},{"label":"03행","meaning":"어론 님 오신 날 밤이여든 구뷔구뷔 펴리라","analysis":"임이 오는 순간 보관한 밤을 펼쳐 함께할 시간을 늘린다. 그리움과 기대를 함축한다.","reference":"어론 님 오신 날 밤이여든 구뷔구뷔 펴리라"}],"detailNotice":"수록한 현대어 본문 3행을 각각 풀어 설명했습니다.","hanjaWords":[{"hanja":"冬至","reading":"동지","meaning":"겨울의 절기"},{"hanja":"春風","reading":"춘풍","meaning":"봄바람"}],"id":"w4","poem":true,"textStatus":"학습용 본문 · 표기 비교 권장"},{"group":"교과 작품","title":"송인","author":"정지상","genre":"한시·칠언절구","theme":"벗과의 이별에서 느끼는 깊은 슬픔","summary":"대동강 남쪽에서 이별하는 장면. 해마다 흐르는 강물보다 이별의 눈물이 많을 것이라는 과장으로 슬픔의 깊이를 표현한다.","structure":"송별의 공간·계절 묘사 → 이별의 눈물과 강물 대비","grammar":"한시 칠언절구(매구 7자, 총 4구). 기-승-전-결 구조이며 후반의 의문 표현은 설의로 읽힌다. 원작은 중국어 한자 문장이나 화면에는 뜻풀이로 제시했다.","emotion":"애상·이별의 슬픔","devices":"대동강·봄빛의 배경, 과장·대비·질문 형식","compare":"「가시리」「진달래꽃」과 이별 정서 비교","note":"","intro":"정지상의 칠언절구. 이별의 감정을 강물의 흐름에 결부시킨 송별시.","units":[{"label":"기구 · 이별의 배경","original":"비가 그친 긴 둑에는 풀이 무성하고,","meaning":"비가 갠 뒤 푸르러진 긴 제방을 제시한다.","analysis":"생기 있는 풍경이 이별의 정서와 대비되며, 서경의 제시로 분위기를 형성한다."},{"label":"승구 · 이별의 정서","original":"남포에서 그대를 보내니 슬픈 노래가 울리네.","meaning":"남포에서 떠나는 벗을 전송한다.","analysis":"송별을 직접 드러내는 부분. ‘남포’는 고전에서 이별의 공간 이미지로 자주 사용된다."},{"label":"전구 · 설의","original":"대동강 물은 어느 때에나 마를까?","meaning":"이별의 눈물 때문에 강물은 마를 수 없다는 뜻이다.","analysis":"의문의 형식을 통해 슬픔이 지속될 것임을 강조한다. 실제 수량 계산이 아니다."},{"label":"결구 · 과장과 인과","original":"해마다 이별의 눈물이 푸른 물결에 더해지는데.","meaning":"해마다 흘리는 이별의 눈물이 강물에 보태진다고 상상한다.","analysis":"‘대동강 물=이별의 눈물’이라는 상상과 과장으로 무한한 이별의 슬픔을 드러낸다."}],"vocab":"긴 둑=장제 / 남포=송별의 장소 / 대동강 물=이별의 슬픔을 부각하는 자연물 / 이별의 눈물=별루 / 푸른 물결=녹파.","point":"대동강이 마르지 않는 까닭을 실제 수문 현상이 아닌 화자의 이별의 눈물이 끊이지 않는 것으로 상상했다는 점.","pitfalls":"해마다 눈물이 강물을 늘린다는 말은 실제 사실이 아니라 과장법.","original":"雨歇長堤草色多\n送君南浦動悲歌\n大同江水何時盡\n別淚年年添綠波","source":"https://ko.wikisource.org/wiki/송인","originalNote":"정지상의 한시 「송인」 7언 절구 한문 원문입니다. 독립적으로 정리한 4구 현대어 풀이를 아래에 제공합니다.","lineGuides":[{"label":"01행","meaning":"비가 그친 긴 둑에는 풀이 무성하고,","analysis":"비가 그친 뒤 풀빛이 살아난 제방을 묘사한다. 생기 있는 경치와 슬픈 이별의 감정을 대비한다.","reference":"雨歇長堤草色多"},{"label":"02행","meaning":"남포에서 그대를 보내니 슬픈 노래가 울리네.","analysis":"남포에서의 송별과 슬픈 노래가 사건·정서를 구체화한다. 장소는 이별의 현장이다.","reference":"送君南浦動悲歌"},{"label":"03행","meaning":"대동강 물은 어느 때에나 마를까?","analysis":"언제 마르겠느냐는 말은 실제 날짜를 묻는 질문이 아니다. 눈물로 강물이 마르지 않는다는 설의다.","reference":"大同江水何時盡"},{"label":"04행","meaning":"해마다 이별의 눈물이 푸른 물결에 더해지는데.","analysis":"해마다 이별하는 사람들이 흘린 눈물이 강물에 더해진다는 과장으로 슬픔의 크기를 극대화한다.","reference":"別淚年年添綠波"}],"detailNotice":"수록한 현대어 본문 4행을 각각 풀어 설명했습니다.","originalModern":"비가 그친 긴 둑에 풀빛이 무성하네.\n남포에서 그대를 보내니 슬픈 노래가 울리네.\n대동강 물은 어느 때에나 마르겠는가.\n이별의 눈물이 해마다 푸른 물결에 더해지는데.","sourceContext":"한시 원문(漢詩)과 별도 현대어 풀이를 구분합니다. 7언 절구의 네 행을 그대로 배열했습니다.","hanjaPronunciations":[{"hanja":"雨歇長堤草色多","reading":"우헐장제초색다","meaning":"비가 그친 긴 둑에는 풀빛이 짙고"},{"hanja":"送君南浦動悲歌","reading":"송군남포동비가","meaning":"남포에서 그대를 보내며 슬픈 노래가 일어나네"},{"hanja":"大同江水何時盡","reading":"대동강수하시진","meaning":"대동강의 물은 언제 마르려나"},{"hanja":"別淚年年添綠波","reading":"별루년년첨록파","meaning":"이별의 눈물이 해마다 푸른 물결에 더해지는데"}],"hanjaWords":[],"id":"w5","poem":true,"textStatus":"한문 원전 · 독음 지원"},{"group":"교과 작품","title":"오백년 도읍지를","author":"길재","genre":"평시조·회고가","theme":"고려 왕조 멸망의 무상감과 옛 왕조에 대한 충절","summary":"옛 도읍을 홀로 돌아보니 산천은 그대로인데 사람과 세상은 달라졌다. 지난 역사가 한순간 꿈처럼 느껴져 눈물짓는다.","structure":"초장: 옛 도읍 방문 → 중장: 자연과 인사의 대비 → 종장: 무상감과 탄식","grammar":"평시조 초장·중장·종장, 각 장 4음보를 기본으로 함. 종장 첫 음보가 3음절인 시조 관습과 전환 감탄사 「어즈버」에 주목.","emotion":"허무·회한·충절","devices":"자연(의구함)과 인간(사라짐)의 대비, 꿈의 비유, 감탄·영탄, 고려 왕조를 회고하는 역사적 정서.","compare":"「제망매가」는 개인적 상실(누이)과 종교적 재회를, 「오백 년 도읍지를」는 왕조의 상실과 역사적 무상함을 표현한다. 모두 시상의 전환 기능을 지닌 감탄사에 주목.","note":"","intro":"고려 유신 길재가 옛 도읍을 돌아보며 왕조 몰락의 무상함을 표현한 회고 시조.","units":[{"label":"초장 · 홀로 옛 도읍에 도착","original":"오백 년 도읍지를 말 한 필을 타고 돌아오니","meaning":"고려 오백 년 역사의 도읍이었던 개경을 혼자 다시 찾는다.","analysis":"‘필마’에는 홀로 돌아온 화자의 적막한 상황이 드러난다. 역사적 공간에 들어가는 순간이다."},{"label":"중장 · 자연과 인간사의 대비","original":"산천은 예전 그대로이지만 뛰어난 인물들은 사라지고 없구나.","meaning":"산과 강은 변하지 않은 듯한데 옛 왕조의 인물들은 보이지 않는다.","analysis":"불변하는 듯한 자연과 사라져 간 인간사의 대비는 망국의 비애와 역사의 무상함을 만든다."},{"label":"종장 · 탄식","original":"아, 태평했던 옛 세월이 꿈이었던 듯하구나.","meaning":"과거 고려의 태평한 시절이 마치 꿈처럼 멀어진 것으로 느낀다.","analysis":"‘어즈버’에 해당하는 감탄사가 시상을 종결·전환하면서 상실감을 집약한다."}],"vocab":"필마: 한 필의 말 / 의구: 이전과 같음 / 인걸: 뛰어난 인물들 / 태평연월: 태평한 시절 / 어즈버: 탄식의 감탄사","point":"과거의 번영 ↔ 현재의 폐허, 자연 ↔ 인간, 지속 ↔ 소멸의 대조 축 정리.","pitfalls":"화자는 다시 새 왕조의 태평을 기대하는 것이 아니라 옛 고려의 태평한 세월을 회고한다. 종장의 꿈은 현재 상황의 허무감을 드러내는 장치.","original":"오백 년 도읍지를 말 한 필을 타고 돌아오니\n산천은 예전 그대로이지만 뛰어난 인물들은 사라지고 없구나.\n아, 태평했던 옛 세월이 꿈이었던 듯하구나.","source":"https://korstudy.tistory.com/4","originalNote":"길재의 평시조 세 장을 현대어로 재진술한 학습용 풀이. 교과서에 실린 옛말 표기·띄어쓰기와 다를 수 있음.","lineGuides":[{"label":"01행","meaning":"오백 년 도읍지를 말 한 필을 타고 돌아오니","analysis":"고려의 옛 수도를 방문하는 역사적 배경이다. 홀로 돌아오는 사람의 모습이 고독한 회고를 암시한다.","reference":"오백 년 도읍지를 말 한 필을 타고 돌아오니"},{"label":"02행","meaning":"산천은 예전 그대로이지만 뛰어난 인물들은 사라지고 없구나.","analysis":"산천은 남아 있는데 옛 사람은 없다는 대조. 자연의 지속성과 인간사·왕조의 덧없음이 선명해진다.","reference":"산천은 예전 그대로이지만 뛰어난 인물들은 사라지고 없구나."},{"label":"03행","meaning":"아, 태평했던 옛 세월이 꿈이었던 듯하구나.","analysis":"옛 태평성대가 꿈처럼 멀어졌음을 한탄한다. 영탄적 결말에서 왕조 상실의 비애가 응축된다.","reference":"아, 태평했던 옛 세월이 꿈이었던 듯하구나."}],"detailNotice":"수록한 현대어 본문 3행을 각각 풀어 설명했습니다.","hanjaWords":[],"id":"w6","poem":true,"textStatus":"학습용 본문 · 표기 비교 권장"},{"group":"교과 작품","title":"임 그려 깊이 든 병을","author":"작자 미상","genre":"연정 시조 계열 · 수업 프린트 발췌","theme":"임을 그리는 병은 임과 다시 만나야만 나을 수 있음","summary":"그리움이 깊어 병이 될 정도인 화자는 임을 생각하는 마음을 숨길 수 없음을 나타낸다.","structure":"발단: 임을 생각해 생긴 병 → 전개: 의원과 주술적 치료법을 열거 → 전환: 그러한 노력의 무효를 설의 → 결말: 임과 재회해야 낫는다는 유일한 해결책.","grammar":"“어이하여 ~까”는 해결책을 묻는 의문형 구성. “의원 청하여 / 소경에게 / 무당 불러”와 같은 열거·병렬이 주된 문장 전개. “한들 ~ 낫겠느냐”는 설의적 의문으로 부정의 뜻을 강조. 마지막 “임 한데”는 임이 있는 곳, 임과 함께한다는 의미로 읽는다.","emotion":"극심한 그리움 → 초조함과 절실함 → 통상적 처방에 대한 부정 → 재회에 대한 확신","devices":"은유·과장: 그리움=병 / 열거: 의원·명약·소경·무당의 도움 / 설의: ‘한들…낫겠느냐’ / 대비: 외적 치료 수단과 내적 원인인 임에 대한 사랑 / 종결의 단호한 정서.","compare":"","note":"표제의 정확한 글자는 수업 원문과 대조 필요(요청에는 ‘갚아’로 적힘).","intro":"말 그대로의 병이 아니라, 임을 향한 그리움이 병처럼 깊어졌다는 과장된 표현이다. 의원·약·굿 등 여러 방도를 동원해도 해결되지 않고, 마지막에 임의 존재가 유일한 처방임을 드러낸다.","units":[{"label":"그리움의 병","meaning":"임 생각이 너무 깊어져 병이 났다고 호소한다.","analysis":"마음의 상태를 질병으로 구체화한 비유이자 과장이다."},{"label":"여러 치료법의 무력함","meaning":"의학적 처방과 민속적 의식까지 해 보더라도 낫지 않는다.","analysis":"열거법으로 그리움의 심각성을 표현하고 마지막 설의를 돋보이게 한다."},{"label":"임과의 만남","meaning":"임을 만나면 비로소 병이 낫는다고 결론짓는다.","analysis":"사랑의 원인과 해결이 동일한 ‘임’에게 있어 다른 수단은 무력함을 강조한다."}],"vocab":"의원(醫員)=병을 치료하는 사람 / 명약(名藥)=좋은 약 / 푸닥거리=액운이나 병을 물리치려는 민속 의식 / 당주굿기=사진 각주에 따르면 당주(버들가지로 만든 광주리)를 활용해 비는 행위 / 진실로=참으로 / 임 한데=임이 있는 곳, 임과 함께.","point":"수업 사진 주석: ‘병’=상사병(그리움), ‘의원·명약’=의학적 처방, ‘소경·푸닥거리·무당·당주굿기’=민속적 의식, “낫겠느냐”=설의법. 작품을 실제 의료 조언으로 읽지 말 것.","pitfalls":"인터넷 자료에서 다른 작품(「사미인곡」)의 나비 환생 대목을 뒤에 붙여 놓은 경우가 있어 한 작품의 전문으로 오인하지 말 것.","original":"임 그려 깊이 든 병을 어이하여 고쳐 낼까\n의원 청하여 명약하며\n소경에게 푸닥거리하고 무당 불러 당주굿기\n한들 이 모진 병이 낫겠느냐\n진실로 임 한데 있으면 바로 좋을까 하노라","source":"https://eduking1978.tistory.com/597","originalNote":"방금 제공한 수업 사진의 본문을 읽기 쉬운 현대 표기로 옮긴 전사본입니다. 일부 옛말의 띄어쓰기·표기는 교실 프린트에서 다시 확인하세요.","lineGuides":[{"label":"① 임 그려 깊이 든 병을 어이하여 고쳐 낼까","reference":"임 그려 깊이 든 병을 어이하여 고쳐 낼까","meaning":"임을 그리워하다 심해진 이 마음의 병을 어떻게 고칠 수 있을까?","analysis":"“임 그려”는 병의 원인이 사랑이라는 점을 제시한다. 신체적 질병으로 치환한 과장이 시 전체를 지배한다."},{"label":"② 의원 청하여 명약하며","reference":"의원 청하여 명약하며","meaning":"의사를 불러 좋은 약을 쓰더라도,","analysis":"현실적인 의술을 먼저 내세운다. 그러나 다음 구절의 주술적 방도까지 이어지는 나열의 시작일 뿐 해결은 아니다."},{"label":"③ 소경에게 푸닥거리하고 무당 불러 당주굿기","reference":"소경에게 푸닥거리하고 무당 불러 당주굿기","meaning":"민속적인 의식을 행하고 무당을 불러 빌어 보아도,","analysis":"사진 각주에는 “당주굿기”의 재료와 의식 방식이 설명되어 있다. 치료 수단의 범위를 넓히는 열거법이 사랑의 병이 얼마나 심한지 부각한다."},{"label":"④ 한들 이 모진 병이 낫겠느냐","reference":"한들 이 모진 병이 낫겠느냐","meaning":"이런 모든 방법으로도 이 지독한 병은 낫지 않지 않겠는가?","analysis":"설의법. 말하는 내용의 실제 뜻은 “낫지 않는다”다. 나열했던 약과 굿을 모두 부정하여 마지막 구절을 준비한다."},{"label":"⑤ 진실로 임 한데 있으면 바로 좋을까 하노라","reference":"진실로 임 한데 있으면 바로 좋을까 하노라","meaning":"정말 임과 함께할 수 있다면 단번에 좋아질 것이다.","analysis":"해결책을 단호하게 제시하는 결말. 화자가 원하는 것은 약이 아니라 임과의 재회다. 앞서 쌓인 그리움이 사랑의 확신으로 귀결된다."}],"detailNotice":"정확한 행별 원문을 확보하지 못한 항목은 뜻 단위로 설명했습니다. 문장 대조는 교과서·참고 출처에서 확인하세요.","sourceContext":"수업 프린트의 해당 작품 본문과 빨간색·파란색 주석을 읽어 텍스트로 정리했습니다. 시어와 풀이를 분리하여 학습할 수 있습니다.","hanjaWords":[],"id":"w7","poem":true,"textStatus":"학습용 본문 · 표기 비교 권장"},{"group":"교과 작품","title":"소춘향가","author":"작자 미상","genre":"잡가·12잡가 계열","theme":"춘향의 사랑과 연정","summary":"춘향의 자태와 사랑의 마음을 노래하는 대목이 중심이다. 가창에 적합한 반복과 긴 호흡을 활용한다.","structure":"춘향의 모습을 묘사 → 사랑을 드러냄 → 노래의 흥을 확장","grammar":"경기 12잡가 계열. 장형 사설, 연속적인 장면 묘사, 어구 반복·열거·감탄·한자어의 활용. 산문체 서술처럼 길어 보여도 부르는 노래라는 점이 중요.","emotion":"연정·흥취·애틋함","devices":"열거, 반복, 과장, 노래의 율조","compare":"「춘향전」과 인물·서술 방식 비교","note":"","intro":"판소리 「춘향가」와 관련 인물·어휘를 활용한 12잡가 계열 작품. 판소리 원본이나 소설 「춘향전」의 본문과 일치하지 않는다.","units":[{"label":"① 춘향의 몸짓을 묘사하다","meaning":"춘향이 한 손으로 해를 가리고 다른 손을 들어 먼 곳을 바라본다.","analysis":"‘춘향의 거동 보아라’와 같은 부름은 구연자와 청중 사이의 거리감을 줄인다. 손동작의 나열이 시각적 장면을 만든다."},{"label":"② 임이 있는 곳으로 시선 이동","meaning":"춘향은 멀리 있는 임의 모습을 찾으려 하지만 시야를 가리는 요소와 거리가 문제된다.","analysis":"먼 거리와 바라보는 행동은 임과의 공간적 단절·그리움을 상징한다."},{"label":"③ 자연과 임을 연결하다","meaning":"달빛·산·구름 등 자연 풍경을 임에 대한 마음에 빗대어 상상한다.","analysis":"정경 교융(풍경을 통해 감정 드러냄), 비유와 과장, 한자어와 생활어의 혼합을 살필 수 있다."},{"label":"④ 끝없이 이어지는 사설","meaning":"여러 행동·경치·감탄을 길게 이어 부르며 춘향의 연정을 강조한다.","analysis":"시조의 3장 정형이 아니라 긴 사설을 노래하는 잡가의 특징을 보여준다."}],"vocab":"거동=몸짓 / 바라다·바라보다=멀리 눈길을 둠 / 임=이몽룡, 사랑하는 대상 / 12잡가=경기 지역 전문 소리꾼의 주요 노래들 / 일광=햇빛 / 정경 교융=자연 경치에 감정을 실어 표현하는 방식.","point":"판소리와 연관 있는 잡가 계통의 긴 노랫말. 정형시인 평시조와 달리 사설이 길고 행동의 나열이 다양하게 나타난다.","pitfalls":"「소춘향가」를 소설 「춘향전」 본문으로 간주하지 말 것.","original":"춘향의 거동 보아라.\n오른손으로 일광을 가리고\n왼손 높이 들어 어쩌거나 죽림 보이는가.\n대 심어 울하고 솔 심어 정자라.\n동편에 연당이요 서편에 우물이라.\n노방에 시매모후와 산수유 국화라.","source":"","originalNote":"수업 사진에 나온 「소춘향가」 중 앞부분을 가독성 있게 옮긴 발췌입니다. 판본에 따라 어휘·구절이 다르며 전문이 아닙니다.","lineGuides":[{"label":"01행","reference":"춘향의 거동 보아라.","meaning":"춘향의 행동을 보라는 부름이다.","analysis":"청중을 직접 부르는 판소리·잡가식 구연 어투가 나타난다."},{"label":"02행","reference":"오른손으로 일광을 가리고","meaning":"햇빛을 피하려고 오른손으로 눈 위를 가린다.","analysis":"한 손의 동작을 구체화하여 시각적 장면을 만든다."},{"label":"03행","reference":"왼손 높이 들어 어쩌거나 죽림 보이는가.","meaning":"왼손을 들어 멀리 죽림 쪽을 살핀다.","analysis":"두 손의 동작을 연속적으로 나열해 기다리는 모습을 실감나게 묘사한다."},{"label":"04행","reference":"대 심어 울하고 솔 심어 정자라.","meaning":"대나무 울타리와 소나무 정자가 있는 공간이다.","analysis":"대나무·소나무는 배경의 공간감과 전통 정취를 만든다."},{"label":"05행","reference":"동편에 연당이요 서편에 우물이라.","meaning":"동쪽 연못과 서쪽 우물이 함께 있다.","analysis":"동·서의 공간 배치가 대구를 이루고 정경을 구체화한다."},{"label":"06행","reference":"노방에 시매모후와 산수유 국화라.","meaning":"길가의 여러 나무와 꽃을 나열한다.","analysis":"식물명의 열거가 잡가 특유의 유장한 사설을 형성한다. 고어 식물명은 판본 대조가 필요하다."}],"detailNotice":"정확한 행별 원문을 확보하지 못한 항목은 뜻 단위로 설명했습니다. 문장 대조는 교과서·참고 출처에서 확인하세요.","sourceContext":"제공된 교과서 수업 사진의 「소춘향가」 앞 대목을 본문으로 배치했습니다. 화면의 전체 줄이 모두 확보된 완전한 원전 전문은 아닙니다.","hanjaWords":[{"hanja":"日光","reading":"일광","meaning":"햇빛"},{"hanja":"竹林","reading":"죽림","meaning":"대나무숲"},{"hanja":"亭子","reading":"정자","meaning":"쉬는 건물"}],"id":"w8","poem":true,"textStatus":"사용자 제공/대조 본문 · 판본 확인 권장"},{"group":"교과 작품","title":"동동","author":"작자 미상","genre":"고려 가요·월령체 노래","theme":"세월의 흐름 속에서 임을 향한 그리움","summary":"정월부터 섣달까지 달마다 절기·풍속·자연 풍경을 통해 임에 대한 감정이 다르게 드러난다. 월별 정서의 차이를 묶어서 읽어야 한다.","structure":"서사(덕과 복 기원) → 1~12월 월령별 노래 → 연속되는 사랑의 감정","grammar":"후렴구 ‘아으 동동다리’가 반복되어 음악적 통일감을 준다. 월령체, 중세 국어 어휘와 비유 확인.","emotion":"그리움·서운함·찬미·외로움","devices":"월령체·후렴·자연물 상징","compare":"「정읍사」와 여성 화자의 기다림 비교","note":"","intro":"달의 순서에 따라 자연과 풍속을 제시하고 화자의 임에 대한 마음을 바꿔 드러내는 월령체 고려가요.","units":[{"label":"서사: 덕과 복","meaning":"덕과 복을 받들고 널리 내려오기를 빈다.","analysis":"축원 구절이며 월별 연정을 시작하기 전 전체 노래를 여는 역할이다.","original":"德으란 곰ᄇᆡ예 받ᄌᆞᆸ고\n福으란 림ᄇᆡ예 받ᄌᆞᆸ고\n德이여 福이라 호ᄂᆞᆯ\n나ᅀᆞ라 오소ᅌᅵ다\n아으 動動다리"},{"label":"정월: 혼자 남은 몸","meaning":"새해 물은 녹기도 하는데 세상에서 홀로 지내는 자신의 몸은 쓸쓸하다.","analysis":"봄을 향해 자연은 변화하지만 화자의 외로움은 그대로라는 대조.","original":"正月ㅅ 나릿 므른\n아으 어져 녹져 ᄒᆞ논ᄃᆡ\n누릿 가온ᄃᆡ 나곤\n몸하 ᄒᆞ올로 녈셔\n아으 動動다리"},{"label":"이월: 등불","meaning":"높이 내건 등불처럼 임이 많은 사람을 비추는 존재임을 기린다.","analysis":"등불은 임의 뛰어남·존귀함을 시각화한다.","original":"二月ㅅ 보로매\n아으 노피 현\n燈ㅅ블 다호라\n萬人 비취실 즈ᅀᅵ샷다\n아으 動動다리"},{"label":"삼월: 봄꽃","meaning":"만발한 봄꽃처럼 고운 임이 남들이 부러워할 만한 모습을 지녔다고 말한다.","analysis":"꽃과 임의 아름다움을 연결하는 비유. 구절 해독 차이에 주의.","original":"三月 나며 開ᄒᆞᆫ\n아으 滿春 ᄃᆞᆯ욋고지여\nᄂᆞᄆᆡ 브롤 즈ᅀᅳᆯ\n디녀 나샷다\n아으 動動다리"},{"label":"사월: 돌아온 꾀꼬리","meaning":"새는 때가 되면 잊지 않고 찾아오지만 임은 자신을 잊은 것 같다고 한탄한다.","analysis":"되돌아온 새와 떠난 임을 대조하여 원망을 드러낸다.","original":"四月 아니 니저\n아으 오실셔 곳고리새여\n므슴다 錄事니ᄆᆞᆫ\n녯 나ᄅᆞᆯ 닛고신뎌\n아으 動動다리"},{"label":"오월: 단오 약","meaning":"단오 아침의 약을 임에게 바치며 오래 살기를 기원한다.","analysis":"일상적 절기 풍속에 임을 위하는 마음을 투영한다.","original":"五月 五日애\n아으 수릿날 아ᄎᆞᆷ 藥은\n즈믄 ᄒᆡᆯ 長存ᄒᆞ샬\n藥이라 받ᄌᆞᆸ노ᅌᅵ다\n아으 動動다리"},{"label":"유월: 바닷가의 빗","meaning":"자신이 바닷가에 버려진 빗 같은 신세라며 자신을 돌아봐 달라고 청한다.","analysis":"아무도 쓰지 않는 물건에 비유한 화자의 소외감이 핵심이다.","original":"六月ㅅ 보로매\n아으 별해 ᄇᆞ룐 빗 다호라\n도라 보실 니믈\n젹곰 좃니노이다\n아으 動動다리"},{"label":"칠월: 백중","meaning":"각종 음식을 차려 놓은 자리에 임과 함께하고 싶다고 생각한다.","analysis":"명절의 풍요는 임과 함께하지 못하는 결핍을 환기한다.","original":"七月ㅅ 보로매\n아으 百種 排ᄒᆞ야 두고\n니믈 ᄒᆞᆫᄃᆡ 녀가져\n顧을 비ᅀᆞᆸ노ᅌᅵ다\n아으 動動다리"},{"label":"팔월: 추석","meaning":"추석이 참으로 기쁜 날이려면 임을 모시고 함께해야 한다.","analysis":"명절의 진정한 기쁨을 임과의 동행에 둔다.","original":"八月ㅅ 보로ᄆᆞᆫ\n아으 嘉俳나리마ᄅᆞᆫ\n니믈 뫼셔 녀곤\n오ᄂᆞᆯ낤 嘉俳샷다\n아으 動動다리"},{"label":"구월: 국화","meaning":"약으로 쓰는 국화가 집 안에 들면서 시드는 모습을 본다.","analysis":"꽃의 시듦을 통해 덧없는 시간과 자신의 처지를 돌아본다.","original":"九月 九日애\n아으 藥이라 먹논 黃花\n고지 안해 드니\n새셔 가만ᄒᆞ얘라\n아으 動動다리"},{"label":"시월: 버림받은 존재","meaning":"자신을 내버린 뒤 알아주는 이가 없어졌다고 느낀다.","analysis":"버려진 물건 같은 화자의 처지를 통해 소외와 고독을 강조한다.","original":"十月애\n아으 져미연 ᄇᆞᄅᆞᆺ 다호라\n것거 ᄇᆞ리신 後에\n디니실 ᄒᆞᆫ 부니 업스샷다\n아으 動動다리"},{"label":"십일월: 차가운 잠자리","meaning":"추운 자리에 얇은 옷만 덮고 누운 듯 쓸쓸하고 서럽다.","analysis":"촉각적 추위로 외로움을 감각적으로 나타낸다.","original":"十一月ㅅ 보ᇰ다ᇰ 자리예\n아으 汗杉 두퍼 누워\n슬ᄒᆞᆯᄉᆞ라온뎌\n고우닐 스싀옴 녈셔\n아으 動動다리"},{"label":"십이월: 젓가락","meaning":"자신을 누군가의 식탁에 놓인 젓가락으로 비유하며 소외된 처지를 노래한다.","analysis":"짝을 이루는 도구라는 성격이 임과의 관계를 생각하게 한다.","original":"十二月ㅅ 분디남ᄀᆞ로 갓곤\n아으 나ᅀᆞᆯ 盤ᄋᆡᆺ 져다호라\n니믜 알ᄑᆡ 드러 얼이노니\n소니 가재다 므ᄅᆞᅀᆞᆸ노ᅌᅵ다\n아으 動動다리"}],"vocab":"월령체: 열두 달의 순서를 따라 구성 / 수릿날: 단오 / 가배: 추석 / 백종: 백중 / 동동다리: 반복 후렴","point":"고려 가요의 후렴구, 월령체 구성, 명절·자연물의 상징을 서로 연결.","pitfalls":"달마다 정서를 똑같은 ‘그리움’으로 단순화하지 말 것. 개별 소재·어조·상황이 달라진다.","original":"德으란 곰ᄇᆡ예 받ᄌᆞᆸ고\n福으란 림ᄇᆡ예 받ᄌᆞᆸ고\n德이여 福이라 호ᄂᆞᆯ\n나ᅀᆞ라 오소ᅌᅵ다\n아으 動動다리\n\n正月ㅅ 나릿 므른\n아으 어져 녹져 ᄒᆞ논ᄃᆡ\n누릿 가온ᄃᆡ 나곤\n몸하 ᄒᆞ올로 녈셔\n아으 動動다리\n\n二月ㅅ 보로매\n아으 노피 현\n燈ㅅ블 다호라\n萬人 비취실 즈ᅀᅵ샷다\n아으 動動다리\n\n三月 나며 開ᄒᆞᆫ\n아으 滿春 ᄃᆞᆯ욋고지여\nᄂᆞᄆᆡ 브롤 즈ᅀᅳᆯ\n디녀 나샷다\n아으 動動다리\n\n四月 아니 니저\n아으 오실셔 곳고리새여\n므슴다 錄事니ᄆᆞᆫ\n녯 나ᄅᆞᆯ 닛고신뎌\n아으 動動다리\n\n五月 五日애\n아으 수릿날 아ᄎᆞᆷ 藥은\n즈믄 ᄒᆡᆯ 長存ᄒᆞ샬\n藥이라 받ᄌᆞᆸ노ᅌᅵ다\n아으 動動다리\n\n六月ㅅ 보로매\n아으 별해 ᄇᆞ룐 빗 다호라\n도라 보실 니믈\n젹곰 좃니노이다\n아으 動動다리\n\n七月ㅅ 보로매\n아으 百種 排ᄒᆞ야 두고\n니믈 ᄒᆞᆫᄃᆡ 녀가져\n顧을 비ᅀᆞᆸ노ᅌᅵ다\n아으 動動다리\n\n八月ㅅ 보로ᄆᆞᆫ\n아으 嘉俳나리마ᄅᆞᆫ\n니믈 뫼셔 녀곤\n오ᄂᆞᆯ낤 嘉俳샷다\n아으 動動다리\n\n九月 九日애\n아으 藥이라 먹논 黃花\n고지 안해 드니\n새셔 가만ᄒᆞ얘라\n아으 動動다리\n\n十月애\n아으 져미연 ᄇᆞᄅᆞᆺ 다호라\n것거 ᄇᆞ리신 後에\n디니실 ᄒᆞᆫ 부니 업스샷다\n아으 動動다리\n\n十一月ㅅ 보ᇰ다ᇰ 자리예\n아으 汗杉 두퍼 누워\n슬ᄒᆞᆯᄉᆞ라온뎌\n고우닐 스싀옴 녈셔\n아으 動動다리\n\n十二月ㅅ 분디남ᄀᆞ로 갓곤\n아으 나ᅀᆞᆯ 盤ᄋᆡᆺ 져다호라\n니믜 알ᄑᆡ 드러 얼이노니\n소니 가재다 므ᄅᆞᅀᆞᆸ노ᅌᅵ다\n아으 動動다리","source":"https://ko.wikisource.org/wiki/동동","originalNote":"고려 가요 월령체의 서사 및 열두 달 원문 전문. 해독·판본 차이에 주의.","lineGuides":[{"label":"서사: 덕과 복 · 1구","reference":"德으란 곰ᄇᆡ예 받ᄌᆞᆸ고","meaning":"덕을 받들어 공경한다.","analysis":"화자가 덕을 대하는 태도에 경건함과 축원의 어조가 있다."},{"label":"서사: 덕과 복 · 2구","reference":"福으란 림ᄇᆡ예 받ᄌᆞᆸ고","meaning":"복을 받들어 공경한다.","analysis":"덕과 복을 짝지어 노래하는 대구 구성이다."},{"label":"서사: 덕과 복 · 3구","reference":"德이여 福이라 호ᄂᆞᆯ","meaning":"덕과 복을 함께 이름한다.","analysis":"같은 말을 다시 불러 행운을 비는 리듬을 만든다."},{"label":"서사: 덕과 복 · 4구","reference":"나ᅀᆞ라 오소ᅌᅵ다","meaning":"덕과 복이 이곳에 오기를 빈다.","analysis":"서사의 축원 성격을 분명히 한다."},{"label":"서사: 덕과 복 · 5구","reference":"아으 動動다리","meaning":"여음구로, 노래의 장단과 각 연의 구분을 이루는 후렴이다.","analysis":"반복되는 후렴이 음악성을 강화한다. 후렴의 소리 자체를 모든 연에서 동일한 구체적 사건으로 해석하지 않는다."},{"label":"정월: 혼자 남은 몸 · 1구","reference":"正月ㅅ 나릿 므른","meaning":"정월의 시냇물이 제시된다.","analysis":"한 해의 첫 달에 시상을 펼치는 월령체 형식이다."},{"label":"정월: 혼자 남은 몸 · 2구","reference":"아으 어져 녹져 ᄒᆞ논ᄃᆡ","meaning":"겨울에
