reading":"사월","meaning":"4월"},{"hanja":"五月","reading":"오월","meaning":"5월"},{"hanja":"五日","reading":"오일","meaning":"다섯째 날"},{"hanja":"六月","reading":"유월","meaning":"6월"},{"hanja":"七月","reading":"칠월","meaning":"7월"},{"hanja":"八月","reading":"팔월","meaning":"8월"},{"hanja":"九月","reading":"구월","meaning":"9월"},{"hanja":"九日","reading":"구일","meaning":"아홉째 날"},{"hanja":"十月","reading":"시월","meaning":"10월"},{"hanja":"十一月","reading":"십일월","meaning":"11월"},{"hanja":"十二月","reading":"십이월","meaning":"12월"},{"hanja":"萬人","reading":"만인","meaning":"많은 사람"},{"hanja":"滿春","reading":"만춘","meaning":"봄이 가득함"},{"hanja":"長存","reading":"장존","meaning":"오래도록 존재함"},{"hanja":"百種","reading":"백종","meaning":"여러 가지 음식"},{"hanja":"嘉俳","reading":"가배","meaning":"추석"},{"hanja":"黃花","reading":"황화","meaning":"누런 꽃"},{"hanja":"汗杉","reading":"한삼","meaning":"홑소매 옷"},{"hanja":"開","reading":"개","meaning":"열리다"},{"hanja":"藥","reading":"약","meaning":"약"},{"hanja":"顧","reading":"고","meaning":"돌아봄"}],"id":"w9","poem":true,"textStatus":"학습용 본문 · 표기 비교 권장"},{"group":"교과 작품","title":"님이 오마 하거늘","author":"작자 미상","genre":"사설시조","theme":"임이 온다는 말에 들뜬 화자의 우스꽝스러운 기다림","summary":"기다림 → 대문 밖 탐색 → 달려감 → 착각의 확인 → 남이 보지 않아 다행이라는 민망한 반응.","structure":"초장(임이 온다는 말을 듣고 준비) → 길어진 중장(탐색·달림·오인) → 종장(착각을 알고 민망해함)","grammar":"사설시조 / 3장 체제를 유지하면서 중장이 크게 확대되는 형태. “오마 하거늘”은 임의 오겠다는 말을 원인으로 다음 행동을 연결한다. “이수로 가액”에는 한자어의 음독을 포함한 옛말 표현이 나타난다.","emotion":"설렘·기다림 → 조급함 → 민망함·해학","devices":"동작의 열거, 반복어와 의태어, 사건의 반전, 구어체와 과장, 장형 중장의 빠른 호흡","compare":"황진이의 진지한 연정 시조와 비교","note":"","intro":"임이 온다는 말을 믿고 달려 나갔다가 엉뚱한 대상을 임으로 착각한 사실을 깨닫는 사설시조이다. 조급한 심리와 우스꽝스러운 행동이 중장의 긴 사설에 생생하게 드러난다.","units":[{"label":"초장 · 임이 온다는 말에 서두름","original":"님이 오마 ᄒᆞ거늘 저녁밥을 일 지어 먹고","meaning":"임이 오겠다고 해서 서둘러 저녁밥을 일찍 차려 먹는다.","analysis":"임을 기다리는 설렘과 기대가 일상의 행동으로 나타난다. “오마”의 약속이 이후 모든 행동의 계기가 된다."},{"label":"중장 ① · 대문 밖에서 기다림","original":"중문 나서 대문 나가 지방 우희 치ᄃᆞ라 안자 이수로 가액ᄒᆞ고","meaning":"중문과 대문을 지나 높은 곳에 올라서서, 손을 이마에 대고 멀리 살펴본다.","analysis":"동작을 빠르게 이어 붙여 조급함을 표현한다. “이수로 가액”은 손을 이마에 대고 먼 곳을 바라보는 동작을 가리킨다."},{"label":"중장 ② · 멀리서 보이는 그림자","original":"오ᄂᆞᆫ가 가ᄂᆞᆫ가 건넌산 ᄇᆞ라보니 거머 횟돌 서 잇거늘 저야 님이로다","meaning":"누가 오나 하고 먼 곳을 바라보다 검고 희끗한 형상을 임인 줄로 착각한다.","analysis":"시각적으로 불분명한 대상을 자신이 원하는 임으로 오인한다. 독자는 뒤의 반전을 예상할 수 있어 해학적 긴장이 생긴다."},{"label":"중장 ③ · 허둥대며 달려감","original":"보션 버서 품에 품고 신 버서 손에 쥐고 곰븨님븨 님븨곰븨 천방지방 지방쳔방 즌 듸 ᄆᆞᄅᆞᆫ 듸 ᄀᆞᆯ히지 말고 위렁충창 건너가서","meaning":"버선과 신발까지 벗어 들고 앞뒤 가리지 않은 채 젖은 곳, 마른 곳을 가리지 않고 달려간다.","analysis":"유사한 말의 반복, 빠른 동작의 나열, 의태어가 어우러져 들뜬 화자를 우스꽝스럽게 그린다. 사설시조의 장형 중장을 확인할 수 있다."},{"label":"중장 ④ · 정다운 말을 하려다","original":"정(情)엣 말 ᄒᆞ려 ᄒᆞ고 겻눈을 흘긋 보니","meaning":"그 사람에게 반가운 말을 하려다가 곁눈질로 자세히 살펴본다.","analysis":"기대가 최고조에 달한 순간 실체를 확인하는 행동을 배치하여 반전 직전의 긴장을 형성한다."},{"label":"중장 ⑤ · 임이 아니라는 반전","original":"상년 칠월 열사흔날 ᄏᆞᆯ가 벅긴 주추리 삭대 ᄉᆞᆯ드리도 날 소겨다","meaning":"알고 보니 임이 아니라 오래도록 서 있던 삭대 같은 물체였다. 자신이 착각했다는 사실을 깨닫는다.","analysis":"애타게 달려간 대상이 사람이 아니라는 사실이 드러나면서 기대와 현실의 차이가 웃음을 만든다. 이미지의 일부 낡은 표기는 원문 사진을 기준으로 옮겼다."},{"label":"종장 · 밤이라 다행이라는 반응","original":"모쳐라 밤일싀만정 행여 낫이런들 ᄂᆞ 우일 번 ᄒᆞ괘라","meaning":"다행히 밤이어서 남이 알아보지 못했지만, 낮이었다면 남들의 웃음거리가 될 뻔했다.","analysis":"민망함을 감추려는 화자의 자기합리화가 해학적인 결말을 완성한다. 3장 중 늘어난 중장과 짧은 종장이 대조된다."}],"vocab":"중문: 대문 안쪽의 문 / 지방: 지붕이나 지붕처럼 높은 곳(문맥상 관찰 위치) / 이수(以手): 손으로 / 가액(加額): 이마에 댐 / 겻눈: 곁눈 / 모쳐라: 다행이다(감탄) / 밤일싀만정: 밤이기에 망정이지","point":"긴 중장의 나열·반복·의태어, 화자의 적극적 행동, 기대와 현실의 반전이 시험 핵심이다.","pitfalls":"임이 실제로 온 것은 아니다. 원문 중 별표는 주석 표시였으므로 노랫말로 옮기지 않았다.","original":"님이 오마 ᄒᆞ거늘 저녁밥을 일 지어 먹고\n중문 나서 대문 나가 지방 우희 치ᄃᆞ라 안자 이수로 가액ᄒᆞ고 오ᄂᆞᆫ가 가ᄂᆞᆫ가 건넌산 ᄇᆞ라보니 거머\n횟돌 서 잇거늘 저야 님이로다 보션 버서 품에 품고 신 버서 손에 쥐고 곰븨님븨 님븨곰븨 천방지방 지\n방쳔방 즌 듸 ᄆᆞᄅᆞᆫ 듸 ᄀᆞᆯ히지 말고 위렁충창 건너가서 정(情)엣 말 ᄒᆞ려 ᄒᆞ고 겻눈을 흘긋 보니 상년\n칠월 열사흔날 ᄏᆞᆯ가 벅긴 주추리 삭대 ᄉᆞᆯ드리도 날 소겨다\n모쳐라 밤일싀만정 행여 낫이런들 ᄂᆞ 우일 번 ᄒᆞ괘라","source":"","originalNote":"사용자 사진에 있는 중세어 표기를 가능한 그대로 옮겼으며, 인쇄된 줄 나눔을 유지했습니다. 일부 희귀 글자는 교과서 판본과 대조가 필요합니다. 사진의 각주 기호는 제거했습니다.","lineGuides":[{"label":"초장 · 임이 온다는 말에 서두름","reference":"님이 오마 ᄒᆞ거늘 저녁밥을 일 지어 먹고","meaning":"임이 오겠다고 해서 서둘러 저녁밥을 일찍 차려 먹는다.","analysis":"임을 기다리는 설렘과 기대가 일상의 행동으로 나타난다. “오마”의 약속이 이후 모든 행동의 계기가 된다."},{"label":"중장 ① · 대문 밖에서 기다림","reference":"중문 나서 대문 나가 지방 우희 치ᄃᆞ라 안자 이수로 가액ᄒᆞ고","meaning":"중문과 대문을 지나 높은 곳에 올라서서, 손을 이마에 대고 멀리 살펴본다.","analysis":"동작을 빠르게 이어 붙여 조급함을 표현한다. “이수로 가액”은 손을 이마에 대고 먼 곳을 바라보는 동작을 가리킨다."},{"label":"중장 ② · 멀리서 보이는 그림자","reference":"오ᄂᆞᆫ가 가ᄂᆞᆫ가 건넌산 ᄇᆞ라보니 거머 횟돌 서 잇거늘 저야 님이로다","meaning":"누가 오나 하고 먼 곳을 바라보다 검고 희끗한 형상을 임인 줄로 착각한다.","analysis":"시각적으로 불분명한 대상을 자신이 원하는 임으로 오인한다. 독자는 뒤의 반전을 예상할 수 있어 해학적 긴장이 생긴다."},{"label":"중장 ③ · 허둥대며 달려감","reference":"보션 버서 품에 품고 신 버서 손에 쥐고 곰븨님븨 님븨곰븨 천방지방 지방쳔방 즌 듸 ᄆᆞᄅᆞᆫ 듸 ᄀᆞᆯ히지 말고 위렁충창 건너가서","meaning":"버선과 신발까지 벗어 들고 앞뒤 가리지 않은 채 젖은 곳, 마른 곳을 가리지 않고 달려간다.","analysis":"유사한 말의 반복, 빠른 동작의 나열, 의태어가 어우러져 들뜬 화자를 우스꽝스럽게 그린다. 사설시조의 장형 중장을 확인할 수 있다."},{"label":"중장 ④ · 정다운 말을 하려다","reference":"정(情)엣 말 ᄒᆞ려 ᄒᆞ고 겻눈을 흘긋 보니","meaning":"그 사람에게 반가운 말을 하려다가 곁눈질로 자세히 살펴본다.","analysis":"기대가 최고조에 달한 순간 실체를 확인하는 행동을 배치하여 반전 직전의 긴장을 형성한다."},{"label":"중장 ⑤ · 임이 아니라는 반전","reference":"상년 칠월 열사흔날 ᄏᆞᆯ가 벅긴 주추리 삭대 ᄉᆞᆯ드리도 날 소겨다","meaning":"알고 보니 임이 아니라 오래도록 서 있던 삭대 같은 물체였다. 자신이 착각했다는 사실을 깨닫는다.","analysis":"애타게 달려간 대상이 사람이 아니라는 사실이 드러나면서 기대와 현실의 차이가 웃음을 만든다. 이미지의 일부 낡은 표기는 원문 사진을 기준으로 옮겼다."},{"label":"종장 · 밤이라 다행이라는 반응","reference":"모쳐라 밤일싀만정 행여 낫이런들 ᄂᆞ 우일 번 ᄒᆞ괘라","meaning":"다행히 밤이어서 남이 알아보지 못했지만, 낮이었다면 남들의 웃음거리가 될 뻔했다.","analysis":"민망함을 감추려는 화자의 자기합리화가 해학적인 결말을 완성한다. 3장 중 늘어난 중장과 짧은 종장이 대조된다."}],"detailNotice":"사진에서 옮긴 노랫말을 사건 흐름에 따라 7구간으로 나누어 현대어 풀이와 표현 효과를 짚습니다.","sourceContext":"이번에 제공된 「님이 오마 하거늘」 사진에서 노랫말을 텍스트로 옮겼습니다. 원문의 별표 각주 기호는 본문에서 제거했습니다.","readableOriginal":"님이 오마 하거늘 저녁밥을 일 지어 먹고\n중문 나서 대문 나가 지방 우희 치다라 안자 이수로 가액하고 오난가 가난가 건넌산 바라보니 거머\n횟돌 서 잇거늘 저야 님이로다 보션 버서 품에 품고 신 버서 손에 쥐고 곰븨님븨 님븨곰븨 천방지방 지\n방쳔방 즌 듸 마란 듸 갈히지 말고 위렁충창 건너가서 정(情)엣 말 하려 하고 겻눈을 흘긋 보니 상년\n칠월 열사흔날 칼가 벅긴 주추리 삭대 살드리도 날 소겨다\n모쳐라 밤일싀만정 행여 낫이런들 나 우일 번 하괘라","originalModern":"","alignedLines":null,"isExcerpt":false,"hanjaWords":[{"hanja":"情","reading":"정","meaning":"정다운 마음"},{"hanja":"以手","reading":"이수","meaning":"손으로"},{"hanja":"加額","reading":"가액","meaning":"손을 이마에 댐"}],"id":"w10","poem":true,"textStatus":"사용자 제공/대조 본문 · 판본 확인 권장"},{"group":"소설","title":"춘향전","author":"작자 미상","genre":"판소리계 고전 소설","theme":"신분 차이를 넘어서는 사랑과 부당 권력에 대한 저항","summary":"몽룡이 암행어사 신분을 감춘 채 변 사또의 잔치에 들어가 백성의 고통을 고발하는 한시를 지은 뒤 출두하여 변 사또를 파면한다. 춘향은 자신의 정절을 굽히지 않고, 몽룡과 재회한 후 정렬부인으로 책봉되어 행복한 결말을 맞는다.","structure":"앞부분 줄거리(사랑·이별·수청 강요) → 생일잔치의 사치와 부패 → 차운 한시로 비판 → 출두와 봉고파직 → 춘향의 수청 거절 → 재회와 고향 하직 → 정렬부인 책봉·백년동락","grammar":"판소리계 소설. 3인칭 서술에 서술자의 말걸기(“거동 보소”), 직접 인용 대화, 의성·의태어와 반복, 열거와 과장, 삽입 한시·노래, 구어체와 장단감을 살리는 문장들이 특징. 대구·은유·설의·반어를 구분하자.","emotion":"몽룡: 분노·의분 → 결단·통쾌함 / 관리들: 안일함 → 당황·공포 / 춘향: 비장함·굳은 절개 → 놀라움·환희 → 고향에 대한 아쉬움","devices":"화려한 연회와 백성의 피·땀·눈물의 대조, 한시의 대구와 은유, 관리의 모습을 과장한 해학과 풍자, 사방의 출두 외침 반복, 바위·청송녹죽으로 굳센 절개 비유, 가을/봄의 대조와 낙엽/이화춘풍의 상징.","compare":"「봄·봄」의 해학은 순박한 ‘나’를 보며 연민 섞인 웃음을 느끼게 하고, 「춘향전」의 풍자는 부패한 사또의 악행을 비판하며 웃게 한다.","note":"이본에 따라 대목과 표현 차이가 큼.","intro":"화려한 잔치와 민중의 고통을 대비하고, 암행어사 출두 때 탐관오리의 권위가 해학적으로 무너지는 장면과 춘향의 변함없는 절개를 연이어 보여 주는 판소리계 소설 발췌다.","units":[{"label":"① 앞부분 줄거리 · 만남, 이별, 수청 강요","meaning":"몽룡과 춘향의 사랑이 변학도의 횡포로 위기에 빠지고, 암행어사가 된 몽룡이 신분을 숨겨 남원으로 돌아온다.","analysis":"작품 전체를 읽기 전에 사건의 원인을 정리하는 요약 부분이다. 사랑과 신분 차이, 개인의 정절과 관리의 권력 남용이 갈등의 두 축이다.","original":"남원 부사의 아들인 몽룡은 광한루에서 그네를 타고 있던 퇴기 월매의 딸 춘향에게 첫눈에 반하고,"},{"label":"② 잔치의 호화로움과 걸인 차별","meaning":"변 사또는 각 읍 수령을 모아 큰 생일잔치를 벌이고, 걸인 행색 몽룡의 입장을 막는다.","analysis":"시각·청각 묘사가 화려하고 관리의 명령이 연달아 제시된다. 어사또의 마음이 심란한 것은 백성의 처지와 관리의 사치가 극명히 다르기 때문이다.","original":"“우리 사또님이 걸인을 금하였으니, 어느 양반인지는 모르오만 그런 말은 내지도 마오.”"},{"label":"③ 차운 한시 · 탐관오리 풍자","meaning":"몽룡은 잔치의 술·안주·촛농·노랫소리가 모두 백성의 고통 위에 놓여 있음을 고발한다.","analysis":"4구는 1·2구의 술/안주, 3·4구의 촛농/노래와 백성의 피/기름/눈물/원망이 대응한다. 대구, 은유, 대조가 핵심이며 운봉은 뜻을 알아차리지만 변 사또는 모른다.","original":"금준미주(金樽美酒) 천인혈(千人血)이요\n옥반가효(玉盤佳肴) 만성고(萬姓膏)라.\n촉루낙시(燭淚落時) 민루낙(民淚落)이요\n가성고처(歌聲高處) 원성고(怨聲高)라."},{"label":"④ 암행어사 출두와 봉고파직","meaning":"출두 외침에 아전과 수령들이 놀라 허둥대고 몽룡은 변 사또를 파면한다.","analysis":"사방에서 터지는 “출두야” 반복과 온갖 물건을 바꿔 챙기는 열거, 비문에 가까운 허둥지둥한 말이 웃음을 유발한다. 부패한 권력을 해학적으로 무너뜨리며 사회 비판성을 드러낸다.","original":"“암행어사 출두야.”\n“본관 사또는 봉고파직(封庫罷職)하라.”"},{"label":"⑤ 춘향의 변함없는 절개와 재회","meaning":"춘향은 새로운 관리의 수청 요구도 거부한다. 마침내 그 관리가 몽룡임을 알고 기쁨과 눈물을 함께 드러낸다.","analysis":"바위·소나무·대나무는 굳센 절개, 가을과 봄은 절망과 구원을 나타낸다. 몽룡의 정체가 공개되며 위기에서 해결로 극적으로 전환된다.","original":"“청송녹죽(靑松綠竹) 푸른 나무가 눈이 온들 변하리까.”"},{"label":"⑥ 고향 하직과 정렬부인 책봉","meaning":"춘향은 남원을 떠나며 고향에 대한 애틋함을 표현하고, 임금에게 정렬부인으로 책봉된다.","analysis":"영귀함과 이별의 슬픔이 함께 나타나는 일희일비의 정서에 주목한다. 춘향의 정절에 대한 보상과 변 사또의 징벌이 권선징악을 형성한다.","original":"“놀고 자던 부용당아. 너 부디 잘 있거라.”"},{"label":"⑦ 백년동락 · 행복한 결말","meaning":"몽룡은 여러 관직을 지낸 뒤 춘향과 더불어 일생을 함께하며 자손이 번창한다.","analysis":"독자의 기대에 부합하는 행복한 결말이다. 개인적 사랑의 성취와 사회적 인정이 한꺼번에 실현된다.","original":"“정렬부인으로 더불어 백년동락(百年同樂)할새”"}],"vocab":"차운: 제시된 운자를 사용해 시를 짓는 일. / 금준미주: 금잔의 좋은 술. / 천인혈: 백성의 피. / 만성고: 백성의 기름. / 촉루: 촛농을 눈물에 빗댄 말. / 민루: 백성의 눈물. / 암행어사: 임금이 비밀리에 파견한 감찰관. / 봉고파직: 관아의 창고를 봉하고 관리를 파면함. / 청송녹죽: 푸른 소나무와 대나무로 변함없는 절개를 상징. / 이화춘풍: 배꽃 피는 봄바람, 이 장면에서는 구원과 새 삶. / 일희일비: 한편 기쁘고 다른 한편 슬픔. / 영귀: 영화롭고 귀하게 됨. / 정렬부인: 절개를 기리는 존호로 제시됨. / 백년동락: 오랫동안 함께 즐겁게 삶.","point":"시험 핵심: 한시 네 구의 대구·은유·풍자, 명관의 반어, 암행어사 출두 장면의 과장·열거·해학, “청송녹죽”의 정절 상징, 가을↔봄의 정서적 대비, 권선징악의 결말.","pitfalls":"「춘향전」의 원전 이본과 수업용 현대어 발췌문을 혼동하지 말 것. ‘명관’은 진짜 칭찬이 아니라 비꼼이다. 출두 장면의 웃음은 부패 관리의 권위 붕괴와 연결된다. 어사또가 춘향에게 수청을 요구하는 것처럼 말하는 장면은 정체 공개 전의 시험적 발화이며 그 요구가 옳다는 의미가 아니다.","original":"앞부분 줄거리\n남원 부사의 아들인 몽룡은 광한루에서 그네를 타고 있던 퇴기 월매의 딸 춘향에게 첫눈에 반하고,\n둘은 사랑에 빠진다. 하지만 몽룡은 동부승지로 임명된 부친을 따라 한양으로 떠난다. 이후 남원 부\n사로 새로 온 변학도가 춘향에게 수청을 강요하고, 춘향은 이를 거절하여 옥에 갇힌다. 한편 장원\n급제 후 암행어사가 된 몽룡은 남원에 내려오는 길에 민중들이 변 사또의 폭정으로 괴로워한다는\n소식을 듣는다. 몽룡은 자신의 신분을 감추고 거지 행색으로 춘향을 만나러 가고, 춘향은 몽룡에게\n자신이 죽으면 시신을 잘 거두어 달라고 부탁한다. 춘향을 만난 다음 날, 몽룡은 변 사또의 생일잔\n치가 열린 곳으로 향한다.\n가까운 읍의 수령들이 모여든다. 운봉의 장관, 구례, 곡성, 순창, 옥과, 진안, 장\n수 원님이 차례로 모여든다. 왼쪽에 행수, 군관 오른쪽에 청령, 사령이 있고 본관\n사또는 주인이 되어 한가운데 있어 하인 불러 분부하되,\n“관청색 불러 다과를 올리라. 육고자 불러 큰 소를 잡고, 예방 불러 악공을 대령\n하고, 승발 불러 천막을 대령하라. 사령 불러 잡인을 금하라.”\n이렇듯 요란할 제 온갖 깃발이며 삼현 육각 풍류 소리 공중에 떠 있고, 붉은 옷\n붉은 치마 입은 기생들은 흰 손 비단 치마 높이 들어 춤을 추고,지화자 둥덩실 하\n는 소리에 어사의 마음이 심란하구나.\n“여봐라 사령들아. 너의 사또에게 여쭈어라. 먼 데 있는 걸인이 좋은 잔치에 왔\n으니 술과 안주나 좀 얻어먹자고 여쭈어라.”\n저 사령의 거동 보소.\n“우리 사또님이 걸인을 금하였으니, 어느 양반인지는 모르오만 그런 말은 내지\n도 마오.”\n등을 밀쳐 내니 어찌 아니 명관(名官)인가. 운봉 영장이 그 거동을 보고 본관 사\n또에게 청하는 말이\n“저 걸인의 의관은 남루하나 양반의 후예인 듯하니 말석에\n앉히고 술잔이나 먹여 보냄이 어떠하뇨?”\n본관 사또 하는 말이,\n“운봉의 소견대로 하오마는.”\n‘마는’ 하는 끝말을 내뱉고는 입맛이 사납겠다. 어사또 속\n으로,\n‘오냐, 도적질은 내가 하마. 오라는 네가 받아라.’\n운봉 영장이 분부하여,\n“저 양반 듭시라고 하여라.”\n어사또 들어가 단정히 앉아 좌우를 살펴보니, 당 위의 모든 수령 다과상을 앞에\n놓고 진양조가 높아 가는데, 어사또의 상을 보니 어찌 아니 통분하랴. 모서리 떨어\n진 개상판에 닥나무 젓가락, 콩나물, 깍두기, 막걸리 한 사발 놓았구나. 상을 발길\n로 탁 차 던지며 운봉 영장의 갈비를 가리키며,\n“갈비 한 대 먹고지고.”\n“다리도 잡수시오.”\n하고는 운봉이 하는 말이,\n“이러한 잔치에 풍류로만 놀아서는 맛이 적사오니 차운 한 수씩 하여 보면 어떠\n하오?”\n“그 말이 옳다.”\n하니 운봉이 운을 낼 제 ‘높을 고(高)’ 자, ‘기름 고(膏)’ 자 두 자를 내어 놓고 차례\n로 운을 달아 시를 짓는다. 이때 어사또 하는 말이,\n“걸인이 어려서 한시(漢詩)깨나 읽었더니 좋은 잔치 당하여서 술과 안주를 포\n식하고 그냥 가기 민망하니 차운 한 수 하사이다.”\n운봉 영장이 반겨 듣고 필연을 내어 주니, 좌중 사람들이 다 짓지도 않았는데 순\n식간에 글 두 귀를 지었으되, 백성들의 형편을 생각하고 본관 사또의 정체를 감안\n하여 지었것다\n금준미주(金樽美酒) 천인혈(千人血)이요\n옥반가효(玉盤佳肴) 만성고(萬姓膏)라.\n촉루낙시(燭淚落時) 민루낙(民淚落)이요\n가성고처(歌聲高處) 원성고(怨聲高)라.\n이 글 뜻은,\n금동이의 아름다운 술은 일만 백성의 피요\n옥소반의 아름다운 안주는 일만 백성의 기름이라.\n촛불 눈물 떨어질 때 백성 눈물 떨어지고\n노랫소리 높은 곳에 원망 소리 높았더라.\n이렇듯이 지었으되 본관 사또는 몰라보는데 운봉 영장은 글을 보며 속으로,\n‘아뿔싸. 일이 났다.’\n이때 어사또가 하직하고 간 연후에 각 아전들을 분부하되,\n“야야. 일이 났다.”\n공방 불러 돗자리 단속, 병방 불러 역마 단속, 관청색 불러 다과상 단속, 옥형방\n불러 죄인 단속, 집사 불러 형구 단속, 형방 불러 장부 단속, 사령 불러 숙직 단속\n한참 이리 요란할 제 사정 모르는 저 본관 사또가,\n“여보 운봉은 어디를 다니시오?”\n“소피 보고 들어오오.”\n본관 사또가 술주정이 나서 분부하되,\n“춘향을 급히 올리라.”\n이때에 어사또 부하들과 내통한다. 서리를 보고 눈길을 보\n내니 서리, 중방 거동 보소. 역졸을 불러 단속할 제 이리 가며 수군, 저리 가며 수군수군. 서리, 역졸 거동 보소. 외올망건 공단 모자 새 패랭이 눌러쓰고, 석 자 감발새 짚신에 한삼 고의 산뜻하게 차려입고,육모방망이 사슴 가죽끈을 손목에 걸어 쥐고,\n여기서 번쩍 저기서 번쩍, 남원읍이 우글\n우글. 청파 역졸 거동 보소. 달 같은 마패\n를 햇빛같이 번쩍 들어,\n“암행어사 출두야.”\n외치는 소리에 강산이 무너지고 천지가 뒤집히는 듯 초목금수(草木禽獸)인들\n아니 떨랴. 남문에서“출두야.”\n북문에서,\n“출두야.”\n동서문 출두 소리 청천(靑天)에 진동하고,\n“모든 아전들 들라.”\n외치는 소리에 육방(六房)이 넋을 잃어,\n“공형이오.”\n등채로 휘닥딱.\n“애고 죽겠다.”\n“공방, 공방.”\n공방이 자리 들고 들어오며,\n“안 하겠다던 공방을 하라더니 저 불속에 어찌 들랴.”\n등채로 휘닥딱.\n“애고 박 터졌네.”\n좌수(座首), 별감(別監) 넋을 잃고 이방, 호방 혼을 잃고 나졸들이 분주하네. 모\n든 수령 도망갈 제 거동 보소. 인궤 잃고 강정 들고, 병부 잃고 송편 들고, 탕건 잃고 용수 쓰고, 갓 잃고 소반 쓰고. 칼집 쥐고 오줌 누기. 부서지는 것은 거문고요 깨\n지는 것은 북과 장고라. 본관 사또가 똥을 싸고 멍석 구멍 새앙쥐 눈 뜨듯 하고,안\n으로 들어가서,\n“어 추워라. 문 들어온다 바람 닫아라. 물 마르다 목 들여라.”\n관청색은 상을 잃고 문짝을 이고 내달으니, 서리, 역졸 달려들어 후닥딱.\n“애고 나 죽네.”\n이때 어사또 분부하되,\n“이 골은 대감이 좌정하시던 골이라. 잡소리를 금하고 객사(客舍)로 옮겨라.”\n자리에 앉은 후에,\n“본관 사또는 봉고파직(封庫罷職)하라.”\n분부하니,\n“본관 사또는 봉고파직이오.”\n사대문(四大門)에 방을 붙이고 옥형리 불러 분부하되,\n“네 골 옥에 갇힌 죄수를 다 올리라.”\n호령하니 죄인을 올린다. 다 각각 죄를 물은 후에 죄가 없는 자는 풀어 줄새,\n“저 계집은 무엇인고?”\n형리 여쭈오되,\n“기생 월매의 딸이온데 관청에서 포악한 죄로 옥중에 있삽내다.”\n“무슨 죄인고?”\n형리 아뢰되,\n“본관 사또 수청 들라고 불렀더니 수절이 정절이라. 수청 아니 들려 하고 사또\n에게 악을 쓰며 달려든 춘향이로소이다.”\n어사또 분부하되,\n“너 같은 년이 수절한다고 관장에게 포악하였으니 살기를 바랄쏘냐. 죽어 마땅\n하되 내 수청도 거역할까?”\n춘향이 기가 막혀,\n“내려오는 관장마다 모두 명관(名官)이로구나. 어사또 들으시오. 층암절벽 높은\n바위가 바람 분들 무너지며, 청송녹죽(靑松綠竹) 푸른 나무가 눈이 온들 변하리\n까. 그런 분부 마옵시고 어서 바삐 죽여 주오.”\n하며,\n“향단아, 서방님 어디 계신가 보아라. 어젯밤에 옥 문간에 와 계실 제 천만당부\n하였더니 어디를 가셨는지 나 죽는 줄 모르는가.”\n어사또 분부하되,\n“얼굴 들어 나를 보라.”\n하시니 춘향이 고개 들어 위를 살펴보니, 걸인으로 왔던 낭군이 분명히 어사또가\n되어 앉았구나. 반웃음 반 울음에,\n“얼씨구나 좋을시고 어사 낭군 좋을시고. 남원 읍내 가을이 들어 떨어지게 되\n었더니, 객사에 봄이 들어 이화춘풍(李花春風) 날 살린다. 꿈이냐, 생시냐? 꿈을\n깰까 염려로다.”\n한참 이리 즐길 적에 춘향 어미 들어와서 가없이 즐겨 하는 말을 어찌 다 설화하랴.\n춘향의 높은 절개 광채 있게 되었으니 어찌 아니 좋을쏜가. 어사또 남원의 공무\n다한 후에 춘향 모녀와 향단이를 서울로 데려갈새, 위의가 찬란하니 세상 사람들\n이 누가 아니 칭찬하랴. 이때 춘향이 남원을 하직할새, 영귀(榮貴)하게 되었건만\n고향을 이별하니 일희일비(一喜一悲)가 아니 되랴.\n놀고 자던 부용당아.\n너 부디 잘 있거라.\n광한루 오작교며\n영주각(瀛州閣)도 잘 있거라.\n‘봄풀은 해마다 푸르건만\n떠난 객은 돌아오지 않는다.’라고 이른 시(詩)는\n나를 두고 이름이라.\n다 각기 이별할 제\n길이길이 무고하옵소서.\n다시 보기 기약 없네.\n이때 어사또는 좌도와 우도의 읍들을 순찰하여 민정을 살핀 후에, 서울로 올라\n가 임금께 절을 하니 판서, 참판, 참의들이 입시하시어 보고서를 살핀다. 임금께서\n크게 칭찬하시며 즉시 이조 참의 대사성을 봉하시고 춘향으로 정렬부인을 봉하신다. 은혜에 감사드리고 물러 나와 부모께 뵈오니 성은(聖恩)을 못 잊어 하시더라.\n이때 이조 판서, 호조 판서, 좌의정, 우의정, 영의정 다 지내고 퇴임한 후에 정렬부\n인으로 더불어 백년동락(百年同樂)할새, 정렬부인에게 삼남삼녀(三男三女)를 두\n었으니 모두가 총명하여 그 부친보다 낫더라. 일품 관직이 대대로 이어져 길이 전\n하더라.","source":"https://world.kbs.co.kr/service/contents_view.htm?board_seq=45117&id=&lang=k&menu_cate=culture","originalNote":"사용자가 채팅에 제공한 현대어 편집 발췌문을 그대로 옮겼습니다. 고전소설 전체 원전이 아니라 수업용 발췌 자료입니다. 화면 줄바꿈은 원래 보낸 대로 유지했습니다.","detailNotice":"제공 본문의 핵심 30개 표현을 중심으로 반어·풍자·대구·설의·해학·계절 상징·권선징악을 분석합니다.","lineGuides":[{"label":"앞부분 줄거리 · 신분과 사랑","reference":"몽룡은 광한루에서 그네를 타던 춘향을 만나 사랑에 빠진다.","meaning":"이 구절의 상황: 춘향이 퇴기 월매의 딸이라는 사실과 몽룡의 사대부 집안이라는 신분 차이가 이후 갈등의 배경을 이룬다.","analysis":"춘향이 퇴기 월매의 딸이라는 사실과 몽룡의 사대부 집안이라는 신분 차이가 이후 갈등의 배경을 이룬다."},{"label":"이별과 외적 갈등","reference":"몽룡은 동부승지가 된 부친을 따라 한양으로 떠나고, 변학도의 수청 요구를 거절한 춘향은 옥에 갇힌다.","meaning":"이 구절의 상황: 개인의 사랑에 지방 관아의 부패한 권력이 개입한다.","analysis":"개인의 사랑에 지방 관아의 부패한 권력이 개입한다. 부당한 명령에 맞서는 춘향의 정절과 자존심이 중심이다."},{"label":"변 사또의 호화 잔치","reference":"“관청색 불러 다과를 올리라. 육고자 불러 큰 소를 잡고, 예방 불러 악공을 대령하고, 승발 불러 천막을 대령하라. 사령 불러 잡인을 금하라.”","meaning":"이 구절의 상황: 명령과 심부름의 열거로 권세와 사치가 드러난다.","analysis":"명령과 심부름의 열거로 권세와 사치가 드러난다. 백성의 고통을 외면한 통치 태도를 간접 비판한다."},{"label":"삼현 육각 · 화려한 풍류","reference":"“삼현 육각 풍류 소리”","meaning":"이 구절의 상황: 음악과 붉은 옷의 기생 등 감각적인 묘사는 떠들썩한 잔치의 분위기를 만들지만 어사에게는 백성들의 삶과 대비되어 심란하게 느껴진다.","analysis":"음악과 붉은 옷의 기생 등 감각적인 묘사는 떠들썩한 잔치의 분위기를 만들지만 어사에게는 백성들의 삶과 대비되어 심란하게 느껴진다."},{"label":"걸인에 대한 거절","reference":"“우리 사또님이 걸인을 금하였으니, 어느 양반인지는 모르오만 그런 말은 내지도 마오.”","meaning":"이 구절의 상황: 암행어사인 몽룡이 거지 행색이므로 관리는 무시한다.","analysis":"암행어사인 몽룡이 거지 행색이므로 관리는 무시한다. 신분·외모를 기준으로 대하는 태도가 드러난다."},{"label":"명관이라는 말의 반어","reference":"“등을 밀쳐 내니 어찌 아니 명관(名官)인가.”","meaning":"이 구절의 상황: 겉으로는 훌륭한 관리라고 칭송하나 실제로는 백성을 업신여기는 부당한 행동을 비꼬는 반어·설의적 표현이다.","analysis":"겉으로는 훌륭한 관리라고 칭송하나 실제로는 백성을 업신여기는 부당한 행동을 비꼬는 반어·설의적 표현이다."},{"label":"운봉의 판단","reference":"“저 걸인의 의관은 남루하나 양반의 후예인 듯하니 말석에 앉히고 술잔이나 먹여 보냄이 어떠하뇨?”","meaning":"이 구절의 상황: 운봉 영장은 걸인을 관찰하고 예우를 청한다.","analysis":"운봉 영장은 걸인을 관찰하고 예우를 청한다. 본관 사또의 태도와 대조된다."},{"label":"어사또 속마음과 복선","reference":"‘오냐, 도적질은 내가 하마. 오라는 네가 받아라.’","meaning":"이 구절의 상황: 어사는 부패 관리를 적발할 결심을 드러낸다.","analysis":"어사는 부패 관리를 적발할 결심을 드러낸다. 독자에게는 상황이 먼저 알려져 긴장과 통쾌함을 예고한다."},{"label":"푸대접과 갈비 요구","reference":"“갈비 한 대 먹고지고.”","meaning":"이 구절의 상황: 손님 대접의 차별을 드러내는 장면이다.","analysis":"손님 대접의 차별을 드러내는 장면이다. 어사또는 걸인의 신분으로 잔치에 섞여 권력자의 언행을 살핀다."},{"label":"차운의 의미","reference":"“차운 한 수씩 하여 보면 어떠하오?”","meaning":"이 구절의 상황: 정해 준 운자를 이용하여 시를 짓는 것을 차운이라 한다.","analysis":"정해 준 운자를 이용하여 시를 짓는 것을 차운이라 한다. 여기서는 높을 고(高)·기름 고(膏)를 사용하여 탐관오리 비판의 시를 짓는다."},{"label":"한시 1구 · 술과 백성의 피","reference":"금준미주(金樽美酒) 천인혈(千人血)이요","meaning":"이 구절의 상황: 금잔에 담긴 아름다운 술이 사실 백성에게서 짜낸 피라는 은유다.","analysis":"금잔에 담긴 아름다운 술이 사실 백성에게서 짜낸 피라는 은유다. 사치와 수탈을 강렬하게 대비한다."},{"label":"한시 2구 · 안주와 백성의 기름","reference":"옥반가효(玉盤佳肴) 만성고(萬姓膏)라.","meaning":"이 구절의 상황: 옥쟁반의 맛있는 안주를 백성들의 기름에 견준다.","analysis":"옥쟁반의 맛있는 안주를 백성들의 기름에 견준다. 한시 1구와 짝을 이루는 대구로 부패한 권력의 착취를 고발한다."},{"label":"한시 3구 · 촛농과 눈물","reference":"촉루낙시(燭淚落時) 민루낙(民淚落)이요","meaning":"이 구절의 상황: 촛불의 촛농을 백성의 눈물과 연결한다.","analysis":"촛불의 촛농을 백성의 눈물과 연결한다. 화려한 연회의 물건을 백성의 고통과 대응시키는 비유다."},{"label":"한시 4구 · 노랫소리와 원망","reference":"가성고처(歌聲高處) 원성고(怨聲高)라.","meaning":"이 구절의 상황: 잔치의 노래가 높을수록 백성의 원망도 높다는 대조·대구이다.","analysis":"잔치의 노래가 높을수록 백성의 원망도 높다는 대조·대구이다. 풍자적 정점이며 ‘고(高)’의 운자 사용도 확인할 수 있다."},{"label":"변 사또와 운봉의 인식 차이","reference":"“이렇듯이 지었으되 본관 사또는 몰라보는데 운봉 영장은 글을 보며 속으로, ‘아뿔싸. 일이 났다.’”","meaning":"이 구절의 상황: 본관 사또는 시가 자신을 비판한다는 사실을 알아보지 못하지만 운봉은 정체를 눈치챈다.","analysis":"본관 사또는 시가 자신을 비판한다는 사실을 알아보지 못하지만 운봉은 정체를 눈치챈다. 인물의 어리석음과 독자의 우월한 정보가 해학을 만든다."},{"label":"출두 준비 · 짧은 명령의 반복","reference":"“공방 불러 돗자리 단속, 병방 불러 역마 단속”","meaning":"이 구절의 상황: 여러 관직과 사무를 빠르게 나열해 출두 직전의 급박함과 분주함을 표현한다.","analysis":"여러 관직과 사무를 빠르게 나열해 출두 직전의 급박함과 분주함을 표현한다."},{"label":"출두 선언","reference":"“암행어사 출두야.”","meaning":"이 구절의 상황: 이야기의 전환점.","analysis":"이야기의 전환점. 변 사또가 권력을 잃고 숨긴 신분의 몽룡이 공식 권한을 드러낸다."},{"label":"과장과 반복의 청각적 효과","reference":"“남문에서‘출두야.’ 북문에서, ‘출두야.’”","meaning":"이 구절의 상황: 사방에서 반복되는 외침과 천지가 뒤집히는 듯한 과장으로 출두의 위력, 극적 효과와 판소리적 현장감을 강조한다.","analysis":"사방에서 반복되는 외침과 천지가 뒤집히는 듯한 과장으로 출두의 위력, 극적 효과와 판소리적 현장감을 강조한다."},{"label":"관아 관리들의 혼란","reference":"“인궤 잃고 강정 들고, 병부 잃고 송편 들고, 탕건 잃고 용수 쓰고, 갓 잃고 소반 쓰고.”","meaning":"이 구절의 상황: 관리들이 허둥대며 엉뚱한 물건을 챙기는 열거·반복·대조는 해학적 풍자이다.","analysis":"관리들이 허둥대며 엉뚱한 물건을 챙기는 열거·반복·대조는 해학적 풍자이다. 권위가 우스꽝스럽게 무너진다."},{"label":"변 사또의 비논리적 발화","reference":"“어 추워라. 문 들어온다 바람 닫아라. 물 마르다 목 들여라.”","meaning":"이 구절의 상황: 어순과 목적어가 뒤엉킨 말로 혼란에 빠진 변 사또를 희화화하며 이전의 권세를 뒤집는다.","analysis":"어순과 목적어가 뒤엉킨 말로 혼란에 빠진 변 사또를 희화화하며 이전의 권세를 뒤집는다."},{"label":"봉고파직","reference":"“본관 사또는 봉고파직(封庫罷職)하라.”","meaning":"이 구절의 상황: 관아 창고를 봉하고 관리를 파면한다는 뜻.","analysis":"관아 창고를 봉하고 관리를 파면한다는 뜻. 부패한 권력에 대한 징벌로 백성의 고통을 해결하는 계기가 된다."},{"label":"춘향에 대한 마지막 시험","reference":"“너 같은 년이 수절한다고 관장에게 포악하였으니 살기를 바랄쏘냐.”","meaning":"이 구절의 상황: 몽룡은 자신의 정체를 밝히기 전 춘향의 마음을 시험하는 질문을 한다.","analysis":"몽룡은 자신의 정체를 밝히기 전 춘향의 마음을 시험하는 질문을 한다. 이 순간 춘향은 또다시 부당한 권력 앞에 놓인 듯 보인다."},{"label":"자연물과 절개의 비유","reference":"“층암절벽 높은 바위가 바람 분들 무너지며, 청송녹죽(靑松綠竹) 푸른 나무가 눈이 온들 변하리까.”","meaning":"이 구절의 상황: 바위의 굳셈과 사철 푸른 소나무·대나무를 춘향의 변치 않는 절개에 견준다.","analysis":"바위의 굳셈과 사철 푸른 소나무·대나무를 춘향의 변치 않는 절개에 견준다. 물음 형식이지만 굴복하지 않겠다는 뜻의 설의다."},{"label":"신분 공개와 극적 반전","reference":"“얼굴 들어 나를 보라.”","meaning":"이 구절의 상황: 걸인이었던 인물이 어사또 몽룡임을 알게 되는 순간, 춘향에게는 죽음의 위기가 기쁨으로 반전된다.","analysis":"걸인이었던 인물이 어사또 몽룡임을 알게 되는 순간, 춘향에게는 죽음의 위기가 기쁨으로 반전된다."},{"label":"계절의 대비","reference":"“남원 읍내 가을이 들어 떨어지게 되었더니, 객사에 봄이 들어 이화춘풍(李花春風) 날 살린다.”","meaning":"이 구절의 상황: 가을·낙엽은 고난과 절망, 봄·꽃 피는 바람은 구원과 소생을 나타낸다.","analysis":"가을·낙엽은 고난과 절망, 봄·꽃 피는 바람은 구원과 소생을 나타낸다. 계절 이미지가 정서 변화를 형상화한다."},{"label":"해학과 비애가 겹치는 재회","reference":"“반웃음 반 울음에,”","meaning":"이 구절의 상황: 기쁨과 눈물이 교차하는 춘향의 감정.","analysis":"기쁨과 눈물이 교차하는 춘향의 감정. 고난 끝에 맞는 재회의 감격을 압축적으로 드러낸다."},{"label":"영귀와 이별의 양가감정","reference":"“영귀(榮貴)하게 되었건만 고향을 이별하니 일희일비(一喜一悲)가 아니 되랴.”","meaning":"이 구절의 상황: 높은 지위를 얻은 기쁨과 정든 고향을 떠나는 슬픔이 공존한다.","analysis":"높은 지위를 얻은 기쁨과 정든 고향을 떠나는 슬픔이 공존한다. 기쁨 일색이 아닌 복합적인 감정을 보여 준다."},{"label":"고향에 대한 작별","reference":"“놀고 자던 부용당아. 너 부디 잘 있거라.”","meaning":"이 구절의 상황: 생활 공간을 의인화해 부르는 방식으로 고향에 대한 애착을 드러낸다.","analysis":"생활 공간을 의인화해 부르는 방식으로 고향에 대한 애착을 드러낸다. 삽입된 운문 형식이 판소리계 소설의 음악성을 보여 준다."},{"label":"정렬부인 책봉과 결말","reference":"“춘향으로 정렬부인을 봉하신다.”","meaning":"이 구절의 상황: 춘향의 정절에 사회적 보상이 주어진다.","analysis":"춘향의 정절에 사회적 보상이 주어진다. 선한 인물의 행복과 부패 관리의 징벌이 대비되어 권선징악을 완성한다."},{"label":"백년동락과 가문 번영","reference":"“정렬부인으로 더불어 백년동락(百年同樂)할새”","meaning":"이 구절의 상황: 오랫동안 함께 복되게 살아간다는 이상적 결말이며, 판소리계 고전 소설의 행복한 결말 경향을 보여 준다.","analysis":"오랫동안 함께 복되게 살아간다는 이상적 결말이며, 판소리계 고전 소설의 행복한 결말 경향을 보여 준다."}],"sourceContext":"사용자가 직접 입력한 미래엔 교과서 「춘향전」 발췌 본문을 전체 반영했습니다. 앞부분 줄거리와 잔치·차운 한시·출두·춘향의 정절·재회·결말까지 원래 순서로 수록했습니다.","originalModern":"","alignedLines":null,"isExcerpt":true,"copyrighted":false,"hanjaWords":[{"hanja":"金樽美酒","reading":"금준미주","meaning":"금잔에 담긴 좋은 술"},{"hanja":"千人血","reading":"천인혈","meaning":"백성의 피"},{"hanja":"玉盤佳肴","reading":"옥반가효","meaning":"옥쟁반의 좋은 안주"},{"hanja":"萬姓膏","reading":"만성고","meaning":"백성의 기름"},{"hanja":"燭淚落時","reading":"촉루낙시","meaning":"촛농이 떨어질 때"},{"hanja":"民淚落","reading":"민루낙","meaning":"백성의 눈물도 떨어짐"},{"hanja":"歌聲高處","reading":"가성고처","meaning":"노랫소리가 높은 곳"},{"hanja":"怨聲高","reading":"원성고","meaning":"원망 소리도 높음"},{"hanja":"封庫罷職","reading":"봉고파직","meaning":"관아의 창고를 봉하고 파면함"}],"id":"w11","poem":false,"textStatus":"사용자 제공 교과서 발췌"},{"group":"소설","title":"사씨남정기","author":"김만중","genre":"가정 소설·국문 고전 소설","theme":"선과 악의 대립, 가정 내 갈등과 권선징악","summary":"사 씨는 꿈에서 왕비의 말을 듣고 황릉묘에서 꿈이 사실과 연결됨을 확인한다. 관음보살의 계시를 받은 여승과 여동이 그녀를 구한다. 한편 유연수는 아내를 의심한 일을 뉘우치고, 신비로운 샘물로 병에서 회복한다.","structure":"왕비의 예언 → 꿈에서 깸 → 황릉묘 확인 → 여승·여동의 구원 → (중략) → 유배지의 유연수 반성 → 노파의 꿈 → 샘 발견·회복·학사정 유래. 두 인물의 구원담이 병렬적으로 대응한다.","grammar":"고전 소설의 현대어 발췌. 대화문은 따옴표와 문답으로 인물의 성격 및 상황을 드러낸다. “어찌 … 하리오”, “무슨 면목으로 … 대하리오” 등의 의문은 설의적 효과를 만든다. 꿈에서의 비현실적 사건이 현실로 이어지는 전기적 구성, 3인칭 서술자의 사건 전달, 인물의 직접 발화를 구분한다.","emotion":"사 씨: 불안·슬픔 → 놀라움·희망 / 유연수: 고통·후회 → 안도·회복","devices":"꿈과 현실의 교차, 반복되는 초월적 조력, 왕비·관음보살·노파의 개입, 황릉묘·학사정 등 공간에 남는 기적의 흔적, 사 씨와 유연수의 대응 구조. 선인에 대한 구원과 잘못을 뉘우치는 인물의 회복을 강조한다.","compare":"","note":"유한림·사씨·교씨 인물 관계를 중심으로 읽기.","intro":"제공 본문은 사 씨가 꿈에서 두 왕비의 인도를 받고 위기에서 구원되는 과정과, 유배 중인 유연수가 꿈에 나타난 노파의 도움으로 병에서 회복되는 과정을 교차하여 제시한다.","units":[{"label":"① 왕비의 예언과 사 씨의 염려","original":"“남해 도인이 그대와 인연이 있으니 잠깐 의탁하게 될 것이오.”","meaning":"왕비는 사 씨가 곧 도움을 받을 것이라고 예고하지만, 사 씨는 배와 돈이 없어 남해로 갈 수 없다고 걱정한다.","analysis":"왕비의 예언은 뒤에 여승과 여동이 찾아오는 사건을 미리 암시한다. 현실의 곤경과 초월적 구원의 대비가 시작된다."},{"label":"② 꿈에서 깨어난 사 씨","original":"“내가 어디 갔다 왔느냐?”","meaning":"사 씨는 왕비와 만났다고 믿지만, 유모와 시비는 사 씨가 기절해 있었다고 말한다.","analysis":"사 씨의 체험은 꿈과 현실의 경계에 놓인다. 향기가 남고 말이 또렷이 기억되는 감각적 세부가 꿈의 진실성을 강조한다."},{"label":"③ 황릉묘에서 확인한 꿈","original":"“분명히 저 길로 갔다 왔으니 어찌 꿈이라 하리오.”","meaning":"사 씨는 대숲 뒤에서 꿈속에서 본 황릉묘와 두 왕비의 초상화를 발견하고 감사의 예를 올린다.","analysis":"실제 사당과 초상화가 꿈에서 본 모습과 일치한다. 비현실적 사건이 이후 현실에서 증명되는 고전소설의 전기적 전개이다."},{"label":"④ 위기에서 나타난 여승과 여동","original":"“관음보살께서 어진 여자가 화를 만나 … 황릉묘로 가서 구하라고 하셨습니다.”","meaning":"갈 곳을 잃은 사 씨에게 여승과 여동이 찾아와 관음보살의 꿈을 보고 구하러 왔다고 밝힌다.","analysis":"앞의 왕비 예언이 실제 구원자로 실현된다. 사 씨의 선함에 초월적 존재가 응답하는 방식으로 권선징악의 기대를 형성한다."},{"label":"⑤ 유연수의 유배와 후회","original":"“어진 아내를 의심했으니 무슨 면목으로 조상을 대하리오.”","meaning":"유배지의 고통을 겪던 유연수는 동청을 경계하던 사 씨의 말이 옳았음을 깨닫고 잘못을 뉘우친다.","analysis":"유연수의 생각이 전환되는 핵심 발화이다. 작품의 유교적 윤리관과 사 씨의 정당성 회복 가능성이 함께 드러난다."},{"label":"⑥ 꿈속 노파와 우연처럼 나타난 샘","original":"“나는 동정 군산에 사는 사람이로다.”","meaning":"유연수는 꿈에서 노파에게 병을 고칠 물을 받는다. 깨어난 뒤 꿈속 노파가 병을 둔 자리에 실제 샘이 솟는다.","analysis":"앞부분 사 씨의 꿈과 구조적으로 대응한다. 두 인물 모두 초월적 존재의 도움을 받으며 꿈속 메시지가 현실 사건으로 실현된다."},{"label":"⑦ 회복과 학사정의 유래","original":"“뜰에서 물이 솟아나옵니다.”","meaning":"유연수는 샘물을 마시고 병에서 회복한다. 마을 사람들도 그 샘물을 마시며 물로 인한 병을 피하고, 샘은 학사정으로 불리게 된다.","analysis":"샘의 효험을 여러 사람이 공유하는 결과까지 보여 준다. 이야기 속 기적의 흔적을 지명·유래로 연결하는 설명이 결말에 놓인다."}],"vocab":"남해 도인: 남해에 있는 수양한 사람 또는 구원자로 예고된 존재. 주렴: 발 형태로 드리우는 가리개. 유모: 어린아이를 보살피던 여성. 시비: 곁에서 시중드는 여성. 황릉묘: 아황과 여영을 모시는 사당. 분향: 향을 피워 예를 올림. 여승: 여성 승려. 동정 군산: 동정호에 있는 군산으로 인물의 거처와 연결됨. 유배: 죄인을 먼 곳으로 보내는 형벌. 학사정: 유연수가 회복된 샘에 붙은 이름.","point":"① 왕비의 예언은 뒤의 구원자 출현을 예고한다. ② 황릉묘와 초상화는 꿈의 실재감을 높인다. ③ 관음보살과 노파의 도움은 전기적 요소다. ④ 유연수는 사 씨를 의심한 과거를 뉘우친다. ⑤ 병이 낫는 샘의 이름이 학사정인 이유를 설명한다. ⑥ 사 씨와 유연수의 초월적 구원은 대응 구조다.","pitfalls":"이 본문은 사용자가 제공한 현대어 편집 발췌문이며 17세기 원전의 한글 표기를 그대로 옮긴 것이 아니다. 유연수의 회복을 사 씨가 직접 치료한 결과로 혼동하지 말 것. 꿈의 사건과 현실의 사건을 구분해 근거를 제시할 것.","original":"왕비가 웃으며 말했다.\n“부인이 이곳에 오긴 오겠지만 아직 때가 멀었소. 남해 도인이 그대와 인연이 있으니 잠깐 의탁하게 될 것이오. 이 또한 하늘의 뜻이니라.”\n사 씨가 여쭈었다. “남해라면 바다 끝으로 알고 있사옵니다. 첩에게는 탈 것이 없고 돈도 없는데 어찌 갈 수 있겠나이까?”\n왕비가 말했다.\n“조만간 길을 인도하는 자가 있을 것이니 조금도 염려 마라.”\n이윽고 좌우에 앉아 있는 부인들을 하나하나 소개했다. 위국 부인 장강*, 한나라의 반첩여* 등이 있었다. 사 씨가 다소곳이 일어나 머리를 조아리고 말했다.\n“뜻밖에도 모든 부인님의 얼굴을 오늘 뵙게 되니 크나큰 영광입니다.”\n드디어 하직을 하고 여동의 인도를 받아 내려오는데, 걸었던 주렴을 내리는 소리가 요란하다. 이 소리에 놀라 몸을 일으키니 유모와 시비가 부인이 깨신다 하고 부르기를 사 씨가 일어나 앉으니 이미 날이 저물었다. 멍한 정신이 한참만에야 진정되었다. 입에서는 향기로운 냄새가 났고 왕비께서 하시던 말이 뚜렷했다. 유모에게 물었다.\n“내가 어디 갔다 왔느냐?”\n유모와 시비가 답했다.\n“부인께서 기절하는 바람에 소인들이 간호하여 이제야 깨어 나셨는데 어디를 가셨단 말입니까?”\n사 씨가 조금 전에 있었던 일을 다 말하고 대나무 수풀을 가리키며 말했다.\n“분명히 저 길로 갔다 왔으니 어찌 꿈이라 하리오. 믿지 못 하겠다면 나를 따라오라.”\n그러고는 길을 찾아 나무 수풀 뒤쪽으로 가니 사당이 하나 있었다. 현판이 걸려 있는데 황릉묘라고 쓰여 있었다. 분명 아황과 여영, 두 왕비의 묘로 꿈에서 본 것과 같았다. 사당 안으로 들어가 살펴보니 두 왕비의 초상화가 걸려 있는데 꿈에서 본 것과 같았다. 이에 사 씨가 향을 피우고 하며 말했다.\n“첩이 왕비의 가르치심을 입어 훗날 좋은 시절을 만나서 영화를 누리게 된다면 어찌 그 은혜를 잊으리까?”\n분향을 마친 후 앉아서 신세를 생각하니 슬픔이 밀려왔다. 시비를 시켜 묘지기 집에 가서 밥을 구해 와서는 세 사람이 나누어 먹었다. 이윽고 사 씨가 말했다.\n“의지할 곳이 없으니 신령이 나를 놀리시는구나.”\n앞길이 막막하여 어쩔 줄 모르는 중 벌써 달이 밝았다. 세 사람이 방황하고 있는데 묘문으로 두 사람이 들어와 물었다.\n“어려움을 만나 물에 빠지려 하시는 부인이 아니옵니까?”\n사 씨가 눈을 들어 자세히 보니 한 명은 여승이고 다른 한 명은 여동이었다. 크게 놀라며 말했다.\n“어찌 우리를 아는가?”\n여승이 합장하고 말했다.\n“우리는 동정 군산에 사는 사람인데 조금 전 꿈결에 관음보살께서 어진 여자가 화를 만나 날이 저물어 갈 곳을 몰라 방황하니 급히 황릉묘로 가서 구하라고 하셨습니다. 이에 배를 저어 와서 부인을 만나게 되었습니다.”\n(중략)\n한편 한림학사 유연수는 유배지에 도착하니 바람이 거세고 인심이 사나워 갖은 고초를 겪게 되었다. 외로운 가운데 이러한 고생을 하니 예전의 총명함이 돌아와 뉘우치며 말했다.\n“사 씨가 동청을 꺼렸는데 이제 와서 생각하니 그 말이 옳도다. 어진 아내를 의심했으니 무슨 면목으로 조상을 대하리오.”\n밤낮 이런 생각을 하면서 탄식하니 병에 걸리고 말았다. 이곳에는 마땅한 의약이 없었다. 병세는 날로 심해져 죽을 지경에 이르렀다. 하루는 흰 옷 입은 노파가 병을 들고 와서 말했다.\n“상공의 병이 위독하니 이 물을 먹으면 좋아지리라.”\n한림이 물었다.\n“그대는 누구인데 유배당한 사람의 병을 구하시오?”\n노파가 말했다.\n“나는 동정 군산에 사는 사람이로다.”\n그러고는 병을 뜰 가운데 놓고 사라졌다. 한림이 놀라 일어나니 꿈이었다. 이상하게 생각했는데 다음 날 아침 하인이 뜰을 청소하다가 들어와 고했다.\n“뜰에서 물이 솟아나옵니다.”\n한림이 이상하게 여겨 창을 열고 보니 꿈에 노파가 병을 놓았던 자리다. 물을 한 그릇 떠오라고 해서 마시니 맛이 달고 상쾌한 것이 마치 단 이슬을 먹은 것 같았다. 원래 행주는 수질이 좋지 않은 곳이다. 한림의 병도 그게 좋지 않은 물 때문에 생긴 것이었다. 그런데 이 물을 먹은 즉시 병세가 사라지고 예전의 얼굴과 기력을 회복하였다. 그것을 본 사람들이 모두 신기하게 여겼다. 이후로도 그 샘은 마르지 않아 마을 사람들이 나누어 마셨다. 이로 인해 물로 인한 병이 없어지자 사람들이 그 샘을 학사정이라고 하였는데 지금까지 전해진다.","source":"https://ko.wikisource.org/wiki/%EC%83%89%EC%9D%B8:%EC%82%AC%EC%94%A8%EB%82%A8%EC%A0%95%EA%B8%B0_1.pdf","originalNote":"사용자가 직접 제공한 「사씨남정기」 현대어 교과서 발췌문입니다. 오탈자와 문장부호를 임의로 고치지 않고 그대로 옮겼습니다. 옛한글 원전과는 구별하세요. (중략) 표시도 제공된 본문을 따릅니다.","lineGuides":[{"label":"왕비가 말한 남해 도인","reference":"“남해 도인이 그대와 인연이 있으니 잠깐 의탁하게 될 것이오.”","meaning":"이후 사 씨를 구해 줄 인연이 이미 정해져 있다는 뜻이다.","analysis":"앞으로 나타날 구원자를 예고하는 복선. 왕비의 말에는 천명 의식이 드러난다."},{"label":"사 씨의 현실적 한계","reference":"“첩에게는 탈 것이 없고 돈도 없는데 어찌 갈 수 있겠나이까?”","meaning":"사 씨는 도움을 받으러 떠날 여건조차 없는 절박한 상태다.","analysis":"설의적 의문으로 자신의 처지를 강조하며 현실적 곤경을 제시한다."},{"label":"예언의 반복","reference":"“조만간 길을 인도하는 자가 있을 것이니 조금도 염려 마라.”","meaning":"길을 안내할 사람이 곧 나타난다는 약속이다.","analysis":"뒤에 나타날 여승·여동과 연결하여 이해해야 한다."},{"label":"꿈과 현실의 인식 차이","reference":"“부인께서 기절하는 바람에 소인들이 간호하여 이제야 깨어 나셨는데 어디를 가셨단 말입니까?”","meaning":"사 씨는 영적 체험을 했지만 주변 사람들은 육체적 실신으로 인식한다.","analysis":"꿈/현실 경계와 서술의 긴장을 조성한다."},{"label":"황릉묘가 뜻하는 것","reference":"“분명히 저 길로 갔다 왔으니 어찌 꿈이라 하리오.”","meaning":"자신이 보았던 장면의 근거가 현실에 존재한다고 사 씨가 주장한다.","analysis":"황릉묘와 두 왕비 초상은 비현실적인 꿈의 진실성을 확인하는 장치로 기능한다."},{"label":"은혜에 대한 다짐","reference":"“어찌 그 은혜를 잊으리까?”","meaning":"왕비의 가르침에 감사하며 은혜를 잊지 않겠다는 뜻이다.","analysis":"의문형이지만 실제 의미는 강한 부정(잊지 않겠다)인 설의적 표현이다."},{"label":"사 씨의 절망","reference":"“의지할 곳이 없으니 신령이 나를 놀리시는구나.”","meaning":"도움을 받았다고 생각해도 당장 갈 곳이 없어 절망한다.","analysis":"구원의 예고와 현실의 무력한 처지를 대비하여 여승 등장 직전 긴장감을 높인다."},{"label":"관음보살의 구원","reference":"“급히 황릉묘로 가서 구하라고 하셨습니다.”","meaning":"여승 일행의 출현은 관음보살의 지시 때문이라고 설명된다.","analysis":"불교적 초월 세계가 실제 서사에 개입한다. 꿈을 통한 예고와 실현 구조에 주목한다."},{"label":"유연수의 반성과 갈등 해소 단서","reference":"“사 씨가 동청을 꺼렸는데 이제 와서 생각하니 그 말이 옳도다.”","meaning":"유연수가 뒤늦게 사 씨의 판단이 옳았음을 인정한다.","analysis":"이전의 오판을 뒤집는 자각으로, 인물의 내적 변화가 분명하게 드러난다."},{"label":"자책과 유교적 가치관","reference":"“어진 아내를 의심했으니 무슨 면목으로 조상을 대하리오.”","meaning":"아내를 의심한 자신의 잘못을 조상에게 부끄러워한다.","analysis":"조상에 대한 도리를 거론하여 유교적 가족 윤리 속에서 자신의 잘못을 판단한다."},{"label":"두 인물의 꿈이 대응함","reference":"“나는 동정 군산에 사는 사람이로다.”","meaning":"노파가 자신을 동정 군산에서 온 존재라고 밝힌다.","analysis":"사 씨를 도우러 왔다는 여승의 거처와 연결된다. 두 구원 사건의 공간적 연결고리이다."},{"label":"현실로 실현된 꿈","reference":"“뜰에서 물이 솟아나옵니다.”","meaning":"꿈에서 병을 둔 자리에 실제 샘이 생긴다.","analysis":"전기성(비현실적·기이한 사건)을 대표하는 대목이다."},{"label":"물의 상징적 기능","reference":"“이 물을 먹은 즉시 병세가 사라지고 예전의 얼굴과 기력을 회복하였다.”","meaning":"샘물은 유연수의 병을 치료하여 회복을 가져온다.","analysis":"병과 회복의 사건 배열은 인물의 내적 반성과 함께 회복의 의미를 부각한다."},{"label":"학사정 유래 설명","reference":"“사람들이 그 샘을 학사정이라고 하였는데 지금까지 전해진다.”","meaning":"이야기는 신비한 샘에 붙은 이름의 유래를 설명하며 마무리된다.","analysis":"고전 산문에서 흔히 보이는 사물·지명 유래담적 결말이다."}],"detailNotice":"사용자가 제공한 본문에서 14개의 문장·발화를 선택하여 바로 아래에서 의미와 표현 효과를 확인할 수 있습니다.","sourceContext":"사용자가 직접 입력한 교과서 발췌 본문 전문을 수록했습니다. 앞부분은 사 씨의 꿈·황릉묘·구원, 뒤는 유연수의 유배·후회·학사정 이야기입니다. 앞서 있던 줄거리 대체 텍스트가 아니라 실제 입력된 발췌 본문입니다.","hanjaWords":[],"id":"w12","poem":false,"textStatus":"사용자 제공 교과서 발췌"},{"group":"소설","title":"봄봄","author":"김유정","genre":"현대 단편 소설","theme":"데릴사위의 노동 착취와 순박한 인물의 갈등을 해학적으로 드러냄","summary":"‘나’는 점순과 결혼하기로 하고 일하지만 장인은 혼인을 미루며 일을 시킨다. 점순의 부추김에 ‘나’가 장인에게 맞서나 결말은 우스꽝스럽게 흐른다.","structure":"혼인 지연 항의 → 장인과 물리적 실랑이 → 장인의 폭력과 ‘나’의 반격 → 상처 치료와 혼인 약속의 반복 → ‘나’의 감사라는 아이러니","grammar":"1인칭 주인공 시점(‘나’). 농촌 구어체와 방언(성례, 빙장님, 갈엔, 하지유 등), 의성·의태어의 반복, 직접 인용된 대화, 주인공의 제한된 인식과 독자가 아는 상황의 차이.","emotion":"분노·억울함 → 두려움·모욕감 → 다시 기대·감사(독자에게는 해학·씁쓸함)","devices":"서술자의 순진한 자기 합리화, 발화 반복과 방언, 과장된 몸짓, 장인의 호의와 노동 명령이 공존하는 상황적 아이러니, 인물 인식과 독자 인식의 차이.","compare":"「춘향전」의 풍자는 부패한 권력자에 대한 비판이고, 「봄·봄」의 해학은 순박한 인물에 대한 애정과 연민이 있는 웃음이다.","note":"작중 ‘나’의 제한된 이해와 독자가 파악하는 상황의 차이가 핵심.","intro":"혼인을 미루고 일만 시키는 장인에게 ‘나’가 항의하다가 서로 바짓가랑이를 잡고 다투는 대목이다. 장인에게 매를 맞고도 다시 혼인 약속을 듣고 고마워하는 ‘나’의 말은 독자가 인식하는 현실과 어긋나 해학과 아이러니를 형성한다.","units":[{"label":"갈등 발단 · 성례 요구","meaning":"‘나’는 장인에게 혼인을 시켜 주지 않고 노동만 시킨다며 따진다.","analysis":"혼인 약속을 노동의 대가로 이용하는 장인의 태도와 ‘나’의 억울함이 드러난다. 방언과 구어체가 인물의 성격을 생생하게 표현한다.","original":"“부려만 먹구 왜 성례 안 하지유!”"},{"label":"실랑이 · 장인의 행동","meaning":"장인이 ‘나’의 바짓가랑이를 붙잡고 격렬하게 다툰다.","analysis":"헐떡헐떡·허둥지둥 등 반복 표현, 호칭의 변화와 과장된 행동으로 웃음과 긴장을 동시에 만든다.","original":"“빙장님! 빙장님! 빙장님!”\n“아! 아! 할아버지! 살려 줍쇼, 할아버지!”"},{"label":"맞대응 · 감정의 역전","meaning":"‘나’도 장인의 바짓가랑이를 잡아당겼다가 결국 맞는다.","analysis":"처음에는 장인을 더럽다고 원망하나 곧 착하다고 평가하는 심리 전환이 등장한다. 독자와 서술자의 해석 차이에 주목한다.","original":"더럽다 더럽다. 이게 장인님인가."},{"label":"결말 · 다시 미뤄진 혼인","meaning":"장인이 상처를 돌봐 주고 가을에 성례를 시켜 주겠다고 말한 다음 콩밭을 갈게 한다. ‘나’는 감격하여 운다.","analysis":"혼인 문제가 여전히 해결되지 않았는데도 주인공은 감동한다. 신뢰하기 어려운 순진한 서술, 상황적 아이러니와 노동 착취에 대한 간접적 풍자가 함께 나타난다.","original":"“올 갈엔 꼭 성례를 시켜 주마. 암말 말구 가서 뒷골의 콩밭이나 얼른 갈아라.”\n나는 장인님이 너무나 고마워서 어느덧 눈물까지 났다."}],"vocab":"성례: 혼례를 치르는 일 / 빙장님: 장인에 대한 높임 호칭 / 사경: 노동한 대가로 받는 품삯·돈 / 히연 한 봉: 인용 본문에 등장하는 약·물품 명칭(판본·표기 대조 권장) / 갈엔: 가을에는 / 뒷골의 콩밭: 노동을 시키는 구체적 장소","point":"장인이 매를 때리고 다시 일을 시키는데도 화자가 “고맙다”고 평가하는 모순이 핵심이다. 서술자=작가의 평가로 해석하지 말고 독자가 읽어 내는 아이러니를 분석하자.","pitfalls":"「봄·봄」 전체 줄거리와 이번에 제공한 발췌문을 구분할 것. ‘나’가 장인을 착하다고 생각한다고 해서 작품이 장인의 착취를 정당화하는 것은 아니다.","original":"“부려만 먹구 왜 성례 안 하지유!”\n나는 이렇게 호령했다. 하지만 장인님이 선뜻 오냐 낼이라두 성례시켜 주마,\n했으면 나도 성가신 걸 그만두었을지 모른다. 나야 이러면 때린 건 아니니까 나\n중에 장인 쳤다는 누명도 안 들을 터이고 얼마든지 해도 좋다.\n한번은 장인님이 헐떡헐떡 기어서 올라오더니 내 바짓가랑이를 요렇게 노리\n고서 단박 움켜잡고 내달렸다. 악, 소리를 치고 나는 그만 세상이 다 팽그르 도\n는 것이\n“빙장님! 빙장님! 빙장님!”\n“이 자식! 잡아먹어라, 잡아먹어!”\n“아! 아! 할아버지! 살려 줍쇼, 할아버지!”\n하고 두 팔을 허둥지둥 내저을 적에는 이마에 진땀이 쭉 내솟고 인젠 참으로 죽\n나 보다 했다. 그래도 장인님은 놓질 않더니 내가 기어\n이 땅바닥에 쓰러져서 거의 까무러치게 되니까 놓는다.\n더럽다 더럽다. 이게 장인님인가.\n나는 한참을 못 일어나고 쩔쩔맸다. 그렇게 얼굴을 드\n니(눈에 참 아무것도 보이지 않았다.) 사지가 부르르 떨\n리면서 나도 엉금엉금 기어가 장인님의 바짓가랑이를\n꽉 움키고 잡아낚았다.\n내가 머리가 터지도록 매를 얻어맞은 것이 이 때문이\n다. 그러나 여기가 또한 우리 장인님이 유달리 착한 곳\n이다. 여느 사람이면 사경을 주어서라도 당장 내쫓았지 터진 머리를 불솜으로\n손수 지져 주고, 호주머니에 히연 한 봉을 넣어 주고 그리고\n“올 갈엔 꼭 성례를 시켜 주마. 암말 말구 가서 뒷골의 콩밭이나 얼른 갈아라.”\n하고 등을 뚜덕여 줄 사람이 누구냐.\n나는 장인님이 너무나 고마워서 어느덧 눈물까지 났다.","source":"","originalNote":"사용자가 채팅으로 제공한 「봄·봄」 교과서 발췌문입니다. 원본 입력의 단어·대사·문장부호와 줄바꿈을 수정 없이 보존했습니다. 소설 전체 전문이 아닙니다.","detailNotice":"제공된 본문에서 대화와 사건 전환의 핵심 표현 12곳을 골라 문장별 의미·서술자 인식·해학을 설명했습니다.","lineGuides":[{"label":"혼인 요구","reference":"“부려만 먹구 왜 성례 안 하지유!”","meaning":"‘나’가 장인에게 혼인 약속을 지키지 않는 이유를 따진다.","analysis":"이 작품의 갈등이 노동 제공과 혼인 지연의 불공정한 관계에서 비롯됨을 직접 보여 준다. 방언과 입말이 생생하다."},{"label":"서술자의 계산","reference":"나야 이러면 때린 건 아니니까","meaning":"장인을 때린 것이 아니라 말로 따지는 것이므로 문제가 없다고 생각한다.","analysis":"1인칭 주인공 서술자의 자기 합리화이며 그가 사건을 자기중심적으로 파악함을 보여 준다."},{"label":"장인의 반격","reference":"내 바짓가랑이를 요렇게 노리고서 단박 움켜잡고 내달렸다.","meaning":"장인이 바짓가랑이를 붙잡고 갑작스레 공격한다.","analysis":"동작의 연속, 의태어, 과장된 상황 제시가 희극적 효과와 긴장감을 함께 낳는다."},{"label":"되풀이되는 호칭","reference":"“빙장님! 빙장님! 빙장님!”","meaning":"‘나’가 장인을 거듭 부르며 다급하게 사정을 호소한다.","analysis":"호칭의 반복으로 공포와 당황을 드러내며 독자에게 해학적인 인상을 준다."},{"label":"호칭의 급변","reference":"“아! 아! 할아버지! 살려 줍쇼, 할아버지!”","meaning":"원래 부르던 ‘빙장님’에서 ‘할아버지’로 호칭이 바뀐다.","analysis":"목숨이 위태롭다고 여긴 순간 살려 달라고 외친다. 화자의 순진하고 우스꽝스러운 반응이 부각된다."},{"label":"감정의 반전","reference":"더럽다 더럽다. 이게 장인님인가.","meaning":"고통을 겪은 뒤 장인을 원망한다.","analysis":"같은 어휘의 반복으로 분노와 혐오를 강조하며, 뒤이어 나타나는 감사와 뚜렷하게 대비된다."},{"label":"복수의 행동","reference":"장인님의 바짓가랑이를 꽉 움키고 잡아낚았다.","meaning":"‘나’ 역시 장인의 바짓가랑이를 잡아당겨 맞선다.","analysis":"장인의 행동을 되돌려 주는 반복 구조로 충돌이 이어지고, 서술자의 ‘나는 때리지 않았다’는 자기인식과도 긴장 관계가 생긴다."},{"label":"억울함의 서술","reference":"내가 머리가 터지도록 매를 얻어맞은 것이 이 때문이다.","meaning":"결국 ‘나’가 심하게 매를 맞았다고 설명한다.","analysis":"서술자는 자신의 행동이 불러온 결과를 이야기하면서도 주로 억울함을 강조한다. 독자가 서술자와 일정한 거리를 두고 판단하게 한다."},{"label":"자기모순적 평가","reference":"그러나 여기가 또한 우리 장인님이 유달리 착한 곳이다.","meaning":"방금 자신을 때린 장인을 오히려 착한 사람이라 평가한다.","analysis":"인물의 진술과 실제 행동의 불일치가 상황적 아이러니를 만든다. 무조건 선량한 장인이라는 뜻은 아니다."},{"label":"달래는 행위","reference":"터진 머리를 불솜으로 손수 지져 주고,","meaning":"장인이 ‘나’의 다친 곳을 손수 돌봐 준다.","analysis":"폭력 이후 베푸는 호의로 주인공의 판단이 흔들리는 장면이다. 화자의 감사를 독자가 그대로 받아들이지 않도록 주의한다."},{"label":"혼인 약속 반복","reference":"“올 갈엔 꼭 성례를 시켜 주마. 암말 말구 가서 뒷골의 콩밭이나 얼른 갈아라.”","meaning":"장인이 결혼을 가을로 또 미루고 당장 밭일을 하라고 명령한다.","analysis":"혼인을 노동의 대가로 이용하는 불합리한 관계가 해결되지 않은 채 되풀이된다. 갈등의 순환성이 보인다."},{"label":"마지막 아이러니","reference":"나는 장인님이 너무나 고마워서 어느덧 눈물까지 났다.","meaning":"‘나’는 장인의 말과 작은 배려에 진심으로 감동한다.","analysis":"독자는 여전히 노동 착취가 계속된다는 것을 알아차리지만 ‘나’는 이를 제대로 보지 못한다. 서술자와 독자의 인식 차이가 해학을 완성한다."}],"sourceContext":"사용자가 제공한 「봄·봄」 발췌문을 그대로 적용. 장인과 ‘나’의 실랑이, 반복되는 혼인 약속, 마지막 감사의 아이러니를 중심으로 분석.","originalModern":"","alignedLines":null,"isExcerpt":true,"hanjaWords":[],"id":"w13","poem":false,"textStatus":"사용자 제공 교과서 발췌"},{"group":"외부 지문","title":"정과정","author":"정서","genre":"고려 가요","theme":"임금에 대한 충절과 결백의 호소","summary":"「정과정곡」과 같은 작품의 약칭이다. 억울한 유배 상황에서 임의 신뢰를 되찾고자 한다.","structure":"원망 → 결백 호소 → 귀환 소망","grammar":"호소·영탄 표현, 고전 어휘 해독.","emotion":"원망·충절","devices":"직접 호소·반복","compare":"교과 작품 「정과정곡」과 동일 작품","note":"중복 텍스트가 아니라 별도 비교 탭으로 제공.","intro":"유배당한 정서가 임금에 대한 충성·결백을 호소하는 고려 가요다. 「정과정」과 동일 작품.","units":[{"label":"첫 부분: 그리움과 울음","meaning":"임을 그리워하며 눈물을 흘린다. 산의 접동새와 같은 자신의 처지를 호소한다.","analysis":"접동새는 슬픈 울음의 상징. 화자의 처지를 자연물과 견주며 애상적 분위기를 조성한다.","original":"내 님믈 그리ᅀᆞ와 우니다니\n山 졉동새 난 이슷ᄒᆞ요이다"},{"label":"중간: 결백의 근거","meaning":"자신에게 씌워진 죄는 사실이 아니며 하늘의 달과 새벽별이 그 결백을 알고 있을 것이라고 주장한다.","analysis":"잔월효성은 화자의 결백을 증언해 줄 대상으로 제시된다. 하늘의 자연물은 객관적 증인의 상징으로 기능한다.","original":"아니시며 거츠르신 ᄃᆞᆯ 아으\n殘月曉星이 아ᄅᆞ시리이다"},{"label":"후반: 모함을 원망","meaning":"자기에게 잘못이 없는데 누군가 헐뜯는 말로 임과의 관계가 끊어졌음을 호소한다.","analysis":"남의 말을 원망하는 부분과 임금에 대한 태도를 구별해야 한다. 결백을 밝힌다는 뜻이 임에 대한 충성을 버렸다는 뜻은 아니다.","original":"넉시라도 님은 ᄒᆞᆫᄃᆡ 녀져라 아으\n벼기더시니 뉘러시니잇가\n過도 허믈도 千萬 업소이다\nᄆᆞᆯ힛마리신뎌\nᄉᆞᆯ읏븐뎌 아으"},{"label":"결말: 돌아봐 주기를","meaning":"임이 자신의 말을 들어 다시 사랑해 주기를 청한다.","analysis":"명령처럼 보이는 끝맺음은 임에 대한 절절한 청원이다. 개인적 서러움과 정치적 충절이 동시에 드러난다.","original":"니미 나ᄅᆞᆯ 하마 니ᄌᆞ시니잇가\n아소 님하 도람 드르샤 괴오쇼셔"}],"vocab":"님: 고려 왕 / 접동새: 슬픈 화자의 분신 / 殘月曉星: 지는 달과 새벽별 / 넉시라도: 넋이라도 / 하마: 이미·벌써 / 아소: 감탄·환기의 표현","point":"고려가요이면서 향가 10구체 전통과 연결되는 사례. 반복된 ‘아으’ 등 여음도 주목.","pitfalls":"‘말힛마리’ 등은 학자별 해석 차이가 있음. 단어 하나의 뜻을 유일한 정답처럼 강요하지 말 것.","original":"내 님믈 그리ᅀᆞ와 우니다니\n山 졉동새 난 이슷ᄒᆞ요이다\n아니시며 거츠르신 ᄃᆞᆯ 아으\n殘月曉星이 아ᄅᆞ시리이다\n넉시라도 님은 ᄒᆞᆫᄃᆡ 녀져라 아으\n벼기더시니 뉘러시니잇가\n過도 허믈도 千萬 업소이다\nᄆᆞᆯ힛마리신뎌\nᄉᆞᆯ읏븐뎌 아으\n니미 나ᄅᆞᆯ 하마 니ᄌᆞ시니잇가\n아소 님하 도람 드르샤 괴오쇼셔","source":"https://ko.wikisource.org/wiki/정과정","originalNote":"분장 표시는 생략하고 노랫말 순서만 정리한 고어 표기 전문. 전승 판본·해독 차이가 있다.","lineGuides":[{"label":"01행","meaning":"내 님믈 그리ᅀᆞ와 우니다니","analysis":"임금에 대한 그리움으로 운다는 고백이며, 충신연주지사의 핵심 상황을 이룬다.","reference":"내 님믈 그리ᅀᆞ와 우니다니"},{"label":"02행","meaning":"이 구절의 한자는 아래 독음으로 읽고, 이어지는 표현 분석과 문맥 뜻풀이를 확인하세요.","analysis":"접동새 울음에 슬픈 마음을 투영한다. 자연물과 자기 처지를 비슷하게 묶는 감정이입이다.","reference":"山 졉동새 난 이슷ᄒᆞ요이다"},{"label":"03행","meaning":"아니시며 거츠르신 ᄃᆞᆯ 아으","analysis":"자신을 비난한 말이 사실이 아니라는 결백의 호소이며, 탄식 표현이 정서적 긴장을 높인다.","reference":"아니시며 거츠르신 ᄃᆞᆯ 아으"},{"label":"04행","meaning":"이 구절의 한자는 아래 독음으로 읽고, 이어지는 표현 분석과 문맥 뜻풀이를 확인하세요.","analysis":"잔월과 새벽별이 자신의 진실을 안다고 주장한다. 자연물을 도덕적 증인의 자리에 세운다.","reference":"殘月曉星이 아ᄅᆞ시리이다"},{"label":"05행","meaning":"넉시라도 님은 ᄒᆞᆫᄃᆡ 녀져라 아으","analysis":"죽어서 영혼이 되더라도 임과 함께 가기를 빈다. 충성과 그리움의 강도를 보인다.","reference":"넉시라도 님은 ᄒᆞᆫᄃᆡ 녀져라 아으"},{"label":"06행","meaning":"벼기더시니 뉘러시니잇가","analysis":"임이 편들고 사랑하던 지난날이 누구 탓에 바뀌었냐는 질문으로 모함한 사람들을 원망한다.","reference":"벼기더시니 뉘러시니잇가"},{"label":"07행","meaning":"이 구절의 한자는 아래 독음으로 읽고, 이어지는 표현 분석과 문맥 뜻풀이를 확인하세요.","analysis":"과실도 허물도 전혀 없다는 부정·강조를 통해 억울함을 적극 주장한다.","reference":"過도 허믈도 千萬 업소이다"},{"label":"08행","meaning":"ᄆᆞᆯ힛마리신뎌","analysis":"모함한 말이 문제라는 폭로다. 말의 신뢰성과 소문에 의한 소외를 드러낸다.","reference":"ᄆᆞᆯ힛마리신뎌"},{"label":"09행","meaning":"ᄉᆞᆯ읏븐뎌 아으","analysis":"서러움을 감탄조로 표현하여 감정의 절정에 이른다.","reference":"ᄉᆞᆯ읏븐뎌 아으"},{"label":"10행","meaning":"니미 나ᄅᆞᆯ 하마 니ᄌᆞ시니잇가","analysis":"임이 자신을 벌써 잊었는지 묻는다. 버려졌다는 두려움이 설의형으로 나타난다.","reference":"니미 나ᄅᆞᆯ 하마 니ᄌᆞ시니잇가"},{"label":"11행","meaning":"아소 님하 도람 드르샤 괴오쇼셔","analysis":"임이 다시 자신을 돌아보고 사랑해 달라는 직접적인 청. 원망보다 충절이 끝내 우세한 결말이다.","reference":"아소 님하 도람 드르샤 괴오쇼셔"}],"detailNotice":"교과 작품 「정과정곡」과 같은 작품이며, 작품명 표기만 다릅니다.","hanjaWords":[{"hanja":"殘月曉星","reading":"잔월효성","meaning":"지는 달과 새벽별"},{"hanja":"千萬","reading":"천만","meaning":"매우 많은 수"},{"hanja":"山","reading":"산","meaning":"산"},{"hanja":"過","reading":"과","meaning":"허물·잘못"}],"id":"w14","poem":true,"textStatus":"학습용 본문 · 표기 비교 권장"},{"group":"외부 지문","title":"사미인곡","author":"정철","genre":"조선 가사","theme":"임에 대한 그리움과 충절","summary":"버림받은 여인의 처지에 자신을 빗대어 사계절의 변화 속에서도 임을 생각하는 마음을 표현한다.","structure":"서사 → 봄·여름·가을·겨울 → 결사","grammar":"여성 화자의 독백과 계절 이미지, 높임·고어 표현.","emotion":"그리움·외로움·일편단심","devices":"계절 변화·의인·상징","compare":"「속미인곡」 대화체와 달리 독백 중심","note":"","intro":"임을 그리워하는 한 여인의 독백을 통해 작가의 연군의 정을 표현하는 조선 가사.","units":[{"label":"서사: 인연 회상","meaning":"태어날 때부터 임과 인연을 맺었고 함께하리라 믿었지만 외롭게 떨어졌다.","analysis":"처음부터 이별을 개인적인 상처이자 숙명적인 인연의 문제로 제시한다."},{"label":"봄: 매화","meaning":"눈이 녹고 매화가 피자 화자는 꽃을 꺾어 임께 보내고 싶어 한다.","analysis":"매화는 고결함과 변함없는 마음의 상징. 봄의 아름다움은 임의 부재를 더욱 선명하게 한다."},{"label":"여름: 옷","meaning":"여름에 임이 입을 옷을 정성스럽게 지어 보내려 한다.","analysis":"화자의 헌신은 단순한 감정 표현을 넘어 실천을 향한다."},{"label":"가을: 달빛과 추위","meaning":"높은 곳에 올라 달을 보며 임의 안녕을 염려한다.","analysis":"달은 멀리 떨어진 임과 화자를 이어주는 매개이자 그리움의 상징이다."},{"label":"겨울: 햇볕","meaning":"추운 계절 임이 있는 곳으로 따뜻한 햇볕을 보내고 싶다.","analysis":"임의 처지를 먼저 걱정한다는 점에서 충성심이 구체화된다."},{"label":"결사: 꿈·나비","meaning":"죽은 뒤라도 나비가 되어 임 곁에 가겠다고 다짐한다.","analysis":"현실에서 성취할 수 없는 만남을 초월적 상상으로 해결한다. 극단적인 헌신의 표현이다."}],"vocab":"매화·달빛·햇볕·나비의 상징 / 사계절 시상 전개 / 독백체 / 4음보 연속체 / 연군가사","point":"「속미인곡」과 공통은 충신연주, 차이는 독백체 대 문답체.","pitfalls":"계절마다 소재의 의미가 달라지는지를 살펴야 하며 화자의 궁극적 태도를 원망으로 단정하지 말 것.","original":"이 몸 삼기실 제 임을 조차 삼기시니\n한생 연분이며 하늘 모를 일이런가.\n나 하나 젊어 있고 임 하나 날 괴시니\n이 마음 이 사랑 견줄 데 전혀 없다.\n평생에 원하되 함께 지내려 하였더니\n늙어서 무슨 일로 외로이 두고 그리는고.","source":"https://ko.wikisource.org/wiki/%EC%86%A1%EA%B0%95%EA%B0%80%EC%82%AC/%EC%82%AC%EB%AF%B8%EC%9D%B8%EA%B3%A1","originalNote":"정철 「사미인곡」 앞부분 발췌이며, 중세 글자를 일반 브라우저에서 읽히도록 바꾼 표기입니다. 전문은 연결된 공개 원전에서 읽으세요.","lineGuides":[{"label":"서사 ① · 임과의 인연","meaning":"태어날 때부터 임과 맺어진 인연을 운명처럼 생각한다.","analysis":"인연의 필연성을 강조해 임을 향한 사랑과 충절을 시작부터 정당화한다."},{"label":"서사 ② · 총애의 기억","meaning":"임 곁에서 받았던 은총과 사랑을 회상한다.","analysis":"과거의 영화가 현재 소외감과 대비되어 슬픔을 깊게 만든다."},{"label":"서사 ③ · 늙음과 이별","meaning":"나이가 들고 임의 곁에서 멀어진 처지를 서러워한다.","analysis":"화자가 스스로를 늙어가는 여인으로 형상화한 충신연주지사의 특징이다."},{"label":"춘사 ① · 봄바람과 매화","meaning":"찬 눈이 녹자 겨울의 추위에서 봄의 생기가 되살아난다.","analysis":"계절 변화는 희망과 재회의 기대를 일깨우지만 현실의 이별은 계속된다."},{"label":"춘사 ② · 매화 가지","meaning":"임에게 매화를 꺾어 바치려 한다.","analysis":"매화의 절개와 아름다움은 임에게 전하려는 정성과 닮아 있다."},{"label":"춘사 ③ · 임의 반응","meaning":"꽃을 보내도 임이 어떻게 받아 줄지 염려한다.","analysis":"제물을 마련하는 정성과 소식이 닿지 않는 거리감이 충돌한다."},{"label":"하사 ① · 여름의 무더위","meaning":"더위 속에 임을 위한 옷을 정성껏 짓는다.","analysis":"일상 노동을 통해 실천적 사랑을 표현한다. 화려함보다 정성이 중요하다."},{"label":"하사 ② · 비단 옷","meaning":"임에게 보낼 옷을 만들어 쌓이는 근심을 잠시 돌리려 한다.","analysis":"의복은 사랑과 충성의 구체적 매개이며 임과의 거리감도 암시한다."},{"label":"추사 ① · 긴 가을밤","meaning":"가을이 오자 밤이 길어지고 외로움이 짙어진다.","analysis":"차가운 계절·긴 밤 이미지가 심리적 고독과 결합한다."},{"label":"추사 ② · 달빛을 보내려 함","meaning":"임의 궁궐을 밝히기 위해 달빛을 보내고 싶어 한다.","analysis":"광명은 임에게 닿기를 바라는 정성의 상징이다."},{"label":"추사 ③ · 어두운 산과 긴 밤","meaning":"공간적 장애가 님을 향한 시선과 소식을 막는다.","analysis":"장애물과 어둠은 단절 상황을 상징해 연군의 정서를 강조한다."},{"label":"동사 ① · 한겨울 추위","meaning":"추위를 무릅쓰고 임의 안위를 걱정한다.","analysis":"자신의 고통보다 임을 먼저 생각하는 태도를 구체적으로 표현한다."},{"label":"동사 ② · 겨울 햇빛","meaning":"햇볕을 임이 머무는 곳으로 보내려 한다.","analysis":"시각·촉각적 온기를 다른 공간으로 옮기려는 상상에서 간절한 마음이 보인다."},{"label":"동사 ③ · 깊은 근심","meaning":"겨울이 길어도 마음속 그리움은 사라지지 않는다.","analysis":"계절을 모두 지나오는 구성이 충정의 지속성을 강조한다."},{"label":"결사 ① · 이루지 못한 사랑","meaning":"끝내 임의 소식을 얻지 못한 현실을 탄식한다.","analysis":"그리움의 한계 앞에서 새로운 초월적 해결이 필요해진다."},{"label":"결사 ② · 나비의 변신","meaning":"죽어서라도 나비가 되어 임 곁에 가고자 한다.","analysis":"현실과 죽음의 경계 너머로 이어지는 충성·사랑의 의지를 형상화한다."},{"label":"결사 ③ · 임의 옷에 향기를 전함","meaning":"나비가 임에게 닿아 향기를 전하는 장면을 상상한다.","analysis":"하나의 구체적 접촉 상상이 사랑의 영속성을 압축한다."}],"detailNotice":"제공된 필기에서 표시한 서사·춘사·하사·추사·동사·결사를 기준으로 시상 전개를 세밀하게 분해했습니다.","sourceContext":"사용자가 보낸 교재·필기 이미지를 참고해 단위별 의미·상징·구성 분석을 보강했습니다. 이미지의 원문 전문을 복제하지 않으며, 판본에 따른 행 순서는 외부 원문과 대조하세요.","hanjaWords":[{"hanja":"白玉京","reading":"백옥경","meaning":"하늘의 궁궐"},{"hanja":"天門","reading":"천문","meaning":"하늘 문"},{"hanja":"九重","reading":"구중","meaning":"깊은 궁궐"},{"hanja":"紫微宮","reading":"자미궁","meaning":"임금이 있는 궁궐"},{"hanja":"春寒","reading":"춘한","meaning":"봄추위"},{"hanja":"冬天","reading":"동천","meaning":"겨울"}],"id":"w15","poem":true,"textStatus":"사용자 제공/대조 본문 · 판본 확인 권장"},{"group":"외부 지문","title":"별사미인곡","author":"김춘택","genre":"조선 후기 가사","theme":"임을 향한 충정과 연모","summary":"임과 떨어진 상황에서 그리움과 충정을 노래하며 앞선 미인곡 전통을 계승한다.","structure":"이별의 처지 → 임에 대한 정서 심화 → 변함없는 충절","grammar":"가사체의 연속적인 4음보와 장문 구조, 고어 어휘 대조.","emotion":"그리움·충정","devices":"여성 화자 차용·연군지정","compare":"「사미인곡」「속미인곡」의 영향 관계","note":"","intro":"김춘택의 가사로, 유배라는 정치적 맥락에서 임을 향한 그리움을 드러내는 작품.","units":[{"label":"시작: 처지 인식","meaning":"화자는 임과 멀어진 자신의 처지를 돌아보며 외로움을 드러낸다.","analysis":"임은 단순한 연애 상대를 넘어 연군의 대상으로 해석할 여지가 크다."},{"label":"중간: 그리움과 원망","meaning":"이별의 사연과 임을 향한 마음을 되새긴다.","analysis":"유배라는 현실적 환경을 비유적 여성 화자의 서술 속에 담은 방식이다."},{"label":"끝: 지속되는 마음","meaning":"만나기 어려운 상황에서도 마음을 거두지 않는 태도로 정서를 정리한다.","analysis":"정철의 미인곡 계열과 갈래적 연속성을 비교하면 좋다."}],"vocab":"별사미인곡: 정철의 사미인곡·속미인곡과 제목은 유사하나 작가와 시대·구체적 표현이 다름","point":"김춘택은 조선 후기 문인. 유배 경험과 작품의 창작 맥락을 연결.","pitfalls":"제목이 비슷하다고 「사미인곡」의 시구와 풀이를 그대로 옮기면 오류.","original":"","source":"https://gugeobucks.tistory.com/entry/가사문학사전_41-별사미인곡_김춘택_원문-현대어-풀이-작품-해설-pdf파일","originalNote":"확인된 범위의 구간별 해설이다. 판본 원문 전체와 1:1 대응한 번역은 아니다.","lineGuides":[{"label":"시작: 처지 인식","meaning":"화자는 임과 멀어진 자신의 처지를 돌아보며 외로움을 드러낸다.","analysis":"임은 단순한 연애 상대를 넘어 연군의 대상으로 해석할 여지가 크다."},{"label":"중간: 그리움과 원망","meaning":"이별의 사연과 임을 향한 마음을 되새긴다.","analysis":"유배라는 현실적 환경을 비유적 여성 화자의 서술 속에 담은 방식이다."},{"label":"끝: 지속되는 마음","meaning":"만나기 어려운 상황에서도 마음을 거두지 않는 태도로 정서를 정리한다.","analysis":"정철의 미인곡 계열과 갈래적 연속성을 비교하면 좋다."}],"detailNotice":"정확한 행별 원문을 확보하지 못한 항목은 뜻 단위로 설명했습니다. 문장 대조는 교과서·참고 출처에서 확인하세요.","hanjaWords":[],"id":"w16","poem":true,"textStatus":"원문 미확보 · 구간별 해설"},{"group":"외부 지문","title":"관동별곡","author":"정철","genre":"기행 가사","theme":"관동의 절경 찬미와 선정의 포부·신선적 풍류","summary":"금강산과 관동 팔경을 돌아보며 경치를 감상하는 한편 임금을 생각하고 백성을 다스릴 책임도 드러낸다.","structure":"관동 부임 → 금강산 유람 → 관동 팔경 → 꿈과 풍류","grammar":"4음보 가사체, 고사·한자어·대구·설의 표현.","emotion":"감탄·호방함·연군","devices":"감각적 묘사·과장·선경 이미지","compare":"「속미인곡」의 충신연주와 구별","note":"","intro":"관동의 명승을 유람하는 기행 가사. 자연 경관에 대한 찬탄 속에 유교적 정치 이상과 신선 사상이 겹친다.","units":[{"label":"서사: 관찰사 부임","meaning":"관찰사에 임명되어 관동으로 떠나며 여정을 시작한다.","analysis":"공적 임무와 개인적 감흥이라는 두 시선이 공존한다."},{"label":"금강산","meaning":"금강산의 여러 봉우리와 폭포를 보고 장대한 아름다움을 노래한다.","analysis":"대구·과장·의인 및 색채 대비가 산수의 역동성을 만든다."},{"label":"관동팔경","meaning":"동해안과 누정·명승을 돌아다니며 절경과 역사적 인물을 떠올린다.","analysis":"이동 경로 자체가 구성의 중심 축인 기행 문학이다."},{"label":"정치적 자각","meaning":"경치를 감상하면서도 백성의 삶과 임금에 대한 관심을 드러낸다.","analysis":"‘신선이 된 듯한 흥취’와 ‘유교적 책임 의식’이 공존한다."},{"label":"결사","meaning":"자연을 즐기며 신선 세계 같은 환상적 경지에 이른다.","analysis":"현실의 지리와 상상 세계가 겹치며 시적 공간이 확장된다."}],"vocab":"기행 가사 / 연속체·4음보 / 산수 묘사 / 설의와 대구 / 우국·애민 / 자연 친화와 신선 사상","point":"여정의 시작·관찰 지점·결말의 전환을 지도로 정리하면 쉽다.","pitfalls":"풍경 감상만이 작품의 전부라고 단정하지 말 것. 정치적 이념·신선적 상상도 함께 존재한다.","original":"강호에 병이 깊어 죽림에 누웠더니\n관동 팔백 리에 방면을 맡기시니\n어와 성은이야 가디록 망극하다.","source":"https://encykorea.aks.ac.kr/Article/E0004849","originalNote":"정철 「관동별곡」 서두 발췌(현대 글자 표기). 원전 전문은 수록하지 않았습니다. 지역 탐방과 임금의 은혜를 노래하는 장편 가사입니다.","lineGuides":[{"label":"서사: 관찰사 부임","meaning":"관찰사에 임명되어 관동으로 떠나며 여정을 시작한다.","analysis":"공적 임무와 개인적 감흥이라는 두 시선이 공존한다."},{"label":"금강산","meaning":"금강산의 여러 봉우리와 폭포를 보고 장대한 아름다움을 노래한다.","analysis":"대구·과장·의인 및 색채 대비가 산수의 역동성을 만든다."},{"label":"관동팔경","meaning":"동해안과 누정·명승을 돌아다니며 절경과 역사적 인물을 떠올린다.","analysis":"이동 경로 자체가 구성의 중심 축인 기행 문학이다."},{"label":"정치적 자각","meaning":"경치를 감상하면서도 백성의 삶과 임금에 대한 관심을 드러낸다.","analysis":"‘신선이 된 듯한 흥취’와 ‘유교적 책임 의식’이 공존한다."},{"label":"결사","meaning":"자연을 즐기며 신선 세계 같은 환상적 경지에 이른다.","analysis":"현실의 지리와 상상 세계가 겹치며 시적 공간이 확장된다."}],"detailNotice":"정확한 행별 원문을 확보하지 못한 항목은 뜻 단위로 설명했습니다. 문장 대조는 교과서·참고 출처에서 확인하세요.","hanjaWords":[{"hanja":"關東","reading":"관동","meaning":"관동 지방"},{"hanja":"江湖","reading":"강호","meaning":"산천과 세상"},{"hanja":"聖恩","reading":"성은","meaning":"임금의 은혜"}],"id":"w17","poem":true,"textStatus":"사용자 제공/대조 본문 · 판본 확인 권장"},{"group":"외부 지문","title":"유리창","author":"정지용","genre":"현대 서정시 · 자유시","theme":"떠난 존재에 대한 그리움과 슬픔","summary":"차갑고 슬픈 유리창의 형상 → 반복되는 닦음과 별빛 → 외로우면서 황홀한 마음 → 떠난 존재에 대한 직접적인 애도.","structure":"유리창의 감각적 모습 → 시선과 행동의 반복 → 역설적 심정 → 이별의 직접 고백","grammar":"행과 연의 자유로운 배열, 현재형 진술과 영탄의 결합. “-어도”는 반복에도 불구하고 해소되지 않는 심리를, “-구나”는 깨달음과 탄식을 드러낸다.","emotion":"그리움·상실감·애틋함·외로운 황홀","devices":"차고 슬픈(감각과 정서의 결합), 지우고 보고(반복), 새까만 밤(어둠의 시각화), 물 먹은 별(이미지), 외로운 황홀(역설), 아아(영탄), 산새처럼(직유)","compare":"「하관」「눈물」과 상실 이후의 태도 비교","note":"","intro":"차가운 유리창 앞에서 떠난 존재를 떠올리는 화자의 심정을 다룬 시다. 감각적 이미지, 되풀이되는 동작, 역설적 어구가 슬픔을 절제하면서도 깊게 만든다.","units":[{"label":"유리 위의 차고 슬픈 형상","meaning":"유리창 너머 혹은 표면에 슬픈 형상이 희미하게 비치는 듯 느낀다.","analysis":"촉각적인 “차고”와 정서적인 “슬픈”을 결합해 차가운 유리창이 화자의 내면적 상실과 이어지게 만든다."},{"label":"입김과 날개 이미지","meaning":"맥없이 유리창에 가까이 선 채 입김을 내쉬니 그 자국이 얼어붙은 날개를 움직이는 듯 보인다.","analysis":"입김의 흔적을 날개 움직임으로 떠올리는 시각적 비유다. ‘언 날개’는 차갑고 움직일 수 없는 상황을 암시한다."},{"label":"되풀이해 닦는 행동","meaning":"유리를 계속 닦으며 다시 보고 또 지워도 마음이 가라앉지 않는다.","analysis":"반복되는 동사가 상실을 부정하거나 다시 만나고 싶은 마음의 집요함을 드러낸다."},{"label":"밀려드는 밤","meaning":"어둠이 물결처럼 왔다 갔다 하는 것처럼 느껴진다.","analysis":"밤을 실제로 움직이는 물질처럼 제시해 불안정한 내면과 밀려오는 슬픔을 드러낸다."},{"label":"물 먹은 별","meaning":"물기에 젖어 반짝이는 별빛이 보석처럼 유리창에 박혀 보인다.","analysis":"별빛과 물기의 감각이 겹친다. 쉼표와 “반짝”이 순간적인 빛의 번쩍임과 눈물 어린 시선을 암시한다."},{"label":"역설적 심사","meaning":"밤에 혼자 유리를 닦는 일이 외롭고도 황홀한 마음에서 비롯된다.","analysis":"“외로운 황홀”은 서로 어울리지 않을 것 같은 정서가 공존하는 역설적 표현이다. 그리움 속에 대상과 만나는 듯한 순간의 감정이 들어 있다."},{"label":"마지막의 직접 호소","meaning":"떠난 대상을 떠올리며 깊은 상실의 슬픔을 직접 토로한다.","analysis":"“아아”는 영탄, “산새처럼”은 직유 표현이다. 부재한 대상에게 직접 말을 거는 방식이 애도의 감정을 강하게 드러낸다."}],"vocab":"열없이: 맥없이, 어쩔 줄 모르게 / 흐리우니: 흐리게 하니 / 언: 얼어붙은 / 심사: 마음속 생각과 정서 / 영탄: 감탄을 통해 마음을 직접 드러냄","point":"① 입김/날개의 관계 ② 지우고 보고의 반복 ③ 물 먹은 별의 이미지 ④ 외로운 황홀의 역설 ⑤ 산새처럼의 직유.","pitfalls":"“외로운 황홀”을 단순 행복이나 감정의 모순으로만 해석하지 말 것. 상실과 그리움이 함께 있는 복합 정서다.","original":"","source":"https://gongu.copyright.or.kr/gongu/wrt/wrt/view.do?menuNo=200019&wrtSn=9029761","originalNote":"저작권 보호 작품이라 전문을 이 프로그램에 재수록하지 않습니다. 아래 URL에서 원문·출처 자료를 확인하세요.","lineGuides":[{"label":"유리 위의 차고 슬픈 형상","meaning":"유리창 너머 혹은 표면에 슬픈 형상이 희미하게 비치는 듯 느낀다.","analysis":"촉각적인 “차고”와 정서적인 “슬픈”을 결합해 차가운 유리창이 화자의 내면적 상실과 이어지게 만든다."},{"label":"입김과 날개 이미지","meaning":"맥없이 유리창에 가까이 선 채 입김을 내쉬니 그 자국이 얼어붙은 날개를 움직이는 듯 보인다.","analysis":"입김의 흔적을 날개 움직임으로 떠올리는 시각적 비유다. ‘언 날개’는 차갑고 움직일 수 없는 상황을 암시한다."},{"label":"되풀이해 닦는 행동","meaning":"유리를 계속 닦으며 다시 보고 또 지워도 마음이 가라앉지 않는다.","analysis":"반복되는 동사가 상실을 부정하거나 다시 만나고 싶은 마음의 집요함을 드러낸다."},{"label":"밀려드는 밤","meaning":"어둠이 물결처럼 왔다 갔다 하는 것처럼 느껴진다.","analysis":"밤을 실제로 움직이는 물질처럼 제시해 불안정한 내면과 밀려오는 슬픔을 드러낸다."},{"label":"물 먹은 별","meaning":"물기에 젖어 반짝이는 별빛이 보석처럼 유리창에 박혀 보인다.","analysis":"별빛과 물기의 감각이 겹친다. 쉼표와 “반짝”이 순간적인 빛의 번쩍임과 눈물 어린 시선을 암시한다."},{"label":"역설적 심사","meaning":"밤에 혼자 유리를 닦는 일이 외롭고도 황홀한 마음에서 비롯된다.","analysis":"“외로운 황홀”은 서로 어울리지 않을 것 같은 정서가 공존하는 역설적 표현이다. 그리움 속에 대상과 만나는 듯한 순간의 감정이 들어 있다."},{"label":"마지막의 직접 호소","meaning":"떠난 대상을 떠올리며 깊은 상실의 슬픔을 직접 토로한다.","analysis":"“아아”는 영탄, “산새처럼”은 직유 표현이다. 부재한 대상에게 직접 말을 거는 방식이 애도의 감정을 강하게 드러낸다."}],"detailNotice":"사용자가 보낸 본문을 일곱 문장·구 단위로 나누어 이미지와 정서를 자세히 풀이했습니다.","sourceContext":"사용자가 직접 제공한 「유리창」의 세 문단을 원문 그대로 입력했습니다. 기존에 있던 원문 미수록 안내는 이 항목에 적용하지 않습니다.","originalModern":"","isExcerpt":false,"userProvidedText":true,"copyrighted":true,"hanjaWords":[],"id":"w18","poem":true,"textStatus":"저작권 보호 · 원문 URL 제공","readableOriginal":"","alignedLines":null},{"group":"외부 지문","title":"눈물","author":"김현승","genre":"현대 서정시","theme":"상실의 슬픔을 눈물이라는 순수하고 값진 존재로 승화함","summary":"화자는 눈물을 흠도 티도 없는 자신의 가장 온전하고 값진 것으로 인식한다. 꽃이 시든 뒤 열매를 맺게 하는 자연의 섭리처럼, 웃음 뒤에 주어진 눈물 역시 고통을 넘어 성숙과 결실에 이르게 하는 것으로 받아들인다.","structure":"작은 생명이 되려는 소망 → 눈물을 가장 온전하고 값진 것으로 인식 → 꽃과 열매의 섭리 → 웃음 뒤에 주어진 눈물의 의미","grammar":"현대 서정시의 비유적 진술과 명사 이미지의 의미 확장.","emotion":"비애·경건·정화","devices":"눈물의 상징, 꽃과 열매의 대비·연결, 반복에 의한 가치 강조, 절대적 존재인 ‘당신’을 향한 종교적 어조","compare":"「유리창」의 감각적 표현과 비교","note":"요청의 ‘김연승’은 통상 작품 작가인 ‘김현승’으로 바로잡음.","intro":"김현승의 「눈물」은 슬픔을 단순한 절망이 아니라 정화와 내면의 깨달음에 연결하는 시.","units":[{"label":"출발: 슬픔","meaning":"화자는 상실과 깊은 고통의 경험을 떠올린다.","analysis":"개인적 사건을 출발점으로 삼되 의미를 보편적 차원으로 확장한다."},{"label":"전개: 눈물의 가치","meaning":"슬픔에서 비롯된 눈물이 자신의 내면을 맑히거나 영혼의 가치를 드러내는 것으로 제시된다.","analysis":"눈물의 부정적 통념과 긍정적·종교적 의미가 대비된다."},{"label":"결말: 정화와 초월","meaning":"고통을 겪은 뒤 얻는 순수성과 깨달음을 강조한다.","analysis":"눈물의 역설적 가치를 이해하는 것이 핵심이다."}],"vocab":"눈물: 슬픔이면서 정화의 상징 / 역설적 가치 / 종교적·성찰적 어조","point":"눈물을 무조건 부정적 소재라고 해석하면 작품의 핵심을 놓침.","pitfalls":"이 작품을 김연승 작품으로 표기하지 말 것. 정확한 이름은 김현승.","original":"","source":"https://eduking1978.tistory.com/477","originalNote":"저작권 보호 작품이라 전문을 이 프로그램에 재수록하지 않습니다. 아래 URL에서 원문·출처 자료를 확인하세요.","externalLabel":"2026 EBS 수능특강 해설·본문 안내","copyrighted":true,"lineGuides":[{"label":"첫 이미지 · 기름진 흙","meaning":"자신의 눈물이 생명을 키우는 땅에 닿는 작은 존재가 되기를 소망한다.","analysis":"눈물을 단순한 고통의 부산물이 아니라 생명을 위한 헌신으로 바라보는 역설이 생긴다."},{"label":"온전한 내면의 한 조각","meaning":"화자는 자신의 마음에서 결함 없이 순수하게 남은 것을 찾는다.","analysis":"상실의 경험을 통해 오히려 가장 순수한 정서가 남았다는 점이 핵심이다."},{"label":"귀한 예물을 바치려는 태도","meaning":"신 앞에 더 가치 있는 것을 내놓으려는 종교적 마음이 드러난다.","analysis":"화자의 상대는 작품 안에서 절대적 존재로 읽힌다. 눈물이 정성의 예물이 된다."},{"label":"가장 소중한 것의 역설","meaning":"화자는 자기 내면에서 남아 있는 가장 귀한 것을 되풀이해 확인한다.","analysis":"눈물이 고통의 표식이면서 동시에 정화된 영혼의 증거라는 이중적 의미를 가진다."},{"label":"꽃이 지고 열매가 맺는 과정","meaning":"아름다운 꽃이 사라지고 열매가 나타나는 생명의 변화를 제시한다.","analysis":"꽃의 소멸이 끝이 아니라 새로운 결실의 조건이 된다는 관점. 고난의 승화를 자연의 순환으로 설명한다."},{"label":"웃음에서 눈물로","meaning":"절대적 존재가 웃음에 이어 눈물을 선물한 것으로 표현된다.","analysis":"눈물은 단순한 형벌이 아니라 성장·깨달음과 연결되는 선물로 재해석된다. 종교적 성찰이 결론이다."}],"detailNotice":"보호 작품은 원문 문장을 복제하지 않고 흐름에 맞춰 해설합니다. 원문은 위의 외부 읽기 링크를 열어 대조하세요.","sourceContext":"제공한 수업 화면에서 작품 이미지·필기의 해설 요소를 확인하고, 원문 재전재 없이 독립적인 뜻풀이와 시어 설명으로 정리했습니다.","hanjaWords":[],"id":"w19","poem":true,"textStatus":"저작권 보호 · 원문 URL 제공","originalModern":"","readableOriginal":"","alignedLines":null},{"group":"외부 지문","title":"하관","author":"박목월","genre":"현대 서정시","theme":"아우의 죽음 이후 생사의 단절을 체감하는 형의 슬픔과 그리움","summary":"관을 땅에 내리고 흙을 뿌리는 장례 장면 뒤, 화자는 꿈속에서 자신을 부르는 아우를 만난다. 아우의 목소리는 들리지만 자신의 대답은 아우에게 닿지 않으며, 이승과 죽음의 세계 사이의 돌이킬 수 없는 단절이 일상의 작은 소리와 대비되어 드러난다.","structure":"하관과 작별 → 꿈속에서 아우와 재회 → 서로 닿지 않는 목소리 → 이승의 일상적 소리만 남음","grammar":"간결한 시어와 반복·여백, 함축적 문장.","emotion":"비통함·기도 → 반가움 → 단절감·그리움 → 고독","devices":"하강 이미지의 반복, 꿈과 현실의 대비, 부름과 응답의 비대칭, 작고 구체적인 소리를 통한 상실감의 심화","compare":"「제망매가」의 죽음 이후 재회 소망과 비교","note":"","intro":"박목월의 「하관」은 장례의 현장 속에서 삶과 죽음의 거리, 남은 사람의 슬픔을 드러낸다.","units":[{"label":"장례의 현장","meaning":"하관이라는 구체적 장면을 통해 떠난 이와 남은 이가 분리된다.","analysis":"물리적 행위가 돌이킬 수 없는 이별을 실제로 체감하게 한다."},{"label":"기억과 상실","meaning":"화자는 생전의 대상과 지금의 부재를 교차하여 인식한다.","analysis":"작은 정물·공간이 기억의 매개체가 될 수 있다."},{"label":"남겨진 정서","meaning":"슬픔을 과장하기보다 담담하게 응시하는 태도가 나타난다.","analysis":"절제된 어조와 구체적 시각 이미지가 추모의 깊이를 만든다."}],"vocab":"하관: 관을 묘에 내리는 절차 / 장례 의식의 상징성 / 절제된 애도 / 부재","point":"「제망매가」가 극락 재회의 소망을 나타내는 것과 애도의 해결 방식이 다름.","pitfalls":"화자와 시인의 경험을 자동으로 동일시하지 말 것.","original":"","source":"https://barlo.tistory.com/222","originalNote":"저작권 보호 작품이라 전문을 이 프로그램에 재수록하지 않습니다. 아래 URL에서 원문·출처 자료를 확인하세요.","externalLabel":"작품 본문·해설 페이지","copyrighted":true,"lineGuides":[{"label":"첫 장면 · 관을 내림","meaning":"가까운 사람의 장례에서 관이 땅 아래로 내려가는 상황.","analysis":"하강의 동작을 내면의 상실감과 결합한다. 짧은 진술로 비통함을 오히려 절제한다."},{"label":"가슴 안쪽의 감각","meaning":"관이 깊이 내려가는 모습을 자신의 가슴 안쪽으로 끌어들인다.","analysis":"공간 이동을 감정의 깊이로 전환하는 비유. 슬픔의 내면화가 나타난다."},{"label":"기도의 말","meaning":"화자는 신에게 용서와 위안을 청한다.","analysis":"기도의 형식은 종교적 믿음과 동시에 현실에서의 무력함을 드러낸다."},{"label":"성경과 흙","meaning":"장례의 의례와 흙을 뿌리는 작별 인사가 이어진다.","analysis":"흙은 살아 있는 자와 죽은 자의 세계를 구별하며, 떨어지는 소리는 죽음을 현실로 확정한다."},{"label":"꿈에서 재회","meaning":"화자는 꿈속에서 떠난 아우를 만난다.","analysis":"꿈은 재회 욕망을 드러내지만 현실의 거리가 사라진 것은 아니다."},{"label":"서로를 부름","meaning":"꿈에서 아우가 형을 부르고 화자도 몸 전체로 응답한다.","analysis":"강한 응답에도 목소리가 전달되지 않는 비대칭성에서 생사의 단절이 드러난다."},{"label":"닿지 않는 목소리","meaning":"화자는 죽은 아우의 목소리를 자신만 기억하는 현실을 깨닫는다.","analysis":"이승과 저승 사이의 거리 때문에 응답은 상대에게 전달될 수 없다."},{"label":"비와 눈의 세상","meaning":"자신이 남은 세계를 눈과 비가 내리는 곳으로 묘사한다.","analysis":"내려오는 이미지가 관과 흙의 하강과 이어져 슬픔을 환기한다."},{"label":"끝 장면 · 떨어지는 것의 소리","meaning":"자연물의 떨어지는 소리만 또렷한 이승의 감각을 떠올린다.","analysis":"생명의 부재를 역설적으로 실감하게 하는 작은 일상 소리. 절제된 종결이다."}],"detailNotice":"보호 작품은 원문 문장을 복제하지 않고 흐름에 맞춰 해설합니다. 원문은 위의 외부 읽기 링크를 열어 대조하세요.","sourceContext":"제공한 수업 화면에서 작품 이미지·필기의 해설 요소를 확인하고, 원문 재전재 없이 독립적인 뜻풀이와 시어 설명으로 정리했습니다.","hanjaWords":[],"id":"w20","poem":true,"textStatus":"저작권 보호 · 원문 URL 제공","originalModern":"","readableOriginal":"","alignedLines":null},{"group":"외부 지문","title":"가을 무덤 - 제망매가","author":"기형도","genre":"현대 서정시","theme":"죽은 누이에 대한 애도와 가난했던 유년의 기억, 살아남은 자의 죄책감과 슬픔","summary":"화자는 무덤에 누운 누이를 직접 부르며 죽음의 현실을 마주한다. 이어 누이와 함께 겪었던 가난하고 고단한 유년의 기억을 떠올리고, 현재의 자신에게 되돌아온 상실감과 죄책감을 격렬한 신체 감각으로 드러낸다.","structure":"① 무덤에 누운 누이에게 말을 건넴 → ② 누이의 죽음을 신체적 이미지로 확인함 → ③ 가난했던 과거의 기억을 회상함 → ④ 함께 겪은 고통과 삶의 투쟁을 되짚음 → ⑤ 살아남은 화자의 슬픔과 죄책감이 폭발함","grammar":"죽은 누이에게 직접 말을 거는 호격과 의문형 종결이 반복된다. 과거 회상과 현재의 무덤 장면이 교차하며, 명사 중심의 압축된 이미지와 거친 감각어가 정서를 강화한다.","emotion":"그리움·애도 → 충격·비통함 → 가난했던 삶에 대한 연민 → 공동의 고통에 대한 회상 → 살아남은 자의 죄책감과 격정적 슬픔","devices":"돈호법과 설의적 의문, 차갑고 거친 촉각·시각 이미지, 죽음과 생명/과거와 현재의 대비, 술·피·뼈·비·구정물·먹을거리 등의 현실적 이미지, 반복되는 누이 호명. 고전 「제망매가」를 부제로 불러오되 불교적 초월보다 육체적 기억과 현실의 상처를 전면화한다.","compare":"월명사 「제망매가」와 비교: 두 작품 모두 죽은 누이를 애도하지만, 고전은 미타찰에서의 재회와 종교적 극복을 지향하는 반면 이 작품은 가난한 삶의 기억과 살아남은 자의 죄책감, 현실적 신체 감각을 강조한다.","note":"사용자가 제공한 작품 전문을 분석의 근거로 반영했다. 저작권 보호를 위해 프로그램에는 전문을 재수록하지 않고 구간별 의미와 표현 분석만 제공한다.","intro":"죽은 누이를 향한 직접적인 호명에서 시작해, 가난했던 유년과 가족의 상처를 거친 감각으로 되살리는 현대시다. 부제 「제망매가」를 통해 고전 향가와 대화하면서도 종교적 초월보다 현실의 기억과 죄책감에 더 깊이 머문다.","units":[{"label":"1연 · 무덤의 누이와 마주함","meaning":"화자는 무덤에 누운 누이에게 직접 말을 걸며 죽음을 받아들이지 못한 채 애도한다.","analysis":"차가운 계절감과 무덤 주변의 황량한 자연 이미지가 누이의 죽음을 구체화한다. 죽은 이를 마치 눈앞에 있는 사람처럼 부르는 방식이 상실의 충격을 현재화한다."},{"label":"2연 · 육체적 죽음의 확인","meaning":"누이의 뼈와 화자의 몸이 맞닿는 상상 속에서 혈육의 관계와 죽음의 잔혹한 현실을 확인한다.","analysis":"촉각과 청각이 강한 신체 이미지가 사용된다. 가족에게서 이어진 생명의 흔적이 죽은 육체의 이미지와 충돌하면서 비극성을 극대화한다."},{"label":"3연 · 가난했던 삶의 기억","meaning":"비와 구정물 속에서 먹을 것을 붙들고 살아가던 누이의 가난하고 서러운 삶을 떠올린다.","analysis":"일상적이고 비루한 사물을 통해 추상적인 슬픔을 사회적·생활사적 기억으로 바꾼다. 화자의 애도는 개인적 죽음뿐 아니라 누이가 겪은 삶의 고통까지 향한다."},{"label":"4~5연 · 함께 겪은 유년과 생존의 고통","meaning":"남매가 척박한 환경 속에서 서로 부딪히며 살아왔고, 삶 자체가 병든 몸처럼 고통스러웠음을 회상한다.","analysis":"자연과 음식물, 질병의 이미지가 연속되어 결핍과 피로를 드러낸다. 밝은 아침의 이미지도 화자 앞이 아니라 뒤에서 솟는 것으로 제시되어 희망이 쉽게 닿지 않는 삶을 암시한다."},{"label":"마지막 연 · 살아남은 자의 죄책감","meaning":"누이에게 술을 바치는 행위가 오히려 화자의 영혼을 흔들며, 슬픔이 자신에게 되돌아온다.","analysis":"처음의 상황을 변주해 되풀이하면서 시 전체를 원형적으로 닫는다. 누이의 죽음을 애도하는 마음과 함께 살아남은 자신의 무력함·죄책감이 폭발한다."}],"vocab":"돈호법: 대상을 직접 부르는 표현 / 설의적 의문: 대답을 요구하기보다 정서를 강조하는 의문 / 상호텍스트성: 다른 작품을 불러와 새로운 의미 관계를 만드는 방식 / 망초꽃: 묘지나 빈터의 황량한 분위기를 강화하는 식물 이미지 / 하구: 강물이 바다로 흘러드는 곳으로, 떠밀려가는 삶의 방향성을 암시","point":"① 죽은 누이를 직접 부르는 호명 ② 차갑고 거친 신체 이미지 ③ 가난했던 유년의 구체적 생활상 ④ 현재의 무덤 장면과 과거 회상의 교차 ⑤ 처음과 끝의 상황 반복 ⑥ 월명사 「제망매가」와의 공통점·차이점","pitfalls":"부제만 보고 고전 「제망매가」와 동일한 종교적 극복 구조로 읽으면 안 된다. 이 작품은 초월적 재회보다 현실의 가난, 육체적 죽음, 살아남은 화자의 죄책감과 상실을 더 강하게 드러낸다.","original":"","source":"https://commonkorean.tistory.com/135","originalNote":"저작권 보호 작품이라 전문을 이 프로그램에 재수록하지 않습니다. 아래 URL에서 원문·출처 자료를 확인하세요.","externalLabel":"기형도 「가을 무덤 - 제망매가」 분석","copyrighted":true,"lineGuides":[{"label":"도입 · 죽은 누이를 직접 부름","meaning":"무덤에 누운 누이를 현재의 대화 상대로 불러내며 애도를 시작한다.","analysis":"돈호법과 의문형 문장이 결합해 죽음을 받아들이기 어려운 화자의 정서를 드러낸다."},{"label":"차가운 무덤과 자연 이미지","meaning":"가을의 차가움과 황량한 묘지 풍경 속에서 누이의 죽음을 바라본다.","analysis":"차가운 계절감과 빛이 바랜 외양이 생명의 소멸을 시각적으로 강화한다."},{"label":"신체적 이미지와 혈육의 기억","meaning":"죽은 누이의 육체를 상상하며 남매를 이어 준 가족적 혈연을 떠올린다.","analysis":"뼈·이빨·피 등 거친 감각 이미지가 죽음의 현실성을 높이고, 추상적 애도를 육체의 문제로 끌어내린다."},{"label":"비와 구정물 속의 가난","meaning":"가난 속에서 먹을 것을 붙들고 견디던 누이의 어린 시절을 회상한다.","analysis":"비루한 생활 사물은 개인적 기억을 구체적인 사회 현실의 장면으로 확장한다."},{"label":"남매가 함께 버틴 삶","meaning":"화자와 누이는 척박한 환경에서 떠밀리듯 성장하며 어둠과 싸웠다.","analysis":"흐르는 물과 병든 몸의 비유가 삶의 불안정성과 지속적인 고통을 동시에 드러낸다."},{"label":"결말 · 술방울과 영혼의 동요","meaning":"누이에게 바치는 술이 화자 자신의 슬픔과 죄책감을 되돌려 주며 몸과 영혼을 흔든다.","analysis":"도입 장면을 반복·변주해 구조적 통일성을 만들고, 질문으로 끝내 해소되지 않은 상실을 남긴다."}],"detailNotice":"사용자가 제공한 작품 전문의 흐름을 바탕으로 연별 의미·이미지·정서를 분석했습니다. 전문은 저작권 보호를 위해 화면에 다시 싣지 않습니다.","hanjaWords":[],"id":"w21","poem":true,"textStatus":"저작권 보호 · 원문 URL 제공","originalModern":"","readableOriginal":"","alignedLines":null},{"group":"외부 지문","title":"모죽지랑가","author":"득오","genre":"8구체 향가","theme":"죽지랑을 그리는 마음과 인물에 대한 추모·찬양","summary":"세월이 지나면서 달라진 모습과 지나간 날을 생각하며 죽지랑을 간절히 그리워한다.","structure":"세월의 변화 → 인물 회상·그리움 → 만나려는 열망","grammar":"향찰 표기 원작의 현대어 해독은 역본마다 차이가 있다.","emotion":"그리움·안타까움·추모","devices":"자연 이미지·호소","compare":"「제망매가」와 추모의 대상·형식 차이","note":"","intro":"득오가 화랑 죽지랑을 사모하고 그리워하는 향가로, 옛 영화와 사라져 가는 시간에 대한 아쉬움을 담는다.","units":[{"label":"1~2구 · 지나간 봄","original":"지나간 봄을 그리워하니 / 온갖 시름이 마음에 밀려오네.","meaning":"죽지랑과 함께했던 지난 시간에 대한 그리움.","analysis":"‘봄’은 한때 찬란했던 시절의 환유적 이미지. 부재로 인해 현재의 시름이 깊어진다."},{"label":"3~4구 · 세월의 흔적","original":"아름다운 모습을 지니셨던 분도 / 세월 따라 모습이 달라지셨구나.","meaning":"그리워하는 대상의 모습과 흘러간 세월을 회상한다.","analysis":"과거의 아름다움과 현재의 변화를 대비하여 시간의 무상함을 표현한다."},{"label":"5~6구 · 만남의 소망","original":"눈 돌릴 짧은 동안이라도 / 그대를 만나 뵐 수 있기를.","meaning":"단 한순간의 재회라도 간절히 바란다.","analysis":"짧은 시간의 제시가 사모의 정을 압축한다. 재회가 현실적으로 성취되었다는 뜻은 아니다."},{"label":"7~8구 · 그리움과 길","original":"낭이여, 그리워하는 마음에 따라가는 길, / 쑥 무성한 마을에서 밤을 지새울 때가 있으리.","meaning":"죽지랑을 사모하는 마음이 앞으로도 계속될 것임을 드러낸다.","analysis":"다복쑥 우거진 곳의 의미는 죽음·장애·지명의 해석 차이가 있어 교과서 설명과 대조해야 한다."}],"vocab":"慕: 사모하다 / 竹旨郞: 죽지랑, 추모 대상 / 향찰 원문 8구 / 죽음의 사실·시점은 해설서에 따라 확인 필요","point":"「제망매가」는 누이의 죽음을 직접적으로 다루고, 「모죽지랑가」는 죽지랑을 그리워하며 시간의 변화와 만남 소망을 드러낸다.","pitfalls":"죽지랑의 사망 여부를 작품만으로 단정하지 말 것. 8구체 향가이므로 「제망매가」의 10구체·낙구 구조와 구별.","original":"지나간 봄을 그리워하니\n온갖 시름이 마음에 밀려오네.\n아름다운 모습을 지니셨던 분도\n세월 따라 모습이 달라지셨구나.\n눈 돌릴 짧은 동안이라도\n그대를 만나 뵐 수 있기를.\n낭이여, 그리워하는 마음에 따라가는 길,\n쑥 무성한 마을에서 밤을 지새울 때가 있으리.","source":"https://ko.wikisource.org/wiki/모죽지랑가","originalNote":"8구체 향가의 대표적 현대어 해독 흐름을 참고하여 새롭게 뜻풀이함. 원향찰의 해독과 말미의 지명·상징 풀이에는 견해차가 있음.","lineGuides":[{"label":"01행","meaning":"지나간 봄을 그리워하니","analysis":"봄은 그리운 사람과 보낸 좋은 시절을 가리킬 수 있다. 다시 돌아오지 않는 과거를 부른다.","reference":"지나간 봄을 그리워하니"},{"label":"02행","meaning":"온갖 시름이 마음에 밀려오네.","analysis":"온갖 시름이 마음을 채운다는 표현으로 과거 회상에서 슬픔으로 정서가 전환된다.","reference":"온갖 시름이 마음에 밀려오네."},{"label":"03행","meaning":"아름다운 모습을 지니셨던 분도","analysis":"죽지랑의 훌륭하고 아름다운 모습에 대한 기억을 환기한다. 존경의 감정도 담긴다.","reference":"아름다운 모습을 지니셨던 분도"},{"label":"04행","meaning":"세월 따라 모습이 달라지셨구나.","analysis":"사람의 모습이 변한 것은 세월이 흐른다는 증거다. 시간의 무상함에 대한 인식이 드러난다.","reference":"세월 따라 모습이 달라지셨구나."},{"label":"05행","meaning":"눈 돌릴 짧은 동안이라도","analysis":"아주 짧은 시간이라도 만나고 싶다는 소망을 제시한다. 만남의 시간보다 간절함이 중요하다.","reference":"눈 돌릴 짧은 동안이라도"},{"label":"06행","meaning":"그대를 만나 뵐 수 있기를.","analysis":"재회의 소망이 구체적 요청으로 발전한다. 현재 화자와 대상의 거리감을 드러낸다.","reference":"그대를 만나 뵐 수 있기를."},{"label":"07행","meaning":"낭이여, 그리워하는 마음에 따라가는 길,","analysis":"“낭이여”라는 부름은 영탄적 호명이며, 그리움이 나아갈 길로 이어진다.","reference":"낭이여, 그리워하는 마음에 따라가는 길,"},{"label":"08행","meaning":"쑥 무성한 마을에서 밤을 지새울 때가 있으리.","analysis":"쑥 무성한 공간과 밤샘은 만남을 향한 길의 고단함을 나타낸다. 장애에도 변하지 않는 마음이다.","reference":"쑥 무성한 마을에서 밤을 지새울 때가 있으리."}],"detailNotice":"수록한 현대어 본문 8행을 각각 풀어 설명했습니다.","sourceContext":"올려 준 현대어 대조 이미지에서 봄·시름·얼굴·밤·길 이미지를 따라 8구체 향가의 정서 변화를 읽도록 수정함.","hanjaWords":[],"id":"w22","poem":true,"textStatus":"학습용 본문 · 표기 비교 권장"},{"group":"외부 지문","title":"한림별곡","author":"한림제유","genre":"고려 경기체가·8장","theme":"한림 문인들의 학문적 자부심과 서예·술·꽃·음악·유흥을 아우르는 풍류의 찬미","summary":"1장에서는 문장과 과거 시험장의 인재를, 2장에서는 독서와 서적을, 3장에서는 서예를 자랑한다. 이후 술·꽃·음악·누각과 가인·그네놀이로 소재가 확장되며 신흥 사대부 문인층의 지적 자부심과 향락적 풍류가 함께 드러난다.","structure":"제1장 문인·과거 → 제2장 서적·독서 → 제3장 서예 → 제4장 술 → 제5장 꽃 → 제6장 음악 → 제7장 누각·가인·자연 → 제8장 그네·남녀 유희","grammar":"각 장에서 명사·고유명사를 병렬적으로 열거하고 ‘위 … 경(景) 긔 엇더하니잇고’와 ‘엽(葉)’ 이하의 반복 구조를 사용한다. 8장으로 이루어진 경기체가의 분절적 형식과 후렴의 반복이 핵심이다.","emotion":"지적 자부심·과시 → 풍류의 흥취 → 향락적 즐거움","devices":"인명·서적명·서체·술·꽃·악기·지명 등의 병렬적 열거, 반복되는 후렴, 감탄과 찬미, 감각적 이미지의 확장","compare":"「동동」이 월령체 형식으로 임에 대한 그리움과 송축을 노래하는 데 비해, 「한림별곡」은 집단적 화자가 자신들의 학문과 풍류 생활을 과시적으로 찬미한다.","note":"사용자가 제공한 1~8장 이미지의 원문과 현대어 풀이를 기준으로 구성했습니다. 이미지에서 글자가 깨져 보인 일부 항목은 바로 옆 한자·현대어 풀이와 대응하여 학습용 표기로 복원했습니다.","intro":"사용자가 보낸 네 장의 자료를 기준으로 1장부터 8장까지 원문과 현대어를 나란히 배치했다. 작품 전체가 ‘무엇이 어떠한가’라고 감탄하는 반복 구조를 지니며, 학문에서 시작해 풍류와 유흥으로 관심이 넓어진다.","units":[{"label":"제1장 · 문장과 과거 시험장의 자부심","meaning":"유원순의 문장, 이인로의 시, 이공로의 사륙변려문\n이규보와 진화가 서로 운을 맞추어 지은 글\n유충기의 대책문, 민광균의 경서 해석, 김양경의 시와 부\n아야, 과거 시험장의 정경, 그것이 어떠합니까?\n금의의 많은 뛰어난 제자들, 금의의 많은 뛰어난 제자들\n아야, 나를 합하여 모두 몇 분입니까?","analysis":"당대 문인과 문장·시험 문화를 연속적으로 열거한다. 화자 집단이 자신들을 뛰어난 문인 집단으로 인식하는 지적 자부심과 과시적 태도가 드러난다.","original":"원순문(元淳文) 인노시(仁老詩) 공노사륙(公老四六)\n니정언(李正言) 딘한림(陳翰林) 쌍운주필(雙韻走筆)\n튱기대책(沖基對策) 광균경의(光鈞經義) 량경시부(良鏡詩賦)\n위 시댱(試場) ㅅ 경(景) 긔 엇더하니잇고\n엽(葉) 금학사(琴學士)의 옥순문생(玉筍門生) 금학사(琴學士)의 옥순문생(玉筍門生)\n위 날조차 몃부니잇고"},{"label":"제2장 · 서적과 독서","meaning":"당서와 한서의 역사서, 장자와 노자, 한유와 유종원의 문집,\n이백과 두보의 시집, 난대 영서들의 문집, 백거이의 문집,\n시경과 서경, 주역과 춘추, 대대례와 소대례\n아야, 주석과 아울러 내내 외운 정경, 그것이 어떠합니까?\n태평광기 400여 권, 태평광기 400여 권\n아야, 두루 읽는 정경, 그것이 어떠합니까?","analysis":"중국의 역사서·철학서·문집·경전을 폭넓게 열거한다. 많은 책을 외우고 두루 읽는 장면을 통해 학식과 독서량을 과시한다.","original":"당한서(唐漢書) 장로자(莊老子) 한류문집(韓柳文集)\n니두집(李杜集) 난대집(蘭臺集) 백락천집(白樂天集)\n모시상서(毛詩尙書) 주역춘추(周易春秋) 주대례기(周戴禮記)\n위 주(註)조쳐 내 외온 경(景) 긔 엇더하니잇고\n엽(葉) 태평광기(太平廣記) 사백여권(四百餘卷) 태평광기(太平廣記) 사백여권(四百餘卷)\n위 력남(歷覽) ㅅ 경(景) 긔 엇더하니잇고"},{"label":"제3장 · 명필과 서예","meaning":"당나라 안진경의 서체, 후한 채옹에서 비롯한 비백의 서체, 후한 유덕승에서 시작한 행서체, 뒷날 성행한 초서체\n진나라 이사의 소전과 주나라 태사주의 대전의 서체, 올챙이 모양의 과두의 서체, 당나라 우세남의 서체\n양수염으로 맨 붓, 쥐수염으로 맨 붓들을 비스듬히 들고\n아야, 한 점을 찍는 광경, 그것이 어떠합니까?\n오생과 유생 두 분 선생님께서, 오생과 유생 두 분 선생님께서\n아야, 붓을 거침없이 휘달려 그려 나가는 광경, 그것이 어떠합니까?","analysis":"여러 서체와 붓, 명필을 열거하며 글씨 쓰는 모습을 찬미한다. 지식의 나열에서 예술적 기량의 과시로 관심이 확장된다.","original":"진경서(眞卿書) 비백서(飛白書) 행서초서(行書草書)\n뎐류서(篆籀書) 과두서(蝌蚪書) 우서남서(虞書南書)\n양수필(羊鬚筆) 서수필(鼠鬚筆) 빗기 드러\n위 딕는 경(景) 긔 엇더하니잇고\n엽(葉) 오생류생(吳生劉生) 량선생(兩先生)의 오생류생(吳生劉生) 량선생(兩先生)의\n위 주필(走筆) ㅅ 경(景) 긔 엇더하니잇고"},{"label":"제4장 · 술과 취흥","meaning":"황금빛 도는 술, 잣으로 빚은 술, 솔잎으로 빚은 술, 그리고 단술\n댓잎으로 빚은 술, 배꽃 필 무렵 빚은 술, 오가피로 담근 술\n앵무새 부리 모양의 자개 껍질로 된 앵무잔과 호박빛 도는 호박잔에 술을 가득 부어\n권하여 올리는 광경, 그것이 어떠합니까?\n(진나라 죽림칠현의 한 분인) 유령과 도잠이야 신선 같은 늙은이로, 유령과 도잠이야 신선 같은 늙은이로\n아야, 거나하게 취한 광경, 그것이 어떠합니까?","analysis":"여러 종류의 술과 술잔을 화려하게 나열한다. 앞 장의 학문·예술 자부심에서 음주와 풍류의 흥취로 시상이 이동한다.","original":"황금주(黃金酒) 백자주(柏子酒) 송주례주(松酒醴酒)\n죽엽주(竹葉酒) 리화주(梨花酒) 오가피주(五加皮酒)\n앵무잔(鸚鵡盞) 호박배(琥珀杯)에 가득 브어\n위 권상(勸上) ㅅ 경(景) 긔 엇더하니잇고\n엽(葉) 류령도잠(劉伶陶潛) 량선옹(兩仙翁)의 류령도잠(劉伶陶潛) 량선옹(兩仙翁)의\n위 취(醉)흔 경(景) 긔 엇더하니잇고"},{"label":"제5장 · 꽃과 정원의 풍경","meaning":"붉은 모란, 흰 모란, 정홍 모란\n붉은 작약, 흰 작약, 정홍 작약\n능수버들과 옥매, 누른 장미와 자줏빛 장미, 지란과 영지와 동백\n아야, 어우러져 핀 정경, 그것이 어떠합니까?\n합죽과 복숭아꽃 고운 두 그루, 합죽과 복숭아꽃 고운 두 그루\n아야, 서로 비치어 바라보는 경치, 그것이 어떠합니까?","analysis":"다채로운 꽃 aning":"유원순의 문장, 이인로의 시, 이공로의 사륙변려문\n이규보와 진화가 서로 운을 맞추어 지은 글\n유충기의 대책문, 민광균의 경서 해석, 김양경의 시와 부\n아야, 과거 시험장의 정경, 그것이 어떠합니까?\n금의의 많은 뛰어난 제자들, 금의의 많은 뛰어난 제자들\n아야, 나를 합하여 모두 몇 분입니까?","analysis":"당대 문인과 문장·시험 문화를 연속적으로 열거한다. 화자 집단이 자신들을 뛰어난 문인 집단으로 인식하는 지적 자부심과 과시적 태도가 드러난다."},{"label":"제2장 · 서적과 독서","meaning":"당서와 한서의 역사서, 장자와 노자, 한유와 유종원의 문집,\n이백과 두보의 시집, 난대 영서들의 문집, 백거이의 문집,\n시경과 서경, 주역과 춘추, 대대례와 소대례\n아야, 주석과 아울러 내내 외운 정경, 그것이 어떠합니까?\n태평광기 400여 권, 태평광기 400여 권\n아야, 두루 읽는 정경, 그것이 어떠합니까?","analysis":"중국의 역사서·철학서·문집·경전을 폭넓게 열거한다. 많은 책을 외우고 두루 읽는 장면을 통해 학식과 독서량을 과시한다."},{"label":"제3장 · 명필과 서예","meaning":"당나라 안진경의 서체, 후한 채옹에서 비롯한 비백의 서체, 후한 유덕승에서 시작한 행서체, 뒷날 성행한 초서체\n진나라 이사의 소전과 주나라 태사주의 대전의 서체, 올챙이 모양의 과두의 서체, 당나라 우세남의 서체\n양수염으로 맨 붓, 쥐수염으로 맨 붓들을 비스듬히 들고\n아야, 한 점을 찍는 광경, 그것이 어떠합니까?\n오생과 유생 두 분 선생님께서, 오생과 유생 두 분 선생님께서\n아야, 붓을 거침없이 휘달려 그려 나가는 광경, 그것이 어떠합니까?","analysis":"여러 서체와 붓, 명필을 열거하며 글씨 쓰는 모습을 찬미한다. 지식의 나열에서 예술적 기량의 과시로 관심이 확장된다."},{"label":"제4장 · 술과 취흥","meaning":"황금빛 도는 술, 잣으로 빚은 술, 솔잎으로 빚은 술, 그리고 단술\n댓잎으로 빚은 술, 배꽃 필 무렵 빚은 술, 오가피로 담근 술\n앵무새 부리 모양의 자개 껍질로 된 앵무잔과 호박빛 도는 호박잔에 술을 가득 부어\n권하여 올리는 광경, 그것이 어떠합니까?\n(진나라 죽림칠현의 한 분인) 유령과 도잠이야 신선 같은 늙은이로, 유령과 도잠이야 신선 같은 늙은이로\n아야, 거나하게 취한 광경, 그것이 어떠합니까?","analysis":"여러 종류의 술과 술잔을 화려하게 나열한다. 앞 장의 학문·예술 자부심에서 음주와 풍류의 흥취로 시상이 이동한다."},{"label":"제5장 · 꽃과 정원의 풍경","meaning":"붉은 모란, 흰 모란, 정홍 모란\n붉은 작약, 흰 작약, 정홍 작약\n능수버들과 옥매, 누른 장미와 자줏빛 장미, 지란과 영지와 동백\n아야, 어우러져 핀 정경, 그것이 어떠합니까?\n합죽과 복숭아꽃 고운 두 그루, 합죽과 복숭아꽃 고운 두 그루\n아야, 서로 비치어 바라보는 경치, 그것이 어떠합니까?","analysis":"다채로운 꽃과 나무가 어우러진 정원을 묘사한다. 색채감 있는 명사 열거와 서로 비치는 모습이 시각적 화려함과 풍류 공간의 아름다움을 강조한다."},{"label":"제6장 · 악기와 밤의 음악","meaning":"아양이 타는 거문고, 문탁이 부는 피리, 종무가 부는 중금, 명기 대어향과 옥기향이 타는 쌍가야금\n금선이 타는 비파, 종지가 타는 해금, 설원이 치는 장구\n아야, 밤을 새워 연주하는 정경, 그것이 어떠합니까?\n일지홍이 비껴 부는 피리 소리, 일지홍이 비껴 부는 피리 소리\n아야, 듣고야 잠들고 싶습니다.","analysis":"연주자와 악기를 병렬적으로 제시하면서 밤새 이어지는 음악의 흥취를 노래한다. 청각적 풍류가 중심이 되며 마지막에는 피리 소리에 취해 잠들고 싶은 소망으로 이어진다."},{"label":"제7장 · 신선 세계와 누각","meaning":"신선들이 산다는 봉래산, 방장산, 영주산들은 삼신산이오.\n이 삼신산 가운데 있는 홍루각 속에는 몸이 가냘픈 맵씨도 아리따운 가인이\n윤이 흐르는 검은 머릿결을 가체수식한 가인이 금수휘장 속에서 구슬발을 반쯤 걷고는\n아야, 높은 대를 올라 멀리 오호를 바라보는 광경, 그것이 어떠합니까?\n푸른 버드나무와 푸른 대나무가 심어진 정자 둔덕에서, 푸른 버드나무와 푸른 대나무가 심어진 정자 둔덕에서\n아야, 노랑 꾀꼬리 반갑기도 하구려.","analysis":"삼신산과 누각, 가인, 버드나무·대나무·꾀꼬리를 배치해 이상적 풍류 공간을 만든다. 신선 세계의 이미지와 현실의 유흥 공간이 겹쳐진다."},{"label":"제8장 · 그네와 남녀의 유희","meaning":"당당당 당추자(호두나무), 쥐엄나무에\n붉은 실로 붉은 그네를 맵니다.\n당기시라 미시라 정소년이여\n아야, 내 가는 곳에 남이 갈까 두렵구나.\n옥같이 예쁘고 가냘픈 두 손길에, 옥같이 예쁘고 가냘픈 두 손길에\n아야, 손을 마주 잡고 노는 정경, 그것이 어떠합니까?","analysis":"그네 놀이와 젊은 남녀의 유희 장면을 제시한다. 마지막 장에서 학문적 자부심으로 시작한 작품이 세속적·향락적 풍류의 절정으로 나아간다."}],"detailNotice":"1~8장을 각각 원문·현대어·핵심 분석으로 대조할 수 있게 구성했습니다.","hanjaWords":[],"id":"w23","poem":true,"textStatus":"사용자 제공 1~8장 원문·현대어 대조","chapterPairs":[{"label":"제1장 · 문장과 과거 시험장의 자부심","original":"원순문(元淳文) 인노시(仁老詩) 공노사륙(公老四六)\n니정언(李正言) 딘한림(陳翰林) 쌍운주필(雙韻走筆)\n튱기대책(沖基對策) 광균경의(光鈞經義) 량경시부(良鏡詩賦)\n위 시댱(試場) ㅅ 경(景) 긔 엇더하니잇고\n엽(葉) 금학사(琴學士)의 옥순문생(玉筍門生) 금학사(琴學士)의 옥순문생(玉筍門生)\n위 날조차 몃부니잇고","modern":"유원순의 문장, 이인로의 시, 이공로의 사륙변려문\n이규보와 진화가 서로 운을 맞추어 지은 글\n유충기의 대책문, 민광균의 경서 해석, 김양경의 시와 부\n아야, 과거 시험장의 정경, 그것이 어떠합니까?\n금의의 많은 뛰어난 제자들, 금의의 많은 뛰어난 제자들\n아야, 나를 합하여 모두 몇 분입니까?","analysis":"당대 문인과 문장·시험 문화를 연속적으로 열거한다. 화자 집단이 자신들을 뛰어난 문인 집단으로 인식하는 지적 자부심과 과시적 태도가 드러난다."},{"label":"제2장 · 서적과 독서","original":"당한서(唐漢書) 장로자(莊老子) 한류문집(韓柳文集)\n니두집(李杜集) 난대집(蘭臺集) 백락천집(白樂天集)\n모시상서(毛詩尙書) 주역춘추(周易春秋) 주대례기(周戴禮記)\n위 주(註)조쳐 내 외온 경(景) 긔 엇더하니잇고\n엽(葉) 태평광기(太平廣記) 사백여권(四百餘卷) 태평광기(太平廣記) 사백여권(四百餘卷)\n위 력남(歷覽) ㅅ 경(景) 긔 엇더하니잇고","modern":"당서와 한서의 역사서, 장자와 노자, 한유와 유종원의 문집,\n이백과 두보의 시집, 난대 영서들의 문집, 백거이의 문집,\n시경과 서경, 주역과 춘추, 대대례와 소대례\n아야, 주석과 아울러 내내 외운 정경, 그것이 어떠합니까?\n태평광기 400여 권, 태평광기 400여 권\n아야, 두루 읽는 정경, 그것이 어떠합니까?","analysis":"중국의 역사서·철학서·문집·경전을 폭넓게 열거한다. 많은 책을 외우고 두루 읽는 장면을 통해 학식과 독서량을 과시한다."},{"label":"제3장 · 명필과 서예","original":"진경서(眞卿書) 비백서(飛白書) 행서초서(行書草書)\n뎐류서(篆籀書) 과두서(蝌蚪書) 우서남서(虞書南書)\n양수필(羊鬚筆) 서수필(鼠鬚筆) 빗기 드러\n위 딕는 경(景) 긔 엇더하니잇고\n엽(葉) 오생류생(吳生劉生) 량선생(兩先生)의 오생류생(吳生劉生) 량선생(兩先生)의\n위 주필(走筆) ㅅ 경(景) 긔 엇더하니잇고","modern":"당나라 안진경의 서체, 후한 채옹에서 비롯한 비백의 서체, 후한 유덕승에서 시작한 행서체, 뒷날 성
