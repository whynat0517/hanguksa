name: Build integrated static site

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/unpack-site.yml"
      - "site.zip"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Get integrated package
        run: |
          set -e
          if [ -f site.zip ]; then
            cp site.zip /tmp/site.zip
          else
            curl -L --fail --retry 3 \
              "https://raw.githubusercontent.com/whynat0517/Social-/main/index_crossbrowser_vercel.zip" \
              -o /tmp/site.zip
          fi

      - name: Extract static site
        run: |
          set -e
          rm -rf /tmp/site_unpack
          mkdir -p /tmp/site_unpack
          unzip -o /tmp/site.zip -d /tmp/site_unpack
          test -f /tmp/site_unpack/index.html
          test -f /tmp/site_unpack/social.html
          rm -rf assets
          rm -f index.html social.html vercel.json
          cp -a /tmp/site_unpack/. .
          test -f index.html
          test -f social.html

      - name: Commit generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html social.html vercel.json assets
          if git diff --cached --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git commit -m "Build integrated history and social site"
          git push
