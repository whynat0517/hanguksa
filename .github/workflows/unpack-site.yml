name: Build integrated static site

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/unpack-site.yml"
      - "site.zip"
      - "index_crossbrowser_vercel.zip"
      - "exam_trainer_github_slim.zip"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Select package
        run: |
          set -e
          if [ -f site.zip ]; then
            cp site.zip /tmp/site.zip
          elif [ -f index_crossbrowser_vercel.zip ]; then
            cp index_crossbrowser_vercel.zip /tmp/site.zip
          elif [ -f exam_trainer_github_slim.zip ]; then
            cp exam_trainer_github_slim.zip /tmp/site.zip
          else
            echo "No site package found"
            exit 1
          fi

      - name: Extract static site
        run: |
          set -e
          rm -rf /tmp/site_unpack
          mkdir -p /tmp/site_unpack
          unzip -o /tmp/site.zip -d /tmp/site_unpack

          test -f /tmp/site_unpack/index.html
          test -f /tmp/site_unpack/social.html
          test -f /tmp/site_unpack/social/index.html
          test -f /tmp/site_unpack/vercel.json

          rm -rf assets social
          rm -f index.html social.html vercel.json
          cp -a /tmp/site_unpack/. .

          test -f index.html
          test -f social.html
          test -f social/index.html
          test -f vercel.json

      - name: Commit generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git commit -m "Fix social route and integrated site"
          git push
