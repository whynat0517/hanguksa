name: Unify subject tabs v39.1

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/ui-v39.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch integrated UI
        run: python .github/scripts/ui_v39_patch.py
      - name: Commit and trigger Vercel
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html social.html social/index.html english.html english/index.html vercel.json
          if git diff --cached --quiet; then
            echo "No UI changes"
            exit 0
          fi
          git commit -m "Unify 3-subject tabs and improve mobile UI"
          git push
