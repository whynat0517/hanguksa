name: Fix integrated subject UI v39

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/ui-v39.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Normalize all subject tabs and mobile headers
        shell: bash
        run: |
          cat > /tmp/patch_ui.py <<'PY'
          from pathlib import Path
          import re, sys

          ROOT = Path(".")
          targets = {
              "index.html": "history",
              "social.html": "social",
              "social/index.html": "social",
              "english.html": "english",
              "english/index.html": "english",
          }

          BAR = """<div id="globalSubjectBar" data-ui="v39"><div class="globalSubjectInner" role="navigation" aria-label="과목 전환"><a class="subjectTab history" data-subject="history" href="/" target="_self"><span class="subjectIcon">📜</span><span>한국사</span></a><a class="subjectTab social" data-subject="social" href="/social/" target="_self"><span class="subjectIcon">🌐</span><span>통합사회</span></a><a class="subjectTab english" data-subject="english" href="/english/" target="_self"><span class="subjectIcon">🔤</span><span>공통영어</span></a></div></div>"""

          BASE_CSS = r"""
          #globalSubjectBar{position:relative;z-index:9999;width:100%;padding:10px 14px;background:#fffaf4;border-bottom:1px solid #eadfce;box-shadow:0 4px 18px rgba(58,42,24,.045);font-family:Pretendard,"Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif}
          #globalSubjectBar *{box-sizing:border-box}
          #globalSubjectBar .globalSubjectInner{width:min(1180px,100%);margin:0 auto;padding:6px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;border:1px solid #ead9bf;border-radius:18px;background:rgba(255,255,255,.72)}
          #globalSubjectBar .subjectTab{min-width:0;min-height:48px;padding:10px 12px;display:flex;align-items:center;justify-content:center;gap:7px;border:1px solid #e5d8c8;border-radius:13px;background:#fff;color:#403831;text-decoration:none;font-size:14px;font-weight:950;letter-spacing:-.025em;white-space:nowrap;box-shadow:0 1px 2px rgba(0,0,0,.02);-webkit-tap-highlight-color:transparent;touch-action:manipulation;transition:transform .12s ease,box-shadow .12s ease,background .12s ease}
          #globalSubjectBar .subjectTab:active{transform:scale(.985)}
          #globalSubjectBar .subjectIcon{font-size:17px;line-height:1}
          #globalSubjectBar .subjectTab.active.history{color:#351827;background:linear-gradient(180deg,#ffd6e8,#f29dc6);border-color:#eb9ac2;box-shadow:0 5px 14px rgba(220,112,164,.20)}
          #globalSubjectBar .subjectTab.active.social{color:#fff;background:linear-gradient(135deg,#3159dc,#7187f3);border-color:#3159dc;box-shadow:0 5px 14px rgba(49,89,220,.20)}
          #globalSubjectBar .subjectTab.active.english{color:#4b2c0e;background:linear-gradient(135deg,#ffdd72,#ffad39);border-color:#efa438;box-shadow:0 5px 14px rgba(239,164,56,.20)}
          @media(max-width:640px){#globalSubjectBar{padding:8px 10px}#globalSubjectBar .globalSubjectInner{gap:6px;padding:5px;border-radius:16px}#globalSubjectBar .subjectTab{min-height:45px;padding:9px 6px;font-size:13px;border-radius:11px;gap:5px}#globalSubjectBar .subjectIcon{font-size:15px}}
          @media(max-width:390px){#globalSubjectBar .subjectTab{font-size:12px;padding-inline:4px}}
          """

          EXTRA = {
              "history": r"""
              body>header{top:0!important}
              @media(max-width:700px){body>header{padding:12px 14px!important}.brand b{font-size:17px!important}.topStats{gap:6px!important}.topChip{font-size:11px!important;padding:7px 10px!important}}
              """,
              "social": r"""
              header .head{display:flex!important;align-items:center!important;justify-content:space-between!important;gap:14px!important;grid-template-columns:none!important}
              header .head>.nav{justify-content:flex-start!important}
              @media(max-width:820px){header .head{display:flex!important;flex-direction:column!important;align-items:stretch!important;padding:12px 14px!important}.logo{font-size:20px!important}.nav{display:flex!important;flex-wrap:nowrap!important;overflow-x:auto!important;gap:7px!important;width:100%!important;padding-bottom:3px!important;scrollbar-width:none}.nav::-webkit-scrollbar{display:none}.nav button{flex:0 0 auto!important;padding:9px 12px!important}.wrap{padding-left:14px!important;padding-right:14px!important}}
              """,
              "english": r"""
              .top .head{display:flex!important;align-items:center!important;gap:19px!important;flex-wrap:wrap!important;grid-template-columns:none!important}.mainnav{margin-left:auto!important}
              @media(max-width:1000px){.top .head{display:flex!important;gap:9px!important}.mainnav{margin-left:auto!important}}
              @media(max-width:650px){.top .head{display:flex!important;min-height:61px!important}.mainnav{width:100%!important;margin:0 0 7px!important;display:flex!important;overflow-x:auto!important;flex-wrap:nowrap!important;scrollbar-width:none}.mainnav::-webkit-scrollbar{display:none}.mainnav button{flex:0 0 auto!important}}
              """
          }

          def remove_old_switchers(html):
              # Remove old two/three-subject navigation blocks from previous revisions.
              for cls in ("subjectPortal","xSubjectSwitch","kx-switch"):
                  html = re.sub(r'<(?:nav|div)[^>]*class="[^"]*\b'+re.escape(cls)+r'\b[^"]*"[^>]*>.*?</(?:nav|div)>', '', html, flags=re.S|re.I)
              html = re.sub(r'<div[^>]*id="globalSubjectBar"[^>]*>.*?</div>\s*</div>', '', html, flags=re.S|re.I)
              html = re.sub(r'<div[^>]*id="globalSubjectBar"[^>]*>.*?</div>', '', html, flags=re.S|re.I)
              html = re.sub(r'<style[^>]*id="global-subject-style"[^>]*>.*?</style>', '', html, flags=re.S|re.I)
              html = re.sub(r'<script[^>]*id="(?:subject-nav-fallback|global-subject-nav-fallback)"[^>]*>.*?</script>', '', html, flags=re.S|re.I)
              return html

          def patch(path, active):
              p = ROOT/path
              if not p.exists():
                  raise SystemExit(f"missing required file: {path}")
              html = p.read_text(encoding="utf-8")
              html = remove_old_switchers(html)

              bar = BAR.replace(f'class="subjectTab {active}"', f'class="subjectTab {active} active"').replace(f'data-subject="{active}"', f'aria-current="page" data-subject="{active}"', 1)
              html, n = re.subn(r'(<body(?:\s[^>]*)?>)', r'\1'+bar, html, count=1, flags=re.I)
              if n != 1:
                  raise SystemExit(f"body insert failed: {path}")

              style = '<style id="global-subject-style">'+BASE_CSS+EXTRA[active]+'</style>'
              html, n = re.subn(r'</head>', style+'</head>', html, count=1, flags=re.I)
              if n != 1:
                  raise SystemExit(f"head insert failed: {path}")

              fallback = """<script id="global-subject-nav-fallback">(function(){document.addEventListener('click',function(e){var a=e.target&&e.target.closest?e.target.closest('#globalSubjectBar a.subjectTab'):null;if(!a)return;var href=a.getAttribute('href');if(!href)return;e.preventDefault();try{window.location.assign(href)}catch(_){window.location.href=href}},false)})();</script>"""
              html, n = re.subn(r'</body>', fallback+'</body>', html, count=1, flags=re.I)
              if n != 1:
                  raise SystemExit(f"body end insert failed: {path}")

              if html.count('id="globalSubjectBar"') != 1:
                  raise SystemExit(f"duplicate subject bar after patch: {path}")
              if html.count('aria-current="page"') < 1:
                  raise SystemExit(f"active subject missing: {path}")
              for href in ('href="/"','href="/social/"','href="/english/"'):
                  if href not in html:
                      raise SystemExit(f"route {href} missing: {path}")

              p.write_text(html, encoding="utf-8")

          for path, active in targets.items():
              patch(path, active)

          # Static integrity checks for the app content.
          hist=(ROOT/"index.html").read_text(encoding="utf-8")
          social=(ROOT/"social/index.html").read_text(encoding="utf-8")
          eng=(ROOT/"english/index.html").read_text(encoding="utf-8")
          if "EMBEDDED_HISTORY_ASSETS" not in hist:
              raise SystemExit("history embedded image map missing")
          if hist.count('"assets/history/user_') < 60:
              raise SystemExit("history user image set incomplete")
          if "통합사회2" not in social or "문제 풀이" not in social:
              raise SystemExit("social app content missing")
          if "37지문" not in eng or "1,850문항" not in eng or 'id="dataset"' not in eng:
              raise SystemExit("English dataset markers missing")
          print("UI patch and integrity checks passed.")
          PY

          python /tmp/patch_ui.py

      - name: Check inline JavaScript syntax
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, subprocess, tempfile, sys
          files=["index.html","social/index.html","english/index.html"]
          for fp in files:
              text=Path(fp).read_text(encoding="utf-8")
              scripts=re.findall(r'<script([^>]*)>(.*?)</script>',text,flags=re.S|re.I)
              checked=0
              for attrs,code in scripts:
                  if 'application/json' in attrs.lower() or 'src=' in attrs.lower() or not code.strip():
                      continue
                  with tempfile.NamedTemporaryFile("w",suffix=".js",delete=False,encoding="utf-8") as f:
                      f.write(code); name=f.name
                  r=subprocess.run(["node","--check",name],capture_output=True,text=True)
                  Path(name).unlink(missing_ok=True)
                  if r.returncode:
                      print(fp, r.stderr)
                      sys.exit(1)
                  checked+=1
              print(fp, "inline JS blocks checked:", checked)
          PY

      - name: Commit fixed UI
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html social.html social/index.html english.html english/index.html
          if git diff --cached --quiet; then
            echo "No UI changes."
            exit 0
          fi
          git commit -m "Fix shared subject tabs and mobile UI"
          git push
