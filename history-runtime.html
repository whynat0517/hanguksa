<style>
html,body{margin:0;min-height:100%;background:#0f0b11;color:#f7edf3;font-family:Pretendard,"Noto Sans KR","Apple SD Gothic Neo",system-ui,sans-serif}

#loading b{font-size:20px}#loading p{opacity:.7;line-height:1.6}
</style>
</head>
<body>
<div id="loading"><div><b>한국사 문제 검증 중…</b><p>프린트 문제의 잘린 문장·단서 부족·선택지 문맥을 검사하고, 풀 수 있는 형태로 보강하고 있어요.</p></div></div>
<script>
(async()=>{
  const fail=(msg)=>{document.getElementById('loading').innerHTML='<div><b>불러오기 실패</b><p>'+msg+'</p></div>'};
  try{
    let html=await fetch('/index.html?v=20261009-printfix6',{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('원본 파일을 불러오지 못했습니다.');return r.text()});
    html=html.replace('#globalSubjectBar{width:min(1180px,100%);margin:0 auto;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));','#globalSubjectBar{width:min(1180px,100%);margin:0 auto;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));');
    html=html.replace('#globalSubjectBar a.active.english{color:#472c0c;background:linear-gradient(135deg,#ffe07a,#ffae39);border-color:#eda23b}','#globalSubjectBar a.active.english{color:#472c0c;background:linear-gradient(135deg,#ffe07a,#ffae39);border-color:#eda23b}\n#globalSubjectBar a.active.korean{color:#fff;background:linear-gradient(135deg,#8d4036,#b96f5f);border-color:#8d4036}');
    html=html.replace('<a class="english" href="/english/" target="_self"><span class="subjectEmoji">🔤</span><span>공통영어</span></a></nav>','<a class="english" href="/english/" target="_self"><span class="subjectEmoji">🔤</span><span>공통영어</span></a><a class="korean" href="/korean/" target="_self"><span class="subjectEmoji">📖</span><span>국어</span></a></nav>');
    html=html.replace('v40 · 3과목 통합 UI','v41 · 4과목 통합 UI');

    // Samsung Internet / 일부 WebView 호환: classList.toggle(token, force) 대신 명시적 add/remove 사용.
    // force 인자를 무시하는 환경에서 모든 학습 섹션이 동시에 뒤집혀 사진자료 화면이 먼저 보이는 문제를 막는다.
    const oldShowView=[
      "function showView(view){",
      " clearInterval(timerId);",
      " ['home','timelineView','summaryView','mapGallery','sourceGallery','photoGallery','quiz','result'].forEach(id=>$(id)?.classList.toggle('hidden',id!==view));",
      " document.querySelectorAll('.studyTab').forEach(b=>b.classList.toggle('active',b.dataset.view===view));",
      " if(view==='mapGallery')buildMapGallery();",
      " if(view==='photoGallery')buildPhotoGallery();",
      " if(view==='sourceGallery')buildSourceGallery();",
      " window.scrollTo({top:0,behavior:'smooth'});",
      "}"
    ].join("\n");
    const newShowView=[
      "function showView(view){",
      " clearInterval(timerId);",
      " const views=['home','timelineView','summaryView','mapGallery','sourceGallery','photoGallery','quiz','result'];",
      " if(!views.includes(view))view='home';",
      " views.forEach(id=>{const el=$(id);if(!el)return;if(id===view)el.classList.remove('hidden');else el.classList.add('hidden');});",
      " document.querySelectorAll('.studyTab').forEach(b=>{if(b.dataset.view===view)b.classList.add('active');else b.classList.remove('active');});",
      " if(view==='mapGallery')buildMapGallery();",
      " if(view==='photoGallery')buildPhotoGallery();",
      " if(view==='sourceGallery')buildSourceGallery();",
      " const active=$(view);",
      " if(active&&typeof active.scrollIntoView==='function')active.scrollIntoView({block:'start',behavior:'auto'});else window.scrollTo(0,0);",
      "}"
    ].join("\n");
    if(!html.includes(oldShowView))throw new Error('한국사 탭 전환 코드를 찾지 못했습니다.');
    html=html.replace(oldShowView,newShowView);

      " const sec=(q.sec||'한국사 시험 범위').replace(/^\\d+\\.\\s*/,'');",

      "}",
      "function selectPool(m){",

    ].join("\\n");
