<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>한국사 시험 대비</title>
<style>
html,body{margin:0;min-height:100%;background:#0f0b11;color:#f7edf3;font-family:Pretendard,"Noto Sans KR","Apple SD Gothic Neo",system-ui,sans-serif}
#loading{min-height:100vh;display:grid;place-items:center;text-align:center;padding:24px;box-sizing:border-box}
#loading b{font-size:20px}#loading p{opacity:.7;line-height:1.6}
</style>
</head>
<body>
<div id="loading"><div><b>한국사 문제 불러오는 중…</b><p>프린트 문제의 불완전한 문맥을 걸러내고 있어요.</p></div></div>
<script>
(async()=>{
  const fail=(msg)=>{document.getElementById('loading').innerHTML='<div><b>불러오기 실패</b><p>'+msg+'</p></div>'};
  try{
    let html=await fetch('/index.html?v=20261009-printfix2',{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('원본 파일을 불러오지 못했습니다.');return r.text()});

    const oldBtn='<button class="modeBtn" onclick="startMode(\'worksheet\')"><div class="modeIcon">✏️</div><div class="modeTitle">학습지 빈칸</div><div class="modeDesc">정답판·학생용 학습지 대조 문제.</div><div class="modeCount">프린트 기반</div></button>';
    const newBtn='<button class="modeBtn" onclick="startMode(\'worksheet\')"><div class="modeIcon">✏️</div><div class="modeTitle">학습지·프린트</div><div class="modeDesc">문맥이 완결된 학습지 빈칸 + 프린트 실전 문제만 출제.</div><div class="modeCount">문맥 검수 221문항</div></button>';
    html=html.replace(oldBtn,newBtn);

    const oldSelect="function selectPool(m){\n let pool=[...BANK];\n if(m==='unit'){const u=$('unitSelect').value;pool=pool.filter(q=>q.sec?.startsWith(u))}\n else if(m==='worksheet')pool=pool.filter(q=>tags(q).includes('학습지')||tags(q).includes('학습지빈칸'));";
    const newSelect="function worksheetQuestionUsable(q){\n const tg=tags(q);\n if(tg.includes('교과서프린트'))return true;\n if(!(tg.includes('학습지')||tg.includes('학습지빈칸')))return false;\n const body=(q.q.split(/\\n\\s*\\n/).slice(1).join('\\n')||q.q).replace(/[∙①②③④⑤⑥⑦⑧⑨⑩→]/g,' ').trim();\n const clue=body.replace(/【\\s*\\?\\s*】/g,' ').replace(/[()[\\]{}0-9.~·ㆍ,:\\-]/g,' ').replace(/\\s+/g,' ').trim();\n if(body.length<28||clue.length<14)return false;\n if(/^\\(?\\s*【\\s*\\?\\s*】\\s*\\)?(?:\\s*\\([^)]*\\))?\\s*$/.test(body))return false;\n if(/(?:,|:|→|하며|하고|하여|해서|등을|등이|등으로|위해|목적으로|중심으로|사이에|따라서|통해|시켜|하려|되어|하였으며|결성하여)\\s*$/.test(body))return false;\n return true;\n}\nfunction worksheetDisplay(q){\n if(!(tags(q).includes('학습지')||tags(q).includes('학습지빈칸')))return q.q;\n let body=(q.q.split(/\\n\\s*\\n/).slice(1).join('\\n')||q.q).trim();\n body=body.replace(/,\\s*$/,'.');\n const sec=(q.sec||'한국사 시험 범위').replace(/^\\d+\\.\\s*/,'');\n return \`다음은 학교 프린트의 「\\${sec}」 내용이다. 앞뒤 의미가 자연스럽게 이어지도록 빈칸에 들어갈 말을 고르시오.\\n\\n\\${body}\`;\n}\nfunction selectPool(m){\n let pool=[...BANK];\n if(m==='unit'){const u=$('unitSelect').value;pool=pool.filter(q=>q.sec?.startsWith(u))}\n else if(m==='worksheet')pool=pool.filter(worksheetQuestionUsable);";
    if(!html.includes(oldSelect))throw new Error('프린트 문제 필터를 적용할 위치를 찾지 못했습니다.');
    html=html.replace(oldSelect,newSelect);

    const oldQ=" $('qtext').textContent=q.q;$('feedback').className='feedback hidden';";
    const newQ=" $('qtext').textContent=mode==='worksheet'?worksheetDisplay(q):q.q;$('feedback').className='feedback hidden';";
    if(!html.includes(oldQ))throw new Error('문제 표시 코드를 수정할 위치를 찾지 못했습니다.');
    html=html.replace(oldQ,newQ);

    document.open();
    document.write(html);
    document.close();
  }catch(e){fail(e.message||String(e))}
})();
</script>
</body>
</html>
